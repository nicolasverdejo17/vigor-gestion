<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>VIGOR - Gestiona tu compañía de forma eficiente</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet"></noscript>
<style>
  @view-transition { navigation: auto; }
  :root{
    --bg:#060A0F; --panel:#0A131C; --panel-alt:#0E1D28; --line:#132734; --line-strong:#1C3B49;
    --text:#E7F5FA; --text-muted:#7B99A3; --text-dim:#516E78;
    --brass:#C97A2E; --brass-bright:#FF9A44; --brass-dim:#8A4E1E;
    --cyan:#49E9FF; --cyan-dim:#1E6E7D; --cyan-glow:rgba(73,233,255,0.35); --amber-glow:rgba(255,154,68,0.32);
    --burdeo:#F13746; --burdeo-bright:#F13746;
    --servicio:#3CF29A; --emergencia:#F13746; --alerta:#FFC94D; --fuera:#C9A63B; --nodisp:#42555C;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;}
  body{
    background: radial-gradient(900px 500px at 50% -10%, rgba(73,233,255,0.08), transparent 60%), #060A0F;
    font-family:'Inter',sans-serif; color:var(--text);
  }
  .mono{font-family:'JetBrains Mono',monospace;}
  h1,h2,h3{font-family:'Rajdhani',sans-serif; text-transform:uppercase; letter-spacing:.04em; font-weight:700; margin:0;}

  .phone{ height:100%; display:flex; flex-direction:column; position:relative;}

  .app-head{ padding:12px 18px 8px; flex-shrink:0;}
  .app-head .eyebrow{ font-size:10px; color:var(--text-dim); letter-spacing:.1em; text-transform:uppercase;}
  .app-head h1{ font-size:20px; margin-top:2px;}
  .role-strip{ display:flex; align-items:center; gap:7px; padding:6px 0 0;}
  .role-strip .dot{ width:6px;height:6px;border-radius:50%; background:var(--cyan);}
  .role-strip span{ font-size:10px; color:var(--text-muted);}
  .role-strip b{ font-size:10px; color:var(--cyan); font-weight:700;}

  .content{ flex:1; overflow-y:auto; padding:8px 18px 18px;}
  .content::-webkit-scrollbar{ display:none;}

  .perfil-card{
    display:flex; align-items:center; gap:14px; background:var(--panel); border:1.5px solid var(--line-strong);
    border-radius:12px; padding:14px; margin-bottom:14px; position:relative; overflow:hidden;
  }
  .perfil-card::before{ content:""; position:absolute; inset:5px; border:1px solid var(--brass-dim); border-radius:8px; pointer-events:none; opacity:.35;}
  .perfil-foto{ width:48px; height:48px; border-radius:50%; background:linear-gradient(135deg,#3A4750,#232D35); border:2px solid var(--servicio); display:flex; align-items:center; justify-content:center; font-family:'Rajdhani'; font-weight:700; font-size:17px; color:var(--text-muted); flex-shrink:0; position:relative; z-index:1;}
  .perfil-nombre{ font-size:14px; font-weight:700; position:relative; z-index:1;}
  .perfil-cargo{ font-size:11px; color:var(--text-muted); position:relative; z-index:1;}

  .section-label{ font-size:10px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.08em; font-weight:600; margin:14px 4px 8px;}
  .section-label:first-child{ margin-top:0;}

  .row{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    background:var(--panel); border:1px solid var(--line-strong); border-radius:10px;
    padding:12px 14px; margin-bottom:8px; cursor:pointer;
  }
  .row-l{ display:flex; align-items:center; gap:12px;}
  .row-ico{ width:34px; height:34px; border-radius:9px; background:var(--panel-alt); display:flex; align-items:center; justify-content:center; font-size:15px; flex-shrink:0;}
  .row-ico svg{ width:20px; height:20px; color:var(--cyan);}
  .row b{ font-size:13.5px; display:block;}
  .row span{ font-size:11px; color:var(--text-muted);}
  .row-arrow{ color:var(--text-dim); font-size:14px;}

  .row.locked{ opacity:.42; cursor:not-allowed;}
  .row.locked .row-ico{ background:var(--panel);}

  .logout-row{ margin-top:18px;}
  .logout-row b{ color:var(--burdeo-bright);}
  .logout-row .row-ico svg{ color:var(--burdeo-bright);}

  .toast{
    position:absolute; bottom:20px; left:16px; right:16px;
    background:var(--panel-alt); border:1px solid var(--cyan); color:#DFF7F9;
    padding:11px 16px; border-radius:8px; font-size:12.5px; opacity:0; transform:translateY(8px);
    transition:all .25s; pointer-events:none; text-align:center; z-index:30;
  }
  .toast.show{ opacity:1; transform:translateY(0);}
  .toast.denegado{ border-color:var(--burdeo-bright); color:#F6DCE0;}

  .tabbar-real{ display:flex; border-top:1px solid var(--line-strong); background:#0C1116; flex-shrink:0; padding-bottom:6px;}
  .tabbar-real a{ flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; padding:9px 0 5px; color:var(--text-dim); text-decoration:none; font-size:9.5px; font-weight:600; letter-spacing:.01em;}
  .tabbar-real a .ic{ line-height:1; display:flex;}
  .tabbar-real a .ic svg{ width:22px; height:22px;}
  .tabbar-real a.active{ color:var(--cyan);}
</style>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon-32.png?v=2" sizes="32x32" type="image/png">
<link rel="icon" href="icons/favicon-16.png?v=2" sizes="16x16" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=2">

<meta name="apple-mobile-web-app-capable" content="yes">

<link rel="stylesheet" href="vigor-ui.css">

<script src="vigor-licencia.js"></script>
<script src="vigor-tema.js" defer></script>
</head>
<body>

  <div class="phone">
    <div class="app-head">
      <div class="eyebrow" id="eyebrowCia">Vigor</div>
      <h1>Opciones</h1>
      <div class="role-strip"><span class="dot"></span><span>Sesión:</span> <b id="sesionLabel">—</b></div>
    </div>

    <div class="content">
      <div class="perfil-card">
        <div class="perfil-foto" id="perfilIniciales">B</div>
        <div>
          <div class="perfil-nombre" id="perfilNombre">Bombero</div>
          <div class="perfil-cargo" id="perfilCargoTxt">Tercera Compañía</div>
        </div>
      </div>

      <div class="section-label">Mi cuenta</div>
      <div class="row" onclick="window.location.href='editar_datos_personales.html'">
        <div class="row-l"><div class="row-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.4"/><path d="M5 20c0-3.9 3.1-7 7-7s7 3.1 7 7"/></svg></div><div><b>Mi Perfil</b><span>Datos personales, editables</span></div></div>
        <span class="row-arrow">›</span>
      </div>

      <div class="section-label">Preferencias</div>
      <div class="row" onclick="window.location.href='notificaciones_celular.html'">
        <div class="row-l"><div class="row-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16V11a6 6 0 1 1 12 0v5l1.7 2.7H4.3L6 16z"/><path d="M10 19.7a2 2 0 0 0 4 0"/></svg></div><div><b>Notificaciones</b><span>Qué avisos quieres recibir</span></div></div>
        <span class="row-arrow">›</span>
      </div>

      <div class="row" onclick="window.location.href='acerca_de.html'">
        <div class="row-l"><div class="row-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 11v5.2"/><path d="M12 7.8v.2"/></svg></div><div><b>Acerca de Vigor</b><span>Quién desarrolla Vigor y créditos</span></div></div>
        <span class="row-arrow">›</span>
      </div>

      <div class="row logout-row" onclick="ir('Cerrando sesión…')">
        <div class="row-l"><div class="row-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M10 4H6a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1h4"/><path d="M15 8l4 4-4 4"/><path d="M19 12H9"/></svg></div><div><b>Cerrar sesión</b></div></div>
      </div>
    </div>
    <div class="tabbar-real" id="tabbarReal"></div>

    <div class="toast" id="toast"></div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="vigor-sesion.js"></script>
<script>
const SUPABASE_URL = 'https://mcfcfbtiruewlcejionr.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1jZmNmYnRpcnVld2xjZWppb25yIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzODExNzgsImV4cCI6MjEwMzk1NzE3OH0.9b_t63ah25RIGNn3pzZU3L553YUrrn7IXWW3MEjXuXU';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { persistSession: true, autoRefreshToken: true } });

let cargoActivo = null;
let rolesActivos = new Set();
let miNombre = null, miIniciales = null, miCiaLabel = null, miFotoUrl = null;

async function cargarSesion(){
  const { data: { session } } = await sb.auth.getSession();
  if(!session){ toast('Debes iniciar sesión primero'); return; }
  const { data: perfil } = await sb.from('personal')
    .select('nombre_completo, cargo, foto_url, companias(nombre), cuerpos(nombre_oficial), personal_roles_funcionales(rol_funcional)')
    .eq('auth_user_id', session.user.id).single();
  if(!perfil) return;
  cargoActivo = perfil.cargo;
  rolesActivos = new Set((perfil.personal_roles_funcionales || []).map(r => r.rol_funcional));
  miNombre = perfil.nombre_completo;
  miIniciales = perfil.nombre_completo.split(' ').map(p=>p[0]).join('').toUpperCase().slice(0,2);
  miFotoUrl = perfil.foto_url;
  miCiaLabel = perfil.companias ? perfil.companias.nombre : 'Cuerpo General';
  document.getElementById('eyebrowCia').textContent = miCiaLabel;
  renderTodo();
}

function renderPerfil(){
  const rolesTxt = rolesActivos.size ? ' + ' + [...rolesActivos].join(', ') : '';
  document.getElementById('sesionLabel').textContent = cargoActivo + rolesTxt;
  document.getElementById('perfilNombre').textContent = miNombre;
  const fotoEl = document.getElementById('perfilIniciales');
  if(miFotoUrl){
    fotoEl.style.backgroundImage = `url('${miFotoUrl}')`;
    fotoEl.style.backgroundSize = 'cover';
    fotoEl.style.backgroundPosition = 'center';
    fotoEl.textContent = '';
  } else {
    fotoEl.style.backgroundImage = '';
    fotoEl.textContent = miIniciales;
  }
  document.getElementById('perfilCargoTxt').textContent = `${cargoActivo} · ${miCiaLabel}`;
}

function renderTodo(){ renderPerfil(); }

async function ir(msg){
  toast(msg, false);
  try{ Object.keys(localStorage).filter(k => k.indexOf('vigor_cache_') === 0).forEach(k => localStorage.removeItem(k)); }catch(e){}   // lo guardado para dibujar rápido se borra al salir
  await sb.auth.signOut();
  setTimeout(()=>window.location.href = 'login_registro.html', 700);
}
function denegado(){ toast('No tienes permiso para acceder a esta sección', true); }

function toast(msg, esDenegado){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.toggle('denegado', !!esDenegado);
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2600);
}

cargarSesion();

// 6 pestañas — "Más" se fusionó dentro de "Opciones", ya no existe como
// pestaña aparte.
const ICONOS_TAB = {
  inicio: '<path d="M4 12 12 5l8 7"/><path d="M6.5 10.5V19a1 1 0 0 0 1 1h9a1 1 0 0 0 1-1v-8.5"/><path d="M10 20v-5h4v5"/>',
  compania: '<path d="M12 2.2v1.5"/><path d="M7.5 8.6C7.5 5.4 9.5 3.6 12 3.6s4.5 1.8 4.5 5"/><path d="M5.8 8.6C5.8 10.4 8.5 11.4 12 11.4s6.2-1 6.2-2.8"/><path d="M5 21c0-4.5 3-7 7-7s7 2.5 7 7"/>',
  pizarra: '<rect x="4" y="5" width="16" height="14" rx="1.6"/><path d="M7.7 10h7M7.7 13.6h4.6"/><circle cx="16.3" cy="8.3" r="1.3"/>',
  actividades: '<rect x="4" y="5.5" width="16" height="14" rx="1.6"/><path d="M4 9.5h16"/><path d="M8 3.5v3M16 3.5v3"/><path d="M8.5 13.5l2 2 4-4.2"/>',
  gps: '<path d="M12 21s7-7.2 7-12a7 7 0 1 0-14 0c0 4.8 7 12 7 12z"/><circle cx="12" cy="9" r="2.4"/>',
  opciones: '<circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2.8"/><g stroke-width="2.3"><path d="M19 12h2.3M16.95 16.95l1.63 1.63M12 19v2.3M7.05 16.95l-1.63 1.63M5 12H2.7M7.05 7.05 5.42 5.42M12 5V2.7M16.95 7.05l1.63-1.63"/></g>',
};
const TABS_NAV = [
  {href:'inicio_celular.html', ic:'inicio', label:'Inicio'},
  {href:'compania_celular.html', ic:'compania', label:'Compañía'},
  {href:'pizarra_celular.html', ic:'pizarra', label:'Pizarra'},
  {href:'actividades_celular.html', ic:'actividades', label:'Activid.'},
  {href:'mapa_celular.html', ic:'gps', label:'Mapa'},
  {href:'opciones_celular.html', ic:'opciones', label:'Opciones'},
];
(function renderTabbarReal(){
  const cont = document.getElementById('tabbarReal');
  if(!cont) return;
  const actual = location.pathname.split('/').pop();
  cont.innerHTML = TABS_NAV.map(t => `<a href="${t.href}" class="${t.href===actual?'active':''}"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">${ICONOS_TAB[t.ic]}</svg></span><span>${t.label}</span></a>`).join('');
})();
</script>
</body>
</html>
