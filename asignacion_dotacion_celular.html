<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Vigor — Asignación de Dotación</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet"></noscript>
<style>
  :root{
    --bg:#060A0F; --panel:#0A131C; --panel-alt:#0E1D28; --line:#132734; --line-strong:#1C3B49;
    --text:#E7F5FA; --text-muted:#7B99A3; --text-dim:#516E78;
    --brass:#C97A2E; --brass-bright:#FF9A44; --brass-dim:#8A4E1E;
    --cyan:#49E9FF; --cyan-dim:#1E6E7D; --cyan-glow:rgba(73,233,255,0.35); --amber-glow:rgba(255,154,68,0.32);
    --burdeo:#7A1620; --burdeo-bright:#D8394E;
    --servicio:#3CF29A; --emergencia:#FF4B5C; --alerta:#FFC94D; --fuera:#C9A63B; --nodisp:#42555C;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;}
  body{
    background: radial-gradient(900px 500px at 50% -10%, rgba(73,233,255,0.08), transparent 60%), #060A0F;
    font-family:'Inter',sans-serif; color:var(--text);
  }
  .mono{font-family:'JetBrains Mono',monospace;}
  h1,h2,h3{font-family:'Rajdhani',sans-serif; text-transform:uppercase; letter-spacing:.04em; font-weight:700; margin:0;}

  #phoneWrap{ height:100%; display:none; flex-direction:column; position:relative;}

  .app-head{ padding:10px 18px 8px; flex-shrink:0; display:flex; align-items:center; gap:12px;}
  .back-btn{
    background:var(--panel); border:1.5px solid var(--line-strong); color:var(--text-muted);
    font-family:'Rajdhani'; font-weight:600; letter-spacing:.03em; text-transform:uppercase;
    font-size:11px; padding:7px 12px; border-radius:6px; cursor:pointer; flex-shrink:0;
  }
  .app-head .titulo{ min-width:0;}
  .app-head .eyebrow{ font-size:10px; color:var(--text-dim); letter-spacing:.1em; text-transform:uppercase;}
  .app-head h1{ font-size:16px; margin-top:2px;}

  .content{ flex:1; overflow-y:auto; padding:6px 18px 18px;}
  .content::-webkit-scrollbar{ display:none;}

  .section-label{ font-size:10px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.08em; font-weight:600; margin:14px 4px 8px;}

  .carro-card{
    background:var(--panel); border:1.5px solid var(--line-strong); border-radius:12px;
    padding:14px 15px; margin-bottom:12px; position:relative; overflow:hidden;
  }
  .carro-card::before{ content:""; position:absolute; inset:5px; border:1px solid var(--brass-dim); border-radius:8px; pointer-events:none; opacity:.3;}
  .carro-top{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; position:relative; z-index:1;}
  .carro-nom{ font-family:'JetBrains Mono',monospace; font-weight:700; font-size:16px; color:var(--brass-bright);}
  .carro-tipo{ font-size:11px; color:var(--text-muted); margin-top:1px;}
  .carro-estado-pill{ font-size:9.5px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; padding:4px 10px; border-radius:10px; color:#fff; flex-shrink:0;}

  .dot-field{ margin-bottom:10px; position:relative; z-index:1;}
  .dot-field label{ display:block; font-size:9.5px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.06em; margin-bottom:5px; font-weight:600;}
  .dot-field select{
    width:100%; background:var(--panel-alt); border:1.5px solid var(--line-strong); border-radius:7px;
    padding:9px 11px; font-size:13px; color:var(--text); font-family:'Inter';
  }
  .dot-field select:focus{ outline:none; border-color:var(--cyan);}
  .dot-trip-chips{ display:flex; flex-wrap:wrap; gap:5px; margin-bottom:7px;}
  .dot-trip-chip{
    display:inline-flex; align-items:center; gap:6px; background:var(--panel-alt); border:1px solid var(--cyan-dim);
    color:var(--cyan); font-size:11px; padding:5px 6px 5px 10px; border-radius:12px;
  }
  .dot-trip-chip button{ background:none; border:none; color:var(--cyan); cursor:pointer; font-size:12px; padding:2px;}
  .dot-trip-add{ display:flex; gap:6px;}
  .dot-trip-add select{ flex:1;}
  .dot-trip-add button{
    background:var(--cyan-dim); border:1.5px solid var(--cyan); color:#fff; font-family:'Rajdhani'; font-weight:700;
    font-size:11px; letter-spacing:.03em; text-transform:uppercase; padding:0 12px; border-radius:7px; cursor:pointer; flex-shrink:0;
  }

  .empty-state{ text-align:center; padding:40px 20px; color:var(--text-dim); font-size:12.5px; line-height:1.6;}

  .toast{
    position:absolute; bottom:20px; left:16px; right:16px;
    background:var(--panel-alt); border:1px solid var(--cyan); color:#DFF7F9;
    padding:11px 16px; border-radius:8px; font-size:12.5px; opacity:0; transform:translateY(8px);
    transition:all .25s; pointer-events:none; text-align:center; z-index:30;
  }
  .toast.show{ opacity:1; transform:translateY(0);}

  .tabbar-real{ display:flex; border-top:1px solid var(--line-strong); background:#0C1116; flex-shrink:0; padding-bottom:6px;}
  .tabbar-real a{ flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; padding:9px 0 5px; color:var(--text-dim); text-decoration:none; font-size:9.5px; font-weight:600; letter-spacing:.01em;}
  .tabbar-real a .ic{ font-size:19px; line-height:1;}
  .tabbar-real a.active{ color:var(--cyan);}
</style>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="icons/favicon-16.png" sizes="16x16" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#060A0F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Vigor">
<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}</script>
</head>
<body>

  <div id="sinSesion" style="display:none; padding:40vh 16px 40px; color:var(--text-muted); text-align:center;">
    Necesitás loguearte primero. <a href="login_registro.html" style="color:var(--cyan);">Ir al login</a>
  </div>

  <div id="phoneWrap">
    <div class="app-head">
      <button class="back-btn" onclick="window.location.href='opciones_celular.html'">← Volver</button>
      <div class="titulo">
        <div class="eyebrow" id="ciaLabel">—</div>
        <h1>Asignación de Dotación</h1>
      </div>
    </div>

    <div class="content">
      <div class="section-label">Carros de mi Compañía</div>
      <div id="carrosList"></div>
    </div>
    <div class="tabbar-real" id="tabbarReal"></div>

    <div class="toast" id="toast"></div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://mcfcfbtiruewlcejionr.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1jZmNmYnRpcnVld2xjZWppb25yIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzODExNzgsImV4cCI6MjEwMzk1NzE3OH0.9b_t63ah25RIGNn3pzZU3L553YUrrn7IXWW3MEjXuXU';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { persistSession: true, autoRefreshToken: true, storageKey: 'vigor-auth-v1' } });

const ESTADO_LABEL_CARRO = { servicio:'En Servicio', mant:'En Mantención', fuera:'Fuera de Servicio', emergencia:'En Emergencia' };
const COLOR_ESTADO_CARRO = { servicio:'#3CF29A', mant:'#FFC94D', fuera:'#42555C', emergencia:'#FF4B5C' };

let miPersonalId = null, miCompaniaId = null, miCuerpoId = null;
let CARROS = [];
let DISPONIBLES = [];
let suscrito = false;

// Mismo cuidado que en pc_compania.html: ignorar el eco de los propios
// cambios por una ventana corta, para no reconstruir la UI en pleno medio
// de la edición.
let ultimaAccionLocalMs = 0;
function marcarAccionLocal(){ ultimaAccionLocalMs = Date.now(); }
function esEcoPropio(){ return Date.now() - ultimaAccionLocalMs < 2500; }

async function cargarDatos(){
  const { data: { session } } = await sb.auth.getSession();
  if(!session){ document.getElementById('sinSesion').style.display = 'block'; return; }
  const { data: perfil } = await sb.from('personal')
    .select('id, compania_id, cuerpo_id, companias(nombre)')
    .eq('auth_user_id', session.user.id).single();
  if(!perfil || !perfil.compania_id){
    document.getElementById('sinSesion').style.display = 'block';
    document.getElementById('sinSesion').innerHTML = 'Esta sesión no pertenece a ninguna Compañía.';
    return;
  }
  miPersonalId = perfil.id;
  miCompaniaId = perfil.compania_id;
  miCuerpoId = perfil.cuerpo_id;
  document.getElementById('ciaLabel').textContent = perfil.companias ? perfil.companias.nombre : 'Vigor';

  await Promise.all([cargarCarros(), cargarDisponibles()]);
  document.getElementById('phoneWrap').style.display = 'flex';
  renderCarros();
  suscribirRealtime();
}

async function cargarCarros(){
  const { data } = await sb.from('carros')
    .select('id, nomenclatura, tipo_descripcion, estado, asignacion_dotacion(conductor_id, oficial_a_cargo_id, asignacion_dotacion_tripulantes(personal_id))')
    .eq('compania_id', miCompaniaId).order('nomenclatura');
  CARROS = (data || []).map(c => {
    const asign = (c.asignacion_dotacion && c.asignacion_dotacion[0]) || null;
    return {
      id: c.id, nom: c.nomenclatura, tipo: c.tipo_descripcion, estado: c.estado,
      conductorId: asign ? asign.conductor_id : null,
      oficialId: asign ? asign.oficial_a_cargo_id : null,
      tripulantesIds: asign ? (asign.asignacion_dotacion_tripulantes || []).map(t => t.personal_id) : []
    };
  });
}

async function cargarDisponibles(){
  const { data } = await sb.from('personal')
    .select('id, numero_registro, nombre_completo, personal_estado_historial!personal_estado_historial_personal_id_fkey(estado, hora_fin)')
    .eq('compania_id', miCompaniaId).neq('estado', 'dado_de_baja');
  DISPONIBLES = (data || []).filter(p => {
    const fv = (p.personal_estado_historial || []).find(h => h.hora_fin === null);
    return fv && fv.estado === 'disponible';
  }).map(p => ({ id: p.id, reg: p.numero_registro, nombre: p.nombre_completo }));
}

function nombrePorId(id){
  const p = DISPONIBLES.find(d => d.id === id);
  return p ? p.nombre : '(no disponible)';
}

function opcionesDisponibles(seleccionadoId){
  return DISPONIBLES.map(p => `<option value="${p.id}" ${p.id===seleccionadoId?'selected':''}>${p.nombre} (N° ${p.reg})</option>`).join('');
}

function renderCarros(){
  const el = document.getElementById('carrosList');
  if(CARROS.length === 0){
    el.innerHTML = '<div class="empty-state">Esta Compañía todavía no tiene Carros registrados.</div>';
    return;
  }
  el.innerHTML = CARROS.map((c, i) => {
    const tripChips = c.tripulantesIds.map((pid, ti) =>
      `<span class="dot-trip-chip">${nombrePorId(pid)} <button onclick="quitarTripulante(${i},${ti})">✕</button></span>`
    ).join('');
    return `
      <div class="carro-card">
        <div class="carro-top">
          <div><div class="carro-nom">${c.nom}</div><div class="carro-tipo">${c.tipo}</div></div>
          <div class="carro-estado-pill" style="background:${COLOR_ESTADO_CARRO[c.estado]}; color:${c.estado==='mant'?'#241505':'#fff'};">${ESTADO_LABEL_CARRO[c.estado]}</div>
        </div>
        <div class="dot-field">
          <label>Conductor (Maquinista)</label>
          <select onchange="setConductor(${i}, this.value)">
            <option value="">— Sin asignar —</option>
            ${opcionesDisponibles(c.conductorId)}
          </select>
        </div>
        <div class="dot-field">
          <label>Oficial a cargo (Mando)</label>
          <select onchange="setOficial(${i}, this.value)">
            <option value="">— Sin asignar —</option>
            ${opcionesDisponibles(c.oficialId)}
          </select>
        </div>
        <div class="dot-field" style="margin-bottom:0;">
          <label>Tripulantes</label>
          <div class="dot-trip-chips">${tripChips}</div>
          <div class="dot-trip-add">
            <select id="tripSelect-${i}">
              <option value="">— Elegir disponible —</option>
              ${opcionesDisponibles(null)}
            </select>
            <button onclick="agregarTripulante(${i})">+ Agregar</button>
          </div>
        </div>
      </div>
    `;
  }).join('');
}

async function persistirDotacion(i){
  marcarAccionLocal();
  const c = CARROS[i];
  const { error } = await sb.rpc('asignar_dotacion', {
    p_carro_id: c.id,
    p_conductor_id: c.conductorId,
    p_oficial_a_cargo_id: c.oficialId,
    p_tripulantes_ids: c.tripulantesIds
  });
  if(error){ toast('No se pudo guardar — ' + error.message); return false; }
  return true;
}

async function setConductor(i, val){
  const anterior = CARROS[i].conductorId;
  CARROS[i].conductorId = val || null;
  if(await persistirDotacion(i)){ renderCarros(); toast('Dotación actualizada'); }
  else { CARROS[i].conductorId = anterior; renderCarros(); }
}
async function setOficial(i, val){
  const anterior = CARROS[i].oficialId;
  CARROS[i].oficialId = val || null;
  if(await persistirDotacion(i)){ renderCarros(); toast('Dotación actualizada'); }
  else { CARROS[i].oficialId = anterior; renderCarros(); }
}
async function agregarTripulante(i){
  const sel = document.getElementById(`tripSelect-${i}`);
  const val = sel.value;
  if(!val) return;
  if(!CARROS[i].tripulantesIds.includes(val)) CARROS[i].tripulantesIds.push(val);
  if(await persistirDotacion(i)){ renderCarros(); toast('Tripulante agregado'); }
  else { CARROS[i].tripulantesIds = CARROS[i].tripulantesIds.filter(x => x !== val); renderCarros(); }
}
async function quitarTripulante(i, ti){
  const quitado = CARROS[i].tripulantesIds[ti];
  CARROS[i].tripulantesIds.splice(ti, 1);
  if(await persistirDotacion(i)){ renderCarros(); }
  else { CARROS[i].tripulantesIds.splice(ti, 0, quitado); renderCarros(); }
}

function suscribirRealtime(){
  if(suscrito) return;
  suscrito = true;
  sb.channel('asignacion-dotacion-celular-' + miCompaniaId)
    .on('postgres_changes', { event:'*', schema:'public', table:'asignacion_dotacion', filter:`compania_id=eq.${miCompaniaId}` }, async () => {
      if(esEcoPropio()) return;
      await cargarCarros(); renderCarros();
    })
    .on('postgres_changes', { event:'*', schema:'public', table:'asignacion_dotacion_tripulantes' }, async () => {
      if(esEcoPropio()) return;
      await cargarCarros(); renderCarros();
    })
    .on('postgres_changes', { event:'*', schema:'public', table:'personal_estado_historial' }, async () => {
      await cargarDisponibles(); renderCarros();
    })
    .on('postgres_changes', { event:'*', schema:'public', table:'carros', filter:`compania_id=eq.${miCompaniaId}` }, async () => {
      if(esEcoPropio()) return;
      await cargarCarros(); renderCarros();
    })
    .subscribe();
}

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2200);
}

const TABS_NAV = [
  {href:'inicio_celular.html', ic:'🏠', label:'Inicio'},
  {href:'compania_celular.html', ic:'🚒', label:'Compañía'},
  {href:'pizarra_celular.html', ic:'📌', label:'Pizarra'},
  {href:'actividades_celular.html', ic:'📋', label:'Activid.'},
  {href:'coordenadas_celular.html', ic:'📍', label:'GPS'},
  {href:'opciones_celular.html', ic:'⚙️', label:'Opciones'},
];
(function renderTabbarReal(){
  document.getElementById('tabbarReal').innerHTML = TABS_NAV.map(t =>
    `<a href="${t.href}" class="${t.href==='opciones_celular.html'?'active':''}"><span class="ic">${t.ic}</span><span>${t.label}</span></a>`
  ).join('');
})();

cargarDatos();
</script>
</body>
</html>
