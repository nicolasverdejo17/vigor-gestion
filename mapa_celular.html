<!DOCTYPE html>
<html lang="es">
<head>
<meta name="robots" content="noindex, nofollow, noarchive">
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>VIGOR - Gestiona tu compañía de forma eficiente</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  @view-transition { navigation: auto; }
  :root{
    --bg:#060A0F; --panel:#0A131C; --panel-alt:#0E1D28; --line:#132734; --line-strong:#1C3B49;
    --text:#E7F5FA; --text-muted:#7B99A3; --text-dim:#516E78;
    --brass:#C97A2E; --brass-bright:#FF9A44; --brass-dim:#8A4E1E;
    --cyan:#49E9FF; --cyan-dim:#1E6E7D; --cyan-glow:rgba(73,233,255,0.35);
    --burdeo:#F13746; --burdeo-bright:#F13746;
    --servicio:#3CF29A; --emergencia:#F13746; --alerta:#FFC94D; --nodisp:#42555C;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;}
  body{ background:#060A0F; font-family:'Inter',sans-serif; color:var(--text);}
  h1,h2,h3{font-family:'Rajdhani',sans-serif; text-transform:uppercase; letter-spacing:.04em; font-weight:700; margin:0;}

  .phone{ height:100%; height:100dvh; display:flex; flex-direction:column; position:relative;}
  .app-head{ padding:10px 18px 8px; flex-shrink:0;}
  .app-head .eyebrow{ font-size:10px; color:var(--text-dim); letter-spacing:.1em; text-transform:uppercase;}
  .app-head h1{ font-size:19px; margin-top:2px;}

  /* los tres botones: GPS, Mapa Comunal y Clima */
  .subtabs{ display:flex; gap:6px; padding:0 14px 10px; flex-shrink:0; }
  .subtabs button{
    flex:1; display:flex; align-items:center; justify-content:center; gap:7px; min-height:44px;
    background:#091D2C; border:1px solid #153A52; border-radius:0; color:#8FB0C2; cursor:pointer;
    font-family:'Montserrat',sans-serif; font-weight:700; font-size:11.5px; letter-spacing:.06em; text-transform:uppercase; padding:0 6px;
  }
  .subtabs button svg{ width:18px; height:18px; flex:none; }
  .subtabs button.on{ background:rgba(45,211,219,.14); border-color:#2DD3DB; color:#fff; box-shadow:inset 0 -3px 0 #3CF29A; }

  /* cada vista vive en su propio cuadro y se abre solo la primera vez que se toca */
  .visor{ flex:1; min-height:0; position:relative; border-top:1px solid #153A52; background:#030B13; }
  .visor iframe{ position:absolute; inset:0; width:100%; height:100%; border:0; display:none; background:#030B13; }
  .visor iframe.on{ display:block; }
  .cargando{ position:absolute; inset:0; display:grid; place-items:center; font-family:'Montserrat',sans-serif; font-size:12px; letter-spacing:.1em; text-transform:uppercase; color:#8FB0C2; pointer-events:none; }

  .tabbar-real{ display:flex; border-top:1px solid var(--line-strong); background:#0C1116; flex-shrink:0; padding-bottom:6px;}
  .tabbar-real a{ flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; padding:9px 0 5px; color:var(--text-dim); text-decoration:none; font-size:9.5px; font-weight:600; letter-spacing:.01em;}
  .tabbar-real a .ic{ line-height:1; display:flex;}
  .tabbar-real a .ic svg{ width:22px; height:22px;}
  .tabbar-real a.active{ color:var(--cyan);}
  @media (max-height:520px){ .app-head{ display:none; } .subtabs{ padding:6px 10px; } .subtabs button{ min-height:36px; } }
</style>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon-32.png?v=2" sizes="32x32" type="image/png">
<link rel="icon" href="icons/favicon-16.png?v=2" sizes="16x16" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=2">
<meta name="theme-color" content="#030B13">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Vigor">
<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}</script>
<link rel="stylesheet" href="vigor-tema.css">
<script src="vigor-tema.js" defer></script>
</head>
<body>
  <div class="phone">
    <div class="app-head">
      <div class="eyebrow" id="eyebrowCia">Vigor</div>
      <h1>Mapa</h1>
    </div>

    <div class="subtabs" id="subtabs">
      <button type="button" data-v="gps"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-7.2 7-12a7 7 0 1 0-14 0c0 4.8 7 12 7 12z"/><circle cx="12" cy="9" r="2.4"/></svg>GPS</button>
      <button type="button" data-v="mapa"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4 4 6v14l5-2 6 2 5-2V4l-5 2-6-2z"/><path d="M9 4v14M15 6v14"/></svg>Mapa comunal</button>
      <button type="button" data-v="clima"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v2M4.9 6.9l1.4 1.4M3 14h2M19 14h2M17.7 8.3l1.4-1.4"/><path d="M7.5 17.5a4 4 0 0 1-.3-8 5 5 0 0 1 9.5 1.2A3.4 3.4 0 0 1 16.5 17.5z"/></svg>Clima</button>
    </div>

    <div class="visor" id="visor"><div class="cargando" id="cargando">Cargando…</div></div>
    <div class="tabbar-real" id="tabbarReal"></div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="vigor-sesion.js"></script>
<script>
const SUPABASE_URL = 'https://mcfcfbtiruewlcejionr.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1jZmNmYnRpcnVld2xjZWppb25yIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzODExNzgsImV4cCI6MjEwMzk1NzE3OH0.9b_t63ah25RIGNn3pzZU3L553YUrrn7IXWW3MEjXuXU';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { persistSession: true, autoRefreshToken: true } });

// Las tres vistas son las mismas pantallas de siempre, incrustadas sin su encabezado.
const VISTAS = { gps:'coordenadas_celular.html?embed=1', mapa:'monitoreo_mapa.html?embed=1', clima:'clima.html?embed=1' };
const frames = {};
function mostrar(v){
  if(!VISTAS[v]) v = 'gps';
  document.querySelectorAll('#subtabs button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  for(const k in frames) frames[k].classList.toggle('on', k === v);
  if(!frames[v]){   // se abre la primera vez que se toca: así no se carga el mapa ni el clima si no se usan
    const f = document.createElement('iframe'); f.src = VISTAS[v]; f.title = v; f.setAttribute('allow', 'geolocation');
    f.addEventListener('load', () => { const c = document.getElementById('cargando'); if(c) c.remove(); });
    document.getElementById('visor').appendChild(f); frames[v] = f; f.classList.add('on');
  } else { const c = document.getElementById('cargando'); if(c) c.remove(); }
  try{ sessionStorage.setItem('vigor_mapa_vista', v); }catch(e){}
  if(location.hash !== '#' + v) history.replaceState(null, '', '#' + v);
}
document.getElementById('subtabs').addEventListener('click', ev => { const b = ev.target.closest('button[data-v]'); if(b) mostrar(b.dataset.v); });

// el nombre de la compañía en el encabezado
(async function(){
  try{
    const { data:{ session } } = await sb.auth.getSession(); if(!session) return;
    const { data:p } = await sb.from('personal').select('companias(nombre)').eq('auth_user_id', session.user.id).maybeSingle();
    document.getElementById('eyebrowCia').textContent = p && p.companias ? p.companias.nombre : 'Cuerpo General';
  }catch(e){}
})();

const ICONOS_TAB = {
  inicio: '<path d="M4 12 12 5l8 7"/><path d="M6.5 10.5V19a1 1 0 0 0 1 1h9a1 1 0 0 0 1-1v-8.5"/><path d="M10 20v-5h4v5"/>',
  compania: '<path d="M12 2.2v1.5"/><path d="M7.5 8.6C7.5 5.4 9.5 3.6 12 3.6s4.5 1.8 4.5 5"/><path d="M5.8 8.6C5.8 10.4 8.5 11.4 12 11.4s6.2-1 6.2-2.8"/><path d="M5 21c0-4.5 3-7 7-7s7 2.5 7 7"/>',
  pizarra: '<rect x="4" y="5" width="16" height="14" rx="1.6"/><path d="M7.7 10h7M7.7 13.6h4.6"/><circle cx="16.3" cy="8.3" r="1.3"/>',
  actividades: '<rect x="4" y="5.5" width="16" height="14" rx="1.6"/><path d="M4 9.5h16"/><path d="M8 3.5v3M16 3.5v3"/><path d="M8.5 13.5l2 2 4-4.2"/>',
  gps: '<path d="M12 21s7-7.2 7-12a7 7 0 1 0-14 0c0 4.8 7 12 7 12z"/><circle cx="12" cy="9" r="2.4"/>',
  opciones: '<circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2.8"/><g stroke-width="2.3"><path d="M19 12h2.3M16.95 16.95l1.63 1.63M12 19v2.3M7.05 16.95l-1.63 1.63M5 12H2.7M7.05 7.05 5.42 5.42M12 5V2.7M16.95 7.05l1.63-1.63"/></g>',
};
const TABS_NAV = [
  {href:'inicio_celular.html', ic:'inicio', label:'Inicio'},
  {href:'compania_celular.html', ic:'compania', label:'Compañía'},
  {href:'pizarra_celular.html', ic:'pizarra', label:'Pizarra'},
  {href:'actividades_celular.html', ic:'actividades', label:'Activid.'},
  {href:'mapa_celular.html', ic:'gps', label:'Mapa'},
  {href:'opciones_celular.html', ic:'opciones', label:'Opciones'},
];
(function renderTabbarReal(){
  const cont = document.getElementById('tabbarReal');
  const actual = location.pathname.split('/').pop();
  cont.innerHTML = TABS_NAV.map(t => `<a href="${t.href}" class="${t.href===actual?'active':''}"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">${ICONOS_TAB[t.ic]}</svg></span><span>${t.label}</span></a>`).join('');
})();

// vuelve a la última vista elegida (o la que pida el enlace: mapa_celular.html#clima)
(function(){ let v = (location.hash || '').slice(1); if(!VISTAS[v]){ try{ v = sessionStorage.getItem('vigor_mapa_vista'); }catch(e){} } mostrar(VISTAS[v] ? v : 'gps'); })();
</script>
</body>
</html>
