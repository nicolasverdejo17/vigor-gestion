<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Vigor — Asistencia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#060A0F; --panel:#0A131C; --panel-alt:#0E1D28; --line:#132734; --line-strong:#1C3B49;
    --text:#E7F5FA; --text-muted:#7B99A3; --text-dim:#516E78;
    --brass:#C97A2E; --brass-bright:#FF9A44; --brass-dim:#8A4E1E;
    --cyan:#49E9FF; --cyan-dim:#1E6E7D; --cyan-glow:rgba(73,233,255,0.35); --amber-glow:rgba(255,154,68,0.32);
    --burdeo:#7A1620; --burdeo-bright:#D8394E;
    --servicio:#3CF29A; --emergencia:#FF4B5C; --alerta:#FFC94D; --fuera:#C9A63B; --nodisp:#42555C;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;}
  body{
    background: radial-gradient(1100px 500px at 15% -10%, rgba(73,233,255,0.06), transparent 60%), var(--bg);
    color:var(--text); font-family:'Inter',sans-serif; height:100vh; display:flex; flex-direction:column;
  }
  .mono{font-family:'JetBrains Mono',monospace;}
  h1,h2,h3{font-family:'Rajdhani',sans-serif; text-transform:uppercase; letter-spacing:.04em; font-weight:700; margin:0;}

  .nameplate{ background:linear-gradient(180deg,var(--panel-alt),var(--panel)); border-bottom:2px solid var(--brass-dim); flex-shrink:0;}
  .nameplate-inner{ display:flex; align-items:center; justify-content:space-between; padding:14px 26px; flex-wrap:wrap; gap:12px;}
  .brand{ display:flex; align-items:center; gap:12px;}
  .brand-mark{ width:36px;height:36px; border:1.5px solid var(--brass); border-radius:3px; display:flex; align-items:center; justify-content:center; position:relative; background:var(--panel);}
  .brand-mark::before{ content:""; position:absolute; inset:4px; border:1px solid var(--brass-dim); border-radius:2px;}
  .brand-mark svg{ width:15px; height:15px;}
  .brand-text h1{ font-size:19px; letter-spacing:.04em;}
  .brand-text span{ font-size:10.5px; color:var(--text-dim); letter-spacing:.1em; text-transform:uppercase; display:block; margin-top:2px;}
  .back-btn{
    background:var(--panel); border:1.5px solid var(--line-strong); color:var(--text-muted);
    font-family:'Rajdhani'; font-weight:600; letter-spacing:.03em; text-transform:uppercase;
    font-size:12.5px; padding:9px 16px; border-radius:5px; cursor:pointer;
  }
  .back-btn:hover{ border-color:var(--brass-bright); color:var(--text);}

  .act-info{ flex-shrink:0; padding:12px 26px; background:var(--panel); border-bottom:1px solid var(--line); display:flex; align-items:center; gap:0; flex-wrap:wrap;}
  .act-item{ padding:0 20px; border-right:1px dashed var(--line);}
  .act-item:last-child{ border-right:none;}
  .act-label{ font-size:9.5px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.08em;}
  .act-val{ font-size:13.5px; font-weight:600; margin-top:2px;}

  .content-wrap{ flex:1; min-height:0; padding:16px 26px 20px; display:flex; flex-direction:column; overflow:hidden;}
  .toolbar-row{ display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; flex-shrink:0;}
  .resumen-chips{ display:flex; gap:8px;}
  .chip{ font-family:'JetBrains Mono',monospace; font-size:11.5px; font-weight:700; padding:6px 12px; border-radius:16px;}
  .chip.presente{ background:var(--servicio); color:#fff;}
  .chip.ausente{ background:var(--burdeo); color:#fff;}
  .chip.justificado{ background:var(--fuera); color:#241505;}
  .btn-marcar-todos{
    background:transparent; border:1.5px solid var(--cyan); color:var(--cyan);
    font-family:'Rajdhani'; font-weight:700; letter-spacing:.04em; text-transform:uppercase;
    font-size:12px; padding:8px 14px; border-radius:5px; cursor:pointer;
  }
  .btn-marcar-todos:hover{ background:rgba(73,233,255,0.1);}

  .lista-wrap{ flex:1; min-height:0; overflow-y:auto; background:var(--panel); border:1px solid var(--line-strong); border-radius:10px; position:relative;}
  .lista-wrap::before{ content:""; position:absolute; inset:6px; border:1px solid var(--brass-dim); border-radius:6px; pointer-events:none; opacity:.4; z-index:0;}

  .asist-row{
    display:flex; align-items:center; gap:14px; padding:11px 20px; border-bottom:1px solid var(--line); position:relative; z-index:1;
  }
  .asist-row:last-child{ border-bottom:none;}
  .asist-foto{
    width:38px; height:38px; border-radius:50%; flex-shrink:0;
    background:linear-gradient(135deg,#3A4750,#232D35); border:2px solid var(--line-strong);
    display:flex; align-items:center; justify-content:center; font-family:'Rajdhani'; font-weight:700; font-size:14px; color:var(--text-muted);
  }
  .asist-info{ flex:1; min-width:0;}
  .asist-nombre{ font-size:14px; font-weight:600;}
  .asist-cargo{ font-size:11.5px; color:var(--text-muted);}
  .asist-toggles{ display:flex; gap:6px; flex-shrink:0;}
  .asist-btn{
    background:var(--panel-alt); border:1.5px solid var(--line-strong); color:var(--text-muted);
    font-size:11.5px; font-weight:600; padding:8px 14px; border-radius:5px; cursor:pointer;
  }
  .asist-btn.presente.on{ background:var(--servicio); border-color:var(--servicio); color:#fff;}
  .asist-btn.ausente.on{ background:var(--burdeo); border-color:var(--burdeo-bright); color:#fff;}
  .asist-btn.justificado.on{ background:var(--fuera); border-color:var(--fuera); color:#241505;}

  .btn-guardar{
    width:100%; margin-top:14px; background:var(--cyan-dim); border:2px solid var(--cyan); color:#fff;
    font-family:'Rajdhani'; font-weight:700; letter-spacing:.05em; text-transform:uppercase;
    font-size:15px; padding:13px; border-radius:8px; cursor:pointer; flex-shrink:0;
  }
  .btn-guardar:hover{ background:var(--cyan); color:#0D2226;}

  .toast{
    position:fixed; bottom:26px; left:50%; transform:translateX(-50%) translateY(12px);
    background:var(--panel-alt); border:1px solid var(--cyan); color:#DFF7F9;
    padding:13px 22px; border-radius:6px; font-size:13.5px; opacity:0; pointer-events:none;
    transition:all .25s; z-index:50;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0);}
</style>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="icons/favicon-16.png" sizes="16x16" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#060A0F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Vigor">
<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}</script>
</head>
<body>

  <div class="nameplate">
    <div class="nameplate-inner">
      <div class="brand">
        <button class="back-btn" onclick="window.location.href='actividades_celular.html'">← Volver</button>
        <div class="brand-text"><h1>Pasar Asistencia</h1><span id="ciaLabel">Vigor</span></div>
      </div>
    </div>
  </div>

  <div class="act-info">
    <div class="act-item"><div class="act-label">Actividad</div><div class="act-val" id="actNombre">—</div></div>
    <div class="act-item"><div class="act-label">Fecha</div><div class="act-val" id="actFecha">—</div></div>
    <div class="act-item"><div class="act-label">Lugar</div><div class="act-val" id="actLugar">—</div></div>
  </div>

  <div class="content-wrap">
    <div class="toolbar-row">
      <div class="resumen-chips" id="resumenChips"></div>
      <button class="btn-marcar-todos" onclick="marcarTodosPresente()">Marcar todos Presente</button>
    </div>

    <div class="lista-wrap">
      <div id="listaAsistencia"></div>
    </div>

    <button class="btn-guardar" onclick="guardarAsistencia()">Guardar Asistencia</button>
  </div>

  <div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://mcfcfbtiruewlcejionr.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1jZmNmYnRpcnVld2xjZWppb25yIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzODExNzgsImV4cCI6MjEwMzk1NzE3OH0.9b_t63ah25RIGNn3pzZU3L553YUrrn7IXWW3MEjXuXU';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const params = new URLSearchParams(window.location.search);
const actividadId = params.get('actividad');
let actividad = null;
let BOMBEROS = [];

async function cargarDatos(){
  if(!actividadId){
    document.write('<p style="color:#E7F5FA; font-family:sans-serif; padding:40px;">Falta la actividad. Volvé a <a href="actividades_celular.html" style="color:#49E9FF;">Actividades</a> y elegí una de la lista.</p>');
    return;
  }
  const { data: { session } } = await sb.auth.getSession();
  if(!session){ toast('Necesitás loguearte primero'); return; }

  const { data: act, error } = await sb.from('actividades').select('*, companias(nombre)').eq('id', actividadId).single();
  if(error || !act){
    document.write('<p style="color:#E7F5FA; font-family:sans-serif; padding:40px;">No se encontró la actividad. Volvé a <a href="actividades_celular.html" style="color:#49E9FF;">Actividades</a> y elegí una de la lista.</p>');
    return;
  }
  actividad = act;

  document.getElementById('actNombre').textContent = `${actividad.tipo} — ${actividad.nombre}`;
  document.getElementById('actFecha').textContent = new Date(actividad.fecha + 'T00:00:00').toLocaleDateString('es-CL');
  document.getElementById('actLugar').textContent = [actividad.hora ? actividad.hora.slice(0,5)+' hrs' : null, actividad.lugar].filter(Boolean).join(' · ') || '—';
  document.getElementById('ciaLabel').textContent = (actividad.companias ? actividad.companias.nombre : 'Todo el Cuerpo') + ' · Vigor';

  let q = sb.from('personal').select('id, nombre_completo, cargo, numero_registro')
    .eq('cuerpo_id', actividad.cuerpo_id).neq('estado','dado_de_baja');
  q = actividad.compania_id ? q.eq('compania_id', actividad.compania_id) : q;
  const { data: personal } = await q.order('nombre_completo');

  const { data: yaMarcados } = await sb.from('asistencia').select('personal_id, estado').eq('actividad_id', actividadId);
  const marcadoMap = {};
  (yaMarcados || []).forEach(r => marcadoMap[r.personal_id] = r.estado);

  BOMBEROS = (personal || []).map(p => ({ id: p.id, n: p.nombre_completo, cargo: p.cargo, reg: p.numero_registro, estado: marcadoMap[p.id] || null }));
  render();
}

function setEstado(i, estado){
  BOMBEROS[i].estado = estado;
  render();
}
function marcarTodosPresente(){
  BOMBEROS.forEach(b=>b.estado='presente');
  render();
  toast('Todos marcados como Presente');
}

async function guardarAsistencia(){
  const sinMarcar = BOMBEROS.filter(b => !b.estado).length;
  if(sinMarcar > 0){
    toast(`Faltan ${sinMarcar} bombero(s) por marcar antes de guardar`);
    return;
  }
  const filas = BOMBEROS.map(b => ({ actividad_id: actividadId, personal_id: b.id, estado: b.estado }));
  const { error } = await sb.from('asistencia').upsert(filas, { onConflict: 'actividad_id,personal_id' });
  if(error){ toast('No se pudo guardar la asistencia — ' + error.message); return; }
  await sb.from('actividades').update({ estado: 'finalizada' }).eq('id', actividadId);

  const presentes = BOMBEROS.filter(b => b.estado === 'presente').length;
  const ausentes = BOMBEROS.filter(b => b.estado === 'ausente').length;
  const justificados = BOMBEROS.filter(b => b.estado === 'justificado').length;
  toast(`Asistencia guardada — ${presentes} presentes, ${ausentes} ausentes, ${justificados} justificados`);
  setTimeout(() => { window.location.href = 'actividades_celular.html'; }, 1400);
}

function render(){
  const lista = document.getElementById('listaAsistencia');
  lista.innerHTML = BOMBEROS.map((b,i)=>{
    const initials = b.n.split(' ').map(p=>p[0]).join('').toUpperCase();
    return `
      <div class="asist-row">
        <div class="asist-foto">${initials}</div>
        <div class="asist-info">
          <div class="asist-nombre">${b.n}</div>
          <div class="asist-cargo">${b.cargo} · N° ${b.reg}</div>
        </div>
        <div class="asist-toggles">
          <button class="asist-btn presente ${b.estado==='presente'?'on':''}" onclick="setEstado(${i},'presente')">Presente</button>
          <button class="asist-btn ausente ${b.estado==='ausente'?'on':''}" onclick="setEstado(${i},'ausente')">Ausente</button>
          <button class="asist-btn justificado ${b.estado==='justificado'?'on':''}" onclick="setEstado(${i},'justificado')">Justificado</button>
        </div>
      </div>
    `;
  }).join('');

  const p = BOMBEROS.filter(b=>b.estado==='presente').length;
  const a = BOMBEROS.filter(b=>b.estado==='ausente').length;
  const j = BOMBEROS.filter(b=>b.estado==='justificado').length;
  document.getElementById('resumenChips').innerHTML = `
    <span class="chip presente">${p} Presente${p!==1?'s':''}</span>
    <span class="chip ausente">${a} Ausente${a!==1?'s':''}</span>
    <span class="chip justificado">${j} Justificado${j!==1?'s':''}</span>
  `;
}

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2400);
}

cargarDatos();
</script>
</body>
</html>
