<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>VIGOR — Terminal de Coordenadas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#060A0F; --panel:#0A131C; --panel-alt:#0E1D28; --line:#132734; --line-strong:#1C3B49;
    --text:#E7F5FA; --text-muted:#7B99A3; --text-dim:#516E78;
    --brass:#C97A2E; --brass-bright:#FF9A44; --brass-dim:#8A4E1E;
    --cyan:#49E9FF; --cyan-dim:#1E6E7D; --cyan-glow:rgba(73,233,255,0.35); --amber-glow:rgba(255,154,68,0.32);
    --burdeo:#7A1620; --burdeo-bright:#D8394E;
    --servicio:#3CF29A; --emergencia:#FF4B5C; --alerta:#FFC94D;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--text); font-family:'Inter',sans-serif;
    min-height:100vh; display:flex; flex-direction:column;
  }
  .mono{font-family:'JetBrains Mono',monospace;}
  h1,h2,h3{font-family:'Rajdhani',sans-serif; text-transform:uppercase; letter-spacing:.04em; font-weight:700; margin:0;}

  .nameplate{ background:linear-gradient(180deg,var(--panel-alt),var(--panel)); border-bottom:2px solid var(--brass-dim); flex-shrink:0;}
  .nameplate-inner{ display:flex; align-items:center; justify-content:space-between; padding:16px 28px; max-width:1180px; margin:0 auto;}
  .brand{ display:flex; align-items:center; gap:12px;}
  .brand-mark{ width:34px; height:34px; border-radius:8px; background:var(--panel); border:1.5px solid var(--cyan); display:flex; align-items:center; justify-content:center;}
  .brand-text h1{ font-size:19px;}
  .brand-text span{ font-size:11px; color:var(--text-dim); letter-spacing:.06em; text-transform:uppercase;}
  .clock{ font-family:'JetBrains Mono',monospace; text-align:right; color:var(--text-muted); font-size:12px;}
  .clock strong{ display:block; font-size:28px; font-weight:700; letter-spacing:.02em; color:var(--cyan); text-shadow:0 0 12px var(--cyan-glow);}

  .central-tabs{ display:flex; gap:6px; padding:0 28px 10px; flex-wrap:wrap;}
  .central-tab{
    background:var(--panel); border:1.5px solid var(--line-strong); color:var(--text-muted);
    font-family:'Rajdhani',sans-serif; font-weight:700; font-size:11.5px; letter-spacing:.03em; text-transform:uppercase;
    padding:8px 14px; border-radius:6px; cursor:pointer; text-decoration:none;
  }
  .central-tab.on{ background:var(--cyan-dim); border-color:var(--cyan); color:#fff;}
  .central-tab:hover{ border-color:var(--brass-bright);}
  .tab-badge{
    display:inline-flex; align-items:center; justify-content:center; min-width:16px; height:16px;
    background:var(--emergencia); color:#fff; font-size:9.5px; font-weight:800; border-radius:8px;
    padding:0 4px; margin-left:6px; vertical-align:middle;
  }

  .demo-tag{ max-width:1180px; margin:0 auto; padding:0 28px 10px; font-size:11.5px; color:var(--text-dim);}
  .demo-tag b{ color:var(--cyan);}

  .wrap{ flex:1; max-width:1180px; width:100%; margin:0 auto; padding:0 28px 28px; display:grid; grid-template-columns:1fr 300px; gap:20px; min-height:0;}

  /* ---- Feed tipo chat ---- */
  .feed-panel{ background:var(--panel); border:1px solid var(--line-strong); border-radius:10px; display:flex; flex-direction:column; overflow:hidden;}
  .feed-head{ padding:14px 18px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center;}
  .feed-head h2{ font-size:14px;}
  .feed-count{ font-family:'JetBrains Mono',monospace; color:var(--cyan); font-size:13px;}
  .feed-list{ flex:1; overflow-y:auto; padding:14px 18px; display:flex; flex-direction:column; gap:10px; max-height:640px;}

  .feed-item{
    background:var(--panel-alt); border:1px solid var(--line-strong); border-left:3px solid var(--cyan);
    border-radius:8px; padding:12px 14px; position:relative;
  }
  .feed-item.reciente{ border-left-color:var(--servicio);}
  .feed-item.despacho{ border-left-color:var(--emergencia);}
  .feed-item.no-leido{ background:var(--panel); box-shadow:inset 0 0 0 1px var(--cyan);}
  .no-leido-dot{
    width:8px; height:8px; border-radius:50%; background:var(--cyan); flex-shrink:0;
    animation:pulso 1.6s ease-in-out infinite;
  }
  @keyframes pulso{ 0%,100%{ opacity:1;} 50%{ opacity:.35;} }
  .feed-top{ display:flex; align-items:center; gap:10px; margin-bottom:6px;}
  .feed-avatar{
    width:32px; height:32px; border-radius:50%; background:linear-gradient(135deg,#3A4750,#232D35);
    border:2px solid var(--line-strong); display:flex; align-items:center; justify-content:center;
    font-family:'Rajdhani'; font-weight:700; font-size:11px; color:var(--text-muted); flex-shrink:0;
  }
  .feed-nombre{ font-size:13px; font-weight:700;}
  .feed-meta{ font-size:10.5px; color:var(--text-muted);}
  .feed-hora{ margin-left:auto; font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--text-dim); white-space:nowrap;}
  .feed-coords{
    font-family:'JetBrains Mono',monospace; font-size:13px; color:var(--cyan); background:var(--panel);
    border-radius:5px; padding:6px 10px; display:inline-flex; align-items:center; gap:7px; margin-top:2px;
  }
  .feed-contexto{ font-size:10.5px; color:var(--text-dim); margin-top:6px;}
  .feed-contexto b{ color:var(--alerta);}
  .feed-actions{ display:flex; gap:6px; margin-top:8px;}
  .feed-btn{
    background:transparent; border:1px solid var(--line-strong); color:var(--text-muted);
    font-size:10.5px; font-weight:600; padding:5px 10px; border-radius:5px; cursor:pointer;
  }
  .feed-btn:hover{ border-color:var(--cyan); color:var(--cyan);}

  /* ---- Panel lateral: Compañías con reporte activo ---- */
  .side-panel{ background:var(--panel); border:1px solid var(--line-strong); border-radius:10px; padding:16px; overflow-y:auto; max-height:700px;}
  .side-title{ font-size:11px; color:var(--brass-bright); text-transform:uppercase; letter-spacing:.06em; margin-bottom:12px; padding-bottom:8px; border-bottom:1px solid var(--line);}
  .cia-mini-row{ display:flex; justify-content:space-between; align-items:center; padding:9px 0; border-bottom:1px solid var(--line); font-size:12.5px;}
  .cia-mini-row:last-child{ border-bottom:none;}
  .cia-mini-count{ font-family:'JetBrains Mono',monospace; color:var(--cyan); font-weight:700;}

  .empty-state{ text-align:center; padding:50px 20px; color:var(--text-dim); font-size:12.5px;}

  .toast{
    position:fixed; bottom:26px; left:50%; transform:translateX(-50%) translateY(12px);
    background:var(--panel-alt); border:1px solid var(--cyan); color:#DFF7F9;
    padding:13px 22px; border-radius:6px; font-size:13.5px; opacity:0; pointer-events:none;
    transition:all .25s; z-index:50; text-align:center;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0);}
</style>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="icons/favicon-16.png" sizes="16x16" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#060A0F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Vigor">
<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}</script>
</head>
<body>

  <div class="nameplate">
    <div class="nameplate-inner">
      <div class="brand">
        <div class="brand-mark"><svg viewBox="0 0 24 24" fill="none"><path d="M12 2L4 6v6c0 5 3.5 8.5 8 10 4.5-1.5 8-5 8-10V6l-8-4z" stroke="#49E9FF" stroke-width="1.6"/></svg></div>
        <div class="brand-text"><h1>Terminal de Coordenadas</h1><span id="cuerpoLabel">Vigor</span></div>
      </div>
      <div class="clock"><strong id="clk">—</strong><span id="fechaHoy">—</span></div>
    </div>
  </div>

  <div class="central-tabs">
    <a href="consola_despacho.html" class="central-tab">Consola de Despacho</a>
    <a href="visual_companias.html" class="central-tab">Visual de Compañías</a>
    <a href="puestos_mando_activos.html" class="central-tab">Modo Crisis Compañías</a>
    <a href="historial_despacho.html" class="central-tab">Historial de Despacho</a>
    <a href="terminal_coordenadas.html" class="central-tab on">Terminal de Coordenadas<span class="tab-badge" id="tabBadge" style="display:none;">0</span></a>
  </div>

  <div class="wrap">
    <div class="feed-panel">
      <div class="feed-head">
        <h2>Ubicaciones Reportadas</h2>
        <div style="display:flex; align-items:center; gap:10px;">
          <button class="feed-btn" onclick="marcarTodosLeidos()">✓ Marcar todos como leídos</button>
          <span class="feed-count" id="feedCount">0 hoy</span>
        </div>
      </div>
      <div class="feed-list" id="feedList"></div>
    </div>

    <div class="side-panel">
      <div class="side-title">Bomberos con Reportes Hoy</div>
      <div id="ciaResumen"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://mcfcfbtiruewlcejionr.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1jZmNmYnRpcnVld2xjZWppb25yIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzODExNzgsImV4cCI6MjEwMzk1NzE3OH0.9b_t63ah25RIGNn3pzZU3L553YUrrn7IXWW3MEjXuXU';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { persistSession: true, autoRefreshToken: true } });

// Cada reporte corresponde a un toque de "Reportar esta Ubicación a Central"
// desde coordenadas_celular.html. Se recibe en orden cronológico — el más
// reciente arriba, como un feed tipo chat. La limpieza de reportes con más
// de 12h de antigüedad la hace un cron job en la base de datos
// (limpieza_reportes_coordenadas), no el cliente — así corre aunque nadie
// tenga esta pantalla abierta.
let REPORTES = [];
let miCuerpoId = null;

async function cargarDatos(){
  const { data: { session } } = await sb.auth.getSession();
  if(!session){ toast('Necesitás loguearte primero'); return; }

  // La Central de Alarmas (sesión institucional, sin fila en "personal")
  // también usa esta pestaña — se prueba primero, igual que en
  // consola_despacho.html.
  const { data: cuerpoCentral } = await sb.rpc('central_obtener_cuerpo');
  const filaCentral = cuerpoCentral && cuerpoCentral[0];
  if(filaCentral){
    miCuerpoId = filaCentral.c_cuerpo_id;
    document.getElementById('cuerpoLabel').textContent = filaCentral.c_nombre_oficial + ' · Vigor';
  } else {
    const { data: perfil } = await sb.from('personal').select('cuerpo_id, cuerpos(nombre_oficial)').eq('auth_user_id', session.user.id).single();
    if(!perfil) return;
    miCuerpoId = perfil.cuerpo_id;
    document.getElementById('cuerpoLabel').textContent = (perfil.cuerpos ? perfil.cuerpos.nombre_oficial : 'Cuerpo') + ' · Vigor';
  }
  await refrescarFeed();
  suscribirRealtime();
}

let suscritoCoordenadas = false;
function suscribirRealtime(){
  if(suscritoCoordenadas) return;
  suscritoCoordenadas = true;
  sb.channel('terminal-coordenadas-feed')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'reportes_coordenadas', filter: `cuerpo_id=eq.${miCuerpoId}` }, () => {
      refrescarFeed();
    })
    .subscribe();
}

async function refrescarFeed(){
  const { data } = await sb.from('reportes_coordenadas')
    .select('id, lat, lng, leido, creado_en, personal(nombre_completo, cargo, numero_registro, companias(nombre))')
    .eq('cuerpo_id', miCuerpoId)
    .order('creado_en', { ascending:false });
  REPORTES = (data || []).map(r => ({
    id: r.id, nombre: r.personal.nombre_completo, reg: r.personal.numero_registro, cargo: r.personal.cargo,
    cia: r.personal.companias ? r.personal.companias.nombre : 'Cuerpo General',
    lat: r.lat, lng: r.lng, creado: new Date(r.creado_en), leido: r.leido
  }));
  renderFeed();
  renderResumenCias();
}

function iniciales(n){ return n.split(' ').map(p=>p[0]).join('').toUpperCase(); }

function renderFeed(){
  const list = document.getElementById('feedList');
  if(REPORTES.length === 0){
    list.innerHTML = `<div class="empty-state">Sin reportes de ubicación todavía hoy.</div>`;
  } else {
    list.innerHTML = REPORTES.map((r,i) => `
      <div class="feed-item reciente ${!r.leido ? 'no-leido' : ''}">
        <div class="feed-top">
          ${!r.leido ? '<span class="no-leido-dot" title="Sin revisar"></span>' : ''}
          <div class="feed-avatar">${iniciales(r.nombre)}</div>
          <div>
            <div class="feed-nombre">${r.nombre}</div>
            <div class="feed-meta">${r.cargo} · N° ${r.reg} · ${r.cia}</div>
          </div>
          <div class="feed-hora">${r.creado.toLocaleTimeString('es-CL', {hour:'2-digit', minute:'2-digit', hour12:false})}</div>
        </div>
        <div class="feed-coords">📍 ${r.lat.toFixed(5)}, ${r.lng.toFixed(5)}</div>
        <div class="feed-actions">
          <button class="feed-btn" onclick="verEnMapa(${r.lat}, ${r.lng})">🗺️ Ver en Mapa</button>
          <button class="feed-btn" onclick="copiarCoords(${r.lat}, ${r.lng})">📋 Copiar</button>
          ${!r.leido ? `<button class="feed-btn" onclick="marcarLeido('${r.id}')">✓ Marcar como leído</button>` : ''}
        </div>
      </div>
    `).join('');
  }
  document.getElementById('feedCount').textContent = REPORTES.length + ' hoy';
  actualizarBadge();
}

async function marcarLeido(id){
  const { error } = await sb.from('reportes_coordenadas').update({ leido: true }).eq('id', id);
  if(error){ toast('No se pudo marcar como leído — ' + error.message); return; }
  const r = REPORTES.find(x => x.id === id);
  if(r) r.leido = true;
  renderFeed();
}

async function marcarTodosLeidos(){
  const idsNoLeidos = REPORTES.filter(r => !r.leido).map(r => r.id);
  if(idsNoLeidos.length === 0) return;
  const { error } = await sb.from('reportes_coordenadas').update({ leido: true }).in('id', idsNoLeidos);
  if(error){ toast('No se pudo actualizar — ' + error.message); return; }
  REPORTES.forEach(r => { r.leido = true; });
  renderFeed();
  toast('Todos los reportes marcados como leídos');
}

function actualizarBadge(){
  const noLeidos = REPORTES.filter(r => !r.leido).length;
  const badge = document.getElementById('tabBadge');
  if(noLeidos > 0){
    badge.textContent = noLeidos;
    badge.style.display = 'inline-flex';
  } else {
    badge.style.display = 'none';
  }
}

// Bug reportado: este panel agrupaba por Compañía — no decía QUIÉN
// reportó, solo de qué Compañía era. Ahora agrupa por bombero.
function renderResumenCias(){
  const conteo = {};
  REPORTES.forEach(r => { conteo[r.nombre] = (conteo[r.nombre]||0) + 1; });
  const el = document.getElementById('ciaResumen');
  const nombres = Object.keys(conteo);
  if(nombres.length === 0){
    el.innerHTML = `<div class="empty-state" style="padding:20px 0;">Sin actividad</div>`;
    return;
  }
  el.innerHTML = nombres.map(n => `
    <div class="cia-mini-row"><span>${n}</span><span class="cia-mini-count">${conteo[n]}</span></div>
  `).join('');
}

function copiarCoords(lat, lng){
  const texto = `${lat.toFixed(5)}, ${lng.toFixed(5)}`;
  if(navigator.clipboard) navigator.clipboard.writeText(texto).then(()=>toast('Copiado: '+texto)).catch(()=>toast('Coordenadas: '+texto));
  else toast('Coordenadas: '+texto);
}

// Abre Google Maps en pestaña nueva, centrado exactamente en la coordenada
// reportada — no es un aviso de mentira, navega de verdad.
function verEnMapa(lat, lng){
  window.open(`https://www.google.com/maps?q=${lat},${lng}`, '_blank');
}

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2600);
}

function tick(){
  const n = new Date();
  const el = document.getElementById('clk');
  if(el) el.textContent = n.toLocaleTimeString('es-CL', {hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:false});
  const fel = document.getElementById('fechaHoy');
  if(fel) fel.textContent = n.toLocaleDateString('es-CL', {weekday:'long', day:'numeric', month:'long'});
}
tick(); setInterval(tick, 1000);

cargarDatos();
setInterval(cargarDatos, 60000);
</script>
</body>
</html>
