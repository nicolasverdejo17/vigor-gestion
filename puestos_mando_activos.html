<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Vigor — Modo Crisis Compañías</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#060A0F; --panel:#0A131C; --panel-alt:#0E1D28; --line:#132734; --line-strong:#1C3B49;
    --text:#E7F5FA; --text-muted:#7B99A3; --text-dim:#516E78;
    --brass:#C97A2E; --brass-bright:#FF9A44; --brass-dim:#8A4E1E;
    --cyan:#49E9FF; --cyan-dim:#1E6E7D; --cyan-glow:rgba(73,233,255,0.35); --amber-glow:rgba(255,154,68,0.32);
    --burdeo:#7A1620; --burdeo-bright:#D8394E;
    --servicio:#3CF29A; --emergencia:#FF4B5C; --alerta:#FFC94D; --fuera:#C9A63B; --nodisp:#42555C;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;}
  body{
    background: radial-gradient(1100px 500px at 15% -10%, rgba(216,57,78,0.06), transparent 60%), var(--bg);
    color:var(--text); font-family:'Inter',sans-serif; height:100vh; display:flex; flex-direction:column;
  }
  .mono{font-family:'JetBrains Mono',monospace;}
  h1,h2,h3{font-family:'Rajdhani',sans-serif; text-transform:uppercase; letter-spacing:.04em; font-weight:700; margin:0;}

  .nameplate{ background:linear-gradient(180deg,var(--panel-alt),var(--panel)); border-bottom:2px solid var(--brass-dim); flex-shrink:0;}
  .nameplate-inner{ display:flex; align-items:center; justify-content:space-between; padding:14px 26px; flex-wrap:wrap; gap:12px;}
  .brand{ display:flex; align-items:center; gap:12px;}
  .brand-mark{ width:36px;height:36px; border:1.5px solid var(--brass); border-radius:3px; display:flex; align-items:center; justify-content:center; position:relative; background:var(--panel);}
  .brand-mark::before{ content:""; position:absolute; inset:4px; border:1px solid var(--brass-dim); border-radius:2px;}
  .brand-mark svg{ width:15px; height:15px;}
  .brand-text h1{ font-size:19px; letter-spacing:.04em;}
  .brand-text span{ font-size:10.5px; color:var(--text-dim); letter-spacing:.1em; text-transform:uppercase; display:block; margin-top:2px;}
  .clock{ text-align:right; color:var(--text-muted); font-size:12px; line-height:1.3;}
  .clock strong{ display:block; color:var(--cyan); text-shadow:0 0 12px var(--cyan-glow); font-size:28px; font-weight:700; letter-spacing:.02em; font-family:'JetBrains Mono',monospace;}

  .content-wrap{ flex:1; min-height:0; padding:20px 26px 22px; overflow-y:auto;}
  .head-row{ display:flex; align-items:center; gap:10px; margin-bottom:16px;}
  .head-row h2{ font-size:18px;}
  .count-badge{ font-family:'JetBrains Mono',monospace; background:var(--burdeo); color:#fff; font-size:12px; font-weight:700; padding:3px 10px; border-radius:12px;}

  .grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(380px,1fr)); gap:14px;}

  .pm-card{
    background:var(--panel); border:2px solid var(--burdeo-bright); border-radius:10px;
    padding:18px 20px; position:relative; overflow:hidden;
  }
  .pm-card::before{ content:""; position:absolute; inset:6px; border:1px solid var(--brass-dim); border-radius:6px; pointer-events:none; opacity:.4;}
  .pm-pulse-row{ display:flex; align-items:center; gap:8px; margin-bottom:4px; position:relative; z-index:1;}
  .pm-pulse{ width:9px; height:9px; border-radius:50%; background:var(--burdeo-bright); box-shadow:0 0 0 0 rgba(216,57,78,.6); animation:pulse 1.8s infinite; flex-shrink:0;}
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(216,57,78,.55);}
    70%{box-shadow:0 0 0 8px rgba(216,57,78,0);}
    100%{box-shadow:0 0 0 0 rgba(216,57,78,0);}
  }
  .pm-cia{ font-size:17px;}

  .pm-since{ font-size:11px; color:var(--text-dim); margin-bottom:14px; position:relative; z-index:1;}
  .pm-since b{ color:var(--text-muted); font-family:'JetBrains Mono',monospace;}

  .pm-stat-row{ display:flex; gap:0; margin-bottom:14px; position:relative; z-index:1;}
  .pm-stat{ flex:1; text-align:center;}
  .pm-stat b{ display:block; font-family:'JetBrains Mono',monospace; font-size:20px; color:var(--cyan); font-weight:700;}
  .pm-stat span{ font-size:9px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.04em;}

  .pm-batallones-heading{ font-size:10px; color:var(--brass-bright); text-transform:uppercase; letter-spacing:.07em; font-weight:700; margin-bottom:8px; position:relative; z-index:1;}
  .pm-batallones{ display:flex; flex-direction:column; gap:6px; margin-bottom:14px; position:relative; z-index:1;}
  .bat-row{ display:flex; justify-content:space-between; align-items:center; background:var(--panel-alt); border-radius:5px; padding:7px 11px; font-size:12px;}
  .bat-estado{ font-size:9.5px; font-weight:700; text-transform:uppercase; padding:2px 8px; border-radius:10px;}
  .bat-estado.emergencia{ background:var(--emergencia); color:#fff;}
  .bat-estado.disponible{ background:var(--servicio); color:#fff;}
  .bat-estado.rancho{ background:var(--fuera); color:#241505;}

  .btn-ver{
    width:100%; background:transparent; border:1.5px solid var(--cyan); color:var(--cyan);
    font-family:'Rajdhani'; font-weight:700; letter-spacing:.04em; text-transform:uppercase;
    font-size:12px; padding:9px; border-radius:6px; cursor:pointer; position:relative; z-index:1;
  }
  .btn-ver:hover{ background:rgba(73,233,255,0.1);}

  .empty-state{ text-align:center; padding:60px 20px; color:var(--text-dim); font-size:14px;}

  .toast{
    position:fixed; bottom:26px; left:50%; transform:translateX(-50%) translateY(12px);
    background:var(--panel-alt); border:1px solid var(--cyan); color:#DFF7F9;
    padding:13px 22px; border-radius:6px; font-size:13.5px; opacity:0; pointer-events:none;
    transition:all .25s; z-index:50;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0);}

  .central-tabs{ display:flex; gap:6px; padding:0 28px 10px; flex-wrap:wrap;}
  .central-tab{
    background:var(--panel); border:1.5px solid var(--line-strong); color:var(--text-muted);
    font-family:'Rajdhani',sans-serif; font-weight:700; font-size:11.5px; letter-spacing:.03em; text-transform:uppercase;
    padding:8px 14px; border-radius:6px; cursor:pointer; text-decoration:none;
  }
  .central-tab.on{ background:var(--cyan-dim); border-color:var(--cyan); color:#fff;}
  .central-tab:hover{ border-color:var(--brass-bright);}
  .tab-badge{ display:inline-flex; align-items:center; justify-content:center; min-width:16px; height:16px; background:var(--emergencia); color:#fff; font-size:9.5px; font-weight:800; border-radius:8px; padding:0 4px; margin-left:6px; vertical-align:middle;}
</style>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="icons/favicon-16.png" sizes="16x16" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#060A0F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Vigor">
<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}</script>
</head>
<body>

  <div class="nameplate">
    <div class="nameplate-inner">
      <div class="brand">
        <div class="brand-mark"><svg viewBox="0 0 24 24" fill="none"><path d="M12 2L4 6v6c0 5 3.5 8.5 8 10 4.5-1.5 8-5 8-10V6l-8-4z" stroke="#49E9FF" stroke-width="1.6"/></svg></div>
        <div class="brand-text"><h1>Modo Crisis Compañías</h1><span id="cuerpoLabel">Central de Alarmas · Vigor</span></div>
      </div>
      <div class="clock"><strong id="clk">—</strong><span id="fechaHoy">—</span></div>
    </div>
  </div>

  <div class="central-tabs">
    <a href="consola_despacho.html" class="central-tab">Consola de Despacho</a>
    <a href="visual_companias.html" class="central-tab">Visual de Compañías</a>
    <a href="puestos_mando_activos.html" class="central-tab on">Modo Crisis Compañías</a>
    <a href="historial_despacho.html" class="central-tab">Historial de Despacho</a>
    <a href="terminal_coordenadas.html" class="central-tab">Terminal de Coordenadas<span class="tab-badge">3</span></a>
  </div>

  <div class="content-wrap">
    <div class="head-row">
      <h2>Compañías con Modo Crisis activo</h2>
      <span class="count-badge" id="countBadge">2</span>
    </div>

    <div class="grid" id="grid"></div>
  </div>

  <div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://mcfcfbtiruewlcejionr.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1jZmNmYnRpcnVld2xjZWppb25yIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzODExNzgsImV4cCI6MjEwMzk1NzE3OH0.9b_t63ah25RIGNn3pzZU3L553YUrrn7IXWW3MEjXuXU';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { persistSession: true, autoRefreshToken: true } });

let PUESTOS = [];

async function cargarDatos(){
  const { data: { session } } = await sb.auth.getSession();
  if(!session){ toast('Necesitás loguearte primero'); return; }

  // Sesión institucional de Central primero (sin fila en "personal"),
  // igual que en consola_despacho.html.
  let miCuerpoId;
  const { data: cuerpoCentral } = await sb.rpc('central_obtener_cuerpo');
  const filaCentral = cuerpoCentral && cuerpoCentral[0];
  if(filaCentral){
    miCuerpoId = filaCentral.c_cuerpo_id;
    document.getElementById('cuerpoLabel').textContent = 'Central de Alarmas · ' + filaCentral.c_nombre_oficial + ' · Vigor';
  } else {
    const { data: perfil } = await sb.from('personal').select('cuerpo_id, cuerpos(nombre_oficial)').eq('auth_user_id', session.user.id).single();
    if(!perfil) return;
    miCuerpoId = perfil.cuerpo_id;
    document.getElementById('cuerpoLabel').textContent = 'Central de Alarmas · ' + (perfil.cuerpos ? perfil.cuerpos.nombre_oficial : 'Cuerpo') + ' · Vigor';
  }

  const { data } = await sb.from('puestos_mando')
    .select('fecha_activacion, companias!inner(nombre, cuerpo_id), batallones(nombre, estado, batallon_carros(id))')
    .eq('activo', true).eq('companias.cuerpo_id', miCuerpoId);

  PUESTOS = (data || []).map(pm => ({
    cia: pm.companias.nombre,
    desde: new Date(pm.fecha_activacion).toLocaleTimeString('es-CL', {hour:'2-digit', minute:'2-digit', hour12:false}),
    batallonesActivos: (pm.batallones || []).length,
    carrosEnEvento: (pm.batallones || []).reduce((s,b)=>s+(b.batallon_carros||[]).length, 0),
    batallones: (pm.batallones || []).map(b => ({ nombre: b.nombre, estado: b.estado }))
  }));
  render();
  suscribirRealtime();
}

// Modo Crisis es colaborativo — Central y varias Compañías pueden tener
// esta pantalla abierta mientras el tablero cambia. Sin cuerpo_id directo
// en estas tablas, se escucha sin filtro y se confía en la RLS.
let suscritoPuestosMando = false;
function suscribirRealtime(){
  if(suscritoPuestosMando) return;
  suscritoPuestosMando = true;
  sb.channel('puestos-mando-activos-live')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'puestos_mando' }, () => cargarDatos())
    .on('postgres_changes', { event: '*', schema: 'public', table: 'batallones' }, () => cargarDatos())
    .on('postgres_changes', { event: '*', schema: 'public', table: 'batallon_carros' }, () => cargarDatos())
    .subscribe();
}

function render(){
  const grid = document.getElementById('grid');
  if(PUESTOS.length===0){
    grid.innerHTML = `<div class="empty-state">Ninguna Compañía tiene el Modo Crisis activo en este momento.</div>`;
    document.getElementById('countBadge').textContent = '0';
    return;
  }
  document.getElementById('countBadge').textContent = PUESTOS.length;
  grid.innerHTML = PUESTOS.map(p => {
    const batHtml = p.batallones.map(b => {
      const label = {emergencia:'En Emergencia', disponible:'Disponible', rancho:'Rancho'}[b.estado];
      return `<div class="bat-row"><span>${b.nombre}</span><span class="bat-estado ${b.estado}">${label}</span></div>`;
    }).join('');
    return `
      <div class="pm-card">
        <div class="pm-pulse-row"><div class="pm-pulse"></div><div class="pm-cia">${p.cia}</div></div>
        <div class="pm-since">Activo desde <b>${p.desde}</b></div>
        <div class="pm-stat-row">
          <div class="pm-stat"><b>${p.batallonesActivos}</b><span>Batallones</span></div>
          <div class="pm-stat"><b>${p.carrosEnEvento}</b><span>Carros en Evento</span></div>
        </div>
        <div class="pm-batallones-heading">Desglose de Batallones</div>
        <div class="pm-batallones">${batHtml}</div>
      </div>
    `;
  }).join('');
}

function tick(){
  const n = new Date();
  document.getElementById('clk').textContent = n.toLocaleTimeString('es-CL',{hour12:false});
  document.getElementById('fechaHoy').textContent = n.toLocaleDateString('es-CL', {weekday:'long', day:'numeric', month:'long'});
}
tick(); setInterval(tick,1000);

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2600);
}

cargarDatos();
</script>
</body>
</html>
