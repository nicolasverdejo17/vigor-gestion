<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>VIGOR — Restablecer Contraseñas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#060A0F; --panel:#0A131C; --panel-alt:#0E1D28; --line:#132734; --line-strong:#1C3B49;
    --text:#E7F5FA; --text-muted:#7B99A3; --text-dim:#516E78;
    --brass-bright:#FF9A44; --brass-dim:#8A4E1E;
    --cyan:#49E9FF; --cyan-dim:#1E6E7D; --cyan-glow:rgba(73,233,255,0.35); --amber-glow:rgba(255,154,68,0.32);
    --burdeo:#7A1620; --burdeo-bright:#D8394E;
    --master:#39FF14; --master-dim:#1F9E0A;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;}
  body{
    background: radial-gradient(1200px 550px at 15% -10%, rgba(57,255,20,0.08), transparent 60%), var(--bg);
    color:var(--text); font-family:'Inter',sans-serif; height:100vh; display:flex; flex-direction:column;
    border:3px solid var(--master);
  }
  .mono{font-family:'JetBrains Mono',monospace;}
  h1,h2,h3{font-family:'Rajdhani',sans-serif; text-transform:uppercase; letter-spacing:.04em; font-weight:700; margin:0;}
  .wordmark{ text-align:center; font-family:'Rajdhani'; font-weight:600; letter-spacing:.35em; font-size:12px; color:var(--master); padding:9px 0 7px; text-transform:uppercase; flex-shrink:0; background:var(--bg);}
  .nameplate{ background:linear-gradient(180deg,var(--panel-alt),var(--panel)); border-bottom:2px solid var(--master); flex-shrink:0;}
  .nameplate-inner{ display:flex; align-items:center; justify-content:space-between; padding:14px 26px;}
  .back-btn{ background:transparent; border:1.5px solid var(--line-strong); color:var(--text-muted); font-family:'Rajdhani'; font-weight:600; font-size:12px; padding:8px 14px; border-radius:5px; cursor:pointer;}
  .back-btn:hover{ border-color:var(--master); color:var(--master);}
  .brand-text{ margin-left:16px;}
  .brand-text h1{ font-size:19px; color:var(--master);}
  .brand-text span{ font-size:10.5px; color:var(--text-dim); letter-spacing:.1em; text-transform:uppercase; display:block; margin-top:2px;}
  .role-tag{ font-family:'Rajdhani'; font-weight:700; font-size:11.5px; letter-spacing:.06em; text-transform:uppercase; padding:6px 14px; border-radius:4px; background:var(--master-dim); border:1.5px solid var(--master); color:#fff;}

  .content-wrap{ flex:1; min-height:0; padding:22px 30px; display:flex; gap:20px; overflow:hidden;}

  .col-buscar{ width:380px; flex-shrink:0; display:flex; flex-direction:column; gap:14px;}
  .panel{ background:var(--panel); border:1px solid var(--line-strong); border-radius:10px; padding:18px 20px;}
  .panel h3{ font-size:11.5px; color:var(--master); letter-spacing:.08em; margin-bottom:14px; padding-bottom:8px; border-bottom:1px solid var(--line);}
  .field{ margin-bottom:12px;}
  .field label{ display:block; font-size:10.5px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.06em; margin-bottom:6px; font-weight:600;}
  .field input{ width:100%; background:var(--panel-alt); border:1.5px solid var(--line-strong); border-radius:6px; padding:10px 12px; font-size:13.5px; color:var(--text);}
  .field input:focus{ outline:none; border-color:var(--master);}
  .btn-buscar{ width:100%; background:var(--master-dim); border:2px solid var(--master); color:#fff; font-family:'Rajdhani'; font-weight:700; letter-spacing:.05em; text-transform:uppercase; font-size:13px; padding:11px; border-radius:8px; cursor:pointer;}
  .btn-buscar:hover{ background:var(--master); color:#0D2206;}

  .tabs-tipo{ display:flex; background:var(--panel-alt); border:1px solid var(--line-strong); border-radius:8px; padding:3px; gap:3px;}
  .tab-tipo{ flex:1; padding:9px 4px; border-radius:6px; border:none; background:transparent; color:var(--text-muted); font-family:'Rajdhani'; font-weight:700; letter-spacing:.03em; text-transform:uppercase; font-size:11px; cursor:pointer;}
  .tab-tipo.on{ background:var(--master-dim); color:#fff;}
  select#buscarTipoInst{ width:100%; background:var(--panel-alt); border:1.5px solid var(--line-strong); border-radius:6px; padding:10px 12px; font-size:13.5px; color:var(--text); font-family:'Inter';}

  .col-resultado{ flex:1; min-width:0; overflow-y:auto;}
  .empty-state{ display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; color:var(--text-dim); font-size:13px; gap:10px;}

  .user-card{ background:var(--panel); border:2px solid var(--master); border-radius:10px; padding:22px 26px;}
  .user-top{ display:flex; align-items:center; gap:14px; margin-bottom:18px; padding-bottom:16px; border-bottom:1px solid var(--line);}
  .user-avatar{ width:52px; height:52px; border-radius:50%; background:linear-gradient(135deg,#3A4750,#232D35); display:flex; align-items:center; justify-content:center; font-family:'Rajdhani'; font-weight:700; font-size:19px; color:var(--text-muted); flex-shrink:0;}
  .user-nombre{ font-size:17px; font-weight:700;}
  .user-meta{ font-size:12px; color:var(--text-muted); margin-top:2px;}

  .warn-box{ display:flex; gap:10px; background:rgba(122,22,32,0.1); border:1px solid var(--burdeo-bright); border-radius:8px; padding:12px 14px; font-size:12px; color:var(--text-muted); margin-bottom:18px; line-height:1.5;}
  .warn-box b{ color:var(--burdeo-bright);}

  .btn-reset{ width:100%; background:var(--burdeo); border:2px solid var(--burdeo-bright); color:#fff; font-family:'Rajdhani'; font-weight:700; letter-spacing:.05em; text-transform:uppercase; font-size:14px; padding:13px; border-radius:8px; cursor:pointer;}
  .btn-reset:hover{ background:var(--burdeo-bright);}

  .resultado-clave{ margin-top:18px; background:var(--panel-alt); border:1.5px solid var(--master); border-radius:8px; padding:16px 20px; text-align:center;}
  .resultado-clave .lbl{ font-size:10px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.08em; margin-bottom:8px;}
  .resultado-clave .clave{ font-family:'JetBrains Mono',monospace; font-size:22px; font-weight:700; color:var(--master); letter-spacing:.05em;}
  .resultado-clave .nota{ font-size:11px; color:var(--text-dim); margin-top:8px;}

  .toast{ position:fixed; bottom:26px; left:50%; transform:translateX(-50%) translateY(12px); background:var(--panel-alt); border:1px solid var(--master); color:#fff; padding:13px 22px; border-radius:6px; font-size:13.5px; opacity:0; pointer-events:none; transition:all .25s; z-index:50; text-align:center;}
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0);}
</style>
<link rel="manifest" href="manifest-maestro.json">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="icons/favicon-16.png" sizes="16x16" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#060A0F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Vigor Maestro">
<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}</script>
</head>
<body>

  <div class="wordmark">VIGOR</div>

  <div class="nameplate">
    <div class="nameplate-inner">
      <div style="display:flex; align-items:center;">
        <button class="back-btn" onclick="window.location.href='perfil_maestro.html'">← Panel Maestro</button>
        <div class="brand-text"><h1>Restablecer Contraseñas</h1><span>Cualquier usuario, sin pasar por su Director · Vigor</span></div>
      </div>
      <div class="role-tag">Sesión: Super Admin</div>
    </div>
  </div>

  <div class="content-wrap">
    <div class="col-buscar">
      <div class="panel">
        <h3>Tipo de Cuenta</h3>
        <div class="tabs-tipo">
          <button class="tab-tipo on" id="tabBombero" onclick="setModoBusqueda('bombero')">Bombero</button>
          <button class="tab-tipo" id="tabInstitucional" onclick="setModoBusqueda('institucional')">PC / Carro / Central</button>
        </div>
      </div>
      <div class="panel" id="panelBombero">
        <h3>Buscar Bombero</h3>
        <div class="field">
          <label>N° de Bombero / Registro</label>
          <input type="text" class="mono" id="buscarNumero" placeholder="Ej. 118" onkeydown="if(event.key==='Enter') buscarUsuario()">
        </div>
        <button class="btn-buscar" onclick="buscarUsuario()">🔍 Buscar</button>
      </div>
      <div class="panel" id="panelInstitucional" style="display:none;">
        <h3>Buscar Cuenta Institucional</h3>
        <div class="field">
          <label>Código de Cuerpo</label>
          <input type="text" class="mono" id="buscarCodigoCuerpo" placeholder="Ej. FLORIDA" style="text-transform:uppercase;">
        </div>
        <div class="field">
          <label>Tipo</label>
          <select id="buscarTipoInst" onchange="renderCampoIdentificador()">
            <option value="pc">PC del Cuartel</option>
            <option value="carro">Carro</option>
            <option value="central">Central de Alarmas</option>
          </select>
        </div>
        <div class="field" id="campoIdentificadorWrap">
          <label id="labelIdentificador">N° de Compañía</label>
          <input type="text" class="mono" id="buscarIdentificador" placeholder="Ej. 1" onkeydown="if(event.key==='Enter') buscarInstitucional()">
        </div>
        <button class="btn-buscar" onclick="buscarInstitucional()">🔍 Buscar</button>
      </div>
    </div>

    <div class="col-resultado" id="resultadoWrap">
      <div class="empty-state">
        <span style="font-size:32px;">🔑</span>
        <span>Buscá un N° de Registro para restablecer su contraseña.</span>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://mcfcfbtiruewlcejionr.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1jZmNmYnRpcnVld2xjZWppb25yIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzODExNzgsImV4cCI6MjEwMzk1NzE3OH0.9b_t63ah25RIGNn3pzZU3L553YUrrn7IXWW3MEjXuXU';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { persistSession: true, autoRefreshToken: true } });

async function verificarAcceso(){
  const { data: { session } } = await sb.auth.getSession();
  if(!session){ toast('Necesitás loguearte primero'); return; }
  const { data: soyAdmin } = await sb.rpc('soy_super_admin');
  if(!soyAdmin){
    document.getElementById('resultadoWrap').innerHTML = `<div class="empty-state"><span style="font-size:32px;">🔒</span><span>Esta herramienta es exclusiva de Super Admin.</span></div>`;
    document.querySelector('.btn-buscar').disabled = true;
  }
}
verificarAcceso();

function iniciales(n){ return n.split(' ').filter(Boolean).map(p=>p[0]).join('').slice(0,2).toUpperCase(); }

function setModoBusqueda(modo){
  document.getElementById('tabBombero').classList.toggle('on', modo==='bombero');
  document.getElementById('tabInstitucional').classList.toggle('on', modo==='institucional');
  document.getElementById('panelBombero').style.display = modo==='bombero' ? 'block' : 'none';
  document.getElementById('panelInstitucional').style.display = modo==='institucional' ? 'block' : 'none';
  document.getElementById('resultadoWrap').innerHTML = `<div class="empty-state"><span style="font-size:32px;">🔑</span><span>Buscá una cuenta para restablecer su contraseña.</span></div>`;
}
function renderCampoIdentificador(){
  const tipo = document.getElementById('buscarTipoInst').value;
  const wrap = document.getElementById('campoIdentificadorWrap');
  const label = document.getElementById('labelIdentificador');
  if(tipo === 'central'){ wrap.style.display = 'none'; return; }
  wrap.style.display = 'block';
  label.textContent = tipo === 'pc' ? 'N° de Compañía' : 'Nomenclatura del Carro';
  document.getElementById('buscarIdentificador').placeholder = tipo === 'pc' ? 'Ej. 1' : 'Ej. B-1';
}

async function buscarInstitucional(){
  const codigo = document.getElementById('buscarCodigoCuerpo').value.trim();
  const tipo = document.getElementById('buscarTipoInst').value;
  const identificador = document.getElementById('buscarIdentificador').value.trim();
  const wrap = document.getElementById('resultadoWrap');
  if(!codigo){
    wrap.innerHTML = `<div class="empty-state"><span style="font-size:32px;">❓</span><span>Ingresá el Código de Cuerpo.</span></div>`;
    return;
  }
  if(tipo !== 'central' && !identificador){
    wrap.innerHTML = `<div class="empty-state"><span style="font-size:32px;">❓</span><span>Falta el ${tipo==='pc' ? 'N° de Compañía' : 'Nomenclatura del Carro'}.</span></div>`;
    return;
  }

  let label = null, meta = null;
  if(tipo === 'pc'){
    const { data } = await sb.from('companias').select('nombre, cuerpos!inner(nombre_oficial, codigo_cuerpo)')
      .eq('numero', parseInt(identificador, 10)).ilike('cuerpos.codigo_cuerpo', codigo).maybeSingle();
    if(data){ label = 'PC — ' + data.nombre; meta = data.cuerpos.nombre_oficial; }
  } else if(tipo === 'carro'){
    const { data } = await sb.from('carros').select('nomenclatura, tipo_descripcion, cuerpos!inner(nombre_oficial, codigo_cuerpo)')
      .ilike('nomenclatura', identificador).ilike('cuerpos.codigo_cuerpo', codigo).maybeSingle();
    if(data){ label = 'Carro ' + data.nomenclatura; meta = data.tipo_descripcion + ' · ' + data.cuerpos.nombre_oficial; }
  } else {
    const { data } = await sb.from('cuerpos').select('nombre_oficial').ilike('codigo_cuerpo', codigo).maybeSingle();
    if(data){ label = 'Central de Alarmas'; meta = data.nombre_oficial; }
  }
  if(!label){
    wrap.innerHTML = `<div class="empty-state"><span style="font-size:32px;">❓</span><span>No se encontró esa cuenta.</span></div>`;
    return;
  }

  wrap.innerHTML = `
    <div class="user-card">
      <div class="user-top">
        <div class="user-avatar">🖥️</div>
        <div>
          <div class="user-nombre">${label}</div>
          <div class="user-meta">${meta}</div>
        </div>
      </div>
      <div class="warn-box">⚠ Esta acción genera una contraseña temporal nueva que <b>debe usarse al próximo inicio de sesión</b> — el sistema la reconoce por su formato (XXXX-XXXX) y lleva a definir una contraseña nueva. Las sesiones ya iniciadas en otros dispositivos siguen activas hasta que expiren por su cuenta.</div>
      <button class="btn-reset" onclick="resetearPasswordInstitucional('${tipo}', '${codigo.replace(/'/g,"\\'")}', '${identificador.replace(/'/g,"\\'")}', '${label.replace(/'/g,"\\'")}')">🔑 Restablecer Contraseña</button>
      <div id="claveResultado"></div>
    </div>
  `;
}

async function resetearPasswordInstitucional(tipo, codigo, identificador, label){
  const { data, error } = await sb.rpc('resetear_password_institucional_admin', {
    p_tipo: tipo, p_codigo_cuerpo: codigo, p_identificador: identificador || null
  });
  if(error){
    toast('No se pudo restablecer — ' + error.message);
    return;
  }
  const clave = data[0].r_password_temporal;
  document.getElementById('claveResultado').innerHTML = `
    <div class="resultado-clave">
      <div class="lbl">Contraseña Temporal Generada</div>
      <div class="clave">${clave}</div>
      <div class="nota">Usuario para entrar: ${tipo==='central' ? 'CENTRAL' : identificador} · Código de Cuerpo: ${codigo.toUpperCase()}</div>
    </div>
  `;
  toast(`Contraseña de ${label} restablecida correctamente`);
}

async function buscarUsuario(){
  const num = document.getElementById('buscarNumero').value.trim();
  const wrap = document.getElementById('resultadoWrap');
  const numInt = parseInt(num, 10);
  if(!num || isNaN(numInt)){
    wrap.innerHTML = `<div class="empty-state"><span style="font-size:32px;">❓</span><span>Ingresá un N° de Registro válido.</span></div>`;
    return;
  }
  const { data: u } = await sb.from('personal')
    .select('nombre_completo, cargo, companias(nombre), cuerpos(nombre_oficial)')
    .eq('numero_registro', numInt).maybeSingle();
  if(!u){
    wrap.innerHTML = `<div class="empty-state"><span style="font-size:32px;">❓</span><span>No se encontró ningún usuario con N° ${num}.</span></div>`;
    return;
  }
  const cia = u.companias ? u.companias.nombre : 'Central de Alarmas';
  wrap.innerHTML = `
    <div class="user-card">
      <div class="user-top">
        <div class="user-avatar">${iniciales(u.nombre_completo)}</div>
        <div>
          <div class="user-nombre">${u.nombre_completo}</div>
          <div class="user-meta">${u.cargo} · ${cia} · N° ${num}${u.cuerpos ? ' · ' + u.cuerpos.nombre_oficial : ''}</div>
        </div>
      </div>
      <div class="warn-box">⚠ Esta acción genera una contraseña temporal nueva que <b>debe usarse al próximo inicio de sesión</b> — expira al primer uso o a los 7 días. Las sesiones ya iniciadas en otros dispositivos siguen activas hasta que expiren por su cuenta.</div>
      <button class="btn-reset" onclick="resetearPassword('${numInt}', '${u.nombre_completo.replace(/'/g,"\\'")}')">🔑 Restablecer Contraseña</button>
      <div id="claveResultado"></div>
    </div>
  `;
}

async function resetearPassword(num, nombre){
  const { data, error } = await sb.rpc('resetear_password_admin', { p_numero_registro: num });
  if(error){
    toast('No se pudo restablecer — ' + error.message);
    return;
  }
  const clave = data[0].r_password_temporal;
  document.getElementById('claveResultado').innerHTML = `
    <div class="resultado-clave">
      <div class="lbl">Contraseña Temporal Generada</div>
      <div class="clave">${clave}</div>
      <div class="nota">Entregar en persona a ${nombre} — expira al primer uso o en 7 días</div>
    </div>
  `;
  toast(`Contraseña de ${nombre} restablecida correctamente`);
}

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 3000);
}
</script>
</body>
</html>
