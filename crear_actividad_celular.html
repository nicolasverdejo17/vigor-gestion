<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>VIGOR — Nueva Actividad</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet"></noscript>
<style>
  :root{
    --bg:#060A0F; --panel:#0A131C; --panel-alt:#0E1D28; --line:#132734; --line-strong:#1C3B49;
    --text:#E7F5FA; --text-muted:#7B99A3; --text-dim:#516E78;
    --brass:#C97A2E; --brass-bright:#FF9A44; --brass-dim:#8A4E1E;
    --cyan:#49E9FF; --cyan-dim:#1E6E7D; --cyan-glow:rgba(73,233,255,0.35); --amber-glow:rgba(255,154,68,0.32);
    --burdeo:#7A1620; --burdeo-bright:#D8394E;
    --servicio:#3CF29A; --emergencia:#FF4B5C; --alerta:#FFC94D; --fuera:#C9A63B; --nodisp:#42555C;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;}
  body{
    background: radial-gradient(900px 500px at 50% -10%, rgba(73,233,255,0.08), transparent 60%), #060A0F;
    font-family:'Inter',sans-serif; color:var(--text);
  }
  .mono{font-family:'JetBrains Mono',monospace;}
  h1,h2,h3{font-family:'Rajdhani',sans-serif; text-transform:uppercase; letter-spacing:.04em; font-weight:700; margin:0;}

  .phone{ height:100%; display:flex; flex-direction:column; position:relative;}

  .app-head{ padding:10px 18px 8px; flex-shrink:0; display:flex; align-items:center; gap:10px;}
  .back-btn{ background:var(--panel); border:1.5px solid var(--line-strong); color:var(--text-muted); font-family:'Rajdhani'; font-weight:600; font-size:11px; padding:7px 11px; border-radius:6px; cursor:pointer;}
  .app-head h1{ font-size:17px;}

  .content{ flex:1; overflow-y:auto; padding:10px 18px 18px;}
  .content::-webkit-scrollbar{ display:none;}

  .field{ margin-bottom:14px;}
  .field label{ display:block; font-size:10.5px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.06em; font-weight:600; margin-bottom:6px;}
  .field input, .field select, .field textarea{
    width:100%; background:var(--panel-alt); border:1.5px solid var(--line-strong); border-radius:6px;
    padding:10px 12px; font-size:13.5px; color:var(--text); font-family:'Inter';
  }
  .field textarea{ resize:none; min-height:64px; }
  .field input:focus, .field select:focus, .field textarea:focus{ outline:none; border-color:var(--cyan);}
  .row2{ display:flex; gap:10px;}
  .row2 .field{ flex:1;}

  .btn-crear{
    width:100%; margin-top:6px; background:var(--cyan-dim); border:2px solid var(--cyan); color:#fff;
    font-family:'Rajdhani'; font-weight:700; letter-spacing:.05em; text-transform:uppercase;
    font-size:14px; padding:13px; border-radius:8px; cursor:pointer;
  }
  .btn-crear:hover{ background:var(--cyan); color:#0D2226;}

  .empty{ text-align:center; padding:40px 20px; color:var(--text-dim); font-size:12.5px;}

  .toast{
    position:absolute; bottom:20px; left:16px; right:16px;
    background:var(--panel-alt); border:1px solid var(--cyan); color:#DFF7F9;
    padding:11px 16px; border-radius:8px; font-size:12.5px; opacity:0; transform:translateY(8px);
    transition:all .25s; pointer-events:none; text-align:center; z-index:30;
  }
  .toast.show{ opacity:1; transform:translateY(0);}
</style>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="icons/favicon-16.png" sizes="16x16" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#060A0F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Vigor">
<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}</script>
</head>
<body>

  <div class="phone">
    <div class="app-head">
      <button class="back-btn" onclick="window.location.href='actividades_celular.html'">← Volver</button>
      <h1>Nueva Actividad</h1>
    </div>

    <div class="content" id="content">
      <div class="field"><label>Tipo</label><input type="text" id="fTipo" placeholder="Ej. Reunión, Capacitación, Práctica Operativa"></div>
      <div class="field"><label>Nombre</label><input type="text" id="fNombre" placeholder="Ej. Reunión General de Compañía"></div>
      <div class="row2">
        <div class="field"><label>Fecha</label><input type="date" id="fFecha"></div>
        <div class="field"><label>Hora</label><input type="time" id="fHora"></div>
      </div>
      <div class="field"><label>Lugar</label><input type="text" id="fLugar" placeholder="Ej. Cuartel"></div>
      <div class="field"><label>Descripción (opcional)</label><textarea id="fDescripcion" placeholder="Detalles adicionales…"></textarea></div>
      <button class="btn-crear" id="btnCrear" onclick="crearActividad()">Crear Actividad</button>
    </div>

    <div class="toast" id="toast"></div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://mcfcfbtiruewlcejionr.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1jZmNmYnRpcnVld2xjZWppb25yIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzODExNzgsImV4cCI6MjEwMzk1NzE3OH0.9b_t63ah25RIGNn3pzZU3L553YUrrn7IXWW3MEjXuXU';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { persistSession: true, autoRefreshToken: true, storageKey: 'vigor-auth-v1' } });
const PRIORIDAD_CARGO_MANDO = ['Director','Capitán','Teniente 1°','Teniente 2°','Teniente 3°','Teniente 4°','Ayudante Cía.'];

let miCuerpoId = null, miCompaniaId = null, miPersonalId = null;

async function cargarDatos(){
  const { data: { session } } = await sb.auth.getSession();
  if(!session){ bloquear('Necesitás loguearte primero.'); return; }
  const { data: perfil } = await sb.from('personal')
    .select('id, cargo, cuerpo_id, compania_id').eq('auth_user_id', session.user.id).single();
  if(!perfil){ bloquear('No se encontró tu perfil.'); return; }
  if(!PRIORIDAD_CARGO_MANDO.includes(perfil.cargo)){ bloquear('Esta pantalla es exclusiva de oficiales de la Compañía.'); return; }
  miPersonalId = perfil.id; miCuerpoId = perfil.cuerpo_id; miCompaniaId = perfil.compania_id;
}
function bloquear(msg){
  document.getElementById('content').innerHTML = `<div class="empty">🔒 ${msg}</div>`;
}

async function crearActividad(){
  const tipo = document.getElementById('fTipo').value.trim();
  const nombre = document.getElementById('fNombre').value.trim();
  const fecha = document.getElementById('fFecha').value;
  const hora = document.getElementById('fHora').value || null;
  const lugar = document.getElementById('fLugar').value.trim() || null;
  const descripcion = document.getElementById('fDescripcion').value.trim() || null;
  if(!tipo || !nombre || !fecha){ toast('Completá al menos tipo, nombre y fecha'); return; }

  const { error } = await sb.from('actividades').insert({
    cuerpo_id: miCuerpoId, compania_id: miCompaniaId, tipo, nombre, fecha, hora, lugar, descripcion,
    creado_por: miPersonalId
  });
  if(error){ toast('No se pudo crear la actividad — ' + error.message); return; }
  toast(`Actividad "${nombre}" creada`);
  setTimeout(()=>window.location.href = 'actividades_celular.html', 900);
}

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2400);
}

cargarDatos();
</script>
</body>
</html>
