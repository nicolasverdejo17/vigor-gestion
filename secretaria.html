<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Vigor — Secretaría</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#060A0F; --panel:#0A131C; --panel-alt:#0E1D28; --line:#132734; --line-strong:#1C3B49;
    --text:#E7F5FA; --text-muted:#7B99A3; --text-dim:#516E78;
    --brass:#C97A2E; --brass-bright:#FF9A44; --brass-dim:#8A4E1E;
    --cyan:#49E9FF; --cyan-dim:#1E6E7D; --cyan-glow:rgba(73,233,255,0.35); --amber-glow:rgba(255,154,68,0.32);
    --burdeo:#7A1620; --burdeo-bright:#D8394E;
    --servicio:#3CF29A; --emergencia:#FF4B5C; --alerta:#FFC94D;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;}
  body{ background:var(--bg); color:var(--text); font-family:'Inter',sans-serif; height:100vh; display:flex; flex-direction:column;}
  h1,h2,h3{font-family:'Rajdhani',sans-serif; text-transform:uppercase; letter-spacing:.04em; font-weight:700; margin:0;}
  .mono{font-family:'JetBrains Mono',monospace;}

  .nameplate{ background:linear-gradient(180deg,var(--panel-alt),var(--panel)); border-bottom:2px solid var(--brass-dim); flex-shrink:0;}
  .nameplate-inner{ display:flex; align-items:center; justify-content:space-between; padding:12px 26px; flex-wrap:wrap; gap:12px;}
  .brand{ display:flex; align-items:center; gap:11px;}
  .back-btn{
    background:var(--panel); border:1.5px solid var(--line-strong); color:var(--text-muted);
    font-family:'Rajdhani',sans-serif; font-weight:600; letter-spacing:.03em; text-transform:uppercase;
    font-size:11.5px; padding:8px 14px; border-radius:5px; cursor:pointer; margin-right:6px;
  }
  .back-btn:hover{ border-color:var(--brass-bright); color:var(--text);}
  .brand-mark{ width:36px;height:36px; border:1.5px solid var(--brass); border-radius:3px; display:flex; align-items:center; justify-content:center; position:relative; background:var(--panel);}
  .brand-mark::before{ content:""; position:absolute; inset:4px; border:1px solid var(--brass-dim); border-radius:2px;}
  .brand-mark svg{ width:15px; height:15px;}
  .brand-text h1{ font-size:17px;}
  .brand-text span{ font-size:10.5px; color:var(--text-dim); letter-spacing:.06em; text-transform:uppercase;}

  .tabs-row{ flex-shrink:0; padding:0 26px; background:var(--panel); border-bottom:1px solid var(--line); display:flex; gap:4px; overflow-x:auto;}
  .tab-btn{
    background:transparent; border:none; border-bottom:3px solid transparent; color:var(--text-muted);
    font-family:'Rajdhani'; font-weight:700; letter-spacing:.03em; text-transform:uppercase;
    font-size:12px; padding:12px 16px; cursor:pointer; white-space:nowrap;
  }
  .tab-btn.on{ color:var(--cyan); border-bottom-color:var(--cyan);}

  .content-wrap{ flex:1; min-height:0; overflow-y:auto; padding:20px 26px;}
  .content-inner{ max-width:980px; margin:0 auto;}
  .panel-view{ display:none;}
  .panel-view.active{ display:block;}

  .toolbar-panel{ display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; flex-wrap:wrap; gap:10px;}
  .toolbar-panel h2{ font-size:16px;}
  .btn-nuevo{
    background:var(--cyan-dim); border:1.5px solid var(--cyan); color:#fff;
    font-family:'Rajdhani'; font-weight:700; letter-spacing:.03em; text-transform:uppercase;
    font-size:11.5px; padding:9px 16px; border-radius:6px; cursor:pointer;
  }
  .btn-nuevo:hover{ background:var(--cyan); color:#0D2226;}

  .item-row{
    background:var(--panel); border:1px solid var(--line-strong); border-radius:8px;
    padding:13px 16px; margin-bottom:9px; display:flex; align-items:center; gap:14px; cursor:pointer;
  }
  .item-row:hover{ border-color:var(--brass-bright);}
  .item-icon{ width:36px; height:36px; border-radius:8px; background:var(--panel-alt); display:flex; align-items:center; justify-content:center; font-size:16px; flex-shrink:0;}
  .item-info{ flex:1; min-width:0;}
  .item-titulo{ font-size:13.5px; font-weight:600;}
  .item-sub{ font-size:11px; color:var(--text-muted); margin-top:2px;}
  .item-tag{ font-size:9.5px; font-weight:700; text-transform:uppercase; padding:4px 9px; border-radius:9px; color:#fff; flex-shrink:0;}
  .item-fecha{ font-size:11px; color:var(--text-dim); font-family:'JetBrains Mono',monospace; flex-shrink:0; text-align:right; min-width:80px;}
  .item-descarga{
    width:30px; height:30px; border-radius:6px; background:var(--panel-alt); border:1.5px solid var(--cyan-dim);
    color:var(--cyan); display:flex; align-items:center; justify-content:center; font-size:14px; flex-shrink:0;
    text-decoration:none;
  }
  .item-descarga:hover{ border-color:var(--cyan); background:var(--cyan-dim);}
  .item-eliminar{
    width:26px; height:26px; border-radius:6px; background:var(--panel-alt); border:1.5px solid var(--line-strong);
    color:var(--text-dim); display:flex; align-items:center; justify-content:center; font-size:12px; flex-shrink:0; cursor:pointer;
  }
  .item-eliminar:hover{ border-color:var(--burdeo-bright); color:var(--burdeo-bright);}

  .empty-state{ text-align:center; padding:50px 20px; color:var(--text-dim); font-size:12.5px;}

  .modal-overlay{ position:fixed; inset:0; background:rgba(5,10,15,0.75); z-index:60; display:none; align-items:center; justify-content:center; padding:20px;}
  .modal-overlay.show{ display:flex;}
  .modal-box{ background:var(--panel); border:1.5px solid var(--brass-dim); border-radius:12px; padding:22px 24px; width:100%; max-width:480px; max-height:85vh; overflow-y:auto;}
  .modal-box h3{ font-size:15px; margin-bottom:16px;}
  .modal-field{ margin-bottom:13px;}
  .modal-field label{ display:block; font-size:10.5px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.05em; margin-bottom:6px;}
  .modal-field input, .modal-field select, .modal-field textarea{
    width:100%; background:var(--panel-alt); border:1.5px solid var(--line-strong); border-radius:6px;
    padding:9px 11px; font-size:12.5px; color:var(--text); font-family:'Inter';
  }
  .modal-field textarea{ min-height:70px; resize:vertical;}
  .modal-actions{ display:flex; gap:9px; margin-top:16px;}
  .modal-cancel{ flex:1; background:transparent; border:1.5px solid var(--line-strong); color:var(--text-muted); font-family:'Rajdhani'; font-weight:700; text-transform:uppercase; font-size:11.5px; padding:10px; border-radius:6px; cursor:pointer;}
  .modal-guardar{ flex:1.4; background:var(--cyan-dim); border:1.5px solid var(--cyan); color:#fff; font-family:'Rajdhani'; font-weight:700; text-transform:uppercase; font-size:11.5px; padding:10px; border-radius:6px; cursor:pointer;}

  .toast{
    position:fixed; bottom:22px; left:50%; transform:translateX(-50%) translateY(10px);
    background:var(--panel-alt); border:1px solid var(--cyan); color:#DFF7F9;
    padding:12px 20px; border-radius:8px; font-size:13px; opacity:0; pointer-events:none;
    transition:all .25s; z-index:70;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0);}
</style>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<body>

  <div class="nameplate">
    <div class="nameplate-inner">
      <div class="brand">
        <button class="back-btn" onclick="window.location.href='administracion_general.html'">← Administración General</button>
        <div class="brand-mark"><svg viewBox="0 0 24 24" fill="none"><path d="M12 2L4 6v6c0 5 3.5 8.5 8 10 4.5-1.5 8-5 8-10V6l-8-4z" stroke="#49E9FF" stroke-width="1.6"/></svg></div>
        <div class="brand-text"><h1>Secretaría</h1><span id="cuerpoLabel">Vigor</span></div>
      </div>
    </div>
  </div>

  <div id="sinPermiso" style="display:none; padding:40px; text-align:center; color:var(--text-dim); font-size:13px;">
    🔒 Esta pantalla es exclusiva de Superintendente, Vicesuperintendente, Secretario General o Tesorero General.
  </div>

  <div class="tabs-row" id="tabsRow"></div>

  <div class="content-wrap" id="contentWrap">
    <div class="content-inner" id="contentInner"></div>
  </div>

  <div class="modal-overlay" id="modalNuevo">
    <div class="modal-box">
      <h3 id="modalTitulo">Nuevo registro</h3>
      <div id="modalCampos"></div>
      <div class="modal-actions">
        <button class="modal-cancel" onclick="cerrarModal()">Cancelar</button>
        <button class="modal-guardar" onclick="confirmarNuevo()">Guardar</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://mcfcfbtiruewlcejionr.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1jZmNmYnRpcnVld2xjZWppb25yIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzODExNzgsImV4cCI6MjEwMzk1NzE3OH0.9b_t63ah25RIGNn3pzZU3L553YUrrn7IXWW3MEjXuXU';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { persistSession: true, autoRefreshToken: true } });
let miCuerpoId = null;

function fmtFecha(f){ return f ? new Date(f + 'T00:00:00').toLocaleDateString('es-CL') : '—'; }

// Secretaría — antes eran tarjetas atenuadas marcadas "Pendiente" en
// Administración General. Ahora las 6 áreas tienen contenido y
// funcionalidad real: Actas, Sesiones, Citaciones, Acuerdos,
// Correspondencia y Archivo Institucional. Cada fila es tocable de verdad
// (antes tenía cursor:pointer pero ningún onclick) para cambiar su estado.
const AREAS = {
  actas: {
    label:'Actas', icono:'📝', tabla:'secretaria_actas',
    campos:[{id:'titulo',label:'Título',tipo:'text',placeholder:'Ej. Sesión Ordinaria N°8',col:'titulo'},{id:'fecha',label:'Fecha de la sesión',tipo:'date',col:'fecha_sesion'},{id:'resumen',label:'Resumen',tipo:'textarea',placeholder:'Puntos tratados…',col:'resumen'}],
    estados:['Pendiente firma','Aprobada'],
    colorEstado:{ 'Aprobada':'#3CF29A', 'Pendiente firma':'#FFC94D' },
    titulo:it=>it.titulo, sub:it=>it.resumen||'Sin resumen', fecha:it=>fmtFecha(it.fecha_sesion), tag:it=>it.estado, orderCol:'fecha_sesion',
  },
  sesiones: {
    label:'Sesiones', icono:'📅', tabla:'secretaria_sesiones',
    campos:[{id:'titulo',label:'Título de la sesión',tipo:'text',placeholder:'Ej. Sesión Ordinaria N°9',col:'titulo'},{id:'fecha',label:'Fecha',tipo:'date',col:'fecha'},{id:'hora',label:'Hora',tipo:'time',col:'hora'},{id:'lugar',label:'Lugar',tipo:'text',placeholder:'Sala de Directorio, Cuartel General',col:'lugar'}],
    estados:['Programada','Realizada'],
    colorEstado:{ 'Programada':'#49E9FF', 'Realizada':'#42555C' },
    titulo:it=>it.titulo, sub:it=>[it.hora ? it.hora.slice(0,5) : null, it.lugar].filter(Boolean).join(' · ') || '—', fecha:it=>fmtFecha(it.fecha), tag:it=>it.estado, orderCol:'fecha',
  },
  citaciones: {
    label:'Citaciones', icono:'📨', tabla:'secretaria_citaciones',
    campos:[{id:'titulo',label:'Motivo de la citación',tipo:'text',placeholder:'Ej. Sesión Ordinaria N°9',col:'motivo'},{id:'destinatarios',label:'Destinatarios',tipo:'text',placeholder:'Ej. Directorio General completo',col:'destinatarios'},{id:'fecha',label:'Fecha límite de envío',tipo:'date',col:'fecha_limite_envio'}],
    estados:['Por enviar','Enviada'],
    colorEstado:{ 'Por enviar':'#FFC94D', 'Enviada':'#3CF29A' },
    titulo:it=>it.motivo, sub:it=>it.destinatarios||'—', fecha:it=>fmtFecha(it.fecha_limite_envio), tag:it=>it.estado, orderCol:'fecha_limite_envio',
  },
  acuerdos: {
    label:'Acuerdos', icono:'🤝', tabla:'secretaria_acuerdos',
    campos:[{id:'titulo',label:'Acuerdo',tipo:'text',placeholder:'Ej. Compra de EPP para 3ª Compañía',col:'titulo'},{id:'sesion',label:'Sesión donde se tomó',tipo:'text',placeholder:'Ej. Sesión Ordinaria N°8',col:'sesion_referencia'},{id:'responsable',label:'Responsable de ejecución',tipo:'text',placeholder:'Ej. Tesorero General',col:'responsable'}],
    estados:['En curso','Cumplido'],
    colorEstado:{ 'En curso':'#FFC94D', 'Cumplido':'#3CF29A' },
    titulo:it=>it.titulo, sub:it=>[it.sesion_referencia ? 'Sesión: '+it.sesion_referencia : null, it.responsable ? 'Responsable: '+it.responsable : null].filter(Boolean).join(' · ') || '—', fecha:it=>new Date(it.creado_en).toLocaleDateString('es-CL'), tag:it=>it.estado, orderCol:'creado_en',
  },
  correspondencia: {
    label:'Correspondencia', icono:'✉️', tabla:'secretaria_correspondencia',
    campos:[{id:'titulo',label:'Asunto',tipo:'text',placeholder:'Ej. Solicitud de reunión',col:'asunto'},{id:'tipo',label:'Tipo',tipo:'select',opciones:['Entrada','Salida'],col:'tipo'},{id:'origen',label:'De / Para',tipo:'text',placeholder:'Ej. Municipalidad de la comuna',col:'origen_destino'},{id:'archivo',label:'Adjuntar documento (opcional)',tipo:'file',col:'archivo_url'}],
    estados:null,
    colorEstado:{ 'Entrada':'#49E9FF', 'Salida':'#FFC94D' },
    titulo:it=>it.asunto, sub:it=>`${it.tipo} · ${it.tipo==='Entrada'?'De':'Para'}: ${it.origen_destino||'—'}`, fecha:it=>fmtFecha(it.fecha), tag:it=>it.tipo, orderCol:'fecha',
    extraInsert:()=>({ fecha: new Date().toISOString().slice(0,10) }),
  },
  archivo: {
    label:'Archivo Institucional', icono:'🗄️', tabla:'secretaria_archivo',
    campos:[{id:'titulo',label:'Nombre del documento',tipo:'text',placeholder:'Ej. Estatutos del Cuerpo',col:'nombre_documento'},{id:'categoria',label:'Categoría',tipo:'select',opciones:['Estatutos','Reglamentos','Históricos','Convenios','Otros'],col:'categoria'},{id:'descripcion',label:'Descripción',tipo:'textarea',placeholder:'De qué trata este documento…',col:'descripcion'},{id:'fechaDoc',label:'Fecha del documento',tipo:'date',col:'fecha_documento'},{id:'archivo',label:'Archivo (PDF, Word, Excel, PowerPoint o imagen)',tipo:'file',col:'archivo_url'}],
    estados:['Vigente','Archivado'],
    colorEstado:{ 'Vigente':'#3CF29A', 'Archivado':'#42555C' },
    titulo:it=>it.nombre_documento, sub:it=>it.descripcion ? `${it.categoria} — ${it.descripcion}` : 'Categoría: '+it.categoria, fecha:it=>it.fecha_documento ? fmtFecha(it.fecha_documento) : '—', tag:it=>it.estado, orderCol:'creado_en',
  },
};

const ACCEPT_DOCUMENTOS = 'application/pdf,image/jpeg,image/png,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.ms-powerpoint,application/vnd.openxmlformats-officedocument.presentationml.presentation,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
let archivoAdjuntoFile = null;

let areaActiva = 'actas';

// Secretario/a de Compañía tiene las mismas 6 herramientas que Secretario
// General, pero acotadas a su propia Compañía -- no al Cuerpo General.
const ROLES_CUERPO_GENERAL_SEC = ['Superintendente','Vicesuperintendente','Secretario General','Tesorero General'];
const ROLES_CON_ACCESO = [...ROLES_CUERPO_GENERAL_SEC, 'Secretario/a'];
let miCompaniaId = null;
async function cargarSesion(){
  const { data: { session } } = await sb.auth.getSession();
  if(!session){ toast('Necesitás loguearte primero'); return; }
  const { data: perfil } = await sb.from('personal').select('cuerpo_id, compania_id, cargo, companias(nombre), cuerpos(nombre_oficial)').eq('auth_user_id', session.user.id).single();
  if(!perfil) return;
  if(!ROLES_CON_ACCESO.includes(perfil.cargo)){
    document.getElementById('contentWrap').style.display = 'none';
    document.getElementById('sinPermiso').style.display = 'block';
    return;
  }
  miCuerpoId = perfil.cuerpo_id;
  // Un cargo institucional (Secretario General, etc.) ve/administra el
  // Cuerpo General (compania_id null) aunque también tenga Compañía propia
  // (doble cargo) -- un Secretario/a de Compañía se acota a la suya.
  miCompaniaId = ROLES_CUERPO_GENERAL_SEC.includes(perfil.cargo) ? null : perfil.compania_id;
  const alcanceTxt = miCompaniaId ? (perfil.companias ? perfil.companias.nombre : 'Compañía') : 'Cuerpo General';
  document.getElementById('cuerpoLabel').textContent = (perfil.cuerpos ? perfil.cuerpos.nombre_oficial : 'Cuerpo') + ' · ' + alcanceTxt + ' · Vigor';
  renderTabs();
  await cargarArea();
  renderContent();
}

async function cargarArea(){
  const a = AREAS[areaActiva];
  let q = sb.from(a.tabla).select('*').eq('cuerpo_id', miCuerpoId);
  q = miCompaniaId ? q.eq('compania_id', miCompaniaId) : q.is('compania_id', null);
  const { data } = await q.order(a.orderCol, { ascending:false });
  a.items = data || [];
}

function renderTabs(){
  document.getElementById('tabsRow').innerHTML = Object.entries(AREAS).map(([k,a]) =>
    `<button class="tab-btn ${areaActiva===k?'on':''}" onclick="setArea('${k}')">${a.icono} ${a.label}</button>`
  ).join('');
}
async function setArea(k){
  areaActiva = k;
  renderTabs();
  await cargarArea();
  renderContent();
}
function renderContent(){
  const a = AREAS[areaActiva];
  const html = `
    <div class="toolbar-panel">
      <h2>${a.icono} ${a.label}</h2>
      <button class="btn-nuevo" onclick="abrirModalNuevo()">+ Nuevo</button>
    </div>
    <div id="listaItems"></div>
  `;
  document.getElementById('contentInner').innerHTML = html;
  renderLista();
}
function renderLista(){
  const a = AREAS[areaActiva];
  const cont = document.getElementById('listaItems');
  if(a.items.length === 0){
    cont.innerHTML = `<div class="empty-state">Sin registros todavía en ${a.label}.</div>`;
    return;
  }
  cont.innerHTML = a.items.map(it => {
    const tag = a.tag(it);
    const puedeAlternar = a.estados && a.estados.includes(tag);
    const descarga = it.archivo_url
      ? `<a class="item-descarga" href="${it.archivo_url}" target="_blank" rel="noopener" download onclick="event.stopPropagation()" title="Descargar ${it.archivo_nombre||'archivo'}">⬇</a>`
      : '';
    return `
    <div class="item-row" ${puedeAlternar ? `onclick="alternarEstado('${it.id}')" title="Tocar para cambiar el estado"` : ''}>
      <div class="item-icon">${a.icono}</div>
      <div class="item-info">
        <div class="item-titulo">${a.titulo(it)}</div>
        <div class="item-sub">${a.sub(it)}</div>
      </div>
      <span class="item-tag" style="background:${a.colorEstado[tag] || '#42555C'};">${tag}</span>
      <span class="item-fecha">${a.fecha(it)}</span>
      <span class="item-eliminar" onclick="event.stopPropagation(); eliminarItem('${it.id}')" title="Eliminar">✕</span>
      ${descarga}
    </div>
  `; }).join('');
}

async function alternarEstado(id){
  const a = AREAS[areaActiva];
  const it = a.items.find(x => x.id === id);
  if(!it) return;
  const siguiente = a.estados[0] === it.estado ? a.estados[1] : a.estados[0];
  const { error } = await sb.from(a.tabla).update({ estado: siguiente }).eq('id', id);
  if(error){ toast('No se pudo actualizar el estado — ' + error.message); return; }
  it.estado = siguiente;
  renderLista();
  toast(`Estado actualizado a "${siguiente}"`);
}

async function eliminarItem(id){
  const a = AREAS[areaActiva];
  const it = a.items.find(x => x.id === id);
  if(!it) return;
  if(!confirm(`¿Eliminar "${a.titulo(it)}"? Esta acción no se puede deshacer.`)) return;
  const tituloIt = a.titulo(it);
  const { error } = await sb.from(a.tabla).delete().eq('id', id);
  if(error){ toast('No se pudo eliminar — ' + error.message); return; }
  // Queda visible en el Registro de Auditoría del Superintendente (Cuerpo
  // General) o del Director (su Compañía), según corresponda.
  sb.rpc('registrar_auditoria', {
    p_tipo: 'critico',
    p_detalle: `Eliminado de Secretaría — ${a.label}: "${tituloIt}"`,
    p_compania_id: miCompaniaId,
  });
  a.items = a.items.filter(x => x.id !== id);
  renderLista();
  toast('Eliminado');
}

function abrirModalNuevo(){
  const a = AREAS[areaActiva];
  archivoAdjuntoFile = null;
  document.getElementById('modalTitulo').textContent = `Nuevo — ${a.label}`;
  document.getElementById('modalCampos').innerHTML = a.campos.map(c => {
    if(c.tipo === 'textarea') return `<div class="modal-field"><label>${c.label}</label><textarea id="campo_${c.id}" placeholder="${c.placeholder||''}"></textarea></div>`;
    if(c.tipo === 'select') return `<div class="modal-field"><label>${c.label}</label><select id="campo_${c.id}">${c.opciones.map(o=>`<option>${o}</option>`).join('')}</select></div>`;
    if(c.tipo === 'file') return `<div class="modal-field"><label>${c.label}</label><input type="file" id="campo_${c.id}" accept="${ACCEPT_DOCUMENTOS}" onchange="archivoAdjuntoFile = this.files[0] || null"></div>`;
    return `<div class="modal-field"><label>${c.label}</label><input type="${c.tipo}" id="campo_${c.id}" placeholder="${c.placeholder||''}"></div>`;
  }).join('');
  document.getElementById('modalNuevo').classList.add('show');
}
function cerrarModal(){ document.getElementById('modalNuevo').classList.remove('show'); }
async function confirmarNuevo(){
  const a = AREAS[areaActiva];
  const tituloEl = document.getElementById(`campo_${a.campos[0].id}`);
  const titulo = tituloEl.value.trim();
  if(!titulo){ toast('Completá al menos el primer campo antes de guardar'); return; }

  const registro = { cuerpo_id: miCuerpoId, compania_id: miCompaniaId };
  const campoArchivo = a.campos.find(c => c.tipo === 'file');
  a.campos.forEach(c => {
    if(c.tipo === 'file') return;
    const val = document.getElementById(`campo_${c.id}`).value.trim();
    registro[c.col] = val || null;
  });
  if(a.extraInsert) Object.assign(registro, a.extraInsert());

  if(campoArchivo && archivoAdjuntoFile){
    const ext = (archivoAdjuntoFile.name.split('.').pop() || 'pdf').toLowerCase();
    const path = `${miCuerpoId}/secretaria/${areaActiva}/${crypto.randomUUID()}.${ext}`;
    const { error: upErr } = await sb.storage.from('vigor-fotos').upload(path, archivoAdjuntoFile);
    if(upErr){ toast('No se pudo subir el archivo — ' + upErr.message); return; }
    registro[campoArchivo.col] = sb.storage.from('vigor-fotos').getPublicUrl(path).data.publicUrl;
    registro.archivo_nombre = archivoAdjuntoFile.name;
  }

  const { error } = await sb.from(a.tabla).insert(registro);
  if(error){ toast('No se pudo guardar — ' + error.message); return; }
  cerrarModal();
  await cargarArea();
  renderLista();
  toast(`"${titulo}" agregado a ${a.label}`);
}

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2600);
}

cargarSesion();
</script>
