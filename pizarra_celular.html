<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Vigor — Pizarra (Celular)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet"></noscript>
<style>
  @view-transition { navigation: auto; }
  :root{
    --bg:#060A0F; --panel:#0A131C; --panel-alt:#0E1D28; --line:#132734; --line-strong:#1C3B49;
    --text:#E7F5FA; --text-muted:#7B99A3; --text-dim:#516E78;
    --brass:#C97A2E; --brass-bright:#FF9A44; --brass-dim:#8A4E1E;
    --cyan:#49E9FF; --cyan-dim:#1E6E7D; --cyan-glow:rgba(73,233,255,0.35); --amber-glow:rgba(255,154,68,0.32);
    --burdeo:#7A1620; --burdeo-bright:#D8394E;
    --servicio:#3CF29A; --emergencia:#FF4B5C; --alerta:#FFC94D; --fuera:#C9A63B; --nodisp:#42555C;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;}
  body{
    background: radial-gradient(900px 500px at 50% -10%, rgba(73,233,255,0.08), transparent 60%), #060A0F;
    font-family:'Inter',sans-serif; color:var(--text);
  }
  .mono{font-family:'JetBrains Mono',monospace;}
  h1,h2,h3{font-family:'Rajdhani',sans-serif; text-transform:uppercase; letter-spacing:.04em; font-weight:700; margin:0;}

  #phoneWrap{ height:100%; flex-direction:column; position:relative;}

  .app-head{ padding:10px 18px 8px; flex-shrink:0;}
  .app-head .eyebrow{ font-size:10px; color:var(--text-dim); letter-spacing:.1em; text-transform:uppercase;}
  .app-head h1{ font-size:19px; margin-top:2px;}
  .role-strip{ display:flex; align-items:center; gap:7px; padding:5px 0 0;}
  .role-strip .dot{ width:6px;height:6px;border-radius:50%; background:var(--cyan);}
  .role-strip span{ font-size:10.5px; color:var(--text-muted);}
  .role-strip b{ font-size:10.5px; color:var(--cyan); font-weight:700;}

  .tabs2{ display:flex; gap:6px; padding:0 18px 10px; flex-shrink:0;}
  .tab2-btn{ flex:1; background:var(--panel); border:1.5px solid var(--line-strong); color:var(--text-muted); font-family:'Rajdhani'; font-weight:700; font-size:11px; letter-spacing:.03em; text-transform:uppercase; padding:8px; border-radius:7px; cursor:pointer;}
  .tab2-btn.on{ background:var(--cyan-dim); border-color:var(--cyan); color:#fff;}

  .content{ flex:1; overflow-y:auto; padding:6px 18px 18px;}
  .content::-webkit-scrollbar{ display:none;}

  .compose{ padding:0 18px 10px; flex-shrink:0;}
  .compose-select{ width:100%; background:var(--panel-alt); border:1.5px solid var(--line-strong); border-radius:7px; padding:8px 10px; font-size:12px; color:var(--text); margin-bottom:6px; font-family:'Inter';}
  .compose-select:focus{ outline:none; border-color:var(--cyan);}
  .compose-row{ display:flex; gap:8px; align-items:flex-end;}
  .compose-row textarea{ flex:1; background:var(--panel-alt); border:1.5px solid var(--line-strong); border-radius:7px; padding:9px 11px; font-size:12.5px; color:var(--text); font-family:'Inter'; resize:none; min-height:38px; max-height:90px;}
  .compose-row textarea:focus{ outline:none; border-color:var(--cyan);}
  .compose-row button{ flex-shrink:0; background:var(--cyan-dim); border:1.5px solid var(--cyan); color:#fff; font-family:'Rajdhani'; font-weight:700; letter-spacing:.03em; text-transform:uppercase; font-size:11.5px; padding:10px 14px; border-radius:7px; cursor:pointer;}

  .obs-item{ background:var(--panel); border:1px solid var(--line-strong); border-left:3px solid var(--brass-bright); border-radius:8px; padding:12px 14px; margin-bottom:9px;}
  .obs-item.general{ border-left-color:var(--cyan);}
  .obs-item .obs-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
  .obs-item .obs-tag{ font-size:9px; font-weight:700; color:var(--cyan); text-transform:uppercase; letter-spacing:.04em; display:block; margin-bottom:3px;}
  .obs-item .obs-del{ background:none; border:none; color:var(--text-dim); font-size:14px; cursor:pointer; flex-shrink:0; padding:2px 4px; margin-top:-2px;}
  .obs-item .obs-del:hover{ color:var(--burdeo-bright);}
  .obs-item time{ font-family:'JetBrains Mono',monospace; font-size:10px; color:var(--text-dim); display:block; margin-bottom:4px;}
  .obs-item p{ margin:0; font-size:13px; line-height:1.4;}
  .obs-item .autor{ font-size:10.5px; color:var(--text-muted); margin-top:6px;}
  .obs-item .autor b{ color:var(--brass-bright);}

  .citacion-item{ background:var(--panel); border:1.5px solid var(--alerta); border-radius:8px; padding:12px 14px; margin-bottom:9px; position:relative; overflow:hidden;}
  .citacion-item::before{ content:""; position:absolute; inset:4px; border:1px solid var(--brass-dim); border-radius:5px; pointer-events:none; opacity:.3;}
  .citacion-tag{ font-size:9px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--alerta); position:relative; z-index:1;}
  .citacion-item h3{ font-size:14px; margin:4px 0 3px; position:relative; z-index:1;}
  .citacion-item p{ margin:0; font-size:12px; color:var(--text-muted); position:relative; z-index:1;}
  .citacion-item .fecha{ font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--text); margin-top:6px; position:relative; z-index:1;}

  .emerg-item{ background:var(--panel); border:2px solid var(--emergencia); border-radius:8px; padding:12px 14px; margin-bottom:9px;}
  .emerg-item .tag{ font-family:'JetBrains Mono',monospace; font-size:10px; color:var(--emergencia); font-weight:700; letter-spacing:.04em; display:block; margin-bottom:4px;}
  .emerg-item p{ margin:0; font-size:12.5px;}
  .emerg-item .meta{ font-size:10.5px; color:var(--text-muted); margin-top:4px;}

  .empty{ text-align:center; padding:40px 20px; color:var(--text-dim); font-size:12.5px;}

  .tabbar-real{ display:flex; border-top:1px solid var(--line-strong); background:#0C1116; flex-shrink:0; padding-bottom:6px;}
  .tabbar-real a{ flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; padding:9px 0 5px; color:var(--text-dim); text-decoration:none; font-size:9.5px; font-weight:600; letter-spacing:.01em;}
  .tabbar-real a .ic{ line-height:1; display:flex;}
  .tabbar-real a .ic svg{ width:22px; height:22px;}
  .tabbar-real a.active{ color:var(--cyan);}
</style>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="icons/favicon-16.png" sizes="16x16" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#060A0F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Vigor">
<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}</script>
</head>
<body>

  <div id="sinSesion" style="display:none; padding:40vh 16px 40px; color:var(--text-muted); text-align:center;">
    Necesitás loguearte primero. <a href="login_registro.html" style="color:var(--cyan);">Ir al login</a>
  </div>

  <div id="phoneWrap" style="display:none;">
    <div class="app-head">
      <div class="eyebrow" id="nombreCompaniaCel">—</div>
      <h1>Pizarra</h1>
      <div class="role-strip"><span class="dot"></span><span>Sesión:</span> <b id="roleLabel">—</b></div>
    </div>

    <div class="tabs2">
      <button class="tab2-btn on" id="btnAvisos" onclick="setTab('avisos')">Avisos</button>
      <button class="tab2-btn" id="btnEmerg" onclick="setTab('emergencias')">Emergencias</button>
    </div>

    <div class="compose" id="composeWrap" style="display:none;">
      <select class="compose-select" id="composeDestino" style="display:none;"></select>
      <div class="compose-row">
        <textarea id="composeTexto" placeholder="Escribir un aviso…" rows="1"></textarea>
        <button id="composeBtn" onclick="publicarAviso()">Publicar</button>
      </div>
    </div>

    <div class="content" id="content"></div>

    <div class="tabbar-real" id="tabbarReal"></div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// --- Conexión real a Supabase ---
const SUPABASE_URL = 'https://mcfcfbtiruewlcejionr.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1jZmNmYnRpcnVld2xjZWppb25yIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzODExNzgsImV4cCI6MjEwMzk1NzE3OH0.9b_t63ah25RIGNn3pzZU3L553YUrrn7IXWW3MEjXuXU';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { persistSession: true, autoRefreshToken: true } });

const PRIORIDAD_CARGO_MANDO = ['Director','Capitán','Teniente 1°','Teniente 2°','Teniente 3°','Teniente 4°','Ayudante Cía.'];
const ROLES_CUERPO_GENERAL = ['Comandante','Segundo Comandante','Tercer Comandante','Cuarto Comandante'];

let tabActiva = 'avisos';
let OBS = [], EMERG = [];
let PERFIL = null;
let esOficialCia = false, esGeneral = false;
let companiasCuerpo = [];

let ultimaAccionLocalMs = 0;
function marcarAccionLocal(){ ultimaAccionLocalMs = Date.now(); }
function esEcoPropio(){ return Date.now() - ultimaAccionLocalMs < 2500; }

function fmtHora(iso){
  return new Date(iso).toLocaleString('es-CL', { day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' });
}

function diasRestantes(expiraIso){
  const ms = new Date(expiraIso).getTime() - Date.now();
  const d = Math.ceil(ms / 86400000);
  return d <= 0 ? 'vence hoy' : `vence en ${d} día${d===1?'':'s'}`;
}

function render(){
  const el = document.getElementById('content');
  if(tabActiva === 'avisos'){
    if(!OBS.length){ el.innerHTML = `<div class="empty">Sin avisos todavía.</div>`; return; }
    el.innerHTML = OBS.map(o => {
      if(o.tipo === 'citacion'){
        return `
          <div class="citacion-item">
            <span class="citacion-tag">📌 Citación</span>
            <h3>${o.titulo || 'Citación'}</h3>
            <p>${o.contenido}</p>
            ${o.fecha_evento ? `<div class="fecha">${fmtHora(o.fecha_evento)}</div>` : ''}
          </div>`;
      }
      const puedeBorrar = !o.es_general && esOficialCia && PERFIL && o.compania_id === PERFIL.compania_id;
      return `
        <div class="obs-item ${o.es_general ? 'general' : ''}">
          <div class="obs-top">
            <div>
              ${o.es_general ? `<span class="obs-tag">📢 Comandancia${o.compania_id ? '' : ' — Todas las Compañías'} · ${diasRestantes(o.expira_en)}</span>` : ''}
              <time>${fmtHora(o.creado_en)}</time>
            </div>
            ${puedeBorrar ? `<button class="obs-del" onclick="borrarAviso('${o.id}')" title="Borrar">🗑</button>` : ''}
          </div>
          <p>${o.contenido}</p>
          ${o.autor_nombre ? `<div class="autor">Publicado por <b>${o.autor_nombre}</b></div>` : ''}
        </div>`;
    }).join('');
  } else {
    if(!EMERG.length){ el.innerHTML = `<div class="empty">No hay emergencias en curso en este momento.</div>`; return; }
    el.innerHTML = EMERG.map(e => `
      <div class="emerg-item">
        <span class="tag">${e.tipo_emergencia_texto || 'Emergencia'}</span>
        <p>${e.compania_texto || ''} ${e.direccion_referencia ? '— ' + e.direccion_referencia : ''}</p>
        <div class="meta">${e.estado} · ${fmtHora(e.actualizado_en)}</div>
      </div>
    `).join('');
  }
}

function setTab(t){
  tabActiva = t;
  document.getElementById('btnAvisos').classList.toggle('on', t==='avisos');
  document.getElementById('btnEmerg').classList.toggle('on', t==='emergencias');
  document.getElementById('composeWrap').style.display = (t==='avisos' && (esOficialCia || esGeneral)) ? 'block' : 'none';
  render();
}

async function publicarAviso(){
  const textoEl = document.getElementById('composeTexto');
  const contenido = textoEl.value.trim();
  if(!contenido) return;
  const destino = esGeneral ? (document.getElementById('composeDestino').value || null) : null;
  marcarAccionLocal();
  const { error } = await sb.rpc('crear_aviso_pizarra', { p_contenido: contenido, p_compania_id: destino });
  if(error){ alert('No se pudo publicar el aviso: ' + error.message); return; }
  textoEl.value = '';
  await cargarDatos();
}
window.publicarAviso = publicarAviso;

async function borrarAviso(id){
  if(!confirm('¿Borrar este aviso de la Pizarra?')) return;
  marcarAccionLocal();
  const { error } = await sb.rpc('borrar_aviso_pizarra', { p_id: id });
  if(error){ alert('No se pudo borrar: ' + error.message); return; }
  await cargarDatos();
}
window.borrarAviso = borrarAviso;

function renderCompose(){
  const destinoSel = document.getElementById('composeDestino');
  if(esGeneral){
    destinoSel.style.display = 'block';
    destinoSel.innerHTML = `<option value="">📢 Todas las Compañías</option>` +
      companiasCuerpo.map(c => `<option value="${c.id}">${c.nombre}</option>`).join('');
  } else {
    destinoSel.style.display = 'none';
  }
  document.getElementById('composeWrap').style.display = (tabActiva==='avisos' && (esOficialCia || esGeneral)) ? 'block' : 'none';
}

async function cargarDatos(){
  const { data: { session } } = await sb.auth.getSession();
  if(!session){
    document.getElementById('sinSesion').style.display = 'block';
    return;
  }
  const { data: perfil } = await sb.from('personal')
    .select('id, nombre_completo, cargo, compania_id, cuerpo_id, companias(nombre)')
    .eq('auth_user_id', session.user.id).single();
  if(!perfil || !perfil.cuerpo_id){
    document.getElementById('sinSesion').style.display = 'block';
    document.getElementById('sinSesion').textContent = 'Esta sesión no pertenece a ningún Cuerpo.';
    return;
  }
  PERFIL = perfil;
  esOficialCia = PRIORIDAD_CARGO_MANDO.includes(perfil.cargo);
  esGeneral = ROLES_CUERPO_GENERAL.includes(perfil.cargo);

  document.getElementById('nombreCompaniaCel').textContent = perfil.companias ? perfil.companias.nombre : 'Comandancia';
  document.getElementById('roleLabel').textContent = `${perfil.nombre_completo} — ${perfil.cargo}`;

  let obsQuery = sb.from('pizarra_observaciones').select('*, personal(nombre_completo)').order('creado_en', { ascending:false }).limit(20);
  if(perfil.compania_id) obsQuery = obsQuery.or(`compania_id.eq.${perfil.compania_id},compania_id.is.null`);

  const tareas = [
    obsQuery,
    sb.from('pizarra_emergencias').select('*').eq('cuerpo_id', perfil.cuerpo_id).order('actualizado_en', { ascending:false }).limit(10)
  ];
  if(esGeneral) tareas.push(sb.from('companias').select('id, nombre').eq('cuerpo_id', perfil.cuerpo_id).order('nombre'));

  const [{ data: obs }, { data: em }, companiasRes] = await Promise.all(tareas);
  OBS = (obs || []).map(o => ({ ...o, autor_nombre: o.personal ? o.personal.nombre_completo : null }));
  EMERG = em || [];
  if(esGeneral) companiasCuerpo = (companiasRes && companiasRes.data) || [];

  document.getElementById('phoneWrap').style.display = 'flex';
  renderCompose();
  render();

  if(!suscritoPizarraCelular){
    suscritoPizarraCelular = true;
    sb.channel('pizarra-celular-' + perfil.cuerpo_id)
      .on('postgres_changes', { event: '*', schema: 'public', table: 'pizarra_observaciones', filter: `cuerpo_id=eq.${perfil.cuerpo_id}` }, () => { if(esEcoPropio()) return; cargarDatos(); })
      .on('postgres_changes', { event: '*', schema: 'public', table: 'pizarra_emergencias', filter: `cuerpo_id=eq.${perfil.cuerpo_id}` }, () => { if(esEcoPropio()) return; cargarDatos(); })
      .subscribe();
  }
}
let suscritoPizarraCelular = false;

cargarDatos();

const ICONOS_TAB = {
  inicio: '<path d="M4 12 12 5l8 7"/><path d="M6.5 10.5V19a1 1 0 0 0 1 1h9a1 1 0 0 0 1-1v-8.5"/><path d="M10 20v-5h4v5"/>',
  compania: '<path d="M12 2.2v1.5"/><path d="M7.5 8.6C7.5 5.4 9.5 3.6 12 3.6s4.5 1.8 4.5 5"/><path d="M5.8 8.6C5.8 10.4 8.5 11.4 12 11.4s6.2-1 6.2-2.8"/><path d="M5 21c0-4.5 3-7 7-7s7 2.5 7 7"/>',
  pizarra: '<rect x="4" y="5" width="16" height="14" rx="1.6"/><path d="M7.7 10h7M7.7 13.6h4.6"/><circle cx="16.3" cy="8.3" r="1.3"/>',
  actividades: '<rect x="4" y="5.5" width="16" height="14" rx="1.6"/><path d="M4 9.5h16"/><path d="M8 3.5v3M16 3.5v3"/><path d="M8.5 13.5l2 2 4-4.2"/>',
  gps: '<path d="M12 21s7-7.2 7-12a7 7 0 1 0-14 0c0 4.8 7 12 7 12z"/><circle cx="12" cy="9" r="2.4"/>',
  opciones: '<circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2.8"/><g stroke-width="2.3"><path d="M19 12h2.3M16.95 16.95l1.63 1.63M12 19v2.3M7.05 16.95l-1.63 1.63M5 12H2.7M7.05 7.05 5.42 5.42M12 5V2.7M16.95 7.05l1.63-1.63"/></g>',
};
const TABS_NAV = [
  {href:'inicio_celular.html', ic:'inicio', label:'Inicio'},
  {href:'compania_celular.html', ic:'compania', label:'Compañía'},
  {href:'pizarra_celular.html', ic:'pizarra', label:'Pizarra'},
  {href:'actividades_celular.html', ic:'actividades', label:'Activid.'},
  {href:'coordenadas_celular.html', ic:'gps', label:'GPS'},
  {href:'opciones_celular.html', ic:'opciones', label:'Opciones'},
];
(function renderTabbarReal(){
  const cont = document.getElementById('tabbarReal');
  if(!cont) return;
  const actual = location.pathname.split('/').pop();
  cont.innerHTML = TABS_NAV.map(t => `<a href="${t.href}" class="${t.href===actual?'active':''}"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">${ICONOS_TAB[t.ic]}</svg></span><span>${t.label}</span></a>`).join('');
})();
</script>
</body>
</html>
