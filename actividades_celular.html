<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>VIGOR — Actividades (Celular)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet"></noscript>
<style>
  :root{
    --bg:#060A0F; --panel:#0A131C; --panel-alt:#0E1D28; --line:#132734; --line-strong:#1C3B49;
    --text:#E7F5FA; --text-muted:#7B99A3; --text-dim:#516E78;
    --brass:#C97A2E; --brass-bright:#FF9A44; --brass-dim:#8A4E1E;
    --cyan:#49E9FF; --cyan-dim:#1E6E7D; --cyan-glow:rgba(73,233,255,0.35); --amber-glow:rgba(255,154,68,0.32);
    --burdeo:#7A1620; --burdeo-bright:#D8394E;
    --servicio:#3CF29A; --emergencia:#FF4B5C; --alerta:#FFC94D; --fuera:#C9A63B; --nodisp:#42555C;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;}
  body{
    background: radial-gradient(900px 500px at 50% -10%, rgba(73,233,255,0.08), transparent 60%), #060A0F;
    font-family:'Inter',sans-serif; color:var(--text);
  }
  .mono{font-family:'JetBrains Mono',monospace;}
  h1,h2,h3{font-family:'Rajdhani',sans-serif; text-transform:uppercase; letter-spacing:.04em; font-weight:700; margin:0;}

  .phone{ height:100%; display:flex; flex-direction:column; position:relative;}

  .app-head{ padding:10px 18px 8px; flex-shrink:0;}
  .app-head .eyebrow{ font-size:10px; color:var(--text-dim); letter-spacing:.1em; text-transform:uppercase;}
  .app-head h1{ font-size:19px; margin-top:2px;}
  .role-strip{ display:flex; align-items:center; gap:7px; padding:5px 0 0;}
  .role-strip .dot{ width:6px;height:6px;border-radius:50%; background:var(--cyan);}
  .role-strip span{ font-size:10.5px; color:var(--text-muted);}
  .role-strip b{ font-size:10.5px; color:var(--cyan); font-weight:700;}

  .tabs2{ display:flex; gap:6px; padding:0 18px 10px; flex-shrink:0;}
  .tab2-btn{ flex:1; background:var(--panel); border:1.5px solid var(--line-strong); color:var(--text-muted); font-family:'Rajdhani'; font-weight:700; font-size:11px; letter-spacing:.03em; text-transform:uppercase; padding:8px; border-radius:7px; cursor:pointer;}
  .tab2-btn.on{ background:var(--cyan-dim); border-color:var(--cyan); color:#fff;}

  .content{ flex:1; overflow-y:auto; padding:6px 18px 18px;}
  .content::-webkit-scrollbar{ display:none;}

  .act-card{ display:flex; align-items:center; gap:12px; background:var(--panel); border:1.5px solid var(--line-strong); border-radius:10px; padding:11px 13px; margin-bottom:8px;}
  .act-fecha{ width:44px; flex-shrink:0; text-align:center; background:var(--panel-alt); border-radius:6px; padding:6px 3px;}
  .act-fecha .dia{ font-family:'JetBrains Mono',monospace; font-size:16px; font-weight:700; color:var(--brass-bright); line-height:1;}
  .act-fecha .mes{ font-size:8px; color:var(--text-dim); text-transform:uppercase; margin-top:2px;}
  .act-info{ flex:1; min-width:0;}
  .act-tipo{ font-size:8.5px; color:var(--cyan); text-transform:uppercase; letter-spacing:.04em; font-weight:700;}
  .act-nombre{ font-size:12.5px; font-weight:700; margin-top:1px;}
  .act-meta{ font-size:10px; color:var(--text-muted); margin-top:2px;}
  .act-estado{ font-size:8.5px; font-weight:700; text-transform:uppercase; padding:3px 7px; border-radius:9px; flex-shrink:0;}
  .act-estado.proxima{ background:var(--fuera); color:#241505;}
  .act-estado.finalizada{ background:var(--servicio); color:#fff;}

  .empty{ text-align:center; padding:40px 20px; color:var(--text-dim); font-size:12.5px;}

  .toast{
    position:absolute; bottom:20px; left:16px; right:16px;
    background:var(--panel-alt); border:1px solid var(--cyan); color:#DFF7F9;
    padding:11px 16px; border-radius:8px; font-size:12.5px; opacity:0; transform:translateY(8px);
    transition:all .25s; pointer-events:none; text-align:center; z-index:30;
  }
  .toast.show{ opacity:1; transform:translateY(0);}

  .tabbar-real{ display:flex; border-top:1px solid var(--line-strong); background:#0C1116; flex-shrink:0; padding-bottom:6px;}
  .tabbar-real a{ flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; padding:9px 0 5px; color:var(--text-dim); text-decoration:none; font-size:9.5px; font-weight:600; letter-spacing:.01em;}
  .tabbar-real a .ic{ font-size:19px; line-height:1;}
  .tabbar-real a.active{ color:var(--cyan);}
</style>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="icons/favicon-16.png" sizes="16x16" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#060A0F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Vigor">
<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}</script>
</head>
<body>

  <div class="phone">
    <div class="app-head">
      <div class="eyebrow" id="eyebrowCia">Vigor</div>
      <h1>Actividades</h1>
      <div class="role-strip"><span class="dot"></span><span>Sesión:</span> <b id="roleStripTxt">Sin sesión</b></div>
    </div>

    <div class="tabs2">
      <button class="tab2-btn on" id="btnTodas" onclick="setTab('todas')">Todas</button>
      <button class="tab2-btn" id="btnProximas" onclick="setTab('proxima')">Próximas</button>
      <button class="tab2-btn" id="btnRealizadas" onclick="setTab('finalizada')">Realizadas</button>
    </div>

    <div style="padding:0 18px 8px; flex-shrink:0;" id="btnNuevaWrap"></div>

    <div class="empty" id="sinSesion" style="display:none;">Necesitás loguearte primero.</div>
    <div class="content" id="content"></div>
    <div class="tabbar-real" id="tabbarReal"></div>

    <div class="toast" id="toast"></div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://mcfcfbtiruewlcejionr.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1jZmNmYnRpcnVld2xjZWppb25yIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzODExNzgsImV4cCI6MjEwMzk1NzE3OH0.9b_t63ah25RIGNn3pzZU3L553YUrrn7IXWW3MEjXuXU';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { persistSession: true, autoRefreshToken: true, storageKey: 'vigor-auth-v1' } });
const PRIORIDAD_CARGO_MANDO = ['Director','Capitán','Teniente 1°','Teniente 2°','Teniente 3°','Teniente 4°','Ayudante Cía.'];
const MESES = ['ENE','FEB','MAR','ABR','MAY','JUN','JUL','AGO','SEP','OCT','NOV','DIC'];

let ACTIVIDADES = [];
let miCuerpoId = null, miCompaniaId = null, esOficial = false;
let tabActiva = 'todas';

async function cargarDatos(){
  const { data: { session } } = await sb.auth.getSession();
  if(!session){ document.getElementById('sinSesion').style.display = 'block'; return; }
  const { data: perfil } = await sb.from('personal')
    .select('id, nombre_completo, cargo, cuerpo_id, compania_id, companias(nombre)')
    .eq('auth_user_id', session.user.id).single();
  if(!perfil){ document.getElementById('sinSesion').style.display = 'block'; return; }
  miCuerpoId = perfil.cuerpo_id;
  miCompaniaId = perfil.compania_id;
  esOficial = PRIORIDAD_CARGO_MANDO.includes(perfil.cargo);
  document.getElementById('eyebrowCia').textContent = perfil.companias ? perfil.companias.nombre : 'Cuerpo General';
  document.getElementById('roleStripTxt').textContent = `${perfil.nombre_completo} — ${perfil.cargo}`;
  document.getElementById('btnNuevaWrap').innerHTML = esOficial
    ? `<button class="tab2-btn on" style="width:100%;" onclick="window.location.href='crear_actividad_celular.html'">+ Nueva Actividad</button>` : '';

  let q = sb.from('actividades').select('*').eq('cuerpo_id', miCuerpoId);
  if(miCompaniaId) q = q.or(`compania_id.eq.${miCompaniaId},compania_id.is.null`);
  else q = q.is('compania_id', null);
  const { data: actividades } = await q.order('fecha', { ascending:false });

  const { data: asistRows } = await sb.from('asistencia').select('actividad_id, estado');
  ACTIVIDADES = (actividades || []).map(a => {
    const asis = (asistRows || []).filter(r => r.actividad_id === a.id);
    return { ...a, asistencia: asis.length ? asis : null };
  });
  render();
}

function metaDeActividad(a){
  const horaLugar = [a.hora ? a.hora.slice(0,5) + ' hrs' : null, a.lugar].filter(Boolean).join(' · ') || 'Sin horario/lugar definido';
  if(!a.asistencia) return horaLugar;
  const presentes = a.asistencia.filter(x=>x.estado==='presente').length;
  const ausentes = a.asistencia.filter(x=>x.estado==='ausente').length;
  return ausentes > 0 ? `${presentes} presentes · ${ausentes} ausentes` : `${presentes} presentes`;
}

function render(){
  const filtradas = tabActiva === 'todas' ? ACTIVIDADES : ACTIVIDADES.filter(a => a.estado === tabActiva);
  const el = document.getElementById('content');
  if(filtradas.length === 0){
    el.innerHTML = `<div class="empty">Sin actividades que coincidan.</div>`;
    return;
  }
  el.innerHTML = filtradas.map(a => {
    const f = new Date(a.fecha + 'T00:00:00');
    const dia = String(f.getDate()).padStart(2,'0');
    const mes = MESES[f.getMonth()];
    return `
    <div class="act-card" onclick="${a.estado==='proxima' ? `window.location.href='pasar_asistencia.html?actividad=${a.id}'` : `toast('${a.nombre.replace(/'/g,"\\'")} — ${metaDeActividad(a).replace(/'/g,"\\'")}')`}">
      <div class="act-fecha"><div class="dia">${dia}</div><div class="mes">${mes}</div></div>
      <div class="act-info">
        <div class="act-tipo">${a.tipo}</div>
        <div class="act-nombre">${a.nombre}</div>
        <div class="act-meta">${metaDeActividad(a)}</div>
      </div>
      <span class="act-estado ${a.estado}">${a.estado==='proxima'?'Próxima':'Hecha'}</span>
    </div>
  `; }).join('');
}

function setTab(t){
  tabActiva = t;
  document.getElementById('btnTodas').classList.toggle('on', t==='todas');
  document.getElementById('btnProximas').classList.toggle('on', t==='proxima');
  document.getElementById('btnRealizadas').classList.toggle('on', t==='finalizada');
  render();
}

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2400);
}

cargarDatos();

const TABS_NAV = [
  {href:'inicio_celular.html', ic:'🏠', label:'Inicio'},
  {href:'compania_celular.html', ic:'🚒', label:'Compañía'},
  {href:'pizarra_celular.html', ic:'📌', label:'Pizarra'},
  {href:'actividades_celular.html', ic:'📋', label:'Activid.'},
  {href:'coordenadas_celular.html', ic:'📍', label:'GPS'},
  {href:'opciones_celular.html', ic:'⚙️', label:'Opciones'},
];
(function renderTabbarReal(){
  const cont = document.getElementById('tabbarReal');
  if(!cont) return;
  const actual = location.pathname.split('/').pop();
  cont.innerHTML = TABS_NAV.map(t => `<a href="${t.href}" class="${t.href===actual?'active':''}"><span class="ic">${t.ic}</span><span>${t.label}</span></a>`).join('');
})();
</script>
</body>
</html>
