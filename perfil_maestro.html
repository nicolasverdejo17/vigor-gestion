<!DOCTYPE html>
<html lang="es">
<head>
<meta name="robots" content="noindex, nofollow, noarchive">
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>VIGOR - Gestiona tu compañía de forma eficiente</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#030B13; --panel:#061520; --panel-alt:#091D2C; --line:#0F2A3B; --line-strong:#153A52;
    --text:#EAF6FB; --text-muted:#8FB0C2; --text-dim:#6C8FA3;
    --master:#39FF14; --master-dim:#1F9E0A; --master-soft:rgba(57,255,20,.10); --master-glow:rgba(57,255,20,.28);
    --cyan:#2DD3DB; --ok:#3CF29A; --warn:#FFC94D; --bad:#F13746; --info:#7FA3B8;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; }
  body{ background:var(--bg); color:var(--text); min-height:100vh; }
  .mono{ font-family:'JetBrains Mono',monospace !important; }
  .hidden{ display:none !important; }
  h1.sr{ position:absolute; left:-9999px; }

  /* ---------- acceso ---------- */
  .login-gate{ min-height:calc(100vh - 56px); display:flex; align-items:center; justify-content:center; padding:32px 16px; }
  .login-panel{ width:100%; max-width:380px; background:linear-gradient(180deg,var(--panel-alt),var(--panel)); border:1px solid var(--master-dim); border-radius:16px; padding:26px 24px; box-shadow:0 0 40px var(--master-soft), 0 20px 50px rgba(0,0,0,.4); }
  .login-panel h2{ font-size:15px; margin:0 0 18px; padding-bottom:12px; border-bottom:1px solid var(--line); text-align:center; color:var(--master); }
  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:11px; color:var(--text-dim); margin-bottom:6px; font-weight:600; }
  .field input, .field select{ width:100%; background:var(--panel-alt); border:1.5px solid var(--line-strong); border-radius:9px; padding:11px 13px; font-size:13.5px; color:var(--text); }
  .field input:focus, .field select:focus{ outline:none; border-color:var(--master); }
  .field label.chk{ display:flex; gap:9px; align-items:flex-start; font-size:12.5px; color:var(--text); font-weight:500; padding:6px 0; cursor:pointer; margin:0; }
  .field label.chk input{ width:auto; margin-top:2px; flex-shrink:0; }
  .field label.chk span{ color:var(--text-dim); }
  .login-msg{ font-size:12px; color:var(--bad); margin-top:12px; min-height:14px; text-align:center; }

  /* ---------- estructura ---------- */
  .shell{ display:grid; grid-template-columns:232px minmax(0,1fr); min-height:calc(100vh - 56px); }
  .side{ position:sticky; top:56px; align-self:start; height:calc(100vh - 56px); background:var(--panel); border-right:1px solid var(--line); display:flex; flex-direction:column; padding:16px 12px; gap:4px; }
  .side-tag{ font-size:10.5px; color:var(--master); font-weight:700; letter-spacing:.12em; text-transform:uppercase; padding:2px 10px 12px; }
  .nav{ display:flex; align-items:center; gap:11px; width:100%; background:transparent; border:1px solid transparent; color:var(--text-muted); font-size:13.5px; font-weight:600; padding:11px 12px; border-radius:10px; cursor:pointer; text-align:left; }
  .nav svg{ width:18px; height:18px; flex-shrink:0; stroke:currentColor; fill:none; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
  .nav:hover{ color:var(--text); background:var(--panel-alt); }
  .nav.on{ color:var(--master); background:var(--master-soft); border-color:rgba(57,255,20,.28); }
  .nav .cnt{ margin-left:auto; font-size:11px; background:var(--bad); color:#fff; border-radius:10px; padding:1px 7px; font-weight:700; }
  .side-foot{ margin-top:auto; border-top:1px solid var(--line); padding:14px 10px 4px; font-size:11.5px; color:var(--text-dim); display:flex; flex-direction:column; gap:10px; }
  .side-foot b{ color:var(--text); font-size:12.5px; display:block; }
  .side-foot span{ word-break:break-all; }
  .main{ padding:22px 28px 60px; min-width:0; max-width:1240px; width:100%; }
  .titulo{ display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:18px; }
  .titulo h2{ margin:0; font-size:21px; }
  .titulo .sub{ font-size:12.5px; color:var(--text-dim); margin-top:3px; }
  .sec{ font-size:11px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.09em; font-weight:700; margin:26px 0 11px; padding-bottom:8px; border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; gap:10px; }

  /* ---------- componentes ---------- */
  .kpis{ display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px; }
  .kpi{ background:var(--panel); border:1px solid var(--line-strong); border-radius:12px; padding:15px 17px; }
  .kpi .k{ font-size:11px; color:var(--text-dim); font-weight:600; }
  .kpi .v{ font-size:27px; font-weight:800; margin-top:6px; color:var(--text); font-variant-numeric:tabular-nums; }
  .kpi .v small{ font-size:13px; color:var(--text-dim); font-weight:600; }
  .kpi.alerta .v{ color:var(--warn); }
  .kpi.ok .v{ color:var(--master); }

  .pill{ display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:700; padding:3px 10px; border-radius:20px; white-space:nowrap; }
  .pill.ok{ background:rgba(60,242,154,.15); color:var(--ok); }
  .pill.warn{ background:rgba(255,201,77,.15); color:var(--warn); }
  .pill.bad{ background:rgba(241,55,70,.17); color:#FF7A85; }
  .pill.mute{ background:rgba(127,163,184,.14); color:var(--info); }

  .grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:12px; }
  .card{ background:var(--panel); border:1px solid var(--line-strong); border-radius:12px; padding:16px 18px; }
  .card.click{ cursor:pointer; transition:border-color .15s, transform .15s; }
  .card.click:hover{ border-color:var(--master-dim); transform:translateY(-1px); }
  .c-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
  .c-nom{ font-size:14.5px; font-weight:700; line-height:1.3; }
  .c-meta{ font-size:12px; color:var(--text-muted); margin:5px 0 13px; }
  .c-stats{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; border-top:1px solid var(--line); padding-top:12px; }
  .c-stats div{ font-size:11px; color:var(--text-dim); }
  .c-stats b{ display:block; font-size:16px; color:var(--text); font-variant-numeric:tabular-nums; }
  .c-foot{ margin-top:12px; display:flex; justify-content:space-between; gap:8px; font-size:11.5px; color:var(--text-dim); flex-wrap:wrap; }

  .atn{ display:flex; flex-direction:column; gap:8px; }
  .atn-row{ display:flex; align-items:center; gap:12px; background:var(--panel); border:1px solid var(--line-strong); border-left-width:3px; border-radius:10px; padding:11px 14px; cursor:pointer; }
  .atn-row.n3{ border-left-color:var(--bad); } .atn-row.n2{ border-left-color:var(--warn); } .atn-row.n1{ border-left-color:var(--info); }
  .atn-row:hover{ background:var(--panel-alt); }
  .atn-row .q{ font-size:13px; font-weight:600; } .atn-row .c{ font-size:11.5px; color:var(--text-dim); margin-left:auto; text-align:right; }
  .vacio{ color:var(--text-dim); font-size:13px; padding:22px; text-align:center; background:var(--panel); border:1px dashed var(--line-strong); border-radius:12px; }
  .vacio.ok{ color:var(--ok); border-color:rgba(60,242,154,.35); }

  .btn{ background:var(--panel-alt); border:1.5px solid var(--line-strong); color:var(--text); font-size:12.5px; font-weight:700; padding:9px 15px; border-radius:10px; cursor:pointer; white-space:nowrap; }
  .btn:hover{ border-color:var(--master); color:var(--master); }
  .btn:disabled{ opacity:.45; cursor:not-allowed; }
  .btn.pri{ background:var(--master); border-color:var(--master); color:#0D2206; }
  .btn.pri:hover{ filter:brightness(1.08); color:#0D2206; }
  .btn.bad{ border-color:rgba(241,55,70,.55); color:#FF7A85; }
  .btn.bad:hover{ background:rgba(241,55,70,.14); border-color:var(--bad); color:#FF7A85; }
  .btn.sm{ padding:6px 11px; font-size:11.5px; border-radius:8px; }
  .acciones{ display:flex; gap:8px; flex-wrap:wrap; }
  .back{ background:transparent; border:1.5px solid var(--line-strong); color:var(--text-muted); font-size:12px; font-weight:700; padding:8px 14px; border-radius:9px; cursor:pointer; margin-bottom:16px; }
  .back:hover{ color:var(--master); border-color:var(--master); }

  .tabla-wrap{ overflow-x:auto; border:1px solid var(--line-strong); border-radius:12px; background:var(--panel); }
  table{ width:100%; border-collapse:collapse; font-size:12.5px; }
  th{ text-align:left; font-size:10.5px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.07em; padding:11px 14px; border-bottom:1px solid var(--line-strong); white-space:nowrap; }
  td{ padding:11px 14px; border-bottom:1px solid var(--line); vertical-align:middle; }
  tr:last-child td{ border-bottom:none; }
  tr.fila-click{ cursor:pointer; } tr.fila-click:hover td{ background:var(--panel-alt); }
  td .sub{ display:block; font-size:11px; color:var(--text-dim); margin-top:2px; }
  td.num{ font-variant-numeric:tabular-nums; }

  .ficha-head{ background:linear-gradient(135deg,var(--panel-alt),var(--panel)); border:1px solid var(--master-dim); border-radius:14px; padding:20px 22px; }
  .ficha-head h2{ margin:0 0 6px; font-size:22px; }
  .ficha-meta{ display:flex; flex-wrap:wrap; gap:8px 20px; font-size:12.5px; color:var(--text-muted); margin-bottom:16px; }
  .codigo{ display:inline-flex; align-items:center; gap:8px; background:var(--bg); border:1px solid var(--line-strong); border-radius:8px; padding:5px 10px; font-size:12px; }
  .codigo b{ color:var(--master); letter-spacing:.05em; }
  .lic-box{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; }
  .lic-box div{ background:var(--panel); border:1px solid var(--line-strong); border-radius:10px; padding:11px 14px; font-size:11px; color:var(--text-dim); }
  .lic-box b{ display:block; font-size:14px; color:var(--text); margin-top:4px; }
  .tools{ display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:10px; }
  .tool{ display:flex; align-items:center; gap:12px; background:var(--panel); border:1px solid var(--line-strong); border-radius:10px; padding:12px 14px; cursor:pointer; }
  .tool:hover{ border-color:var(--master-dim); }
  .tool .ic{ width:32px; height:32px; border-radius:9px; background:var(--panel-alt); display:flex; align-items:center; justify-content:center; font-size:15px; flex-shrink:0; }
  .tool b{ font-size:12.5px; display:block; } .tool span{ font-size:11px; color:var(--text-dim); }

  .filtros{ display:flex; gap:10px; flex-wrap:wrap; margin-bottom:14px; }
  .filtros input, .filtros select{ background:var(--panel-alt); border:1.5px solid var(--line-strong); border-radius:10px; padding:10px 13px; font-size:13px; color:var(--text); min-width:0; }
  .filtros input{ flex:1 1 260px; } .filtros input:focus, .filtros select:focus{ outline:none; border-color:var(--master); }
  .subtabs{ display:flex; gap:6px; margin-bottom:14px; }
  .subtab{ background:transparent; border:1.5px solid var(--line-strong); color:var(--text-muted); font-size:12.5px; font-weight:700; padding:8px 15px; border-radius:20px; cursor:pointer; }
  .subtab.on{ background:var(--master-soft); border-color:var(--master); color:var(--master); }

  /* ---------- ventana ---------- */
  .velo{ position:fixed; inset:0; background:rgba(2,8,13,.78); z-index:100; display:flex; align-items:center; justify-content:center; padding:16px; overflow-y:auto; }
  .modal{ width:100%; max-width:520px; background:var(--panel); border:1px solid var(--line-strong); border-radius:16px; padding:22px; box-shadow:0 24px 70px rgba(0,0,0,.55); max-height:calc(100vh - 32px); overflow-y:auto; }
  .modal h3{ margin:0 0 14px; font-size:17px; }
  .modal p{ margin:0 0 14px; font-size:13px; color:var(--text-muted); line-height:1.55; }
  .modal .pie{ display:flex; gap:8px; justify-content:flex-end; flex-wrap:wrap; margin-top:18px; }
  .kv{ display:grid; grid-template-columns:130px 1fr; gap:8px 12px; font-size:12.5px; margin-bottom:14px; }
  .kv dt{ color:var(--text-dim); } .kv dd{ margin:0; word-break:break-word; }
  .clave{ background:var(--bg); border:1.5px solid var(--master-dim); border-radius:12px; padding:16px; text-align:center; margin:4px 0 14px; }
  .clave .v{ font-size:28px; font-weight:600; letter-spacing:.1em; color:var(--master); }
  .clave .l{ font-size:11px; color:var(--text-dim); margin-bottom:6px; }
  .toast{ position:fixed; bottom:26px; left:50%; transform:translateX(-50%) translateY(12px); background:var(--panel-alt); border:1px solid var(--master); color:#E9FFDE; padding:12px 22px; border-radius:10px; font-size:13px; opacity:0; pointer-events:none; transition:all .25s; z-index:200; text-align:center; max-width:calc(100vw - 32px); }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
  .toast.err{ border-color:var(--bad); }

  @media (max-width:980px){
    .kpis{ grid-template-columns:repeat(2,minmax(0,1fr)); }
    .shell{ grid-template-columns:1fr; }
    .side{ position:sticky; top:56px; height:auto; flex-direction:row; align-items:center; overflow-x:auto; padding:8px 12px; border-right:none; border-bottom:1px solid var(--line); z-index:20; gap:6px; }
    .side-tag, .side-foot{ display:none; }
    .nav{ width:auto; white-space:nowrap; padding:9px 13px; }
    .main{ padding:18px 16px 60px; }
  }
  @media (max-width:560px){ .grid{ grid-template-columns:1fr; } .kv{ grid-template-columns:1fr; gap:2px; } .kv dd{ margin-bottom:8px; } }
</style>

<body>
  <h1 class="sr">Soporte técnico</h1>

  <div class="login-gate" id="loginGate">
    <div class="login-panel">
      <h2>Acceso Super Admin</h2>
      <div class="field"><label>Email</label><input type="email" id="loginEmail" placeholder="tu@vigor.cl" autocomplete="username"></div>
      <div class="field"><label>Contraseña</label><input type="password" id="loginPassword" placeholder="••••••••" autocomplete="current-password" onkeydown="if(event.key==='Enter') iniciarSesion();"></div>
      <button class="btn pri" style="width:100%; padding:13px;" id="btnLogin" onclick="iniciarSesion()">Iniciar sesión</button>
      <div class="login-msg" id="loginMsg"></div>

  <div class="shell hidden" id="shell">
    <aside class="side">
      <div class="side-tag">Soporte técnico</div>
      <button class="nav on" data-nav="resumen"><svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="8" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="5" rx="1.5"/><rect x="13.5" y="11.5" width="7" height="9" rx="1.5"/><rect x="3.5" y="14.5" width="7" height="6" rx="1.5"/></svg>Resumen<span class="cnt hidden" id="cntAtencion">0</span></button>

      <button class="nav" data-nav="usuarios"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3 19.5c0-3.2 2.7-5.5 6-5.5s6 2.3 6 5.5"/><circle cx="17.5" cy="9" r="2.4"/><path d="M16 14.3c2.8 0 5 1.8 5 4.7"/></svg>Usuarios</button>
      <button class="nav" data-nav="dispositivos"><svg viewBox="0 0 24 24"><rect x="4" y="3.5" width="11" height="16" rx="2"/><path d="M9.5 16.5h.01"/><rect x="15.5" y="9" width="5" height="10.5" rx="1.5"/></svg>Dispositivos</button>
      <button class="nav" data-nav="auditoria"><svg viewBox="0 0 24 24"><path d="M12 3.5 5 6v5.5c0 4.5 3 7.5 7 9 4-1.5 7-4.5 7-9V6l-7-2.5z"/><path d="M9.3 12l1.9 1.9 3.5-3.8"/></svg>Auditoría</button>

      <div class="side-foot">
        <div><b id="adminNombre">—</b><span id="adminEmail"></span></div>
        <button class="btn sm" onclick="cerrarSesion()">Cerrar sesión</button>
      </div>
    </aside>
    <main class="main" id="main"></main>
  </div>

  <div class="toast" id="toast"></div>

<script>
const SUPABASE_URL = 'https://mcfcfbtiruewlcejionr.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1jZmNmYnRpcnVld2xjZWppb25yIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzODExNzgsImV4cCI6MjEwMzk1NzE3OH0.9b_t63ah25RIGNn3pzZU3L553YUrrn7IXWW3MEjXuXU';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { persistSession: true, autoRefreshToken: true } });

/* ===================== utilidades ===================== */
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
function rel(d){
  if(!d) return 'nunca';
  const s = (Date.now() - new Date(d).getTime()) / 1000;
  if(s < 90) return 'hace un momento';
  const m = s / 60; if(m < 60) return 'hace ' + Math.round(m) + ' min';
  const h = m / 60; if(h < 24) return 'hace ' + Math.round(h) + ' h';
  const dd = h / 24; if(dd < 60) return 'hace ' + Math.round(dd) + ' d';
  return 'hace ' + Math.round(dd / 30) + ' meses';
}
const fecha = d => d ? new Date(d).toLocaleDateString('es-CL', { day:'numeric', month:'short', year:'numeric' }) : '—';
const fechaHora = d => d ? new Date(d).toLocaleString('es-CL', { day:'numeric', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit', hour12:false }) : '—';
const dias = d => Math.ceil((new Date(d).getTime() - Date.now()) / 864e5);
function toast(msg, esError){
  const t = $('toast'); t.textContent = msg; t.classList.toggle('err', !!esError); t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), esError ? 4200 : 2800);
}
function pill(tipo, txt){ return `<span class="pill ${tipo}">${esc(txt)}</span>`; }
const MENSAJES = {
  SESION_CAMBIADA:'La sesión cambió a otra cuenta', SIN_PERMISO:'Tu cuenta no tiene permiso para esto', USUARIO_NO_ENCONTRADO:'No se encontró a la persona', USUARIO_SIN_CUENTA:'Esta persona todavía no tiene cuenta de acceso',
  USUARIO_DADO_DE_BAJA:'La persona está dada de baja', MOTIVO_REQUERIDO:'Escribe el motivo', CUERPO_NO_SUSPENDIDO:'Primero hay que suspender el Cuerpo',
  CUENTA_NO_ENCONTRADA:'Esa cuenta no existe todavía', CUERPO_NO_ENCONTRADO:'No se encontró el Cuerpo', CLIENTE_REQUERIDO:'Escribe el nombre del cliente', PLAN_INVALIDO:'Elige un plan', SIN_VENCIMIENTO:'Esta licencia no tiene vencimiento', MESES_INVALIDOS:'Meses no válidos', NO_ESTA_REVOCADA:'La licencia no está revocada'
};
const msgErr = e => MENSAJES[e && e.message] || ('No se pudo completar — ' + ((e && e.message) || 'error desconocido'));
/* El navegador guarda UNA sola sesión para todas las pestañas: si en otra pestaña se inicia sesión con otra cuenta
   (por ejemplo la de un Director para probar la app), esta pestaña pasa a ser esa cuenta y Soporte deja de funcionar.
   En ese caso se avisa claramente en vez de mostrar «no tienes permiso». No se cierra la sesión de la otra pestaña. */
let _vigilando = false;
function sesionCambiada(){
  S.admin = null; S.adminId = null;
  $('shell').classList.add('hidden'); $('loginGate').classList.remove('hidden');

}
function vigilarCuenta(){
  if(_vigilando) return; _vigilando = true;
  sb.auth.onAuthStateChange((ev, ses) => {
    if(!S.adminId) return;
    if(ev === 'SIGNED_OUT' || (ses && ses.user && ses.user.id !== S.adminId)) sesionCambiada();
  });
}
async function rpc(nombre, args){
  const { data, error } = await sb.rpc(nombre, args || {});
  if(error){
    if(/SIN_PERMISO/.test(error.message || '') && S.adminId){
      const { data: u } = await sb.auth.getUser();
      if(!u || !u.user || u.user.id !== S.adminId){ sesionCambiada(); const e = new Error('SESION_CAMBIADA'); e.silencioso = true; throw e; }
    }
    throw error;
  }
  return data;
}

function copiar(texto){
  const ok = () => toast('Copiado');
  if(navigator.clipboard) navigator.clipboard.writeText(texto).then(ok, () => toast(texto)); else toast(texto);
}

let modalAbierto = null;
function abrirModal({ titulo, html, botones, ancho }){
  cerrarModal();
  const velo = document.createElement('div'); velo.className = 'velo';
  velo.innerHTML = `<div class="modal" role="dialog" aria-modal="true" ${ancho ? `style="max-width:${ancho}px"` : ''}><h3>${esc(titulo)}</h3><div id="modalCuerpo">${html || ''}</div><div class="pie" id="modalPie"></div></div>`;
  document.body.appendChild(velo);
  velo.addEventListener('mousedown', e => { if(e.target === velo) cerrarModal(); });
  const pie = velo.querySelector('#modalPie');
  (botones || [{ txt:'Cerrar' }]).forEach(b => {
    const el = document.createElement('button'); el.className = 'btn ' + (b.cls || ''); el.textContent = b.txt; if(b.id) el.id = b.id; if(b.deshabilitado) el.disabled = true;
    el.onclick = async () => {
      if(!b.fn){ cerrarModal(); return; }
      const antes = el.textContent; el.disabled = true; el.textContent = 'Un momento…';
      let r; try { r = await b.fn(); } catch(e){ toast(msgErr(e), true); r = false; }
      if(r === false){ el.disabled = false; el.textContent = antes; } else cerrarModal();
    };
    pie.appendChild(el);
  });
  modalAbierto = velo;
  const primero = velo.querySelector('input, select, textarea'); if(primero) primero.focus();
}
function cerrarModal(){ if(modalAbierto){ modalAbierto.remove(); modalAbierto = null; } }
document.addEventListener('keydown', e => { if(e.key === 'Escape') cerrarModal(); });
function mostrarClave(titulo, filas, clave){

async function onSesionValida(session){

async function cargarResumen(){
  try { S.cuerpos = await rpc('soporte_resumen') || []; }
  catch(e){ toast(msgErr(e), true); S.cuerpos = []; }
  const n = S.cuerpos.reduce((t, c) => t + alertas(c).filter(a => a.n >= 2).length, 0);
  const cnt = $('cntAtencion'); cnt.textContent = n; cnt.classList.toggle('hidden', n === 0);
}
function alertas(c){
  const a = [];
  if(c.estado === 'suspendido') a.push({ n:3, t:'Cuerpo suspendido — nadie puede ingresar' });
  if(!c.lic_codigo) a.push({ n:2, t:'Sin licencia vinculada' });
  else if(c.lic_estado === 'solo_lectura') a.push({ n:3, t:'Licencia vencida — la app está en solo lectura' });
  else if(c.lic_estado === 'gracia') a.push({ n:3, t:'Licencia vencida el ' + fecha(c.lic_vence) + ' — en período de gracia' });
  else if(c.lic_estado === 'revocada') a.push({ n:3, t:'Licencia revocada' });
  else if(c.lic_vence){ const d = dias(c.lic_vence); if(d <= 30) a.push({ n:2, t:`La licencia vence en ${d} día${d === 1 ? '' : 's'}` }); }
  if(!c.ultimo_ingreso) a.push({ n:2, t:'Nadie ha ingresado todavía' });
  else { const d = Math.floor((Date.now() - new Date(c.ultimo_ingreso).getTime()) / 864e5); if(d >= 14) a.push({ n:2, t:`Sin ingresos hace ${d} días` }); }
  if(c.central_sin_login) a.push({ n:1, t:'Sin cuenta de Central de Alarmas' });
  if(c.n_cias_sin_pc > 0) a.push({ n:1, t:`${c.n_cias_sin_pc} compañía${c.n_cias_sin_pc === 1 ? '' : 's'} sin cuenta de PC` });
  if(c.n_solicitudes > 0) a.push({ n:1, t:`${c.n_solicitudes} solicitud${c.n_solicitudes === 1 ? '' : 'es'} de alta pendiente${c.n_solicitudes === 1 ? '' : 's'}` });
  return a;
}
function pillLicencia(c){
  if(!c.lic_codigo) return pill('warn', 'Sin licencia');
  if(c.lic_estado === 'solo_lectura') return pill('bad', 'Solo lectura');
  if(c.lic_estado === 'revocada') return pill('bad', 'Licencia revocada');
  if(c.lic_estado === 'gracia') return pill('warn', 'En gracia');
  const plan = nombrePlan(c.lic_plan);
  if(c.lic_vence && dias(c.lic_vence) <= 30) return pill('warn', plan + ' · vence en ' + dias(c.lic_vence) + ' d');
  return pill('ok', plan);
}

/* ===================== Usuarios ===================== */
function vistaUsuarios(){
  return `
  <div class="titulo"><div><h2>Usuarios</h2><div class="sub">Búsqueda en todos los clientes</div></div></div>
  <div class="filtros">
    <input type="search" id="qUsuarios" placeholder="Nombre, N° de registro, RUT o teléfono…" value="${esc(S.qUsuarios)}" oninput="S.qUsuarios=this.value; programarBusqueda()">
    <select id="cuerpoUsuarios" onchange="S.cuerpoUsuarios=this.value; buscarUsuarios()"><option value="">Todos los clientes</option>${S.cuerpos.map(c => `<option value="${esc(c.id)}" ${S.cuerpoUsuarios === c.id ? 'selected' : ''}>${esc(c.nombre_oficial)}</option>`).join('')}</select>
  </div>
  <div id="resUsuarios"><div class="vacio">Buscando…</div></div>`;
}
let _bt = null;
function programarBusqueda(){ clearTimeout(_bt); _bt = setTimeout(buscarUsuarios, 280); }
async function buscarUsuarios(){
  const el = $('resUsuarios'); if(!el) return;
  try {
    const q = S.qUsuarios, cu = S.cuerpoUsuarios;
    const data = await rpc('soporte_buscar_usuarios', { p_q:q || null, p_cuerpo_id:cu || null });
    if(q !== S.qUsuarios || cu !== S.cuerpoUsuarios) return;
    S.usuarios = data || [];
    el.innerHTML = S.usuarios.length ? `<div class="tabla-wrap"><table><thead><tr><th>Persona</th><th>Cargo</th><th>Cliente · Compañía</th><th>Estado</th><th>Último ingreso</th><th>Notific.</th></tr></thead><tbody>
      ${S.usuarios.map(u => `<tr class="fila-click" data-act="abrirUsuario" data-id="${esc(u.id)}"><td><b>${esc(u.nombre_completo)}</b><span class="sub">N° ${u.numero_registro}</span></td><td>${esc(u.cargo)}</td>
        <td>${esc(u.cuerpo_nombre)}<span class="sub">${esc(u.compania_nombre || 'Comandancia / Cuerpo')}</span></td><td>${pillEstadoUsuario(u)}</td><td class="num">${esc(rel(u.ultimo_ingreso))}</td>
        <td>${u.n_push > 0 ? pill('ok', 'Activas') : pill('mute', 'No')}</td></tr>`).join('')}</tbody></table></div>
      ${S.usuarios.length >= 80 ? '<div class="sub" style="margin-top:10px;color:var(--text-dim);font-size:12px">Se muestran los primeros 80 resultados — afina la búsqueda.</div>' : ''}` : `<div class="vacio">Sin resultados.</div>`;
  } catch(e){ el.innerHTML = `<div class="vacio">${esc(msgErr(e))}</div>`; }
}
function pillEstadoUsuario(u){
  if(u.estado === 'dado_de_baja') return pill('mute', 'De baja');
  if(u.estado === 'suspendido') return pill('bad', 'Suspendido');
  if(!u.tiene_cuenta) return pill('warn', 'Sin cuenta');
  if(u.debe_cambiar_password) return pill('warn', 'Clave temporal');
  return pill('ok', 'Activo');
}
function abrirUsuario(id){
  const u = S.usuarios.find(x => x.id === id); if(!u) return;
  const puedeEstado = u.estado !== 'dado_de_baja';
  abrirModal({ titulo:u.nombre_completo, ancho:560, html:`<dl class="kv">
      <dt>N° de registro</dt><dd>${u.numero_registro}</dd><dt>Cargo</dt><dd>${esc(u.cargo)}</dd>
      <dt>Cliente</dt><dd>${esc(u.cuerpo_nombre)}</dd><dt>Compañía</dt><dd>${esc(u.compania_nombre || 'Comandancia / Cuerpo')}</dd>
      <dt>Estado</dt><dd>${pillEstadoUsuario(u)}</dd><dt>Último ingreso</dt><dd>${u.ultimo_ingreso ? esc(fechaHora(u.ultimo_ingreso)) + ' (' + esc(rel(u.ultimo_ingreso)) + ')' : 'Nunca'}</dd>
      <dt>Notificaciones</dt><dd>${u.n_push > 0 ? u.n_push + ' dispositivo' + (u.n_push === 1 ? '' : 's') : 'Ninguno'}</dd>
      <dt>RUT · Teléfono</dt><dd>${esc(u.rut || '—')} · ${esc(u.telefono || '—')}</dd>
      ${u.debe_cambiar_password ? `<dt>Clave temporal</dt><dd>${u.password_temporal_expira_en ? 'vence ' + esc(fecha(u.password_temporal_expira_en)) : 'pendiente de cambio'}</dd>` : ''}</dl>
    <div class="acciones">
      <button class="btn" id="uReset" ${u.tiene_cuenta ? '' : 'disabled'}>Restablecer contraseña</button>
      <button class="btn" id="uSesiones" ${u.tiene_cuenta ? '' : 'disabled'}>Cerrar sesiones</button>
      ${puedeEstado ? (u.estado === 'suspendido' ? `<button class="btn pri" id="uEstado">Reactivar</button>` : `<button class="btn bad" id="uEstado">Suspender</button>`) : ''}
      <button class="btn" id="uCliente">Ver cliente</button>
    </div>`, botones:[{ txt:'Cerrar' }] });
  const refrescar = async () => { await buscarUsuarios(); };
  if($('uReset')) $('uReset').onclick = () => abrirModal({ titulo:'Restablecer contraseña', html:`<p>Se genera una contraseña temporal para <b>${esc(u.nombre_completo)}</b> (N° ${u.numero_registro}). Deberá cambiarla al ingresar y vence en 7 días.</p>`,
    botones:[{ txt:'Cancelar' }, { txt:'Restablecer', cls:'pri', fn: async () => {
      const r = await rpc('soporte_resetear_password_personal', { p_personal_id:u.id }); const fila = Array.isArray(r) ? r[0] : r;
      setTimeout(() => mostrarClave(u.nombre_completo, [['N° de registro', u.numero_registro], ['Cliente', u.cuerpo_nombre]], fila.r_password_temporal), 50); refrescar();
    } }] });
  if($('uSesiones')) $('uSesiones').onclick = () => abrirModal({ titulo:'Cerrar sesiones', html:`<p>Se cierran todas las sesiones abiertas de <b>${esc(u.nombre_completo)}</b>. Tendrá que volver a ingresar.</p>`,
    botones:[{ txt:'Cancelar' }, { txt:'Cerrar sesiones', cls:'pri', fn: async () => { const n = await rpc('soporte_cerrar_sesiones_personal', { p_personal_id:u.id }); toast(n + ' sesión' + (n === 1 ? '' : 'es') + ' cerrada' + (n === 1 ? '' : 's')); } }] });
  if($('uEstado')) $('uEstado').onclick = () => {
    const suspender = u.estado !== 'suspendido';
    abrirModal({ titulo:suspender ? 'Suspender usuario' : 'Reactivar usuario', html:`<p><b>${esc(u.nombre_completo)}</b> (N° ${u.numero_registro})</p><div class="field"><label>Motivo</label><input id="uMotivo" placeholder="Obligatorio"></div>`,
      botones:[{ txt:'Cancelar' }, { txt:suspender ? 'Suspender' : 'Reactivar', cls:suspender ? 'bad' : 'pri', fn: async () => {
        const motivo = $('uMotivo').value.trim(); if(!motivo){ toast('Escribe el motivo', true); return false; }
        await rpc('soporte_cambiar_estado_personal', { p_personal_id:u.id, p_estado:suspender ? 'suspendido' : 'activo', p_motivo:motivo });
        toast(suspender ? 'Usuario suspendido' : 'Usuario reactivado'); refrescar();
      } }] });
  };
  if($('uCliente')) $('uCliente').onclick = () => { cerrarModal(); irA('clientes'); abrirFicha(u.cuerpo_id); };
}

/* ===================== Auditoría ===================== */
const ETQ_ACCION = { reset_password:'Contraseña restablecida', suspender_cuerpo:'Cuerpo suspendido', reactivar_cuerpo:'Cuerpo reactivado', eliminar_cuerpo:'Cuerpo eliminado', editar_cuerpo:'Datos editados',
  exportar_datos:'Datos exportados', crear_licencia:'Licencia creada', licencia_plan:'Plan cambiado', licencia_extender:'Licencia extendida', licencia_revocar:'Licencia revocada', licencia_restaurar:'Licencia restaurada', licencia_vincular:'Licencia vinculada', entrar_como_admin:'Entró como Admin', crear_cuenta:'Cuenta creada', suspender_usuario:'Usuario suspendido', reactivar_usuario:'Usuario reactivado', cerrar_sesiones:'Sesiones cerradas' };
const etiquetaAccion = a => ETQ_ACCION[a] || a;
function dispositivoCorto(ua){ ua = ua || ''; const so = /iPhone|iPad/.test(ua) ? 'iPhone/iPad' : /Android/.test(ua) ? 'Android' : /Windows/.test(ua) ? 'Windows' : /Mac OS/.test(ua) ? 'Mac' : '—'; const nav = /CriOS|Chrome\//.test(ua) ? 'Chrome' : /Safari\//.test(ua) ? 'Safari' : /Firefox\//.test(ua) ? 'Firefox' : ''; return so + (nav ? ' · ' + nav : ''); }
function vistaAuditoria(){
  return `
  <div class="titulo"><div><h2>Auditoría</h2><div class="sub">Qué se hizo y quién lo hizo</div></div></div>
  <div class="subtabs"><button class="subtab ${S.subAud === 'soporte' ? 'on' : ''}" data-act="subAud" data-v="soporte">Acciones de soporte</button><button class="subtab ${S.subAud === 'cuerpos' ? 'on' : ''}" data-act="subAud" data-v="cuerpos">Actividad de los clientes</button><button class="subtab ${S.subAud === 'errores' ? 'on' : ''}" data-act="subAud" data-v="errores">Errores de la app</button></div>
  <div class="filtros">
    <select id="audCuerpo" onchange="S.audCuerpo=this.value; cargarAuditoria()"><option value="">Todos los clientes</option>${S.cuerpos.map(c => `<option value="${esc(c.id)}" ${S.audCuerpo === c.id ? 'selected' : ''}>${esc(c.nombre_oficial)}</option>`).join('')}</select>
    ${S.subAud === 'cuerpos' ? `<select id="audTipo" onchange="S.audTipo=this.value; cargarAuditoria()"><option value="">Todos los tipos</option>${['critico', 'modificacion', 'creacion'].map(t => `<option value="${t}" ${S.audTipo === t ? 'selected' : ''}>${t.charAt(0).toUpperCase() + t.slice(1)}</option>`).join('')}</select>` : ''}
    <input type="search" id="audTexto" placeholder="Filtrar por texto…" value="${esc(S.audTexto)}" oninput="S.audTexto=this.value; pintarAuditoria()">
  </div>
  <div id="resAud"><div class="vacio">Cargando…</div></div>`;
}
ACCIONES.subAud = (d) => { S.subAud = d.v; S.audTipo = ''; render(); };
let _aud = [];
async function cargarAuditoria(){
  const el = $('resAud'); if(!el) return;
  try {
    let q;
    if(S.subAud === 'soporte'){ q = sb.from('soporte_auditoria').select('*').order('ocurrido_en', { ascending:false }).limit(300); if(S.audCuerpo) q = q.eq('cuerpo_id', S.audCuerpo); }
    else if(S.subAud === 'errores'){ q = sb.from('app_errores').select('*').order('ocurrido_en', { ascending:false }).limit(300); if(S.audCuerpo) q = q.eq('cuerpo_id', S.audCuerpo); }
    else { q = sb.from('registro_auditoria').select('*').order('ocurrido_en', { ascending:false }).limit(300); if(S.audCuerpo) q = q.eq('cuerpo_id', S.audCuerpo); if(S.audTipo) q = q.eq('tipo', S.audTipo); }
    const { data, error } = await q; if(error) throw error;
    _aud = data || []; pintarAuditoria();
  } catch(e){ el.innerHTML = `<div class="vacio">${esc(msgErr(e))}</div>`; }
}
function pintarAuditoria(){
  const el = $('resAud'); if(!el) return;
  const mc = mapaCuerpos(), t = S.audTexto.trim().toLowerCase();
  const lista = _aud.filter(a => !t || JSON.stringify(a).toLowerCase().includes(t));
  if(!lista.length){ el.innerHTML = `<div class="vacio">Sin registros.</div>`; return; }
  if(S.subAud === 'soporte'){
    el.innerHTML = `<div class="tabla-wrap"><table><thead><tr><th>Fecha</th><th>Acción</th><th>Detalle</th><th>Cliente</th><th>Quién</th></tr></thead><tbody>${lista.map(a => `<tr><td style="white-space:nowrap">${esc(fechaHora(a.ocurrido_en))}</td><td>${pill(a.accion.includes('eliminar') || a.accion.includes('suspender') || a.accion.includes('revocar') ? 'bad' : 'mute', etiquetaAccion(a.accion))}</td><td>${esc(a.detalle || '')}</td><td>${esc(a.cuerpo_nombre || (mc[a.cuerpo_id] || {}).nombre_oficial || '—')}</td><td>${esc(a.admin_nombre || '—')}</td></tr>`).join('')}</tbody></table></div>`;
  } else if(S.subAud === 'errores'){
    el.innerHTML = `<div class="tabla-wrap"><table><thead><tr><th>Fecha</th><th>Cliente</th><th>Persona</th><th>Pantalla</th><th>Error</th><th>Dispositivo</th></tr></thead><tbody>${lista.map(a => `<tr><td style="white-space:nowrap">${esc(fechaHora(a.ocurrido_en))}</td><td>${esc((mc[a.cuerpo_id] || {}).nombre_oficial || '—')}</td><td>${esc(a.usuario_label || 'sin sesión')}</td><td>${esc(a.pagina || '')}</td><td style="max-width:420px; word-break:break-word">${esc(a.mensaje || '')}${a.detalle ? `<span class="sub" style="font-family:var(--ui-mono,monospace); font-size:10.5px">${esc(String(a.detalle).slice(0, 220))}</span>` : ''}</td><td style="font-size:11px; color:var(--text-dim); max-width:220px">${esc(dispositivoCorto(a.agente))}</td></tr>`).join('')}</tbody></table></div>`;
  } else {
    el.innerHTML = `<div class="tabla-wrap"><table><thead><tr><th>Fecha</th><th>Tipo</th><th>Detalle</th><th>Cliente</th><th>Quién</th></tr></thead><tbody>${lista.map(a => `<tr><td style="white-space:nowrap">${esc(fechaHora(a.ocurrido_en))}</td><td>${pill(a.tipo === 'critico' ? 'bad' : a.tipo === 'creacion' ? 'ok' : 'mute', a.tipo)}</td><td>${esc(a.detalle || '')}</td><td>${esc((mc[a.cuerpo_id] || {}).nombre_oficial || '—')}</td><td>${esc(a.usuario_label || '—')}</td></tr>`).join('')}</tbody></table></div>`;
  }
}

/* ===================== Planes y paquetes ===================== */
async function cargarCatalogo(){
  try {
    const [p, pl] = await Promise.all([sb.from('vigor_paquetes').select('*').order('orden'), sb.from('vigor_planes').select('*').order('orden')]);
    S.paquetes = p.data || []; S.planes = pl.data || [];
  } catch(e){ S.paquetes = []; S.planes = []; }
}
const nombrePlan = c => { const p = S.planes.find(x => x.codigo === c); return p ? p.nombre : (c ? String(c).toUpperCase() : 'Sin plan'); };
const nombrePaq = c => { const p = S.paquetes.find(x => x.codigo === c); return p ? p.nombre : String(c).toUpperCase(); };
const planDe = c => S.planes.find(x => x.codigo === c);
function chipsPaquetes(lista, extras){
  const ex = new Set(extras || []);
  return `<span class="pill mute" title="Gestión de la compañía">STATION</span> ` + S.paquetes.filter(p => (lista || []).includes(p.codigo))
    .map(p => `<span class="pill ${ex.has(p.codigo) ? 'ok' : 'mute'}" title="${esc(p.descripcion)}${ex.has(p.codigo) ? ' · suelto' : ''}">${esc(p.nombre)}</span>`).join(' ');
}
function estadoLicencia(l){
  const ahora = Date.now();
  let vence = null;
  if(l.estado === 'revocada') vence = l.revocada_en ? new Date(l.revocada_en) : new Date();
  else if(l.vigencia_meses){ vence = new Date(l.generada_en); vence.setMonth(vence.getMonth() + l.vigencia_meses); }
  const gracia = vence ? new Date(vence.getTime() + 15 * 864e5) : null;
  if(l.estado === 'generada') return { pill:pill('warn', 'Sin activar'), vence, gracia };
  if(l.estado === 'revocada') return { pill:pill('bad', ahora <= gracia ? 'Revocada · en gracia' : 'Revocada · solo lectura'), vence, gracia };
  if(!vence || ahora <= vence.getTime()) return { pill:pill('ok', 'Activa'), vence, gracia };
  if(ahora <= gracia.getTime()) return { pill:pill('warn', 'En gracia'), vence, gracia };
  return { pill:pill('bad', 'Solo lectura'), vence, gracia };
}
function bloqueLicenciaFicha(estadoLic, l){
  const plan = planDe(l.plan);
  const e = estadoLic && estadoLic.estado;
  const txtEstado = e === 'activa' ? (estadoLic.revocada ? 'Revocada' : 'Activa') : e === 'gracia' ? 'En gracia' : e === 'solo_lectura' ? 'Solo lectura' : '—';
  const vence = estadoLic && estadoLic.vence ? new Date(estadoLic.vence) : null;
  const txtVence = !vence ? 'Sin vencimiento' : fecha(vence) + (e === 'activa' ? ' · ' + dias(vence) + ' d' : e === 'gracia' ? ' · gracia hasta ' + fecha(estadoLic.gracia_hasta) : ' · vencida');
  return `<div class="lic-box">
      <div>Plan<b>${esc(plan ? plan.nombre : 'Sin plan')}</b></div>
      <div>Estado<b>${esc(txtEstado)}</b></div>
      <div>Vence<b style="font-size:12.5px">${esc(txtVence)}</b></div>
      <div>Código<b class="mono" style="font-size:12px">${esc(l.codigo)}</b></div>
    </div>
    <div style="margin-top:12px; display:flex; gap:6px; flex-wrap:wrap;">${chipsPaquetes(estadoLic && estadoLic.paquetes, l.paquetes_extra)}</div>`;
}

/* ===================== Licencias ===================== */
let _lics = [];
function vistaLicencias(){
  return `
  <div class="titulo"><div><h2>Licencias</h2><div class="sub">Planes, paquetes y vigencia de cada cliente</div></div>
    <div class="acciones"><button class="btn pri" data-act="nuevaLicencia">Nueva licencia</button><button class="btn" data-act="abrirHerramienta" data-url="activar_licencia.html">Activar licencia</button><button class="btn" data-act="abrirHerramienta" data-url="wizard_inicial.html">Asistente de configuración</button></div></div>
  <div class="sec">Planes</div>
  <div class="grid">${S.planes.map(p => `<div class="card"><div class="c-top"><div class="c-nom">${esc(p.nombre)}</div>${pill('mute', p.nivel)}</div>
      <div style="margin-top:12px; display:flex; gap:6px; flex-wrap:wrap;">${chipsPaquetes(p.paquetes)}</div></div>`).join('')}</div>
  <div class="sec">Paquetes</div>
  <div class="tabla-wrap"><table><thead><tr><th>Paquete</th><th>Función</th>${S.planes.map(p => `<th style="text-align:center">${esc(p.nombre.replace('VIGOR ', ''))}</th>`).join('')}<th>Requiere</th></tr></thead><tbody>
    <tr><td><b>STATION</b></td><td>Gestión de la compañía (siempre incluido)</td>${S.planes.map(() => `<td style="text-align:center; color:var(--ok)">●</td>`).join('')}<td>—</td></tr>
    ${S.paquetes.map(p => `<tr><td><b>${esc(p.nombre)}</b></td><td>${esc(p.descripcion)}</td>${S.planes.map(pl => `<td style="text-align:center; color:${(pl.paquetes || []).includes(p.codigo) ? 'var(--ok)' : 'var(--line-strong)'}">${(pl.paquetes || []).includes(p.codigo) ? '●' : '○'}</td>`).join('')}<td>${esc((p.requiere || []).map(nombrePaq).join(', ') || '—')}</td></tr>`).join('')}
  </tbody></table></div>
  <div class="sec">Licencias emitidas</div>
  <div id="resLic"><div class="vacio">Cargando…</div></div>`;
}
async function cargarLicencias(){
  const el = $('resLic'); if(!el) return;
  const { data, error } = await sb.from('licencias').select('*').order('generada_en', { ascending:false });
  if(error){ el.innerHTML = `<div class="vacio">${esc(msgErr(error))}</div>`; return; }
  _lics = data || [];
  const mc = mapaCuerpos();
  el.innerHTML = _lics.length ? `<div class="tabla-wrap"><table><thead><tr><th>Cliente</th><th>Código</th><th>Plan</th><th>Estado</th><th>Vence</th><th>Cuerpo vinculado</th><th></th></tr></thead><tbody>${_lics.map(l => {
    const e = estadoLicencia(l);
    return `<tr><td><b>${esc(l.nombre_cliente)}</b>${l.contacto ? `<span class="sub">${esc(l.contacto)}</span>` : ''}</td><td class="mono" style="font-size:12px">${esc(l.codigo)}</td>
      <td>${esc(nombrePlan(l.plan))}${(l.paquetes_extra || []).length ? `<span class="sub">+ ${esc(l.paquetes_extra.map(nombrePaq).join(', '))}</span>` : ''}</td>
      <td>${e.pill}</td><td>${e.vence ? esc(fecha(e.vence)) : 'Sin vencimiento'}</td>
      <td>${l.cuerpo_id ? esc((mc[l.cuerpo_id] || {}).nombre_oficial || '—') : pill('warn', 'Sin vincular')}</td>
      <td style="text-align:right"><button class="btn sm" data-act="editarLicencia" data-codigo="${esc(l.codigo)}">Editar</button></td></tr>`;
  }).join('')}</tbody></table></div>` : `<div class="vacio">Todavía no hay licencias emitidas.</div>`;
}
function selectorExtras(planCodigo, marcados){
  const incluidos = new Set((planDe(planCodigo) || {}).paquetes || []);
  const libres = S.paquetes.filter(p => !incluidos.has(p.codigo));
  return libres.length ? libres.map(p => `<label class="chk"><input type="checkbox" class="chkExtra" value="${esc(p.codigo)}" ${(marcados || []).includes(p.codigo) ? 'checked' : ''}> <div><b>${esc(p.nombre)}</b> <span>· ${esc(p.descripcion)}</span></div></label>`).join('') : `<div style="font-size:12.5px; color:var(--text-dim)">Este plan ya incluye todos los paquetes.</div>`;
}
function previewPaquetes(planCodigo, extras){
  const plan = new Set((planDe(planCodigo) || {}).paquetes || []);
  const todos = new Set([...plan, ...(extras || [])]);
  for(let i = 0; i < 3; i++) S.paquetes.forEach(p => { if(todos.has(p.codigo)) (p.requiere || []).forEach(r => todos.add(r)); });
  const auto = new Set([...todos].filter(c => !plan.has(c) && !(extras || []).includes(c)));
  const incluidos = S.paquetes.filter(p => todos.has(p.codigo));
  const fuera = S.paquetes.filter(p => !todos.has(p.codigo));
  return `<div style="background:var(--bg); border:1px solid var(--line-strong); border-radius:10px; padding:12px 14px;">
    <div style="font-size:11px; color:var(--ok); font-weight:700; margin-bottom:8px;">ACCESO DEL CLIENTE</div>
    <div style="display:flex; gap:6px; flex-wrap:wrap;"><span class="pill mute">STATION</span>${incluidos.map(p => `<span class="pill ${plan.has(p.codigo) ? 'mute' : 'ok'}" title="${esc(p.descripcion)}">${esc(p.nombre)}${auto.has(p.codigo) ? ' · requerido' : ''}</span>`).join('')}</div>
    ${fuera.length ? `<div style="font-size:11px; color:var(--text-dim); font-weight:700; margin:12px 0 8px;">BLOQUEADO</div><div style="display:flex; gap:6px; flex-wrap:wrap;">${fuera.map(p => `<span class="pill" style="background:transparent; border:1px dashed var(--line-strong); color:var(--text-dim)">${esc(p.nombre)}</span>`).join('')}</div>` : ''}
  </div>`;
}
function conectarPreview(idPlan, idPrev){
  const act = () => { const el = $(idPrev); if(el) el.innerHTML = previewPaquetes($(idPlan).value, extrasMarcados()); };
  $('modalCuerpo').addEventListener('change', act); act();
}
const extrasMarcados = () => [...document.querySelectorAll('.chkExtra:checked')].map(c => c.value);
function opcionesPlanes(sel){ return S.planes.map(p => `<option value="${esc(p.codigo)}" ${p.codigo === sel ? 'selected' : ''}>${esc(p.nombre)} · ${esc(p.nivel)}</option>`).join(''); }

ACCIONES.nuevaLicencia = () => {
  abrirModal({ titulo:'Nueva licencia', ancho:560, html:`
    <div class="field"><label>Nombre del Cuerpo cliente</label><input id="nlCliente" placeholder="Ej. Cuerpo de Bomberos de …"></div>
    <div class="field"><label>Contacto / Email</label><input id="nlContacto" placeholder="contacto@cuerpo.cl"></div>
    <div class="field"><label>Vigencia</label><select id="nlVigencia"><option value="12">12 meses</option><option value="24">24 meses</option><option value="0">Sin vencimiento (uso interno / demo)</option></select></div>
    <div class="field"><label>Plan base</label><select id="nlPlan">${opcionesPlanes('enterprise')}</select></div>
    <div class="field"><label>Paquetes sueltos (se suman al plan)</label><div id="nlExtras">${selectorExtras('enterprise', [])}</div></div>
    <div id="nlPrev"></div>`,
    botones:[{ txt:'Cancelar' }, { txt:'Crear licencia', cls:'pri', fn: async () => {
      const cliente = $('nlCliente').value.trim(); if(!cliente){ toast('Escribe el nombre del cliente', true); return false; }
      const vig = parseInt($('nlVigencia').value, 10);
      const codigo = await rpc('soporte_crear_licencia', { p_cliente:cliente, p_contacto:$('nlContacto').value.trim() || null, p_vigencia_meses:vig === 0 ? null : vig, p_plan:$('nlPlan').value, p_extra:extrasMarcados() });
      setTimeout(() => abrirModal({ titulo:'Licencia creada', html:`<p>Entrégale este código a <b>${esc(cliente)}</b> para activarlo.</p><div class="clave"><div class="l">Código de activación</div><div class="v mono" style="font-size:22px">${esc(codigo)}</div></div>`,
        botones:[{ txt:'Copiar código', fn:() => { copiar(codigo); return false; } }, { txt:'Listo', cls:'pri' }] }), 50);
      if(S.tab === 'licencias') cargarLicencias();
    } }] });
  $('nlPlan').onchange = () => { $('nlExtras').innerHTML = selectorExtras($('nlPlan').value, []); };
  conectarPreview('nlPlan', 'nlPrev');
};
ACCIONES.editarLicencia = async (d) => {
  let l = _lics.find(x => x.codigo === d.codigo);
  if(!l){ const r = await sb.from('licencias').select('*').eq('codigo', d.codigo).maybeSingle(); l = r.data; }
  if(!l){ toast('No se encontró la licencia', true); return; }
  const revocada = l.estado === 'revocada', sinVigencia = l.vigencia_meses == null;
  const mc = mapaCuerpos();
  abrirModal({ titulo:l.nombre_cliente, ancho:580, html:`
    <dl class="kv" style="margin-bottom:10px"><dt>Código</dt><dd class="mono">${esc(l.codigo)}</dd><dt>Estado</dt><dd>${estadoLicencia(l).pill}</dd>
      <dt>Cuerpo vinculado</dt><dd>${l.cuerpo_id ? esc((mc[l.cuerpo_id] || {}).nombre_oficial || '—') : 'Sin vincular'}</dd></dl>
    <div class="field"><label>Plan base</label><select id="elPlan">${opcionesPlanes(l.plan)}</select></div>
    <div class="field"><label>Paquetes sueltos (se suman al plan)</label><div id="elExtras">${selectorExtras(l.plan, l.paquetes_extra)}</div></div>
    <div id="elPrev"></div>
    <div class="sec" style="margin-top:18px">Otras acciones</div>
    <div class="acciones">
      ${sinVigencia ? '' : `<button class="btn sm" id="elMas6">Extender 6 meses</button><button class="btn sm" id="elMas12">Extender 12 meses</button>`}
      ${revocada ? `<button class="btn sm" id="elRestaurar">Restaurar licencia</button>` : `<button class="btn sm bad" id="elRevocar">Revocar</button>`}
      ${l.cuerpo_id ? '' : `<select id="elCuerpo" style="background:var(--panel-alt);border:1.5px solid var(--line-strong);border-radius:8px;color:var(--text);padding:6px 10px;font-size:12px"><option value="">Vincular a un Cuerpo…</option>${S.cuerpos.map(c => `<option value="${esc(c.id)}">${esc(c.nombre_oficial)}</option>`).join('')}</select>`}
    </div>`,
    botones:[{ txt:'Cerrar' }, { txt:'Guardar plan', cls:'pri', fn: async () => {
      await rpc('soporte_licencia_editar', { p_codigo:l.codigo, p_accion:'plan', p_plan:$('elPlan').value, p_extra:extrasMarcados() });
      toast('Plan actualizado'); await refrescarLicencias();
    } }] });
  $('elPlan').onchange = () => { $('elExtras').innerHTML = selectorExtras($('elPlan').value, []); };
  conectarPreview('elPlan', 'elPrev');
  const accion = (id, args, msg, confirmar) => { const b = $(id); if(!b) return; b.onclick = async () => {
    if(confirmar && !window.confirm(confirmar)) return;
    try { await rpc('soporte_licencia_editar', Object.assign({ p_codigo:l.codigo }, args)); toast(msg); cerrarModal(); await refrescarLicencias(); } catch(e){ toast(msgErr(e), true); } }; };
  accion('elMas6', { p_accion:'extender', p_meses:6 }, 'Licencia extendida 6 meses');
  accion('elMas12', { p_accion:'extender', p_meses:12 }, 'Licencia extendida 12 meses');
  accion('elRevocar', { p_accion:'revocar' }, 'Licencia revocada', 'Se revoca la licencia: el cliente tiene 15 días de gracia y luego pasa a solo lectura. ¿Continuar?');
  accion('elRestaurar', { p_accion:'restaurar' }, 'Licencia restaurada');
  if($('elCuerpo')) $('elCuerpo').onchange = async () => { const id = $('elCuerpo').value; if(!id) return;
    try { await rpc('soporte_licencia_editar', { p_codigo:l.codigo, p_accion:'vincular', p_cuerpo_id:id }); toast('Licencia vinculada'); cerrarModal(); await refrescarLicencias(); } catch(e){ toast(msgErr(e), true); } };
};
async function refrescarLicencias(){
  await cargarResumen();
  if(S.tab === 'licencias') await cargarLicencias();
  else if(S.tab === 'clientes' && S.fichaId) await abrirFicha(S.fichaId);
}

/* ===================== Dispositivos ===================== */
const ETQ_DISP = { tablet:'Tablet', pc:'PC de cuartel', central:'Central', celular:'Celular' };
const diasDesde = d => d ? Math.floor((Date.now() - new Date(d).getTime()) / 864e5) : null;
function problemaDisp(x){ const lim = x.tipo === 'celular' ? 14 : 7; const dd = diasDesde(x.ultimo_ingreso); return dd === null || dd >= lim; }
function vistaDispositivos(){
  return `
  <div class="titulo"><div><h2>Dispositivos</h2><div class="sub">Tablets, PC de cuartel, Central y celulares con notificaciones</div></div><button class="btn sm" data-act="recargarDisp">Actualizar</button></div>
  <div class="kpis" id="kpisDisp"></div>
  <div class="filtros" style="margin-top:18px">
    <select id="dTipo" onchange="S.dispTipo=this.value; pintarDispositivos()"><option value="">Todos los tipos</option>${Object.keys(ETQ_DISP).map(t => `<option value="${t}" ${S.dispTipo === t ? 'selected' : ''}>${ETQ_DISP[t]}</option>`).join('')}</select>
    <select id="dCuerpo" onchange="S.dispCuerpo=this.value; pintarDispositivos()"><option value="">Todos los clientes</option>${S.cuerpos.map(c => `<option value="${esc(c.id)}" ${S.dispCuerpo === c.id ? 'selected' : ''}>${esc(c.nombre_oficial)}</option>`).join('')}</select>
    <label style="display:flex; align-items:center; gap:8px; font-size:13px; color:var(--text-muted); white-space:nowrap"><input type="checkbox" id="dProb" ${S.dispProblemas ? 'checked' : ''} onchange="S.dispProblemas=this.checked; pintarDispositivos()"> Solo con problemas</label>
  </div>
  <div id="resDisp"><div class="vacio">Cargando…</div></div>`;
}
ACCIONES.recargarDisp = () => cargarDispositivos(true);
async function cargarDispositivos(forzar){
  try { if(forzar || !S.disp.length) S.disp = await rpc('soporte_dispositivos') || []; } catch(e){ toast(msgErr(e), true); S.disp = []; }
  pintarDispositivos();
}
function pintarDispositivos(){
  const el = $('resDisp'); if(!el) return;
  const todos = S.disp;
  const tab = todos.filter(x => x.tipo === 'tablet'), pc = todos.filter(x => x.tipo === 'pc'), cel = todos.filter(x => x.tipo === 'celular');
  const k = $('kpisDisp');
  if(k) k.innerHTML = `
    <div class="kpi ok"><div class="k">Tablets en línea ahora</div><div class="v">${tab.filter(x => x.en_linea).length} <small>de ${tab.length}</small></div></div>
    <div class="kpi"><div class="k">PC con ingreso en 7 días</div><div class="v">${pc.filter(x => !problemaDisp(x)).length} <small>de ${pc.length}</small></div></div>
    <div class="kpi"><div class="k">Celulares con notificaciones</div><div class="v">${cel.length}</div></div>
    <div class="kpi ${todos.filter(problemaDisp).length ? 'alerta' : 'ok'}"><div class="k">Con problemas</div><div class="v">${todos.filter(problemaDisp).length}</div></div>`;
  const mostrados = todos.filter(x => (!S.dispTipo || x.tipo === S.dispTipo) && (!S.dispCuerpo || x.cuerpo_id === S.dispCuerpo) && (!S.dispProblemas || problemaDisp(x)))
    .sort((a, b) => (problemaDisp(b) - problemaDisp(a)) || String(a.cuerpo_nombre).localeCompare(String(b.cuerpo_nombre)) || String(a.tipo).localeCompare(String(b.tipo)) || String(a.nombre).localeCompare(String(b.nombre)));
  el.innerHTML = mostrados.length ? `<div class="tabla-wrap"><table><thead><tr><th>Tipo</th><th>Dispositivo</th><th>Cliente</th><th>Último ingreso</th><th>Señal / Notificaciones</th><th>Estado</th></tr></thead><tbody>
    ${mostrados.map(x => { const dd = diasDesde(x.ultimo_ingreso);
      const senal = x.tipo === 'tablet' ? (x.en_linea ? pill('ok', 'En línea') : (x.ultima_senal ? pill('mute', 'Señal ' + rel(x.ultima_senal)) : pill('mute', 'Sin señal'))) : x.tipo === 'celular' ? (x.n_push + ' dispositivo' + (x.n_push === 1 ? '' : 's')) : '—';
      return `<tr><td>${esc(ETQ_DISP[x.tipo])}</td><td><b>${esc(x.nombre)}</b>${x.detalle ? `<span class="sub">${esc(x.detalle)}</span>` : ''}</td><td>${esc(x.cuerpo_nombre)}</td><td class="num">${esc(rel(x.ultimo_ingreso))}</td><td>${senal}</td>
        <td>${problemaDisp(x) ? pill('warn', dd === null ? 'Nunca ingresó' : 'Sin conexión hace ' + dd + ' d') : pill('ok', 'Conectado')}</td></tr>`; }).join('')}</tbody></table></div>` : `<div class="vacio">Sin dispositivos para mostrar.</div>`;
}

(async function(){ const { data } = await sb.auth.getSession(); if(data.session) await onSesionValida(data.session); })();
