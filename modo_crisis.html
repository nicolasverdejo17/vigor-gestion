<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Vigor — Modo Crisis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#060A0F; --panel:#0A131C; --panel-alt:#0E1D28; --line:#132734; --line-strong:#1C3B49;
    --text:#E7F5FA; --text-muted:#7B99A3; --text-dim:#516E78;
    --brass:#C97A2E; --brass-bright:#FF9A44; --brass-dim:#8A4E1E;
    --cyan:#49E9FF; --cyan-dim:#1E6E7D; --cyan-glow:rgba(73,233,255,0.35); --amber-glow:rgba(255,154,68,0.32);
    --burdeo:#7A1620; --burdeo-bright:#D8394E;
    --servicio:#3CF29A; --emergencia:#FF4B5C; --alerta:#FFC94D; --fuera:#C9A63B; --nodisp:#42555C;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{margin:0;background:
      radial-gradient(1100px 500px at 15% -10%, rgba(216,57,78,0.08), transparent 60%),
      var(--bg);
    color:var(--text); font-family:'Inter',sans-serif; padding-bottom:60px;}
  .mono{font-family:'JetBrains Mono',monospace;}
  h1,h2,h3{font-family:'Rajdhani',sans-serif; text-transform:uppercase; letter-spacing:.04em; font-weight:700; margin:0;}

  .wordmark{
    text-align:center; font-family:'Rajdhani',sans-serif; font-weight:600; letter-spacing:.35em;
    font-size:12px; color:var(--brass-bright); padding:9px 0 7px; text-transform:uppercase;
    background:var(--bg); position:relative; z-index:31;
  }

  /* ---- Crisis banner (persistent, replaces normal nameplate accent) ---- */
  .crisis-banner{
    background:linear-gradient(180deg,#2B1418,#1E0F12);
    border-bottom:2px solid var(--burdeo-bright);
    padding:0; position:sticky; top:0; z-index:30;
  }
  .crisis-banner-inner{
    display:flex; align-items:center; justify-content:space-between; padding:16px 28px;
    max-width:1180px; margin:0 auto; flex-wrap:wrap; gap:12px;
  }
  .crisis-left{ display:flex; align-items:center; gap:14px;}
  .crisis-pulse{
    width:12px;height:12px;border-radius:50%; background:var(--burdeo-bright);
    box-shadow:0 0 0 0 rgba(216,57,78,0.6); animation:pulse 1.8s infinite; flex-shrink:0;
  }
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(216,57,78,0.55);}
    70%{box-shadow:0 0 0 10px rgba(216,57,78,0);}
    100%{box-shadow:0 0 0 0 rgba(216,57,78,0);}
  }
  .crisis-title h1{ font-size:20px; color:#F6DCE0; letter-spacing:.06em;}
  .crisis-title span{ font-size:11px; color:#C99BA3; letter-spacing:.1em; text-transform:uppercase; display:block; margin-top:2px;}
  .crisis-right{ display:flex; align-items:center; gap:16px;}
  .crisis-clock{ text-align:right; color:var(--text-muted); font-size:11.5px; line-height:1.3; padding-right:16px; border-right:1px solid rgba(255,255,255,0.15);}
  .crisis-clock strong{ display:block; color:var(--text); font-size:20px; font-family:'JetBrains Mono',monospace; letter-spacing:.02em;}
  .crisis-timer{ text-align:right; color:#C99BA3; font-size:11.5px; line-height:1.3;}
  .crisis-timer strong{ display:block; color:#F6DCE0; font-size:16px; font-family:'JetBrains Mono',monospace;}
  .btn-desactivar{
    background:transparent; border:1.5px solid #C99BA3; color:#F6DCE0;
    font-family:'Rajdhani'; font-weight:600; letter-spacing:.05em; text-transform:uppercase;
    font-size:12px; padding:9px 16px; border-radius:3px; cursor:pointer;
  }
  .btn-desactivar:hover{ background:rgba(255,255,255,0.06);}

  .wrap{ max-width:1180px; margin:0 auto; padding:22px 24px 0;}
  .demo-tag{ color:var(--text-dim); font-size:12px; margin-bottom:20px;}

  .visibilidad-note{
    background:var(--panel); border:1px solid var(--line); border-left:3px solid var(--brass);
    border-radius:4px; padding:13px 16px; margin-bottom:22px; font-size:12.5px; color:var(--text-muted); line-height:1.5;
  }
  .visibilidad-note b{ color:var(--brass-bright);}

  /* ---- Toolbar ---- */
  .toolbar{ display:flex; justify-content:space-between; align-items:center; margin-bottom:18px; flex-wrap:wrap; gap:12px;}
  .toolbar h2{ font-size:20px;}
  .toolbar-actions{ display:flex; gap:10px;}
  .btn-crear{
    background:var(--alerta); border:none; color:#241505;
    font-family:'Rajdhani'; font-weight:700; letter-spacing:.04em; text-transform:uppercase;
    font-size:13px; padding:11px 20px; border-radius:4px; cursor:pointer;
  }
  .btn-crear:hover{ filter:brightness(1.08);}
  .btn-reporte{
    background:transparent; border:1.5px solid var(--cyan); color:var(--cyan);
    font-family:'Rajdhani'; font-weight:700; letter-spacing:.04em; text-transform:uppercase;
    font-size:13px; padding:10px 20px; border-radius:4px; cursor:pointer;
  }
  .btn-reporte:hover{ background:rgba(73,233,255,0.08);}

  /* ---- Batallón card ---- */
  .batallones{ display:grid; grid-template-columns:repeat(3,1fr); gap:14px; align-items:start;}
  @media (max-width:900px){ .batallones{grid-template-columns:1fr;} }
  .batallon{ background:var(--panel); border:1px solid var(--line-strong); border-radius:6px; position:relative; overflow:hidden;}
  .batallon::before{ content:""; position:absolute; inset:5px; border:1px solid var(--brass-dim); border-radius:2px; pointer-events:none; opacity:.5;}

  .batallon-summary{ padding:14px 16px; cursor:pointer; display:flex; flex-direction:column; gap:8px;}
  .batallon-summary-top{ display:flex; justify-content:space-between; align-items:center; gap:8px;}
  .batallon-summary-top h3{ font-size:15px; margin:0; letter-spacing:.02em;}
  .estado-pill{
    font-family:'Rajdhani'; font-weight:700; font-size:10px; letter-spacing:.05em; text-transform:uppercase;
    padding:4px 9px; border-radius:3px; white-space:nowrap;
  }
  .estado-pill.emergencia{ background:var(--emergencia); color:#fff;}
  .estado-pill.disponible{ background:var(--servicio); color:#fff;}
  .estado-pill.rancho{ background:var(--fuera); color:#241505;}
  .batallon-summary-meta{ font-size:11.5px; color:var(--text-muted); line-height:1.4;}
  .batallon-summary-counts{ display:flex; gap:14px; font-size:11.5px; color:var(--text-dim); font-family:'JetBrains Mono',monospace;}
  .batallon-summary-counts b{ color:var(--brass-bright);}
  .expand-hint{ font-size:10.5px; color:var(--cyan); text-transform:uppercase; letter-spacing:.05em; margin-top:2px;}
  .btn-cerrar-batallon{
    background:transparent; border:1.5px solid var(--cyan); color:var(--cyan);
    font-family:'Rajdhani'; font-weight:700; letter-spacing:.04em; text-transform:uppercase;
    font-size:11px; padding:7px 14px; border-radius:4px; cursor:pointer; margin-bottom:12px; width:100%;
  }
  .btn-cerrar-batallon:hover{ background:rgba(73,233,255,0.08);}

  .batallon-head{ display:none;}
  .batallon-body{ display:none; padding:0 16px 18px; position:relative; border-top:1px solid var(--line); padding-top:16px;}
  .batallon.open .batallon-head{ display:flex; justify-content:space-between; align-items:center; padding:16px 16px 0; flex-wrap:wrap; gap:10px;}
  .batallon-head-right{ display:flex; align-items:center; gap:14px; flex-wrap:wrap;}
  .batallon.open .batallon-body{ display:block;}
  .batallon.open .batallon-summary{ display:none;}
  .batallon-nombre{ font-family:'Rajdhani'; font-weight:700; font-size:16px; background:transparent; border:none; color:var(--text); letter-spacing:.03em; text-transform:uppercase; width:150px;}
  .batallon-nombre:focus{ outline:none; border-bottom:1px solid var(--cyan);}
  .estado-select{ display:flex; gap:6px;}
  .estado-btn{
    font-family:'Rajdhani'; font-weight:600; font-size:11.5px; letter-spacing:.04em; text-transform:uppercase;
    padding:7px 13px; border-radius:3px; cursor:pointer; border:1.5px solid var(--line);
    background:var(--panel-alt); color:var(--text-muted);
  }
  .estado-btn.emergencia.on{ background:var(--emergencia); border-color:var(--emergencia); color:#fff;}
  .estado-btn.disponible.on{ background:var(--servicio); border-color:var(--servicio); color:#fff;}
  .estado-btn.rancho.on{ background:var(--fuera); border-color:var(--fuera); color:#241505;}

  .batallon-body{ padding:18px 20px 20px; position:relative;}
  .meta-row{ display:flex; flex-direction:column; gap:10px; margin-bottom:16px;}
  .meta-field{ width:100%;}
  .meta-field label{ display:block; font-size:10px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.08em; margin-bottom:6px;}
  .meta-field input{
    width:100%; background:var(--panel-alt); border:1px solid var(--line); border-radius:4px;
    padding:9px 12px; color:var(--text); font-size:13.5px;
  }
  .meta-field input:focus{ outline:none; border-color:var(--cyan);}

  .sub-block{ margin-bottom:16px;}
  .sub-block:last-child{ margin-bottom:0;}
  .sub-label{ font-size:10.5px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.08em; margin-bottom:8px;}
  .chip-list{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px; min-height:8px;}
  .chip{
    display:inline-flex; align-items:center; gap:7px; background:var(--panel-alt); border:1px solid var(--line-strong);
    border-radius:3px; padding:6px 10px; font-size:12.5px;
  }
  .chip.carro{ font-family:'JetBrains Mono',monospace; color:var(--brass-bright); border-color:var(--brass-dim);}
  .chip.bombero{ color:var(--text);}
  .chip .rol{ font-size:10px; color:var(--text-muted); text-transform:uppercase;}
  .chip button{ background:none; border:none; color:var(--text-dim); cursor:pointer; font-size:12px; padding:0;}
  .chip button:hover{ color:var(--emergencia);}

  .add-row{ display:flex; flex-direction:column; gap:7px;}
  .add-row input, .add-row select{
    background:var(--bg); border:1px dashed var(--line-strong); border-radius:4px;
    padding:8px 10px; color:var(--text); font-size:12.5px; width:100%;
  }
  .add-row input:focus, .add-row select:focus{ outline:none; border-color:var(--cyan); border-style:solid;}
  .add-row input.i-nom{ font-family:'JetBrains Mono',monospace;}
  .add-btn-mini{
    background:var(--cyan-dim); border:1px solid var(--cyan); color:#DFF7F9;
    font-size:12px; font-weight:600; padding:8px 14px; border-radius:4px; cursor:pointer; width:100%;
  }
  .add-btn-mini:hover{ filter:brightness(1.1);}

  .del-batallon{
    background:transparent; border:1.5px solid var(--burdeo-bright); color:var(--burdeo-bright);
    font-family:'Rajdhani'; font-weight:700; letter-spacing:.04em; text-transform:uppercase;
    font-size:11px; padding:7px 14px; border-radius:4px; cursor:pointer; white-space:nowrap;
  }
  .del-batallon:hover{ background:rgba(255,75,92,0.1);}

  .empty-state{ text-align:center; padding:50px 20px; color:var(--text-dim); font-size:13.5px;}

  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(12px);
    background:var(--panel-alt); border:1px solid var(--cyan); color:#DFF7F9;
    padding:13px 22px; border-radius:5px; font-size:13.5px; opacity:0; pointer-events:none;
    transition:all .25s; z-index:50; max-width:90vw;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0);}

  .modal-overlay{ position:fixed; inset:0; background:rgba(5,10,15,0.75); z-index:60; display:none; align-items:center; justify-content:center;}
  .modal-overlay.show{ display:flex;}
  .modal-box{ background:var(--panel); border:1.5px solid var(--burdeo-bright); border-radius:10px; padding:22px 24px; width:400px;}
  .modal-box h3{ font-family:'Rajdhani',sans-serif; font-size:15px; margin:0 0 8px; color:var(--text);}
  .modal-box p{ font-size:13px; color:var(--text-muted); margin:0 0 18px; line-height:1.5;}
  .modal-actions{ display:flex; gap:10px;}
  .modal-actions button{ flex:1; font-family:'Inter',sans-serif; font-weight:600; font-size:13px; padding:11px; border-radius:5px; cursor:pointer; border:none;}
  .modal-cancel{ background:transparent; border:1px solid var(--line-strong) !important; color:var(--text-muted);}
  .modal-confirm{ background:var(--burdeo); border:1px solid var(--burdeo-bright) !important; color:#fff;}
  .modal-confirm:hover{ background:var(--burdeo-bright);}
</style>

<body>

  <div class="wordmark">VIGOR</div>
  <div class="crisis-banner">
    <div class="crisis-banner-inner">
      <div class="crisis-left">
        <div class="crisis-pulse"></div>
        <div class="crisis-title">
          <h1>Modo Crisis — Puesto de Mando</h1>
          <span id="ciaLabel">Vigor</span>
        </div>
      </div>
      <div class="crisis-right">
        <div class="crisis-clock">Hora actual<strong id="relojReal">00:00:00</strong></div>
        <div class="crisis-timer">Activo desde<strong id="timer">00:00:00</strong></div>
        <button class="btn-desactivar" onclick="confirmarDesactivarCrisis()">Desactivar Modo Crisis</button>
      </div>
    </div>
  </div>

  <div class="wrap">
    <div class="toolbar">
      <h2>Batallones</h2>
      <div class="toolbar-actions">
        <button class="btn-reporte" onclick="window.print()">Generar reporte</button>
        <button class="btn-crear" onclick="crearBatallon()">+ Crear Batallón</button>
      </div>
    </div>

    <div class="batallones" id="batallones"></div>

  </div>

  <div class="toast" id="toast"></div>

  <div class="modal-overlay" id="desactivarModal">
    <div class="modal-box">
      <h3>Desactivar Modo Crisis</h3>
      <p>¿Confirmar que deseas desactivar el Modo Crisis? Todos los Batallones activos deben estar cerrados antes de continuar.</p>
      <div class="modal-actions">
        <button class="modal-cancel" onclick="document.getElementById('desactivarModal').classList.remove('show')">Cancelar</button>
        <button class="modal-confirm" id="btnConfirmarDesactivar">Confirmar</button>
      </div>
    </div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://mcfcfbtiruewlcejionr.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1jZmNmYnRpcnVld2xjZWppb25yIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzODExNzgsImV4cCI6MjEwMzk1NzE3OH0.9b_t63ah25RIGNn3pzZU3L553YUrrn7IXWW3MEjXuXU';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let batallones = [];
let abiertos = new Set();
let miPuestoMandoId = null;
let fechaActivacion = null;
let elapsedBaseMs = 0;
let elapsedRefPerf = 0;

async function cargarDatos(){
  const { data: { session } } = await sb.auth.getSession();
  if(!session){ toast('Necesitás loguearte primero'); return; }

  // Modo Crisis se abre exclusivamente desde el botón del PC del Cuartel
  // (pc_compania.html) — esa es una identidad institucional (companias.auth_user_id),
  // no una fila en "personal". Antes esto buscaba solo en "personal" y
  // siempre fallaba con "Esta sesión no pertenece a ninguna Compañía".
  const { data: pc } = await sb.rpc('pc_obtener_compania');
  const pcRow = Array.isArray(pc) ? pc[0] : pc;
  if(!pcRow){
    toast('Esta sesión no es un PC de Cuartel identificado — entrá desde el botón "Modo Crisis" del PC del Cuartel');
    return;
  }
  const companiaId = pcRow.p_compania_id;
  document.getElementById('ciaLabel').textContent = `${pcRow.p_nombre} · ${pcRow.p_cuerpo_nombre}`;

  const { data: pmId, error } = await sb.rpc('activar_puesto_mando', { p_compania_id: companiaId });
  if(error){ toast('No se pudo activar el Puesto de Mando — ' + error.message); return; }
  miPuestoMandoId = pmId;

  const { data: pm } = await sb.from('puestos_mando').select('fecha_activacion').eq('id', miPuestoMandoId).single();
  fechaActivacion = new Date(pm.fecha_activacion);
  // El cronómetro no vuelve a comparar contra el reloj del sistema en cada
  // tick (si el reloj del dispositivo está aunque sea unos segundos atrasado
  // respecto al servidor, esa resta da negativa y queda clavado en 00:00:00
  // para siempre). Se calcula el desfasaje UNA sola vez acá y de ahí en
  // adelante se suma tiempo real transcurrido con performance.now(), que
  // nunca retrocede ni depende de la hora del sistema.
  elapsedBaseMs = Math.max(0, Date.now() - fechaActivacion.getTime());
  elapsedRefPerf = performance.now();

  await cargarBatallones();
  suscribirRealtime();
}

// Modo Crisis es un tablero colaborativo — más de un Comandante puede
// estar viendo/editando el mismo Puesto de Mando activo a la vez.
let suscritoModoCrisis = false;
function suscribirRealtime(){
  if(suscritoModoCrisis || !miPuestoMandoId) return;
  suscritoModoCrisis = true;
  sb.channel('modo-crisis-' + miPuestoMandoId)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'batallones', filter: `puesto_mando_id=eq.${miPuestoMandoId}` }, () => cargarBatallones())
    .on('postgres_changes', { event: '*', schema: 'public', table: 'batallon_carros' }, () => cargarBatallones())
    .on('postgres_changes', { event: '*', schema: 'public', table: 'batallon_bomberos' }, () => cargarBatallones())
    .subscribe();
}

async function cargarBatallones(){
  const { data } = await sb.from('batallones')
    .select('id, nombre, estado, frente_zona, responsable, batallon_carros(id, nomenclatura, procedencia), batallon_bomberos(id, nombre, rol)')
    .eq('puesto_mando_id', miPuestoMandoId).order('creado_en');
  batallones = (data || []).map(b => ({
    id: b.id, nombre: b.nombre, estado: b.estado, frente: b.frente_zona || '', responsable: b.responsable || '',
    carros: b.batallon_carros || [], bomberos: b.batallon_bomberos || []
  }));
  render();
}

async function crearBatallon(){
  const { data, error } = await sb.from('batallones').insert({ puesto_mando_id: miPuestoMandoId, nombre: `Batallón ${batallones.length+1}` }).select().single();
  if(error){ toast('No se pudo crear el batallón — ' + error.message); return; }
  await cargarBatallones();
  abiertos.add(data.id);
  render();
}
async function eliminarBatallon(id){
  await sb.from('batallones').delete().eq('id', id);
  await cargarBatallones();
}
async function setEstado(id, estado){
  await sb.from('batallones').update({ estado }).eq('id', id);
  batallones.find(b=>b.id===id).estado = estado;
  render();
}
async function setNombre(id, val){
  await sb.from('batallones').update({ nombre: val }).eq('id', id);
  batallones.find(b=>b.id===id).nombre = val;
}
async function setMeta(id, campo, val){
  const columna = campo === 'frente' ? 'frente_zona' : 'responsable';
  await sb.from('batallones').update({ [columna]: val }).eq('id', id);
  batallones.find(b=>b.id===id)[campo] = val;
}
async function addCarro(id){
  const nom = document.getElementById(`carro-nom-${id}`).value.trim();
  const proc = document.getElementById(`carro-proc-${id}`).value.trim();
  if(!nom){ toast('Ingresá al menos la nomenclatura del carro'); return; }
  const { error } = await sb.from('batallon_carros').insert({ batallon_id: id, nomenclatura: nom, procedencia: proc || 'Base' });
  if(error){ toast('No se pudo agregar el carro — ' + error.message); return; }
  await cargarBatallones();
}
async function delCarro(id, carroId){
  await sb.from('batallon_carros').delete().eq('id', carroId);
  await cargarBatallones();
}
async function addBombero(id){
  const nombre = document.getElementById(`bomb-nombre-${id}`).value.trim();
  const rol = document.getElementById(`bomb-rol-${id}`).value;
  if(!nombre){ toast('Ingresá el nombre del bombero'); return; }
  const { error } = await sb.from('batallon_bomberos').insert({ batallon_id: id, nombre, rol });
  if(error){ toast('No se pudo agregar el bombero — ' + error.message); return; }
  await cargarBatallones();
}
async function delBombero(id, bomberoId){
  await sb.from('batallon_bomberos').delete().eq('id', bomberoId);
  await cargarBatallones();
}

function toggleAbierto(id){
  if(abiertos.has(id)) abiertos.delete(id); else abiertos.add(id);
  render();
}

function render(){
  const el = document.getElementById('batallones');
  if(batallones.length===0){
    el.innerHTML = '<div class="empty-state">Sin Batallones creados todavía. Tocá "+ Crear Batallón" para empezar a organizar los recursos del evento.</div>';
    return;
  }
  el.innerHTML = batallones.map(b => `
    <div class="batallon ${abiertos.has(b.id)?'open':''}">
      <div class="batallon-summary" onclick="toggleAbierto('${b.id}')">
        <div class="batallon-summary-top">
          <h3>${b.nombre}</h3>
          <span class="estado-pill ${b.estado}">${ {emergencia:'En Emergencia', disponible:'Disponible', rancho:'Rancho'}[b.estado] }</span>
        </div>
        <div class="batallon-summary-meta">${b.frente || 'Sin frente asignado'} ${b.responsable ? '· ' + b.responsable : ''}</div>
        <div class="batallon-summary-counts"><span><b>${b.carros.length}</b> carros</span><span><b>${b.bomberos.length}</b> bomberos</span></div>
        <div class="expand-hint">Tocar para ${abiertos.has(b.id)?'cerrar':'ver detalle'} ▾</div>
      </div>
      <div class="batallon-head">
        <input class="batallon-nombre" value="${b.nombre}" onchange="setNombre('${b.id}', this.value)">
        <div class="batallon-head-right">
          <div class="estado-select">
            <button class="estado-btn emergencia ${b.estado==='emergencia'?'on':''}" onclick="setEstado('${b.id}','emergencia')">En Emergencia</button>
            <button class="estado-btn disponible ${b.estado==='disponible'?'on':''}" onclick="setEstado('${b.id}','disponible')">Disponible</button>
            <button class="estado-btn rancho ${b.estado==='rancho'?'on':''}" onclick="setEstado('${b.id}','rancho')">Rancho</button>
          </div>
          <button class="del-batallon" onclick="eliminarBatallon('${b.id}')">Eliminar ✕</button>
        </div>
      </div>
      <div class="batallon-body">
        <button class="btn-cerrar-batallon" onclick="toggleAbierto('${b.id}')">▲ Cerrar</button>
        <div class="meta-row">
          <div class="meta-field"><label>Frente / Zona</label><input value="${b.frente}" placeholder="Ej. Sector Norte" onchange="setMeta('${b.id}','frente',this.value)"></div>
          <div class="meta-field"><label>Responsable</label><input value="${b.responsable}" placeholder="Ej. Cap. R. Salinas" onchange="setMeta('${b.id}','responsable',this.value)"></div>
        </div>

        <div class="sub-block">
          <div class="sub-label">Carros</div>
          <div class="chip-list">
            ${b.carros.map((c)=>`<span class="chip carro">${c.nomenclatura} — ${c.procedencia} <button onclick="delCarro('${b.id}','${c.id}')">✕</button></span>`).join('') || ''}
          </div>
          <div class="add-row">
            <input class="i-nom" id="carro-nom-${b.id}" placeholder="Ej. F-3">
            <input class="i-proc" id="carro-proc-${b.id}" placeholder="Procedencia">
            <button class="add-btn-mini" onclick="addCarro('${b.id}')">+ Agregar carro</button>
          </div>
        </div>

        <div class="sub-block">
          <div class="sub-label">Bomberos</div>
          <div class="chip-list">
            ${b.bomberos.map((p)=>`<span class="chip bombero">${p.nombre} <span class="rol">${p.rol}</span> <button onclick="delBombero('${b.id}','${p.id}')">✕</button></span>`).join('') || ''}
          </div>
          <div class="add-row">
            <input class="i-nombre" id="bomb-nombre-${b.id}" placeholder="Nombre">
            <select id="bomb-rol-${b.id}">
              <option>Oficial</option>
              <option>Maquinista</option>
              <option>Tripulante</option>
            </select>
            <button class="add-btn-mini" onclick="addBombero('${b.id}')">+ Agregar bombero</button>
          </div>
        </div>
      </div>
    </div>
  `).join('');
}

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2600);
}

function confirmarDesactivarCrisis(){
  document.getElementById('desactivarModal').classList.add('show');
}
document.getElementById('btnConfirmarDesactivar').addEventListener('click', async () => {
  const { error } = await sb.rpc('desactivar_puesto_mando', { p_puesto_mando_id: miPuestoMandoId });
  document.getElementById('desactivarModal').classList.remove('show');
  if(error){ toast('No se pudo desactivar — hay Batallones en "En Emergencia", cambiá su estado primero'); return; }
  toast('Modo Crisis desactivado — volviendo al PC del Cuartel');
  setTimeout(() => { window.location.href = 'pc_compania.html'; }, 700);
});

// timer — cuenta desde la activación real del Puesto de Mando (fila en
// puestos_mando), no desde que se abrió esta pestaña.
function tickTimer(){
  if(!fechaActivacion) return;
  const s = Math.floor((elapsedBaseMs + (performance.now() - elapsedRefPerf)) / 1000);
  const hh = String(Math.floor(s/3600)).padStart(2,'0');
  const mm = String(Math.floor((s%3600)/60)).padStart(2,'0');
  const ss = String(s%60).padStart(2,'0');
  document.getElementById('timer').textContent = `${hh}:${mm}:${ss}`;
}
setInterval(tickTimer,1000);

function tickRelojReal(){
  document.getElementById('relojReal').textContent = new Date().toLocaleTimeString('es-CL', {hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:false});
}
tickRelojReal();
setInterval(tickRelojReal, 1000);

cargarDatos();
</script>
