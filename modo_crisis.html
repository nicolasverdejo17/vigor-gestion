<!DOCTYPE html>
<html lang="es">
<head>
<meta name="robots" content="noindex, nofollow, noarchive">
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>VIGOR - Gestiona tu compañía de forma eficiente</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#060A0F; --panel:#0A131C; --panel-alt:#0E1D28; --line:#132734; --line-strong:#1C3B49;
    --text:#E7F5FA; --text-muted:#7B99A3; --text-dim:#516E78;
    --brass:#C97A2E; --brass-bright:#FF9A44; --brass-dim:#8A4E1E;
    --cyan:#49E9FF; --cyan-dim:#1E6E7D; --cyan-glow:rgba(73,233,255,0.35); --amber-glow:rgba(255,154,68,0.32);
    --burdeo:#F13746; --burdeo-bright:#F13746;
    --servicio:#3CF29A; --emergencia:#F13746; --alerta:#FFC94D; --fuera:#C9A63B; --nodisp:#42555C;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{margin:0;background:
      radial-gradient(1100px 500px at 15% -10%, rgba(241,55,70,0.08), transparent 60%),
      var(--bg);
    color:var(--text); font-family:'Inter',sans-serif; padding-bottom:60px;}
  .mono{font-family:'JetBrains Mono',monospace;}
  h1,h2,h3{font-family:'Rajdhani',sans-serif; text-transform:uppercase; letter-spacing:.04em; font-weight:700; margin:0;}

  .wordmark{
    text-align:center; font-family:'Rajdhani',sans-serif; font-weight:600; letter-spacing:.35em;
    font-size:12px; color:var(--brass-bright); padding:9px 0 7px; text-transform:uppercase;
    background:var(--bg); position:relative; z-index:31;
  }

  /* ---- Crisis banner (persistent, replaces normal nameplate accent) ---- */
  .crisis-banner{
    background:linear-gradient(180deg,#2B1418,#1E0F12);
    border-bottom:2px solid var(--burdeo-bright);
    padding:0; position:sticky; top:0; z-index:30;
  }
  .crisis-banner-inner{
    display:flex; align-items:center; justify-content:space-between; padding:16px 28px;
    max-width:1180px; margin:0 auto; flex-wrap:wrap; gap:12px;
  }
  .crisis-left{ display:flex; align-items:center; gap:14px;}
  .crisis-pulse{
    width:12px;height:12px;border-radius:50%; background:var(--burdeo-bright);
    box-shadow:0 0 0 0 rgba(241,55,70,0.6); animation:pulse 1.8s infinite; flex-shrink:0;
  }
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(241,55,70,0.55);}
    70%{box-shadow:0 0 0 10px rgba(241,55,70,0);}
    100%{box-shadow:0 0 0 0 rgba(241,55,70,0);}
  }
  .crisis-title h1{ font-size:20px; color:#F6DCE0; letter-spacing:.06em;}
  .crisis-title span{ font-size:11px; color:#C99BA3; letter-spacing:.1em; text-transform:uppercase; display:block; margin-top:2px;}
  .crisis-right{ display:flex; align-items:center; gap:16px;}
  .crisis-clock{ text-align:right; color:var(--text-muted); font-size:11.5px; line-height:1.3; padding-right:16px; border-right:1px solid rgba(255,255,255,0.15);}
  .crisis-clock strong{ display:block; color:var(--text); font-size:20px; font-family:'JetBrains Mono',monospace; letter-spacing:.02em;}
  .crisis-timer{ text-align:right; color:#C99BA3; font-size:11.5px; line-height:1.3;}
  .crisis-timer strong{ display:block; color:#F6DCE0; font-size:16px; font-family:'JetBrains Mono',monospace;}
  .btn-desactivar{
    background:transparent; border:1.5px solid #C99BA3; color:#F6DCE0;
    font-family:'Rajdhani'; font-weight:600; letter-spacing:.05em; text-transform:uppercase;
    font-size:12px; padding:9px 16px; border-radius:3px; cursor:pointer;
  }
  .btn-desactivar:hover{ background:rgba(255,255,255,0.06);}

  .wrap{ max-width:1180px; margin:0 auto; padding:22px 24px 0;}
  .demo-tag{ color:var(--text-dim); font-size:12px; margin-bottom:20px;}

  .visibilidad-note{
    background:var(--panel); border:1px solid var(--line); border-left:3px solid var(--brass);
    border-radius:4px; padding:13px 16px; margin-bottom:22px; font-size:12.5px; color:var(--text-muted); line-height:1.5;
  }
  .visibilidad-note b{ color:var(--brass-bright);}

  /* ---- Toolbar ---- */
  .toolbar{ display:flex; justify-content:space-between; align-items:center; margin-bottom:18px; flex-wrap:wrap; gap:12px;}
  .toolbar h2{ font-size:20px;}
  .toolbar-actions{ display:flex; gap:10px;}
  .btn-crear{
    background:var(--alerta); border:none; color:#241505;
    font-family:'Rajdhani'; font-weight:700; letter-spacing:.04em; text-transform:uppercase;
    font-size:13px; padding:11px 20px; border-radius:4px; cursor:pointer;
  }
  .btn-crear:hover{ filter:brightness(1.08);}
  .btn-reporte{
    background:transparent; border:1.5px solid var(--cyan); color:var(--cyan);
    font-family:'Rajdhani'; font-weight:700; letter-spacing:.04em; text-transform:uppercase;
    font-size:13px; padding:10px 20px; border-radius:4px; cursor:pointer;
  }
  .btn-reporte:hover{ background:rgba(73,233,255,0.08);}

  /* ---- Batallón card ---- */
  .batallones{ display:grid; grid-template-columns:repeat(3,1fr); gap:14px; align-items:start;}
  @media (max-width:900px){ .batallones{grid-template-columns:1fr;} }
  .batallon{ background:var(--panel); border:1px solid var(--line-strong); border-radius:6px; position:relative; overflow:hidden;}
  .batallon::before{ content:""; position:absolute; inset:5px; border:1px solid var(--brass-dim); border-radius:2px; pointer-events:none; opacity:.5;}

  .batallon-summary{ padding:14px 16px; cursor:pointer; display:flex; flex-direction:column; gap:8px;}
  .batallon-summary-top{ display:flex; justify-content:space-between; align-items:center; gap:8px;}
  .batallon-summary-top h3{ font-size:15px; margin:0; letter-spacing:.02em;}
  .estado-pill{
    font-family:'Rajdhani'; font-weight:700; font-size:10px; letter-spacing:.05em; text-transform:uppercase;
    padding:4px 9px; border-radius:3px; white-space:nowrap;
  }
  .estado-pill.emergencia{ background:var(--emergencia); color:#fff;}
  .estado-pill.disponible{ background:var(--servicio); color:#fff;}
  .estado-pill.rancho{ background:var(--fuera); color:#241505;}
  .batallon-summary-meta{ font-size:11.5px; color:var(--text-muted); line-height:1.4;}
  .batallon-summary-counts{ display:flex; gap:14px; font-size:11.5px; color:var(--text-dim); font-family:'JetBrains Mono',monospace;}
  .batallon-summary-counts b{ color:var(--brass-bright);}
  .expand-hint{ font-size:10.5px; color:var(--cyan); text-transform:uppercase; letter-spacing:.05em; margin-top:2px;}
  .btn-cerrar-batallon{
    background:transparent; border:1.5px solid var(--cyan); color:var(--cyan);
    font-family:'Rajdhani'; font-weight:700; letter-spacing:.04em; text-transform:uppercase;
    font-size:11px; padding:7px 14px; border-radius:4px; cursor:pointer; margin-bottom:12px; width:100%;
  }
  .btn-cerrar-batallon:hover{ background:rgba(73,233,255,0.08);}

  .batallon-head{ display:none;}
  .batallon-body{ display:none; padding:0 16px 18px; position:relative; border-top:1px solid var(--line); padding-top:16px;}
  .batallon.open .batallon-head{ display:flex; justify-content:space-between; align-items:center; padding:16px 16px 0; flex-wrap:wrap; gap:10px;}
  .batallon-head-right{ display:flex; align-items:center; gap:14px; flex-wrap:wrap;}
  .batallon.open .batallon-body{ display:block;}
  .batallon.open .batallon-summary{ display:none;}
  .batallon-nombre{ font-family:'Rajdhani'; font-weight:700; font-size:16px; background:transparent; border:none; color:var(--text); letter-spacing:.03em; text-transform:uppercase; width:150px;}
  .batallon-nombre:focus{ outline:none; border-bottom:1px solid var(--cyan);}
  .estado-select{ display:flex; gap:6px;}
  .estado-btn{
    font-family:'Rajdhani'; font-weight:600; font-size:11.5px; letter-spacing:.04em; text-transform:uppercase;
    padding:7px 13px; border-radius:3px; cursor:pointer; border:1.5px solid var(--line);
    background:var(--panel-alt); color:var(--text-muted);
  }
  .estado-btn.emergencia.on{ background:var(--emergencia); border-color:var(--emergencia); color:#fff;}
  .estado-btn.disponible.on{ background:var(--servicio); border-color:var(--servicio); color:#fff;}
  .estado-btn.rancho.on{ background:var(--fuera); border-color:var(--fuera); color:#241505;}

  .batallon-body{ padding:18px 20px 20px; position:relative;}
  .meta-row{ display:flex; flex-direction:column; gap:10px; margin-bottom:16px;}
  .meta-field{ width:100%;}
  .meta-field label{ display:block; font-size:10px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.08em; margin-bottom:6px;}
  .meta-field input{
    width:100%; background:var(--panel-alt); border:1px solid var(--line); border-radius:4px;
    padding:9px 12px; color:var(--text); font-size:13.5px;
  }
  .meta-field input:focus{ outline:none; border-color:var(--cyan);}

  .sub-block{ margin-bottom:16px;}
  .sub-block:last-child{ margin-bottom:0;}
  .sub-label{ font-size:10.5px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.08em; margin-bottom:8px;}
  .chip-list{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px; min-height:8px;}
  .chip{
    display:inline-flex; align-items:center; gap:7px; background:var(--panel-alt); border:1px solid var(--line-strong);
    border-radius:3px; padding:6px 10px; font-size:12.5px;
  }
  .chip.carro{ font-family:'JetBrains Mono',monospace; color:var(--brass-bright); border-color:var(--brass-dim);}
  .chip.bombero{ color:var(--text);}
  .chip .rol{ font-size:10px; color:var(--text-muted); text-transform:uppercase;}
  .chip button{ background:none; border:none; color:var(--text-dim); cursor:pointer; font-size:12px; padding:0;}
  .chip button:hover{ color:var(--emergencia);}

  .add-row{ display:flex; flex-direction:column; gap:7px;}
  .add-row input, .add-row select{
    background:var(--bg); border:1px dashed var(--line-strong); border-radius:4px;
    padding:8px 10px; color:var(--text); font-size:12.5px; width:100%;
  }
  .add-row input:focus, .add-row select:focus{ outline:none; border-color:var(--cyan); border-style:solid;}
  .add-row input.i-nom{ font-family:'JetBrains Mono',monospace;}
  .add-btn-mini{
    background:var(--cyan-dim); border:1px solid var(--cyan); color:#DFF7F9;
    font-size:12px; font-weight:600; padding:8px 14px; border-radius:4px; cursor:pointer; width:100%;
  }
  .add-btn-mini:hover{ filter:brightness(1.1);}

  .del-batallon{
    background:transparent; border:1.5px solid var(--burdeo-bright); color:var(--burdeo-bright);
    font-family:'Rajdhani'; font-weight:700; letter-spacing:.04em; text-transform:uppercase;
    font-size:11px; padding:7px 14px; border-radius:4px; cursor:pointer; white-space:nowrap;
  }
  .del-batallon:hover{ background:rgba(241,55,70,0.1);}

  .empty-state{ text-align:center; padding:50px 20px; color:var(--text-dim); font-size:13.5px;}

  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(12px);
    background:var(--panel-alt); border:1px solid var(--cyan); color:#DFF7F9;
    padding:13px 22px; border-radius:5px; font-size:13.5px; opacity:0; pointer-events:none;
    transition:all .25s; z-index:50; max-width:90vw;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0);}

  .modal-overlay{ position:fixed; inset:0; background:rgba(5,10,15,0.75); z-index:60; display:none; align-items:center; justify-content:center;}
  .modal-overlay.show{ display:flex;}
  .modal-box{ background:var(--panel); border:1.5px solid var(--burdeo-bright); border-radius:10px; padding:22px 24px; width:400px;}
  .modal-box h3{ font-family:'Rajdhani',sans-serif; font-size:15px; margin:0 0 8px; color:var(--text);}
  .modal-box p{ font-size:13px; color:var(--text-muted); margin:0 0 18px; line-height:1.5;}
  .modal-actions{ display:flex; gap:10px;}
  .modal-actions button{ flex:1; font-family:'Inter',sans-serif; font-weight:600; font-size:13px; padding:11px; border-radius:5px; cursor:pointer; border:none;}
  .modal-cancel{ background:transparent; border:1px solid var(--line-strong) !important; color:var(--text-muted);}
  .modal-confirm{ background:var(--burdeo); border:1px solid var(--burdeo-bright) !important; color:#fff;}
  .modal-confirm:hover{ background:var(--burdeo-bright);}
</style>

<link rel="stylesheet" href="vigor-tema.css">
<script src="vigor-tema.js" defer></script>
<style>
  html{ background:#030B13;}
  /* Tablero de batallones con el diseño de Vigor */
  .wrap{ padding-top:20px;}
  .toolbar h2{ font-family:'Montserrat',sans-serif; text-transform:none; letter-spacing:0; font-size:22px;}
  .resumen-crisis{ font-size:12px; color:var(--text-muted); margin-top:4px;}
  .btn-reporte, .btn-crear{ font-family:'Montserrat',sans-serif !important; text-transform:none !important; letter-spacing:0 !important; font-size:13px !important; font-weight:700; padding:11px 18px !important; border-radius:12px !important;}
  .btn-crear{ background:var(--vg-grad) !important; color:#030B13 !important; font-weight:800;}
  .batallones{ grid-template-columns:repeat(auto-fill, minmax(300px, 1fr)); gap:16px;}
  .bcard{ background:var(--panel); border:1.5px solid var(--line-strong); border-radius:16px; padding:16px 16px 12px 20px; cursor:pointer; position:relative; overflow:hidden; transition:border-color .15s, transform .15s;}
  .bcard::before{ content:""; position:absolute; left:0; top:0; bottom:0; width:5px; background:var(--servicio);}
  .bcard.emergencia::before{ background:var(--emergencia);}
  .bcard.rancho::before{ background:var(--alerta);}
  .bcard:hover{ border-color:var(--cyan); transform:translateY(-2px);}
  .bc-top{ display:flex; justify-content:space-between; align-items:center; gap:10px;}
  .bc-top h3{ font-family:'Montserrat',sans-serif; text-transform:none; letter-spacing:0; font-size:17px; margin:0; overflow-wrap:anywhere;}
  .estado-pill{ font-family:'Montserrat',sans-serif !important; border-radius:999px !important; font-size:10px !important; padding:4px 11px !important; letter-spacing:.03em;}
  .estado-pill.disponible{ color:#030B13;}
  .bc-meta{ font-size:12px; color:var(--text-muted); margin-top:8px; min-height:16px;}
  .bc-meta i{ color:var(--text-dim);}
  .bc-nums{ display:flex; gap:22px; margin-top:12px;}
  .bc-nums b{ display:block; font-size:26px; font-weight:800; line-height:1;}
  .bc-nums span{ font-size:10px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.08em;}
  .bc-carros{ display:flex; flex-wrap:wrap; gap:6px; margin-top:12px;}
  .bc-carro{ font-family:'JetBrains Mono',monospace; font-size:11px; font-weight:700; color:var(--cyan); border:1px solid var(--cyan-dim); border-radius:8px; padding:3px 9px;}
  .bc-mas{ font-size:11px; color:var(--text-dim); align-self:center;}
  .bc-abrir{ text-align:right; font-size:11.5px; color:var(--cyan); font-weight:700; margin-top:8px;}
  .vacio-crisis{ grid-column:1 / -1; text-align:center; padding:48px 20px; background:var(--panel); border:1.5px dashed var(--line-strong); border-radius:16px; color:var(--text-muted); font-size:13px; line-height:1.6;}
  .vacio-crisis b{ display:block; color:var(--text); font-size:15px; margin-bottom:4px;}
  .vc-ico{ font-size:34px; color:var(--line-strong); margin-bottom:8px;}

  /* Detalle del batallón */
  .bm-overlay{ position:fixed; inset:0; background:rgba(5,10,15,.78); z-index:70; display:none; align-items:center; justify-content:center; padding:18px;}
  .bm-overlay.show{ display:flex;}
  .bm-box{ background:var(--panel); border:1.5px solid var(--line-strong); border-radius:18px; padding:20px; width:100%; max-width:660px; max-height:92vh; overflow-y:auto;}
  .bm-head{ display:flex; align-items:center; gap:10px; margin-bottom:14px;}
  .bm-nombre{ flex:1; min-width:0; background:transparent; border:none; border-bottom:2px solid transparent; color:var(--text); font-family:'Montserrat',sans-serif; font-weight:800; font-size:22px; padding:4px 0;}
  .bm-nombre:hover{ border-bottom-color:var(--line-strong);}
  .bm-nombre:focus{ outline:none; border-bottom-color:var(--cyan);}
  .bm-x{ background:none; border:none; color:var(--text-dim); font-size:20px; cursor:pointer; padding:4px 8px;}
  .bm-x:hover{ color:var(--text);}
  .bm-estados{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:16px;}
  .bm-est{ font-family:'Montserrat',sans-serif; font-weight:700; font-size:13px; padding:12px 8px; border-radius:12px; cursor:pointer; background:var(--panel-alt); border:1.5px solid var(--line-strong); color:var(--text-muted);}
  .bm-est:hover{ border-color:var(--cyan); color:var(--text);}
  .bm-est.emergencia.on{ background:var(--emergencia); border-color:var(--emergencia); color:#fff;}
  .bm-est.disponible.on{ background:var(--servicio); border-color:var(--servicio); color:#030B13;}
  .bm-est.rancho.on{ background:var(--alerta); border-color:var(--alerta); color:#241505;}
  .bm-campos{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:18px;}
  .bm-campo label{ display:block; font-size:10px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.08em; margin-bottom:6px; font-weight:700;}
  .bm-campo input, .bm-add input{ width:100%; background:var(--panel-alt); border:1.5px solid var(--line-strong); border-radius:12px; padding:11px 13px; color:var(--text); font-size:13.5px; font-family:inherit;}
  .bm-campo input:focus, .bm-add input:focus{ outline:none; border-color:var(--cyan);}
  .bm-sec{ background:var(--panel-alt); border:1.5px solid var(--line-strong); border-radius:14px; padding:14px; margin-bottom:12px;}
  .bm-sec-t{ font-size:11px; color:var(--cyan); text-transform:uppercase; letter-spacing:.1em; font-weight:700; margin-bottom:10px; display:flex; align-items:center; gap:8px;}
  .bm-sec-t span, .bm-grupo-t span{ font-size:10px; border:1px solid currentColor; border-radius:9px; padding:1px 8px;}
  .bm-vacio{ font-size:12.5px; color:var(--text-dim); margin-bottom:10px;}
  .bm-grupo{ margin-bottom:10px;}
  .bm-grupo-t{ font-size:10.5px; color:var(--text-muted); text-transform:uppercase; letter-spacing:.07em; font-weight:700; margin-bottom:6px; display:flex; align-items:center; gap:8px;}
  .bm-chips{ display:flex; flex-wrap:wrap; gap:7px; margin-bottom:10px;}
  .bm-chip{ display:inline-flex; align-items:center; gap:8px; background:var(--panel); border:1px solid var(--line-strong); border-radius:999px; padding:4px 6px 4px 4px; font-size:12.5px; font-weight:600;}
  .bm-chip button{ background:none; border:none; color:var(--text-dim); cursor:pointer; font-size:12px; padding:2px 4px;}
  .bm-chip button:hover{ color:var(--emergencia);}
  .bm-av{ width:24px; height:24px; border-radius:50%; background:var(--vg-grad); color:#030B13; display:flex; align-items:center; justify-content:center; font-size:9.5px; font-weight:800;}
  .bm-chip.carro{ padding:5px 6px 5px 12px; border-color:var(--cyan-dim);}
  .bm-chip.carro b{ font-family:'JetBrains Mono',monospace; color:var(--cyan);}
  .bm-chip.carro i{ font-style:normal; font-size:11px; color:var(--text-muted); font-weight:500;}
  .bm-add{ display:grid; grid-template-columns:1fr 1.4fr auto; gap:8px; align-items:center;}
  .bm-add.col{ grid-template-columns:1fr; }
  .bm-add input.mono{ font-family:'JetBrains Mono',monospace;}
  .bm-roles{ display:grid; grid-template-columns:repeat(3,1fr); gap:6px;}
  .bm-rol{ font-family:'Montserrat',sans-serif; font-weight:700; font-size:12px; padding:10px 6px; border-radius:10px; cursor:pointer; background:var(--panel); border:1.5px solid var(--line-strong); color:var(--text-muted);}
  .bm-rol.on{ background:var(--vg-grad); border-color:transparent; color:#030B13;}
  .bm-mas{ font-family:'Montserrat',sans-serif; font-weight:800; font-size:12.5px; padding:11px 16px; border-radius:12px; cursor:pointer; border:none; color:#030B13; background:var(--vg-grad); white-space:nowrap;}
  .bm-mas:hover{ filter:brightness(1.08);}
  .bm-pie{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:16px; flex-wrap:wrap;}
  .bm-conf{ flex:1; min-width:200px; font-size:12.5px; color:#FFC9CE;}
  .bm-peligro, .bm-sec-btn, .bm-listo{ font-family:'Montserrat',sans-serif; font-weight:700; font-size:12.5px; padding:11px 18px; border-radius:12px; cursor:pointer;}
  .bm-peligro{ background:var(--burdeo); border:1.5px solid var(--burdeo-bright); color:#fff;}
  .bm-peligro.suave{ background:transparent; color:var(--burdeo-bright);}
  .bm-peligro:hover{ background:var(--burdeo-bright); color:#fff;}
  .bm-sec-btn{ background:transparent; border:1.5px solid var(--line-strong); color:var(--text-muted);}
  .bm-listo{ border:none; color:#030B13; font-weight:800; background:var(--vg-grad); padding:11px 30px;}
  @media (max-width:640px){
    .bm-overlay{ align-items:flex-end; padding:0;}
    .bm-box{ border-radius:18px 18px 0 0; max-height:94vh;}
    .bm-campos{ grid-template-columns:1fr;}
    .bm-add{ grid-template-columns:1fr;}
  }

  /* Reporte */
  #reporteImp{ display:none;}
  @media print{
    body{ background:#fff !important; color:#000 !important; padding:0 !important;}
    #vigor-banner, .wrap, .toast, .bm-overlay, .modal-overlay, .crisis-banner, .wordmark{ display:none !important;}
    #reporteImp{ display:block !important; padding:0; color:#000; font-family:'Montserrat',sans-serif;}
    #reporteImp h2{ font-size:20px; margin:0 0 4px; text-transform:none; letter-spacing:0; color:#000;}
    .rp-sub{ font-size:11px; color:#333; margin-bottom:16px;}
    .rp-bat{ border:1px solid #999; border-radius:8px; padding:10px 12px; margin-bottom:10px; break-inside:avoid;}
    .rp-bat h3{ font-size:14px; margin:0 0 6px; text-transform:none; letter-spacing:0; color:#000;}
    .rp-linea{ font-size:12px; margin:3px 0; color:#000;}
  }
</style>
</head>
<body>

  <div class="wordmark">VIGOR</div>
  <div class="crisis-banner">
    <div class="crisis-banner-inner">
      <div class="crisis-left">
        <div class="crisis-pulse"></div>
        <div class="crisis-title">
          <h1>Modo Crisis — Puesto de Mando</h1>
          <span id="ciaLabel">Vigor</span>
        </div>
      </div>
      <div class="crisis-right">
        <div class="crisis-clock">Hora actual<strong id="relojReal">00:00:00</strong></div>
        <div class="crisis-timer">Activo desde<strong id="timer">00:00:00</strong></div>
        <button class="btn-desactivar" onclick="confirmarDesactivarCrisis()">Desactivar Modo Crisis</button>
      </div>
    </div>
  </div>

  <div class="wrap">
    <div class="toolbar">
      <div><h2>Batallones</h2><div class="resumen-crisis" id="resumenCrisis"></div></div>
      <div class="toolbar-actions">
        <button class="btn-reporte" onclick="generarReporte()">Generar reporte</button>
        <button class="btn-crear" onclick="crearBatallon()">+ Crear Batallón</button>
      </div>
    </div>

    <div class="batallones" id="batallones"></div>

  </div>

  <datalist id="listaPersonas"></datalist>
  <div class="bm-overlay" id="bmOverlay" onclick="cerrarBatallon()"></div>
  <div id="reporteImp"></div>

  <div class="toast" id="toast"></div>

  <div class="modal-overlay" id="desactivarModal">
    <div class="modal-box">
      <h3>Desactivar Modo Crisis</h3>
      <p>¿Confirmar que deseas desactivar el Modo Crisis? Todos los Batallones activos deben estar cerrados antes de continuar.</p>
      <div class="modal-actions">
        <button class="modal-cancel" onclick="document.getElementById('desactivarModal').classList.remove('show')">Cancelar</button>
        <button class="modal-confirm" id="btnConfirmarDesactivar">Confirmar</button>
      </div>
    </div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="vigor-sesion.js"></script>
<script>
const SUPABASE_URL = 'https://mcfcfbtiruewlcejionr.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1jZmNmYnRpcnVld2xjZWppb25yIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzODExNzgsImV4cCI6MjEwMzk1NzE3OH0.9b_t63ah25RIGNn3pzZU3L553YUrrn7IXWW3MEjXuXU';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { persistSession: true, autoRefreshToken: true } });

let batallones = [];
let abiertos = new Set();
let miPuestoMandoId = null;
let fechaActivacion = null;
let elapsedBaseMs = 0;
let elapsedRefPerf = 0;

async function cargarDatos(){
  const { data: { session } } = await sb.auth.getSession();
  if(!session){ toast('Debes iniciar sesión primero'); return; }

  // Modo Crisis se abre exclusivamente desde el botón del PC del Cuartel
  // (pc_compania.html) — esa es una identidad institucional (companias.auth_user_id),
  // no una fila en "personal". Antes esto buscaba solo en "personal" y
  // siempre fallaba con "Esta sesión no pertenece a ninguna Compañía".
  const { data: pc } = await sb.rpc('pc_obtener_compania');
  const pcRow = Array.isArray(pc) ? pc[0] : pc;
  if(!pcRow){
    toast('Esta sesión no es un PC de Cuartel identificado — entra desde el botón "Modo Crisis" del PC del Cuartel');
    return;
  }
  const companiaId = pcRow.p_compania_id;
  document.getElementById('ciaLabel').textContent = `${pcRow.p_nombre} · ${pcRow.p_cuerpo_nombre}`;

  const { data: pmId, error } = await sb.rpc('activar_puesto_mando', { p_compania_id: companiaId });
  if(error){ toast('No se pudo activar el Puesto de Mando — ' + error.message); return; }
  miPuestoMandoId = pmId;

  const { data: pm } = await sb.from('puestos_mando').select('fecha_activacion').eq('id', miPuestoMandoId).single();
  fechaActivacion = new Date(pm.fecha_activacion);
  // El cronómetro no vuelve a comparar contra el reloj del sistema en cada
  // tick (si el reloj del dispositivo está aunque sea unos segundos atrasado
  // respecto al servidor, esa resta da negativa y queda clavado en 00:00:00
  // para siempre). Se calcula el desfasaje UNA sola vez acá y de ahí en
  // adelante se suma tiempo real transcurrido con performance.now(), que
  // nunca retrocede ni depende de la hora del sistema.
  elapsedBaseMs = Math.max(0, Date.now() - fechaActivacion.getTime());
  elapsedRefPerf = performance.now();

  await cargarBatallones();
  cargarSugerencias();
  suscribirRealtime();
}

// Modo Crisis es un tablero colaborativo — más de un Comandante puede
// estar viendo/editando el mismo Puesto de Mando activo a la vez.
let suscritoModoCrisis = false;
function suscribirRealtime(){
  if(suscritoModoCrisis || !miPuestoMandoId) return;
  suscritoModoCrisis = true;
  sb.channel('modo-crisis-' + miPuestoMandoId)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'batallones', filter: `puesto_mando_id=eq.${miPuestoMandoId}` }, () => cargarBatallones())
    .on('postgres_changes', { event: '*', schema: 'public', table: 'batallon_carros' }, () => cargarBatallones())
    .on('postgres_changes', { event: '*', schema: 'public', table: 'batallon_bomberos' }, () => cargarBatallones())
    .subscribe();
}

async function cargarBatallones(forzar){
  const { data } = await sb.from('batallones')
    .select('id, nombre, estado, frente_zona, responsable, batallon_carros(id, nomenclatura, procedencia), batallon_bomberos(id, nombre, rol)')
    .eq('puesto_mando_id', miPuestoMandoId).order('creado_en');
  batallones = (data || []).map(b => ({
    id: b.id, nombre: b.nombre, estado: b.estado, frente: b.frente_zona || '', responsable: b.responsable || '',
    carros: b.batallon_carros || [], bomberos: b.batallon_bomberos || []
  }));
  render(forzar);
}

// Nombres del Cuerpo para sugerir al escribir (opcional: si falla, se escribe a mano como antes)
let PERSONAS = [];
async function cargarSugerencias(){
  try{
    const { data } = await sb.from('personal').select('nombre_completo, cargo').neq('estado', 'dado_de_baja').order('nombre_completo').limit(1500);
    PERSONAS = data || [];
    const dl = document.getElementById('listaPersonas');
    if(dl) dl.innerHTML = PERSONAS.map(p => `<option value="${esc(p.nombre_completo)}">${esc(p.cargo || '')}</option>`).join('');
  }catch(e){ PERSONAS = []; }
}
function rolSugerido(cargo){
  if(/maquinista/i.test(cargo || '')) return 'Maquinista';
  if(/^(Director|Capit|Teniente|Ayudante)/i.test(cargo || '')) return 'Oficial';
  return 'Tripulante';
}

const ROLES = ['Oficial', 'Maquinista', 'Tripulante'];
const ROL_PLURAL = { Oficial:'Oficiales', Maquinista:'Maquinistas', Tripulante:'Tripulantes' };
const ESTADO_TXT = { emergencia:'En Emergencia', disponible:'Disponible', rancho:'Rancho' };
let abiertoId = null;
let rolSel = 'Tripulante';
let confirmandoEliminar = false;
const esc = (t) => String(t == null ? '' : t).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const inicialesDe = (n) => (n || '?').split(' ').filter(Boolean).slice(0, 2).map(p => p[0]).join('').toUpperCase();

async function crearBatallon(){
  const { data, error } = await sb.from('batallones').insert({ puesto_mando_id: miPuestoMandoId, nombre: `Batallón ${batallones.length+1}` }).select().single();
  if(error){ toast('No se pudo crear el batallón — ' + error.message); return; }
  abiertoId = data.id; confirmandoEliminar = false;
  await cargarBatallones(true);
}
async function eliminarBatallon(id){
  await sb.from('batallones').delete().eq('id', id);
  abiertoId = null; confirmandoEliminar = false;
  await cargarBatallones(true);
  toast('Batallón eliminado');
}
// Pasar un Batallón a «En Emergencia» funciona como un despacho: sus carros y bomberos pasan a emergencia y suena el celular de los bomberos asignados.
// Al volver a Disponible o Rancho, todo vuelve a como estaba.
async function setEstado(id, estado){
  const b = batallones.find(x => x.id === id); if(!b || b.estado === estado) return;
  const antes = b.estado;
  const { data, error } = await sb.rpc('batallon_cambiar_estado', { p_batallon_id: id, p_estado: estado });
  if(error){ toast('No se pudo cambiar el estado — ' + error.message); return; }
  b.estado = estado; render(true);
  if(estado === 'emergencia' && antes !== 'emergencia' && data){
    const partes = [];
    if(data.carros) partes.push(data.carros + (data.carros === 1 ? ' carro' : ' carros'));
    if(data.bomberos) partes.push(data.bomberos + (data.bomberos === 1 ? ' bombero' : ' bomberos'));
    let msg = 'Batallón en emergencia' + (partes.length ? ': ' + partes.join(' y ') + ' pasaron a emergencia' : '') + (data.alertados ? ' · ' + data.alertados + (data.alertados === 1 ? ' celular alertado' : ' celulares alertados') : '');
    if(data.sin_resolver && data.sin_resolver.length) msg += ' · No se encontraron en el sistema: ' + data.sin_resolver.join(', ');
    toast(msg);
  }
}
async function setNombre(id, val){
  val = (val || '').trim() || 'Batallón';
  await sb.from('batallones').update({ nombre: val }).eq('id', id);
  batallones.find(b=>b.id===id).nombre = val;
  renderTarjetas();
}
async function setMeta(id, campo, val){
  const columna = campo === 'frente' ? 'frente_zona' : 'responsable';
  await sb.from('batallones').update({ [columna]: val }).eq('id', id);
  batallones.find(b=>b.id===id)[campo] = val;
  renderTarjetas();
}
async function addCarro(id){
  const nomEl = document.getElementById('bm-carro-nom'), procEl = document.getElementById('bm-carro-proc');
  const nom = nomEl.value.trim(), proc = procEl.value.trim();
  if(!nom){ toast('Ingresa al menos la nomenclatura del carro'); nomEl.focus(); return; }
  const { error } = await sb.from('batallon_carros').insert({ batallon_id: id, nomenclatura: nom, procedencia: proc || 'Base' });
  if(error){ toast('No se pudo agregar el carro — ' + error.message); return; }
  await cargarBatallones(true);
  const n = document.getElementById('bm-carro-nom'); if(n) n.focus();
}
async function delCarro(id, carroId){
  await sb.from('batallon_carros').delete().eq('id', carroId);
  await cargarBatallones(true);
}
async function addBombero(id){
  const nomEl = document.getElementById('bm-bomb-nombre');
  const nombre = nomEl.value.trim();
  if(!nombre){ toast('Ingresa el nombre del bombero'); nomEl.focus(); return; }
  const { error } = await sb.from('batallon_bomberos').insert({ batallon_id: id, nombre, rol: rolSel });
  if(error){ toast('No se pudo agregar el bombero — ' + error.message); return; }
  await cargarBatallones(true);
  const n = document.getElementById('bm-bomb-nombre'); if(n) n.focus();
}
async function delBombero(id, bomberoId){
  await sb.from('batallon_bomberos').delete().eq('id', bomberoId);
  await cargarBatallones(true);
}
function elegirRol(rol){
  rolSel = rol; document.querySelectorAll('.bm-rol').forEach(b => b.classList.toggle('on', b.dataset.rol === rol));
  const n = document.getElementById('bm-bomb-nombre'); if(n) n.focus();   // para seguir escribiendo y agregar con Enter
}
function alEscribirNombre(el){
  const p = PERSONAS.find(x => x.nombre_completo === el.value.trim());
  if(p) elegirRol(rolSugerido(p.cargo));   // si es una persona del Cuerpo, propone su rol
}
function enter(ev, fn){ if(ev.key === 'Enter'){ ev.preventDefault(); fn(); } }

function abrirBatallon(id){ abiertoId = id; confirmandoEliminar = false; renderModal(true); }
function cerrarBatallon(){
  if(document.activeElement && document.activeElement.blur) document.activeElement.blur();
  abiertoId = null; confirmandoEliminar = false;
  document.getElementById('bmOverlay').classList.remove('show');
}
function pedirEliminar(){ confirmandoEliminar = true; renderModal(true); }
function cancelarEliminar(){ confirmandoEliminar = false; renderModal(true); }

// ---- Tarjetas ----
function render(forzar){
  renderTarjetas();
  if(abiertoId) renderModal(!!forzar);
}
function renderTarjetas(){
  const el = document.getElementById('batallones');
  const nC = batallones.reduce((s, b) => s + b.carros.length, 0), nB = batallones.reduce((s, b) => s + b.bomberos.length, 0);
  document.getElementById('resumenCrisis').textContent = batallones.length
    ? `${batallones.length} ${batallones.length === 1 ? 'batallón' : 'batallones'} · ${nC} carro${nC === 1 ? '' : 's'} · ${nB} bombero${nB === 1 ? '' : 's'}` : '';
  if(batallones.length === 0){
    el.innerHTML = `<div class="vacio-crisis"><div class="vc-ico">⚑</div><b>Todavía no hay batallones</b>Toca «+ Crear Batallón» para empezar a organizar los carros y el personal del evento.</div>`;
    return;
  }
  el.innerHTML = batallones.map(b => `
    <div class="bcard ${b.estado}" onclick="abrirBatallon('${b.id}')">
      <div class="bc-top"><h3>${esc(b.nombre)}</h3><span class="estado-pill ${b.estado}">${ESTADO_TXT[b.estado] || b.estado}</span></div>
      <div class="bc-meta">${b.frente ? esc(b.frente) : '<i>Sin frente asignado</i>'}${b.responsable ? ' · ' + esc(b.responsable) : ''}</div>
      <div class="bc-nums"><div><b>${b.carros.length}</b><span>carros</span></div><div><b>${b.bomberos.length}</b><span>bomberos</span></div></div>
      ${b.carros.length ? `<div class="bc-carros">${b.carros.slice(0, 6).map(c => `<span class="bc-carro">${esc(c.nomenclatura)}</span>`).join('')}${b.carros.length > 6 ? `<span class="bc-mas">+${b.carros.length - 6}</span>` : ''}</div>` : ''}
      <div class="bc-abrir">Abrir ›</div>
    </div>`).join('');
}

// ---- Detalle del batallón ----
function renderModal(forzar){
  const b = batallones.find(x => x.id === abiertoId);
  const ov = document.getElementById('bmOverlay');
  if(!b){ ov.classList.remove('show'); abiertoId = null; return; }
  // Si alguien está escribiendo en el detalle, un cambio de otra persona no le borra lo que lleva escrito
  const foco = document.activeElement;
  if(!forzar && ov.classList.contains('show') && foco && ov.contains(foco) && /INPUT/.test(foco.tagName)) return;
  const porRol = (rol) => b.bomberos.filter(p => p.rol === rol);
  const otros = b.bomberos.filter(p => !ROLES.includes(p.rol));
  const grupo = (titulo, lista) => lista.length ? `
    <div class="bm-grupo"><div class="bm-grupo-t">${titulo} <span>${lista.length}</span></div>
    <div class="bm-chips">${lista.map(p => `<span class="bm-chip"><span class="bm-av">${esc(inicialesDe(p.nombre))}</span>${esc(p.nombre)}<button onclick="delBombero('${b.id}','${p.id}')" title="Quitar">✕</button></span>`).join('')}</div></div>` : '';
  ov.innerHTML = `
    <div class="bm-box" onclick="event.stopPropagation()">
      <div class="bm-head">
        <input class="bm-nombre" value="${esc(b.nombre)}" onchange="setNombre('${b.id}', this.value)" onkeydown="enter(event, () => this.blur())" title="Toca para cambiar el nombre">
        <button class="bm-x" onclick="cerrarBatallon()" title="Cerrar">✕</button>
      </div>
      <div class="bm-estados">
        ${['emergencia', 'disponible', 'rancho'].map(e => `<button class="bm-est ${e} ${b.estado === e ? 'on' : ''}" onclick="setEstado('${b.id}','${e}')">${ESTADO_TXT[e]}</button>`).join('')}
      </div>
      <div class="bm-campos">
        <div class="bm-campo"><label>Frente / Zona</label><input value="${esc(b.frente)}" placeholder="Ej. Sector Norte" onchange="setMeta('${b.id}','frente',this.value)" onkeydown="enter(event, () => this.blur())"></div>
        <div class="bm-campo"><label>Responsable</label><input value="${esc(b.responsable)}" placeholder="Ej. Cap. R. Salinas" onchange="setMeta('${b.id}','responsable',this.value)" onkeydown="enter(event, () => this.blur())"></div>
      </div>

      <div class="bm-sec">
        <div class="bm-sec-t">Carros <span>${b.carros.length}</span></div>
        ${b.carros.length ? `<div class="bm-chips">${b.carros.map(c => `<span class="bm-chip carro"><b>${esc(c.nomenclatura)}</b><i>${esc(c.procedencia)}</i><button onclick="delCarro('${b.id}','${c.id}')" title="Quitar">✕</button></span>`).join('')}</div>` : '<div class="bm-vacio">Aún no hay carros en este batallón.</div>'}
        <div class="bm-add">
          <input id="bm-carro-nom" class="mono" placeholder="Carro (Ej. F-3)" onkeydown="enter(event, () => addCarro('${b.id}'))">
          <input id="bm-carro-proc" placeholder="Procedencia (Ej. 1ª Compañía)" onkeydown="enter(event, () => addCarro('${b.id}'))">
          <button class="bm-mas" onclick="addCarro('${b.id}')">+ Agregar carro</button>
        </div>
      </div>

      <div class="bm-sec">
        <div class="bm-sec-t">Bomberos <span>${b.bomberos.length}</span></div>
        ${b.bomberos.length ? grupo('Oficiales', porRol('Oficial')) + grupo('Maquinistas', porRol('Maquinista')) + grupo('Tripulantes', porRol('Tripulante')) + grupo('Otros', otros) : '<div class="bm-vacio">Aún no hay bomberos en este batallón.</div>'}
        <div class="bm-add col">
          <input id="bm-bomb-nombre" list="listaPersonas" placeholder="Nombre del bombero" autocomplete="off" oninput="alEscribirNombre(this)" onkeydown="enter(event, () => addBombero('${b.id}'))">
          <div class="bm-roles">${ROLES.map(r => `<button class="bm-rol ${rolSel === r ? 'on' : ''}" data-rol="${r}" onclick="elegirRol('${r}')">${r}</button>`).join('')}</div>
          <button class="bm-mas" onclick="addBombero('${b.id}')">+ Agregar bombero</button>
        </div>
      </div>

      <div class="bm-pie">
        ${confirmandoEliminar
          ? `<span class="bm-conf">¿Eliminar «${esc(b.nombre)}» con sus carros y bomberos?</span><button class="bm-sec-btn" onclick="cancelarEliminar()">No</button><button class="bm-peligro" onclick="eliminarBatallon('${b.id}')">Sí, eliminar</button>`
          : `<button class="bm-peligro suave" onclick="pedirEliminar()">Eliminar batallón</button><button class="bm-listo" onclick="cerrarBatallon()">Listo</button>`}
      </div>
    </div>`;
  ov.classList.add('show');
}
document.addEventListener('keydown', (e) => { if(e.key === 'Escape' && abiertoId) cerrarBatallon(); });

// ---- Reporte (se imprime o se guarda como PDF) ----
function generarReporte(){
  const hora = new Date().toLocaleString('es-CL');
  document.getElementById('reporteImp').innerHTML = `
    <h2>Reporte de Modo Crisis — Puesto de Mando</h2>
    <div class="rp-sub">${esc(document.getElementById('ciaLabel').textContent)} · Emitido el ${esc(hora)} · Activo hace ${esc(document.getElementById('timer').textContent)}</div>
    ${batallones.map(b => `
      <div class="rp-bat">
        <h3>${esc(b.nombre)} — ${ESTADO_TXT[b.estado] || b.estado}</h3>
        <div class="rp-linea"><b>Frente / Zona:</b> ${esc(b.frente || '—')} &nbsp;·&nbsp; <b>Responsable:</b> ${esc(b.responsable || '—')}</div>
        <div class="rp-linea"><b>Carros (${b.carros.length}):</b> ${b.carros.length ? b.carros.map(c => esc(c.nomenclatura) + ' (' + esc(c.procedencia) + ')').join(', ') : '—'}</div>
        ${ROLES.map(r => { const l = b.bomberos.filter(p => p.rol === r); return l.length ? `<div class="rp-linea"><b>${ROL_PLURAL[r]} (${l.length}):</b> ${l.map(p => esc(p.nombre)).join(', ')}</div>` : ''; }).join('')}
        ${(() => { const l = b.bomberos.filter(p => !ROLES.includes(p.rol)); return l.length ? `<div class="rp-linea"><b>Otros (${l.length}):</b> ${l.map(p => esc(p.nombre) + ' (' + esc(p.rol) + ')').join(', ')}</div>` : ''; })()}
      </div>`).join('') || '<p>Sin batallones.</p>'}`;
  window.print();
}

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2600);
}

function confirmarDesactivarCrisis(){
  document.getElementById('desactivarModal').classList.add('show');
}
document.getElementById('btnConfirmarDesactivar').addEventListener('click', async () => {
  const { error } = await sb.rpc('desactivar_puesto_mando', { p_puesto_mando_id: miPuestoMandoId });
  document.getElementById('desactivarModal').classList.remove('show');
  if(error){ toast('No se pudo desactivar — hay Batallones en "En Emergencia", cambia su estado primero'); return; }
  toast('Modo Crisis desactivado — volviendo al PC del Cuartel');
  setTimeout(() => { window.location.href = 'pc_compania.html'; }, 700);
});

// timer — cuenta desde la activación real del Puesto de Mando (fila en
// puestos_mando), no desde que se abrió esta pestaña.
function tickTimer(){
  if(!fechaActivacion) return;
  const s = Math.floor((elapsedBaseMs + (performance.now() - elapsedRefPerf)) / 1000);
  const hh = String(Math.floor(s/3600)).padStart(2,'0');
  const mm = String(Math.floor((s%3600)/60)).padStart(2,'0');
  const ss = String(s%60).padStart(2,'0');
  document.getElementById('timer').textContent = `${hh}:${mm}:${ss}`;
}
setInterval(tickTimer,1000);

function tickRelojReal(){
  document.getElementById('relojReal').textContent = new Date().toLocaleTimeString('es-CL', {hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:false});
}
tickRelojReal();
setInterval(tickRelojReal, 1000);

cargarDatos();
</script>
