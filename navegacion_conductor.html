<!DOCTYPE html>
<html lang="es">
<head>
<meta name="robots" content="noindex, nofollow, noarchive">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VIGOR - Gestiona tu compañía de forma eficiente</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon-32.png?v=2" sizes="32x32" type="image/png">
<link rel="icon" href="icons/favicon-16.png?v=2" sizes="16x16" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=2">
<meta name="theme-color" content="#030B13">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Vigor">
<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}</script>
<style>
/* Pantalla del conductor — mapa a pantalla completa con banner de despacho; el panel de mando se despliega a la derecha.
   Mismo lenguaje que Vigor: Montserrat, paleta azul oscura, ángulos rectos, relojes de 7 segmentos, rojo de emergencia #F13746. */
@font-face{font-family:'DSEG7';src:url('https://cdn.jsdelivr.net/npm/dseg@0.46.0/fonts/DSEG7-Classic/DSEG7Classic-Bold.woff2') format('woff2');font-weight:700;font-style:normal;font-display:swap}
:root{
  --bg:#030B13;--p:#061520;--c:#091D2C;--l:#0F2A3B;--l2:#153A52;
  --cy:#2DD3DB;--rj:#F13746;--vd:#3CF29A;--az:#34B8FF;--am:#FFC247;--tx:#EAF6FB;--mu:#8FB0C2;--bl:#1C6EE6;
  --pw:510px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);overflow:hidden;-webkit-font-smoothing:antialiased;font-family:'Montserrat','Segoe UI',sans-serif}
button{font-family:inherit;color:inherit}
#stage{position:relative;width:100%;height:100%;overflow:hidden;background:var(--bg)}
#map{position:absolute;inset:0}
.maplibregl-ctrl-bottom-left,.maplibregl-ctrl-bottom-right{display:none}
#fade{position:absolute;left:0;right:0;top:0;height:40%;background:linear-gradient(to bottom,var(--bg) 8%,rgba(3,11,19,0));pointer-events:none;z-index:850}
.meMk{width:86px;height:86px;z-index:5;pointer-events:none}
.meMk svg{width:86px;height:86px;overflow:visible}
.meMk .onda,.uMk .onda{transform-box:fill-box;transform-origin:center;animation:late 1.6s ease-out infinite;opacity:0}
.meMk .o2,.uMk .o2{animation-delay:.8s}
.uMk{width:86px;height:86px;z-index:4;pointer-events:none}
.uMk svg{width:86px;height:86px;overflow:visible;transform:scale(var(--esc,1))}
.lejos .uMk svg{transform:scale(.45)}
.lejos .uMk .nom{top:40px}
.uMk .nom{position:absolute;left:50%;top:62px;transform:translateX(-50%);font:700 11px 'Montserrat',sans-serif;color:#fff;background:rgba(3,11,19,.92);border:1px solid var(--l2);padding:1px 8px;white-space:nowrap}
.meMk .punto,.uMk .punto{transform-box:fill-box;transform-origin:center;animation:latido 1.6s ease-in-out infinite}
@keyframes late{0%{transform:scale(1);opacity:.55}100%{transform:scale(3.2);opacity:0}}
@keyframes latido{0%,100%{transform:scale(1)}50%{transform:scale(1.14)}}
.dseg{font-family:'DSEG7',monospace;font-weight:700;letter-spacing:.06em;color:var(--cy)}
.lab{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--mu);font-weight:600}
.num{font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.num small{font-size:.42em;font-weight:600;margin-left:.2em;color:var(--mu)}

/* ---- gotas del mapa ---- */
.mk{width:34px;height:34px;pointer-events:none}   /* sin position: la fija MapLibre (absolute) y así cada punto queda sobre su coordenada */
.g{position:absolute;inset:0}
.g b{position:absolute;left:3px;top:0;width:28px;height:28px;background:var(--k);border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:2px solid #030B13;display:grid;place-items:center}
.g b i{transform:rotate(45deg);font-size:15px;color:#030B13;line-height:1}
.g.big{width:46px;height:46px;inset:auto;left:-6px;top:-12px}
.g.big b{left:4px;width:38px;height:38px}.g.big b i{font-size:21px}
.mk .lb{position:absolute;left:50%;top:38px;transform:translateX(-50%);font:600 10px 'Montserrat',sans-serif;color:var(--tx);background:rgba(3,11,19,.88);border:1px solid var(--l2);padding:1px 7px;white-space:nowrap}
.mk .lb:empty{display:none}
/* los íconos se achican al alejar el zoom y, muy lejos, quedan como puntos de su color */
.mk .g{transform:scale(var(--esc,1));transform-origin:50% 100%}
.mk .lb{opacity:calc((var(--esc,1) - .62) * 5)}
.pt{display:none;position:absolute;left:50%;bottom:-5px;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:var(--k);border:1.5px solid #030B13}
.pt.gr{width:16px;height:16px;margin-left:-8px;bottom:-8px}
.lejos .mk .g,.lejos .mk .lb,.lejos .pul{display:none}
.lejos .mk .pt{display:block}
.pul{position:absolute;left:50%;top:50%;width:60px;height:60px;margin:-34px 0 0 -30px;border-radius:50%;background:var(--rj);opacity:.3;animation:pu 1.6s ease-out infinite;pointer-events:none}
@keyframes pu{0%{transform:scale(.4);opacity:.5}100%{transform:scale(1.5);opacity:0}}

/* ---- banner de despacho (panel recogido) ---- */
#ban{position:absolute;left:0;right:0;top:0;height:88px;z-index:1000;display:flex;align-items:center;gap:18px;padding:0 22px;
  background:linear-gradient(180deg,#B21F2E 0%,#74101B 62%,#4D0A13 100%);border-bottom:3px solid var(--rj);box-shadow:0 8px 34px rgba(241,55,70,.30)}
#ban img{height:46px;width:auto;display:block}
#ban .sep{width:2px;height:34px;background:rgba(255,194,200,.35);flex:none}
#ban .t1{font-weight:800;font-size:24px;text-shadow:0 0 18px rgba(241,55,70,.55);line-height:1.1}
#ban .t2{font-size:14px;color:#ffd0d4;margin-top:3px}
#ban .tr{margin-left:auto;text-align:right;flex:none}
#ban .tr .lab{color:#ffc2c8}
#ban .tr .dseg{font-size:30px;color:#fff;display:block;margin-top:2px}
#ban .txt{min-width:0}#ban .t1,#ban .t2{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---- tarjetas ---- */
.pnl{background:rgba(6,21,32,.94);border:1px solid var(--l2)}
#grif{position:absolute;right:24px;top:110px;width:300px;padding:12px 16px;z-index:1000;font-size:12px}
#grif .row{display:flex;justify-content:space-between;padding:3px 0;gap:10px}
#grif .row i{color:var(--az);margin-right:6px}
#al{position:absolute;z-index:1000;display:none;align-items:center;gap:10px;font-size:14px;font-weight:600;padding:10px 16px;border-left:5px solid var(--k,#FFC247);background:color-mix(in srgb,var(--k,#FFC247) 20%,#061520);color:var(--k,#FFC247);width:min(400px,92vw)}
#al i{font-size:22px}
body:not(.abierto) #al{left:24px;top:110px}
body.abierto #al{left:18px;top:106px;width:330px}

#man{position:absolute;left:18px;top:18px;width:330px;z-index:1000;background:var(--bl);padding:12px 16px;display:none;align-items:center;gap:14px}
#man i{font-size:48px;line-height:1;flex:none}
#man .num{font-size:34px}#man .num small{color:#cfe0ff}
#man .calle{font-size:12px;margin-top:4px}
#vsq{position:absolute;left:18px;bottom:18px;z-index:1000;display:none;gap:10px;align-items:center}
#vsq .box{width:78px;height:78px;background:var(--p);border:2px solid var(--cy);display:grid;place-content:center;text-align:center}
#vsq .box.exc{border-color:var(--rj)}
#vsq .box .num{font-size:28px}#vsq .box span{font-size:9px;color:var(--mu)}
.lim{display:none;place-items:center;background:#fff;border:6px solid var(--rj);color:#111;border-radius:50%;font-weight:800;width:48px;height:48px;font-size:16px;flex:none}

/* ---- datos de ruta (panel recogido): rectángulo oscuro compacto, sin bordes, abajo a la derecha ---- */
#dock{position:absolute;right:24px;bottom:24px;z-index:1000;display:grid;grid-template-columns:auto auto auto;align-items:center;background:var(--p);border:none}
#dock .m{display:flex;align-items:center;gap:12px;padding:12px 18px 12px 16px}
#dock .m i{font-size:38px;color:var(--cy);line-height:1;flex:none}
#dock .m .num{font-size:30px}
#dock .m .calle{font-size:12px;margin-top:4px;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#dock .v{display:grid;place-content:center;text-align:center;padding:12px 18px}
#dock .v .num{font-size:28px}
#dock .v .lab{margin-top:3px;font-size:9px}
#dock .v .lm{font-size:10px;color:var(--rj);font-weight:700;margin-top:3px;min-height:12px}
#dock .e{padding:12px 16px 12px 18px}
#dock .e .lab{font-size:9px}
#dock .e .num{font-size:22px;display:block;margin-top:3px}
#dock .e .sub{font-size:11px;color:var(--mu);margin-top:3px}
#dock .e .sub .dseg{font-size:10px}

/* ---- botones ---- */
#btns{position:absolute;z-index:1000;display:flex;flex-direction:column;gap:8px}
.bt{width:50px;height:50px;display:grid;place-items:center;background:rgba(6,21,32,.94);border:1px solid var(--l2);cursor:pointer;padding:0;color:var(--tx)}
.bt:hover{border-color:var(--cy)}.bt:focus-visible{outline:2px solid var(--cy);outline-offset:2px}
.bt i{font-size:22px}.bt.rep{color:var(--am)}
.bt[hidden]{display:none}
.bt.ctr{border-color:var(--cy);color:var(--cy);background:rgba(6,21,32,.98)}
body:not(.abierto) #btns{left:24px;bottom:24px}
body.abierto #btns{right:calc(var(--pw) + 14px);bottom:18px}

/* ---- panel de mando (desplegable) ---- */
#panel{position:absolute;right:0;top:0;bottom:0;width:var(--pw);z-index:1100;background:var(--p);border-left:1px solid var(--l2);transform:translateX(100%);transition:transform .3s;display:flex;flex-direction:column;overflow:hidden}
body.abierto #panel{transform:none}
#panel .hd{height:56px;flex:none;display:flex;align-items:center;gap:12px;padding:0 20px;background:linear-gradient(180deg,#07192A,#030B13);border-bottom:1px solid var(--l)}
#panel .hd img{height:34px;width:auto}#panel .hd b{font-size:15px}#panel .hd .dseg{margin-left:auto;font-size:20px}
#panel .cuerpo{padding:18px 20px;overflow:auto;flex:1}
#panel .desp{background:linear-gradient(180deg,#B21F2E,#74101B);border-bottom:3px solid var(--rj);padding:16px 20px;margin-bottom:18px}
#panel .desp .lab{color:#ffc2c8}
#panel .desp .dir{font-size:22px;font-weight:700;margin-top:6px}
#panel .desp .kp{display:flex;gap:26px;margin-top:12px;align-items:flex-end}
#panel .desp .kp .num{font-size:24px}#panel .desp .kp>div>small{display:block;font-size:12px;font-weight:500;color:#ffc2c8;margin:2px 0 0}
#panel .desp .kp .dseg{font-size:20px;color:#fff}
#panel .desp .rn{font-size:12px;color:#ffd0d4;margin-top:12px;line-height:1.4}
#panel .desp .rn:empty{display:none}
#panel h4{margin:0 0 8px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--mu);font-weight:600}
#panel .lista{display:grid;gap:6px;margin-bottom:16px}
#panel .it{display:flex;gap:12px;align-items:center;background:var(--c);border:1px solid var(--l2);padding:9px 14px;font-size:14px}
#panel .it .d{margin-left:auto;color:var(--mu);font-size:13px;text-align:right}
#panel .it i{font-size:20px;color:var(--az)}
#panel button.it{width:100%;text-align:left;cursor:pointer;font-family:inherit;color:var(--tx)}
#panel button.it:hover{border-color:var(--cy)}
#panel button.it:focus-visible{outline:2px solid var(--cy);outline-offset:2px}
#panel button.it.sel{border-color:var(--cy);background:rgba(45,211,219,.1)}
#panel .it.off{opacity:.5;cursor:default}
#panel .it .rj{width:10px;height:10px;border-radius:50%;background:var(--rj);flex:none}
#panel .it.off .rj{background:var(--mu)}
#panel .it .ver{font-size:18px;color:var(--cy);margin-left:10px}
#panel .vacio{color:var(--mu);font-size:13px;padding:6px 2px}

/* pestaña para desplegar / recoger */
#tab{position:absolute;z-index:1200;top:50%;transform:translateY(-50%);width:44px;height:150px;background:var(--p);border:1px solid var(--l2);border-right:none;border-top:3px solid var(--cy);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;cursor:pointer;padding:0;right:0;transition:right .3s}
#tab i{font-size:22px;color:var(--cy)}
#tab span{writing-mode:vertical-rl;transform:rotate(180deg);font-weight:700;font-size:11px;letter-spacing:.14em;color:var(--mu)}
#tab:hover{background:var(--c)}
body.abierto #tab{right:var(--pw)}
body.abierto #tab .c{display:none}body:not(.abierto) #tab .o{display:none}

/* ---- mensaje ---- */
#msg{position:absolute;left:50%;top:18px;transform:translateX(-50%);max-width:min(560px,92vw);text-align:center;font-weight:600;font-size:14px;background:rgba(6,21,32,.96);border:1px solid var(--l2);border-top:3px solid var(--cy);padding:11px 18px;display:none;z-index:1300}
#msg.show{display:block}
#msg small{display:block;color:var(--mu);font-size:12px;margin-top:3px;font-weight:500}

/* ---- estados ---- */
body.sin-ruta #ban,body.sin-ruta #dock,body.sin-ruta #grif,body.sin-ruta #panel,body.sin-ruta #tab,body.sin-ruta #man,body.sin-ruta #vsq,body.sin-ruta #al{display:none!important}
body.sin-ruta #btns{left:24px;bottom:24px}
body.abierto #ban,body.abierto #grif,body.abierto #dock{display:none}
body.abierto:not(.sin-ruta) #man{display:flex}
body.abierto:not(.sin-ruta) #vsq{display:flex}
body.abierto #fade{right:var(--pw)}

/* ---- vertical (celular en vertical) ---- */
@media (max-aspect-ratio:1/1){
  :root{--ph:54%}
  #ban{height:70px;padding:0 14px;gap:12px}#ban img{height:34px}#ban .t1{font-size:17px}#ban .t2{font-size:11px}#ban .tr .dseg{font-size:20px}
  #grif{display:none}
  #dock{right:12px;bottom:12px}
  #dock .m{padding:9px 12px 9px 10px;gap:8px}#dock .m i{font-size:30px}#dock .m .num{font-size:24px}#dock .m .calle{font-size:10px;max-width:100px}
  #dock .v{padding:9px 10px}#dock .v .num{font-size:22px}#dock .e{padding:9px 10px 9px 12px}#dock .e .num{font-size:17px}#dock .e .sub{font-size:10px}#dock .e .sub .dseg{display:none}
  body:not(.abierto) #al{left:12px;top:82px;width:calc(100% - 24px)}
  body:not(.abierto) #btns{left:12px;bottom:12px}
  #panel{top:auto;left:0;width:auto;height:var(--ph);border-left:none;border-top:1px solid var(--l2);transform:translateY(100%)}
  body.abierto #panel{transform:none}
  body.abierto #btns{right:12px;left:auto;bottom:calc(var(--ph) + 12px)}
  #man{left:12px;top:12px;width:calc(100% - 24px)}
  body.abierto #al{left:12px;top:92px;width:calc(100% - 24px)}
  #vsq{left:12px;bottom:calc(var(--ph) + 12px)}
  #tab{top:auto;bottom:190px;transform:none;right:auto;left:12px;width:132px;height:36px;flex-direction:row;border:1px solid var(--l2);border-bottom:none;border-top:3px solid var(--cy);transition:bottom .3s}
  #tab span{writing-mode:horizontal-tb;transform:none}
  #tab i{transform:rotate(90deg)}
  body.abierto #tab{left:auto;right:12px;bottom:var(--ph)}
  body.abierto #fade{right:0}
}
@media (prefers-reduced-motion:reduce){.pul,.meMk .onda,.meMk .punto,.uMk .onda,.uMk .punto{animation:none}#panel,#tab{transition:none}}
</style>
</head>
<body class="sin-ruta">
<div id="stage">
  <div id="map"></div>
  <div id="fade"></div>

  <!-- banner rojo de despacho -->
  <div id="ban">
    <img src="img/logo.png" alt="Vigor">
    <div class="sep"></div>
    <div class="txt"><div class="t1" data-f="titulo">Despacho</div><div class="t2" data-f="subt">—</div></div>
    <div class="tr"><div class="lab">Tiempo en ruta</div><span class="dseg" id="tRuta">00:00:00</span></div>
  </div>

  <div id="grif" class="pnl"><div class="lab" style="margin-bottom:8px">Grifos cerca del siniestro</div><div id="grifL"></div></div>
  <div id="al" role="status"><i class="ti ti-alert-triangle" id="ai" aria-hidden="true"></i><span id="at"></span></div>

  <!-- panel desplegado: maniobra y velocidad sobre el mapa -->
  <div id="man"><i class="ti ti-corner-up-right" data-f="ic" aria-hidden="true"></i><div><div class="num" data-f="d1">—</div><div class="calle" data-f="d2">—</div></div></div>
  <div id="vsq"><div class="lim" data-f="lim" aria-label="Límite de velocidad">50</div><div class="box" data-f="box"><div class="num" data-f="vel">0</div><span>km/h</span></div></div>

  <!-- tablero inferior (panel recogido) -->
  <div id="dock">
    <div class="m"><i class="ti ti-corner-up-right" data-f="ic" aria-hidden="true"></i><div><div class="num" data-f="d1">—</div><div class="calle" data-f="d2">—</div></div></div>
    <div class="v"><div class="num" data-f="vel">0</div><div class="lab">km/h</div><div class="lm" data-f="lm"></div></div>
    <div class="e"><div class="lab">Llegada</div><b class="num" data-f="eM">—</b><div class="sub"><span data-f="eK">—</span> · <span class="dseg" data-f="eH">--:--</span></div></div>
  </div>

  <div id="btns">
    <button class="bt ctr" id="b4" aria-label="Volver a centrar el mapa en tu vehículo" hidden><i class="ti ti-current-location"></i></button>
    <button class="bt" id="b1" aria-label="Inicio"><i class="ti ti-home"></i></button>
    <button class="bt" id="b2" aria-label="Buscar punto"><i class="ti ti-search"></i></button>
    <button class="bt rep" id="b3" aria-label="Agregar punto al mapa"><i class="ti ti-plus"></i></button>
  </div>

  <!-- panel de mando desplegable -->
  <aside id="panel" aria-label="Panel de despacho">
    <div class="hd"><img src="img/logo.png" alt="Vigor"><b id="pUnit">En ruta</b><span class="dseg" id="clock">--:--</span></div>
    <div class="cuerpo">
      <div class="desp"><div class="lab" data-f="tipo">Despacho</div><div class="dir" data-f="dir">—</div>
        <div class="kp"><div><b class="num" data-f="eM">—</b><small>llegada</small></div><div><b class="num" data-f="eK">—</b><small>distancia</small></div><div><b class="dseg" data-f="eH">--:--</b><small>hora</small></div></div><div class="rn" data-f="rnota"></div></div>
      <h4>Unidades en ruta</h4><div class="lista" id="uniL"></div>
      <h4>Grifos cercanos al siniestro</h4><div class="lista" id="grifP"></div>
    </div>
  </aside>
  <button id="tab" aria-label="Mostrar u ocultar el panel de despacho" aria-expanded="false"><i class="ti ti-chevron-left c"></i><i class="ti ti-chevron-right o"></i><span class="c">DESPACHO</span><span class="o">OCULTAR</span></button>

  <div id="msg" role="status"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="vigor-sesion.js"></script>
<script src="vigor-config.js"></script>
<script>
(function(){
'use strict';

/* =====================  Configuración  ===================== */
const C = Object.assign({
  MAPA_ESTILO_URL:'', MAPA_TILEJSON:'https://tiles.openfreemap.org/planet',
  MAPA_GLYPHS:'https://tiles.openfreemap.org/fonts/{fontstack}/{range}.pbf', MAPA_FUENTE_TEXTO:'Noto Sans Regular',
  CENTRO_DEFECTO:[-72.6636,-36.8236],
  RUTEO_PROVEEDOR:'valhalla', RUTEO_URL:'https://valhalla1.openstreetmap.de', RUTEO_PESO_T:0, RUTEO_ALTERNATIVAS:2,
  DEMO_DESTINO:[-72.6900,-36.7800]
}, window.VIGOR_CONFIG || {});
const $ = id => document.getElementById(id);

/* =====================  Geometría  ===================== */
const RAD = Math.PI/180, RT = 6371008.8;
function dist(a,b){ const dLa=(b[1]-a[1])*RAD, dLo=(b[0]-a[0])*RAD, la1=a[1]*RAD, la2=b[1]*RAD;
  const h=Math.sin(dLa/2)**2+Math.cos(la1)*Math.cos(la2)*Math.sin(dLo/2)**2; return 2*RT*Math.asin(Math.sqrt(h)); }
function rumbo(a,b){ const la1=a[1]*RAD, la2=b[1]*RAD, dLo=(b[0]-a[0])*RAD;
  return (Math.atan2(Math.sin(dLo)*Math.cos(la2), Math.cos(la1)*Math.sin(la2)-Math.sin(la1)*Math.cos(la2)*Math.cos(dLo))/RAD+360)%360; }
const difAng = (a,b) => ((a-b+540)%360)-180;
function decodificarPolilinea(str, prec){
  let i=0, lat=0, lng=0; const f=Math.pow(10,prec||6), out=[];
  while(i<str.length){ let b,s=0,r=0;
    do{ b=str.charCodeAt(i++)-63; r|=(b&31)<<s; s+=5; }while(b>=32); lat+=(r&1)?~(r>>1):(r>>1);
    s=0; r=0; do{ b=str.charCodeAt(i++)-63; r|=(b&31)<<s; s+=5; }while(b>=32); lng+=(r&1)?~(r>>1):(r>>1);
    out.push([lng/f,lat/f]); }
  return out;
}

/* =====================  Ruta más corta en kilómetros  =====================
   Criterio principal: la menor distancia (km). No se usan las medidas del vehículo; solo el peso, si está configurado.
   Algoritmo:
     1. Se piden en paralelo varias candidatas al motor de rutas, todas con el costo «solo distancia» (shortest):
        A) perfil camión con el peso (más hasta 2 alternativas que ofrece el motor)  B) perfil auto, sin peso (referencia).
     2. De cada candidata se toma su distancia real; se descartan las que fallan.
     3. Gana la de menos kilómetros (si empatan en menos de 100 m, la de menos tiempo).
     4. Si la ganadora no respeta el peso y la mejor que sí lo respeta es más larga, se deja el aviso con la diferencia. */
function leerViaje(trip, fuente){
  const leg = trip && trip.legs && trip.legs[0]; if(!leg) return null;
  return {
    fuente, coords: decodificarPolilinea(leg.shape, 6),
    maniobras: leg.maneuvers.map(m => ({ idx:m.begin_shape_index, tipo:m.type, via:(m.street_names && m.street_names[0]) || '', texto:m.instruction || '', metros:(m.length||0)*1000, seg:m.time||0, lim:m.speed_limit||null })),
    metros:(trip.summary.length||0)*1000, seg:trip.summary.time||0
  };
}
async function candidatas(origen, destino, costing, opciones, alternativas, fuente){
  const cuerpo = { locations:[{lat:origen[1],lon:origen[0]},{lat:destino[1],lon:destino[0]}], costing, costing_options:{ [costing]: Object.assign({ shortest:true }, opciones||{}) },
                   directions_options:{ language:'es-ES', units:'kilometers' } };
  if(alternativas>0) cuerpo.alternates = alternativas;
  /* GET con ?json= (formato nativo de Valhalla): evita la consulta previa de CORS que bloquean algunos servidores */
  const r = await fetch(C.RUTEO_URL.replace(/\/$/,'') + '/route?json=' + encodeURIComponent(JSON.stringify(cuerpo)));
  if(!r.ok) throw new Error('El motor de rutas respondió ' + r.status);
  const j = await r.json(); if(!j.trip) throw new Error('Sin ruta');
  return [leerViaje(j.trip, fuente)].concat((j.alternates||[]).map((x,i)=>leerViaje(x.trip, fuente+' (alternativa '+(i+1)+')'))).filter(Boolean);
}
async function pedirRuta(origen, destino){
  if(C.RUTEO_PROVEEDOR !== 'valhalla') throw new Error('Proveedor de rutas no soportado: ' + C.RUTEO_PROVEEDOR);
  const peso = +C.RUTEO_PESO_T > 0 ? +C.RUTEO_PESO_T : 0;
  const pedidos = [ candidatas(origen, destino, 'auto', {}, 0, 'sin peso') ];
  if(peso) pedidos.push(candidatas(origen, destino, 'truck', { weight:peso }, C.RUTEO_ALTERNATIVAS|0, 'con peso') );
  const res = await Promise.allSettled(pedidos);
  let todas = []; res.forEach(r => { if(r.status==='fulfilled') todas = todas.concat(r.value); });
  if(!todas.length) throw new Error((res.find(r=>r.status==='rejected')||{reason:{message:'Sin ruta'}}).reason.message);
  const mejor = (l) => l.slice().sort((a,b) => Math.abs(a.metros-b.metros) < 100 ? a.seg-b.seg : a.metros-b.metros)[0];
  const ganadora = mejor(todas), conPeso = todas.filter(x => x.fuente.indexOf('con peso')===0);
  let nota = 'Ruta más corta: ' + (ganadora.metros/1000).toFixed(1) + ' km' + (todas.length>1 ? ' (de ' + todas.length + ' opciones)' : '');
  if(peso && ganadora.fuente==='sin peso' && conPeso.length){
    const mp = mejor(conPeso), dif = (mp.metros - ganadora.metros)/1000;
    if(dif > .3) nota += '. Revisa los límites de peso del camino: respetando ' + peso + ' t sería de ' + (mp.metros/1000).toFixed(1) + ' km (+' + dif.toFixed(1) + ' km)';
  }
  ganadora.nota = nota; ganadora.candidatas = todas.map(x => ({ fuente:x.fuente, km:+(x.metros/1000).toFixed(1), min:Math.round(x.seg/60) }));
  return ganadora;
}
function iconoDe(t){
  if([4,5,6].includes(t)) return 'flag';
  if([2,9,10,11,12,18,20,23].includes(t)) return 'corner-up-right';
  if([3,13,14,15,16,19,21,24].includes(t)) return 'corner-up-left';
  return 'arrow-up';
}

function construirEstilo(){
  if(C.MAPA_ESTILO_URL) return C.MAPA_ESTILO_URL;
  const src = 'osm', fuente = [C.MAPA_FUENTE_TEXTO];
  const w = (pts,extra) => { const x=extra||0, a=['interpolate',['linear'],['zoom']]; pts.forEach(p=>{ a.push(p[0], p[1]+x); }); return a; };
  const grupos = [
    { id:'mayor', clases:['motorway','trunk'],        pts:[[10,1.2],[14,4],[17,12],[20,26]], color:'#2C6B8F' },
    { id:'prim',  clases:['primary'],                 pts:[[10,1],[14,3.2],[17,10],[20,22]], color:'#265F7F' },
    { id:'sec',   clases:['secondary','tertiary'],    pts:[[11,.8],[14,2.6],[17,8],[20,18]], color:'#1F5170' },
    { id:'local', clases:['minor','service','track'], pts:[[13,.6],[15,1.8],[17,6],[20,14]], color:'#173F58' }
  ];
  const capas = [
    { id:'fondo', type:'background', paint:{'background-color':'#030B13'} },
    { id:'cobertura', type:'fill', source:src, 'source-layer':'landcover', paint:{'fill-color':'#061520','fill-opacity':.9} },
    { id:'parques', type:'fill', source:src, 'source-layer':'park', paint:{'fill-color':'#08241F','fill-opacity':.7} },
    { id:'uso', type:'fill', source:src, 'source-layer':'landuse', paint:{'fill-color':'#061520','fill-opacity':.8} },
    { id:'agua', type:'fill', source:src, 'source-layer':'water', paint:{'fill-color':'#06263A'} },
    { id:'rios', type:'line', source:src, 'source-layer':'waterway', paint:{'line-color':'#06263A','line-width':['interpolate',['linear'],['zoom'],10,.6,16,3]} },
    { id:'edificios', type:'fill-extrusion', source:src, 'source-layer':'building', minzoom:14,
      paint:{'fill-extrusion-color':'#0C2A3F','fill-extrusion-height':['coalesce',['get','render_height'],6],'fill-extrusion-base':['coalesce',['get','render_min_height'],0],'fill-extrusion-opacity':.95} }
  ];
  const filtro = g => ['all',['==',['geometry-type'],'LineString'],['in',['get','class'],['literal',g.clases]]];
  for(const g of grupos) capas.push({ id:'borde-'+g.id, type:'line', source:src, 'source-layer':'transportation', filter:filtro(g), layout:{'line-cap':'round','line-join':'round'}, paint:{'line-color':'#030B13','line-width':w(g.pts,3)} });
  for(const g of grupos.slice().reverse()) capas.push({ id:'via-'+g.id, type:'line', source:src, 'source-layer':'transportation', filter:filtro(g), layout:{'line-cap':'round','line-join':'round'}, paint:{'line-color':g.color,'line-width':w(g.pts)} });
  capas.push(
    { id:'nombres-calles', type:'symbol', source:src, 'source-layer':'transportation_name', minzoom:13,
      layout:{'symbol-placement':'line','text-field':['get','name'],'text-font':fuente,'text-size':11,'text-letter-spacing':.08,'text-transform':'uppercase'},
      paint:{'text-color':'#7FA6C2','text-halo-color':'#030B13','text-halo-width':1.3} },
    { id:'lugares', type:'symbol', source:src, 'source-layer':'place', filter:['in',['get','class'],['literal',['city','town','village','suburb','hamlet','neighbourhood']]],
      layout:{'text-field':['get','name'],'text-font':fuente,'text-size':['match',['get','class'],'city',16,'town',14,'village',12,11]},
      paint:{'text-color':'#9FC0D6','text-halo-color':'#030B13','text-halo-width':1.4} }
  );
  return { version:8, glyphs:C.MAPA_GLYPHS, sources:{ [src]:{ type:'vector', url:C.MAPA_TILEJSON } }, layers:capas };
}

let mapa = null, mapaListo = false, W = 0, H = 0;
const V = { padR:0, padB:0, padRObj:0, padBObj:0, camPad:{top:0,bottom:0,left:0,right:0} };   // márgenes de la cámara y posición del carro en pantalla
const vertical = () => window.innerWidth < window.innerHeight;
function medir(){ const st=$('stage'); W=st.clientWidth; H=st.clientHeight; }
function objetivos(){
  const abierto = document.body.classList.contains('abierto') && !document.body.classList.contains('sin-ruta');
  const vert = vertical();
  V.padRObj = (abierto && !vert) ? Math.min(510, W*.4) : 0;
  V.padBObj = (abierto && vert) ? H*.54 : 0;
}
function posicionarCarro(){
  const oy = H * (vertical() ? .62 : .74);                         // dónde queremos al carro, mirando desde arriba
  let padT=0, padB=0; if(2*oy > H) padT = 2*oy - H; else padB = H - 2*oy;
  padB += V.padB;
  V.camPad = { top:padT, bottom:padB, left:0, right:V.padR };
}
window.addEventListener('resize', () => { medir(); objetivos(); if(mapa) mapa.resize(); });
medir();

function iniciarMapa(){
  try{
    mapa = new maplibregl.Map({
      container:'map', style:construirEstilo(), center:C.CENTRO_DEFECTO, zoom:16.7, pitch:58, bearing:0,
      interactive:true, minZoom:10, maxZoom:19, attributionControl:false, keyboard:false, doubleClickZoom:false, fadeDuration:0, pixelRatio:Math.min(2, window.devicePixelRatio||1)
    });
  }catch(e){ avisar('Este dispositivo no puede dibujar el mapa', 'Falta compatibilidad con WebGL', 0); return; }
  mapa.dragRotate.disable(); mapa.touchZoomRotate.disableRotation(); if(mapa.touchPitch) mapa.touchPitch.disable();
  // si la persona mueve o acerca el mapa con el dedo, la cámara deja de seguir al vehículo hasta que apriete «volver a centrar»
  // (la cámara se pausa mientras hay un dedo sobre el mapa; si el dedo se mueve, pasa a modo libre)
  const cont=mapa.getCanvasContainer(); let ini=null;
  cont.addEventListener('pointerdown', ev => { E.tocando=true; ini={x:ev.clientX,y:ev.clientY}; });
  cont.addEventListener('pointermove', ev => { if(E.tocando && ini && Math.hypot(ev.clientX-ini.x, ev.clientY-ini.y)>8) soltar(); });
  const suelta=()=>{ E.tocando=false; ini=null; };
  window.addEventListener('pointerup', suelta); window.addEventListener('pointercancel', suelta);
  cont.addEventListener('wheel', () => soltar(), { passive:true });
  mapa.on('error', ev => console.warn('mapa:', ev && ev.error && ev.error.message));
  mapa.on('load', () => {
    mapa.addSource('ruta', { type:'geojson', data:{ type:'Feature', geometry:{ type:'LineString', coordinates:[] } } });
    mapa.addLayer({ id:'ruta-borde', type:'line', source:'ruta', layout:{'line-cap':'round','line-join':'round'}, paint:{'line-color':'#0E7C86','line-width':['interpolate',['linear'],['zoom'],12,4,16,12,19,24]} });
    mapa.addLayer({ id:'ruta-linea', type:'line', source:'ruta', layout:{'line-cap':'round','line-join':'round'}, paint:{'line-color':'#2DD3DB','line-width':['interpolate',['linear'],['zoom'],12,2.5,16,8,19,16]} });
    mapaListo = true; document.dispatchEvent(new Event('vigor-mapa-listo'));
  });
}

const E = { ruta:null, cum:[], destino:null, s:0, pos:null, rum:0, rumVista:0, vel:0, puntos:[], marcadores:[], unidades:[], uni:{}, sigue:null, camC:null, mkDestino:null, activo:false, t0:0, libre:false, tocando:false, esc:1, lejos:false, mkMe:null, meSvg:null };

function avisar(t, sub, ms){ const m=$('msg'); m.innerHTML = t + (sub ? '<small>'+sub+'</small>' : ''); m.classList.add('show'); clearTimeout(avisar._t); if(ms) avisar._t=setTimeout(()=>m.classList.remove('show'), ms); }
function ocultarAviso(){ $('msg').classList.remove('show'); }
function enRuta(s){
  const c=E.cum, n=c.length-1; s=Math.max(0,Math.min(c[n],s));
  let lo=0, hi=n; while(lo<hi-1){ const mid=(lo+hi)>>1; if(c[mid]<=s) lo=mid; else hi=mid; }
  const a=E.ruta.coords[lo], b=E.ruta.coords[Math.min(lo+1,n)], d=(c[lo+1]||c[lo])-c[lo], t=d>0?(s-c[lo])/d:0;
  return { lng:a[0]+(b[0]-a[0])*t, lat:a[1]+(b[1]-a[1])*t, i:lo };
}
function elem(html, cls){ const d=document.createElement('div'); d.className='mk'+(cls?' '+cls:''); d.innerHTML=html; return d; }
function gota(color, icono, grande){ return `<div class="g${grande?' big':''}" style="--k:${color}"><b><i class="ti ti-${icono}"></i></b></div><div class="pt${grande?' gr':''}" style="--k:${color}"></div>`; }
function fmtDist(m){ return m>=1000 ? (m/1000).toFixed(1)+' km' : (Math.round(m/5)*5)+' m'; }

/* grifos y fuentes cercanos al siniestro (lista del panel y tarjeta del banner) */
function listaAgua(){
  if(!E.destino) return;
  const d=[E.destino.lng,E.destino.lat];
  const l = E.puntos.filter(p=>AGUA.has(p.tipo||p.categoria)).map(p=>({p,d:dist([p.lng,p.lat],d)})).sort((a,b)=>a.d-b.d).slice(0,3);
  $('grifL').innerHTML = l.length ? l.map(x=>{ const t=tipoDe(x.p); return `<div class="row"><span><i class="ti ti-${t.icono}"></i>${esc(x.p.nombre||t.nombre)}</span><b>${fmtDist(x.d)}</b></div>`; }).join('') : '<div class="row" style="color:var(--mu)">Sin puntos de agua registrados</div>';
  $('grifP').innerHTML = l.length ? l.map(x=>{ const t=tipoDe(x.p); return `<div class="it"><i class="ti ti-${t.icono}"></i><b>${esc(x.p.nombre||t.nombre)}</b><span class="d">${fmtDist(x.d)}</span></div>`; }).join('') : '<div class="vacio">Sin puntos de agua registrados cerca.</div>';
}

const Nav = {
  /* ruta: salida de pedirRuta(); destino: {lng,lat,titulo,sub,dir} */
  iniciarRuta(ruta, destino){
    E.ruta = ruta; E.destino = destino; E.s = 0; E.activo = true; E.t0 = Date.now();
    E.cum = [0]; for(let i=1;i<ruta.coords.length;i++) E.cum.push(E.cum[i-1] + dist(ruta.coords[i-1], ruta.coords[i]));
    if(mapaListo) mapa.getSource('ruta').setData({ type:'Feature', geometry:{ type:'LineString', coordinates:ruta.coords } });
    if(E.mkDestino) E.mkDestino.remove();
    E.mkDestino = new maplibregl.Marker({ element:elem(`<div class="pul"></div>${gota('#F13746','flame',true)}`), anchor:'bottom' }).setLngLat([destino.lng, destino.lat]).addTo(mapa);
    setTxt('titulo', destino.titulo || 'Despacho'); setTxt('tipo', 'Despacho · ' + (destino.titulo || ''));
    setTxt('dir', destino.dir || destino.sub || ''); setTxt('rnota', ruta.nota || '');
    const u=$('pUnit').textContent; setTxt('subt', (destino.dir||destino.sub||'') + (u && u!=='En ruta' ? ' · ' + u.replace(' · En ruta','') + ' en ruta' : ''));
    document.body.classList.remove('sin-ruta'); ocultarAviso(); listaAgua(); objetivos();
  },
  detener(){ E.activo=false; E.ruta=null; document.body.classList.add('sin-ruta'); objetivos(); if(mapaListo) mapa.getSource('ruta').setData({ type:'Feature', geometry:{ type:'LineString', coordinates:[] } }); if(E.mkDestino){ E.mkDestino.remove(); E.mkDestino=null; } },
  /* posición del carro: lng, lat, rumbo (grados, opcional), velocidad en km/h */
  setPosicion(lng, lat, rum, velKmh){
    E.pos=[lng,lat]; if(typeof rum==='number') E.rum=rum; E.vel=velKmh||0;
    if(E.activo && E.ruta){
      let mejor=E.s, md=1e12; const c=E.cum, co=E.ruta.coords, i0=enRuta(E.s).i;
      for(let i=Math.max(0,i0-3); i<Math.min(co.length-1, i0+60); i++){ const dd=dist([lng,lat], co[i]); if(dd<md){ md=dd; mejor=c[i]; } }
      if(mejor>=E.s-30) E.s=Math.max(E.s,mejor);
    }
  },
  /* puntos propios: [{id,tipo,nombre,nota,lng,lat}]  (tipo = clave de TIPOS) */
  setPuntos(lista){
    E.marcadores.forEach(m=>m.mk.remove()); E.marcadores=[]; E.puntos=lista||[];
    for(const p of E.puntos){
      const t=tipoDe(p);
      const mk=new maplibregl.Marker({ element:elem(gota(t.color,t.icono)+'<div class="lb"></div>'), anchor:'bottom' }).setLngLat([p.lng,p.lat]).addTo(mapa);
      E.marcadores.push({ p, t, mk, el:mk.getElement(), tx:null });
    }
    listaAgua();
  },
  /* otras unidades en ruta, en tiempo real: [{id,nombre,lng,lat,minDetras,ts,enLinea}]
     Se llama cada vez que llega una posición nueva; el mapa mueve la unidad con suavidad hasta ahí.
     Una unidad sin señal (enLinea:false, o sin datos hace más de 45 s) sale del mapa y queda marcada en el panel. */
  setUnidades(lista){
    const ids=new Set((lista||[]).map(u=>u.id));
    for(const id in E.uni) if(!ids.has(id)){ if(E.uni[id].mk) E.uni[id].mk.remove(); delete E.uni[id]; if(E.sigue===id) E.sigue=null; }
    for(const u of lista||[]){
      const en = u.enLinea!==false && (!u.ts || Date.now()-u.ts<45000) && isFinite(u.lng) && isFinite(u.lat);
      let e=E.uni[u.id]; if(!e) e=E.uni[u.id]={ id:u.id, mk:null, cur:null, tgt:null, vis:null };
      e.nombre=u.nombre||u.id; e.min=u.minDetras; e.en=en;
      if(en){
        e.tgt=[u.lng,u.lat]; if(!e.cur) e.cur=[u.lng,u.lat];
        if(!e.mk){ const d=document.createElement('div'); d.className='uMk'; d.innerHTML=UHTML+'<div class="nom">'+esc(e.nombre)+'</div>'; e.mk=new maplibregl.Marker({ element:d, anchor:'center' }).setLngLat(e.cur).addTo(mapa); }
      } else if(e.mk){ e.mk.remove(); e.mk=null; e.cur=null; e.vis=null; if(E.sigue===u.id) E.sigue=null; }
    }
    pintarUnidades();
  },
  _estado:E, _pedirRuta:pedirRuta, get _mapa(){ return mapa; }
};
window.VigorNav = Nav;

/* =====================  HUD  ===================== */
function actualizarHUD(){
  const r=E.ruta; if(!r) return;
  const total=E.cum[E.cum.length-1], restante=Math.max(0, total-E.s), llego = restante < 25;
  let m=null; for(const x of r.maniobras){ if(E.cum[x.idx] > E.s + 6 && x.tipo!==1 && x.tipo!==2 && x.tipo!==3){ m=x; break; } }
  let d1, ic, l2;
  const num = mts => mts>=1000 ? `${(mts/1000).toFixed(1)}<small>km</small>` : `${Math.max(10,Math.round(mts/10)*10)}<small>m</small>`;
  if(llego){ d1='Llegaste'; ic='flag'; l2=(E.destino.titulo||'Siniestro'); }
  else if(m){ const dm=E.cum[m.idx]-E.s; ic=iconoDe(m.tipo); d1=num(dm); l2=m.via || m.texto || 'Sigue'; }
  else { ic='flag'; d1=num(restante); l2='Llegada al siniestro'; }
  set('d1', d1); setTxt('d2', l2);
  document.querySelectorAll('[data-f="ic"]').forEach(e=>{ e.className='ti ti-'+ic; });
  let lim=null; for(const x of r.maniobras){ if(E.cum[x.idx] <= E.s) lim = x.lim || lim; else break; }
  const v=Math.round(E.vel); setTxt('vel', v);
  document.querySelectorAll('[data-f="lim"]').forEach(e=>{ e.style.display = lim ? 'grid' : 'none'; e.textContent = lim||''; });
  setTxt('lm', lim ? 'Límite '+lim : '');
  document.querySelectorAll('[data-f="box"]').forEach(e=>e.classList.toggle('exc', !!(lim && v>lim)));
  const frac = total>0 ? restante/total : 0, seg = llego ? 0 : r.seg*frac, mn = llego ? 0 : Math.max(1, Math.ceil(seg/60));
  set('eM', `${mn}<small>min</small>`); setTxt('eK', (restante/1000).toFixed(1)+' km');
  setTxt('eH', new Date(Date.now()+mn*60000).toLocaleTimeString('es-CL',{hour:'2-digit',minute:'2-digit',hour12:false}));
  const sg=Math.floor((Date.now()-E.t0)/1000), pad=n=>String(n).padStart(2,'0');
  $('tRuta').textContent = pad(Math.floor(sg/3600))+':'+pad(Math.floor(sg/60)%60)+':'+pad(sg%60);
  alertas(llego);
}
function ladoDe(rumboCarro, a, b){ return difAng(rumbo(a,b), rumboCarro) >= 0 ? 'derecha' : 'izquierda'; }
function alertas(llego){
  const al=$('al'); let mostrar=null;
  if(llego){
    const dd=E.puntos.filter(p=>AGUA.has(p.tipo||p.categoria)).map(p=>({p,d:dist([p.lng,p.lat],[E.destino.lng,E.destino.lat])})).sort((a,b)=>a.d-b.d).slice(0,2);
    if(dd.length) mostrar={ color:FAM.agua[1], icono:'droplet', texto:`Puntos de agua más cercanos: ${dd.map(x=>Math.round(x.d)+' m').join(' y ')}` };
  } else if(E.pos){
    let mejor=null;
    for(const m of E.marcadores){ const t=m.t; if(!t.radio) continue; const d=dist(E.pos,[m.p.lng,m.p.lat]); if(d>t.radio) continue;
      const rel=Math.abs(difAng(rumbo(E.pos,[m.p.lng,m.p.lat]), E.rum)); if(rel>100 && d>25) continue;
      if(!mejor || d<mejor.d) mejor={m,t,d}; }
    if(mejor){
      const { m, t, d } = mejor, dd = Math.round(d/5)*5;
      const txt = m.p.nota || (AGUA.has(m.p.tipo||m.p.categoria) ? `${m.p.nombre||t.nombre} a la ${ladoDe(E.rum,E.pos,[m.p.lng,m.p.lat])}, ${dd} m` : (t.aviso ? `${t.aviso} · ${dd} m` : `${m.p.nombre||t.nombre} a ${dd} m`));
      mostrar={ color:t.color, icono:t.icono, texto:txt };
    }
  }
  if(mostrar){ al.style.setProperty('--k', mostrar.color); $('ai').className='ti ti-'+mostrar.icono; $('at').textContent=mostrar.texto; al.style.display='flex'; } else al.style.display='';
}

/* =====================  Unidades en tiempo real  ===================== */
const UHTML='<svg viewBox="0 0 100 100" aria-hidden="true"><circle class="onda" cx="50" cy="50" r="15" fill="#F13746"/><circle class="onda o2" cx="50" cy="50" r="15" fill="#F13746"/><circle class="punto" cx="50" cy="50" r="15" fill="#F13746" stroke="#fff" stroke-width="5"/></svg>';
function pintarUnidades(){
  const l=Object.values(E.uni);
  $('uniL').innerHTML = l.length ? l.map(e=>{
    const t = !e.en ? 'sin señal' : (e.min>0 ? e.min+' min detrás' : (e.min<0 ? Math.abs(e.min)+' min delante' : 'junto a ti'));
    return `<button type="button" class="it${e.en?'':' off'}${E.sigue===e.id?' sel':''}" data-u="${esc(e.id)}" ${e.en?'':'disabled'}><span class="rj"></span><b>${esc(e.nombre)}</b><span class="d">${t}</span>${e.en?'<i class="ti ti-current-location ver"></i>':''}</button>`;
  }).join('') : '<div class="vacio">Sin otras unidades en ruta.</div>';
}
$('uniL').addEventListener('click', ev => { const b=ev.target.closest('[data-u]'); if(b) seguirUnidad(b.dataset.u); });
function seguirUnidad(id){
  const e=E.uni[id]; if(!e || !e.en || !mapa) return;
  E.sigue=id; E.camC=mapa.getCenter().toArray(); setLibre(true); pintarUnidades();
  avisar('Siguiendo a '+esc(e.nombre), 'Toca la mira para volver a tu vehículo', 2800);
}
function moverUnidades(dt){
  for(const id in E.uni){ const e=E.uni[id]; if(!e.mk) continue;
    const k=Math.min(1,dt*2.5); e.cur[0]+=(e.tgt[0]-e.cur[0])*k; e.cur[1]+=(e.tgt[1]-e.cur[1])*k; e.mk.setLngLat(e.cur); }
}

/* =====================  Cámara libre y vehículo  ===================== */
function setLibre(v){ if(E.libre===v) return; E.libre=v; $('b4').hidden=!v; }
function soltar(){ if(E.sigue){ E.sigue=null; pintarUnidades(); } setLibre(true); }
function recentrar(){
  if(E.sigue){ E.sigue=null; pintarUnidades(); }
  setLibre(false);
  if(mapaListo && E.pos){ mapa.jumpTo({ center:E.pos, bearing:E.rumVista||0, pitch:58, zoom:17.3-Math.min(1.2,E.vel/60), padding:V.camPad }); }
}
const MEHTML='<svg viewBox="0 0 100 100" aria-hidden="true"><defs><linearGradient id="cono" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#F13746" stop-opacity=".7"/><stop offset="1" stop-color="#F13746" stop-opacity="0"/></linearGradient></defs><path d="M50 50 -12 -58Q50 -80 112 -58Z" fill="url(#cono)"/><circle class="onda" cx="50" cy="50" r="15" fill="#F13746"/><circle class="onda o2" cx="50" cy="50" r="15" fill="#F13746"/><circle class="punto" cx="50" cy="50" r="15" fill="#F13746" stroke="#fff" stroke-width="5"/></svg>';
function vehiculo(){
  if(!E.mkMe){ const d=document.createElement('div'); d.className='meMk'; d.innerHTML=MEHTML; E.meSvg=d.firstChild; E.mkMe=new maplibregl.Marker({ element:d, anchor:'center' }).setLngLat(E.pos).addTo(mapa); }
  else E.mkMe.setLngLat(E.pos);
  E.meSvg.style.transform='rotate('+difAng(E.rum, mapa.getBearing())+'deg) scale('+(E.lejos?.45:E.esc)+')';   // el cono apunta hacia donde va el vehículo, aunque se mueva el mapa
}
/* solo se muestran los puntos que caen dentro de lo que se ve en pantalla (y a una distancia razonable) */
function visible(lng, lat, c, alcance){
  if(dist(c,[lng,lat]) > alcance) return false;
  const q=mapa.project([lng,lat]);
  return q.x>=-20 && q.x<=W+20 && q.y>=70 && q.y<=H+20;
}
function filtrarVisibles(){
  const c=mapa.getCenter().toArray(), alcance=1500*Math.pow(2, 17-mapa.getZoom());
  for(const m of E.marcadores){ const v=visible(m.p.lng,m.p.lat,c,alcance); if(v!==m.vis){ m.vis=v; m.el.style.display=v?'':'none'; } }
  for(const id in E.uni){ const e=E.uni[id]; if(!e.mk) continue; const v=visible(e.cur[0],e.cur[1],c,alcance); if(v!==e.vis){ e.vis=v; e.mk.getElement().style.display=v?'':'none'; } }
  if(E.mkDestino){ const ll=E.mkDestino.getLngLat(), v=visible(ll.lng,ll.lat,c,alcance); if(v!==E.mkDestino._vis){ E.mkDestino._vis=v; E.mkDestino.getElement().style.display=v?'':'none'; } }
}
/* tamaño de los íconos según el zoom: completos desde zoom 16; se achican hasta 14,5 y más lejos quedan como puntos */
function escalaIconos(){
  const z=mapa.getZoom(), esc = z>=16 ? 1 : (z<=14.5 ? .62 : .62 + (z-14.5)/1.5*.38), lejos = z<14.5;
  if(Math.abs(esc-E.esc)>.015){ E.esc=esc; mapa.getContainer().style.setProperty('--esc', esc.toFixed(3)); }
  if(lejos!==E.lejos){ E.lejos=lejos; mapa.getContainer().classList.toggle('lejos', lejos); }
}

/* =====================  Bucle de dibujo  ===================== */
let ultimoT=null;
function cuadro(ts){
  if(ultimoT===null) ultimoT=ts; const dt=Math.min(.1,(ts-ultimoT)/1000); ultimoT=ts;
  // el margen de la cámara se desliza junto con el panel
  V.padR += (V.padRObj-V.padR)*Math.min(1,dt*8); if(Math.abs(V.padRObj-V.padR)<.5) V.padR=V.padRObj;
  V.padB += (V.padBObj-V.padB)*Math.min(1,dt*8); if(Math.abs(V.padBObj-V.padB)<.5) V.padB=V.padBObj;
  posicionarCarro();
  if(mapaListo && E.pos){
    const dif=difAng(E.rum, E.rumVista||0); E.rumVista=((E.rumVista||0)+dif*Math.min(1,dt*4)+360)%360;
    const zoom = 17.3 - Math.min(1.2, E.vel/60);
    moverUnidades(dt);
    const seg = E.sigue && E.uni[E.sigue] && E.uni[E.sigue].mk ? E.uni[E.sigue] : null;
    if(seg){
      if(!E.tocando){ const t=seg.cur, c=E.camC||mapa.getCenter().toArray(), k=Math.min(1,dt*5); E.camC=[c[0]+(t[0]-c[0])*k, c[1]+(t[1]-c[1])*k];
        mapa.jumpTo({ center:E.camC, pitch:58, padding:V.camPad }); }
    } else if(!E.libre && !E.tocando) mapa.jumpTo({ center:E.pos, bearing:E.rumVista, pitch:58, zoom, padding:V.camPad });
    vehiculo(); escalaIconos(); filtrarVisibles();
    for(const m of E.marcadores){ const d=dist(E.pos,[m.p.lng,m.p.lat]); const tx = d<350 ? `${m.p.nombre||m.t.nombre} · ${Math.round(d/10)*10} m` : ''; if(tx!==m.tx){ m.tx=tx; m.el.querySelector('.lb').textContent=tx; } }
  }
  if(E.activo) actualizarHUD();
  requestAnimationFrame(cuadro);
}

/* =====================  Panel desplegable  ===================== */
function abrirPanel(abierto, recordar){
  document.body.classList.toggle('abierto', abierto); $('tab').setAttribute('aria-expanded', abierto?'true':'false'); objetivos();
  if(recordar!==false){ try{ localStorage.setItem('vigor_nav_panel', abierto?'1':'0'); }catch(e){} }
}
$('tab').onclick = () => abrirPanel(!document.body.classList.contains('abierto'));
try{ if(localStorage.getItem('vigor_nav_panel')==='1' || PARAMS.get('panel')==='1') abrirPanel(true,false); }catch(e){ if(PARAMS.get('panel')==='1') abrirPanel(true,false); }

/* =====================  Reloj, unidad y botones  ===================== */
const tic=()=>{ $('clock').textContent=new Date().toLocaleTimeString('es-CL',{hour:'2-digit',minute:'2-digit',hour12:false}); }; tic(); setInterval(tic,10000);
$('b4').onclick=recentrar;
$('b1').onclick=()=>{ location.href='tablet_carro.html'; };
$('b2').onclick=()=>avisar('Buscar un punto', 'Llega en una próxima parte: buscar entre los puntos del Cuerpo', 3200);
$('b3').onclick=()=>avisar('Agregar un punto al mapa', 'Llega en una próxima parte: marcar un punto nuevo con su tipo', 3200);

    const { data:{ session } } = await sb.auth.getSession(); if(!session) return;

/* =====================  Arranque  ===================== */
iniciarMapa(); medir(); objetivos(); V.padR=V.padRObj; V.padB=V.padBObj; requestAnimationFrame(cuadro);

/* Modo de prueba (?sim=1): ruta de ejemplo y recorrido simulado, sin controles. Solo para probar la pantalla. */
if(PARAMS.get('sim')){
  document.addEventListener('vigor-mapa-listo', async () => {
    /* parámetros de prueba: ?sim=1&destino=lng,lat&origen=lng,lat&nombre=Texto&x=4 (x = veces más rápido) */
    const par = k => { const v=(PARAMS.get(k)||'').split(',').map(Number); return v.length===2 && v.every(isFinite) ? v : null; };
    const origen = par('origen') || C.CENTRO_DEFECTO, destino = par('destino') || C.DEMO_DESTINO, factor = Math.max(1, Math.min(20, +PARAMS.get('x')||1));
    avisar('Modo de prueba', 'Calculando una ruta de ejemplo…', 0);
    let ruta;
    try{ ruta = await pedirRuta(origen, destino); }
    catch(e){
      avisar('No se pudo calcular la ruta de prueba', esc(e.message) + ' — se usa una ruta recta de ejemplo', 6000);
      const n=40, co=[]; for(let i=0;i<=n;i++) co.push([origen[0]+(destino[0]-origen[0])*i/n, origen[1]+(destino[1]-origen[1])*i/n]);
      ruta = { coords:co, maniobras:[{idx:0,tipo:1,via:'',texto:'',metros:0,seg:0},{idx:n,tipo:4,via:'',texto:'',metros:0,seg:0}], metros:dist(origen,destino), seg:dist(origen,destino)/12 };
    }
    Nav.iniciarRuta(ruta, { lng:destino[0], lat:destino[1], titulo:'Incendio estructural', sub:'Sector de prueba', dir:PARAMS.get('nombre') || 'Calle Prat 1240, Florida' });
    const tot=E.cum[E.cum.length-1], ej=[];
    const lat=(s,off)=>{ const p=enRuta(s), q=enRuta(s+8), rm=(rumbo([p.lng,p.lat],[q.lng,q.lat])+90)*RAD; return [p.lng+Math.sin(rm)*off/(111320*Math.cos(p.lat*RAD)), p.lat+Math.cos(rm)*off/110540]; };
    [[.10,'grifo','G-01',-18],[.22,'escuela','Escuela El Roble',-30],[.30,'farmacia','Farmacia',26],[.38,'puente','Puente 12 t',0],[.46,'carabineros','Carabineros',-34],[.55,'hospital','Hospital',40],[.64,'bodega_riesgo','Bodega agroquímicos',30],[.74,'grifo','G-02',20],[.83,'posta','Posta',-30],[.90,'grifo','G-12',-20],[.95,'grifo','G-13',22],[.97,'fuente_agua','Fuente de agua',-40]]
      .forEach(([f,tipo,nom,off],i)=>{ const [lg,la]=lat(tot*f,off); ej.push({id:'d'+i,tipo,nombre:nom,nota:tipo==='puente'?'Puente con límite de 12 toneladas':'',lng:lg,lat:la}); });
    Nav.setPuntos(ej);
    let s=0, vel=0, previo=null;
    const paso = ts => {
      if(!E.activo) return; if(previo===null) previo=ts; const dt=Math.min(.1,(ts-previo)/1000); previo=ts;
      const cerca = (()=>{ for(const x of ruta.maniobras){ const dm=E.cum[x.idx]-s; if(dm>0&&dm<45&&x.tipo!==1&&x.tipo!==4) return true; } return false; })();
      const objetivo = s>=tot-10 ? 0 : (cerca ? 25 : 55); vel += (objetivo-vel)*Math.min(1,dt*1.5);
      s = Math.min(tot, s + (vel/3.6)*dt*factor);
      const p=enRuta(s), q=enRuta(s+25); Nav.setPosicion(p.lng,p.lat, rumbo([p.lng,p.lat],[q.lng,q.lat]), vel);
      if(s>=tot-1 && vel<1){ setTimeout(()=>{ s=0; vel=0; previo=null; E.t0=Date.now(); requestAnimationFrame(paso); }, 7000); return; }
      requestAnimationFrame(paso);
    };
    const p0=enRuta(0), q0=enRuta(25); E.rumVista=rumbo([p0.lng,p0.lat],[q0.lng,q0.lat]); Nav.setPosicion(p0.lng,p0.lat,E.rumVista,0);
    // otras unidades en ruta: llegan posiciones nuevas cada 2 s (como llegarían por internet) y el mapa las mueve con suavidad
    const flota=[{id:'b3',nombre:'B-3',gap:-160},{id:'r1',nombre:'R-1',gap:-340},{id:'bx2',nombre:'BX-2',gap:240}];
    const emitir=()=>{ if(!E.activo) return;
      const ms=Math.max(vel/3.6,12), off=(Date.now()%48000)>34000;          // R-1 pierde la señal unos segundos para probar el caso «sin conexión»
      Nav.setUnidades(flota.map(f=>{ const q=enRuta(Math.max(0,Math.min(tot,s+f.gap))); return { id:f.id, nombre:f.nombre, lng:q.lng, lat:q.lat, minDetras:Math.sign(-f.gap)*Math.max(1,Math.round(Math.abs(f.gap)/ms/60)), ts:Date.now(), enLinea:!(f.id==='r1'&&off) }; })); };
    emitir(); setInterval(emitir, 2000);
    requestAnimationFrame(paso);
  });
} else {
  // Sin despacho ni GPS: se muestra el mapa de la comuna y un aviso
  document.addEventListener('vigor-mapa-listo', () => {
    E.pos = C.CENTRO_DEFECTO.slice(); E.rum = 0; E.rumVista = 0;
    avisar('Sin despacho activo', 'Cuando se despache esta unidad, aquí verás la ruta', 0);
  });
}
})();
