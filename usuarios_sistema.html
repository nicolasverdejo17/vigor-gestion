<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>VIGOR — Usuarios del Sistema</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#060A0F; --panel:#0A131C; --panel-alt:#0E1D28; --line:#132734; --line-strong:#1C3B49;
    --text:#E7F5FA; --text-muted:#7B99A3; --text-dim:#516E78;
    --burdeo:#7A1620; --burdeo-bright:#D8394E; --cyan:#49E9FF; --cyan-dim:#1E6E7D; --cyan-glow:rgba(73,233,255,0.35); --amber-glow:rgba(255,154,68,0.32);
    --servicio:#3CF29A; --fuera:#C9A63B;
    --esp-r:#FF5A4E; --esp-t:#4FA3FF; --esp-h:#FFC94D; --esp-f:#3CF29A; --esp-m:#B77CFF; --esp-c:#E08A5C;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;}
  body{
    background: radial-gradient(1200px 550px at 15% -10%, rgba(73,233,255,0.07), transparent 60%), var(--bg);
    color:var(--text); font-family:'Inter',sans-serif; height:100vh; display:flex; flex-direction:column;
  }
  .mono{font-family:'JetBrains Mono',monospace;}
  h1,h2,h3{font-family:'Rajdhani',sans-serif; text-transform:uppercase; letter-spacing:.04em; font-weight:700; margin:0;}
  .wordmark{ text-align:center; font-family:'Rajdhani'; font-weight:600; letter-spacing:.35em; font-size:12px; color:var(--brass-bright); padding:9px 0 7px; text-transform:uppercase; flex-shrink:0; background:var(--bg);}
  .nameplate{ background:linear-gradient(180deg,var(--panel-alt),var(--panel)); border-bottom:2px solid var(--brass-dim); flex-shrink:0;}
  .nameplate-inner{ display:flex; align-items:center; justify-content:space-between; padding:14px 26px;}
  .back-btn{ background:transparent; border:1.5px solid var(--line-strong); color:var(--text-muted); font-family:'Rajdhani'; font-weight:600; font-size:12px; padding:8px 14px; border-radius:5px; cursor:pointer;}
  .back-btn:hover{ border-color:var(--brass-bright); color:var(--text);}
  .brand-mark{ width:36px;height:36px; border:1.5px solid var(--brass); border-radius:3px; display:flex; align-items:center; justify-content:center; position:relative; background:var(--panel); flex-shrink:0;}
  .brand-mark::before{ content:""; position:absolute; inset:4px; border:1px solid var(--brass-dim); border-radius:2px;}
  .brand-mark svg{ width:15px; height:15px;}
  .brand-text{ margin-left:16px;}
  .brand-text h1{ font-size:19px; color:var(--text);}
  .brand-text span{ font-size:10.5px; color:var(--text-dim); letter-spacing:.1em; text-transform:uppercase; display:block; margin-top:2px;}
  .role-tag{ font-family:'Rajdhani'; font-weight:700; font-size:11.5px; letter-spacing:.06em; text-transform:uppercase; padding:6px 14px; border-radius:4px; background:var(--panel); border:1.5px solid var(--brass); color:var(--brass-bright);}

  .toolbar{ flex-shrink:0; padding:14px 30px; display:flex; gap:10px; align-items:center; flex-wrap:wrap;}
  .search-input{ flex:1; min-width:220px; background:var(--panel-alt); border:1.5px solid var(--line-strong); border-radius:6px; padding:9px 14px; font-size:13px; color:var(--text);}
  .search-input:focus{ outline:none; border-color:var(--cyan);}
  .filtro-btn{ background:var(--panel); border:1.5px solid var(--line-strong); color:var(--text-muted); font-family:'Rajdhani'; font-weight:700; font-size:11px; letter-spacing:.03em; text-transform:uppercase; padding:8px 14px; border-radius:6px; cursor:pointer;}
  .filtro-btn.on{ background:var(--cyan-dim); border-color:var(--cyan); color:#fff;}

  .content-wrap{ flex:1; min-height:0; padding:0 30px 20px; overflow-y:auto;}
  table{ width:100%; border-collapse:collapse; background:var(--panel); border:1px solid var(--line-strong); border-radius:10px; overflow:hidden;}
  thead th{ text-align:left; font-size:10px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.06em; padding:11px 16px; border-bottom:2px solid var(--line-strong); background:var(--panel-alt);}
  tbody tr{ border-bottom:1px solid var(--line);}
  tbody tr:last-child{ border-bottom:none;}
  tbody td{ padding:10px 16px; font-size:12.5px; vertical-align:middle;}
  .td-nombre{ font-weight:600;}
  .td-reg{ font-family:'JetBrains Mono',monospace; color:var(--text-dim);}
  .estado-pill{ font-size:9.5px; font-weight:700; text-transform:uppercase; padding:3px 9px; border-radius:10px; display:inline-block;}
  .esp-chip{
    display:inline-flex; align-items:center; justify-content:center; width:26px; height:26px;
    font-family:'JetBrains Mono',monospace; font-size:12px; font-weight:700; border-radius:6px;
    margin-right:3px; box-shadow:0 1px 4px rgba(0,0,0,.35);
  }
  .estado-pill.activo{ background:var(--servicio); color:#fff;}
  .estado-pill.baja{ background:var(--burdeo); color:#fff;}
  .btn-ver-ficha{
    background:var(--cyan-dim); border:1.5px solid var(--cyan); color:#fff;
    font-family:'Rajdhani'; font-weight:700; letter-spacing:.03em; text-transform:uppercase;
    font-size:12px; padding:9px 18px; border-radius:6px; cursor:pointer; white-space:nowrap;
  }
  .btn-ver-ficha:hover{ background:var(--cyan); color:#0D2226;}

  .toast{ position:fixed; bottom:26px; left:50%; transform:translateX(-50%) translateY(12px); background:var(--panel-alt); border:1px solid var(--cyan); color:#fff; padding:13px 22px; border-radius:6px; font-size:13.5px; opacity:0; pointer-events:none; transition:all .25s; z-index:50; text-align:center;}
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0);}

  /* Bug reportado: pedido de que el listado de bomberos (roster para
     "Hojas de Vida de otros") funcione bien en Celular. Tabla ancha se
     envuelve en scroll horizontal en vez de reflow forzado. */
  @media (max-width:760px){
    html,body{ overflow:auto; height:auto; min-height:100%; border-width:0;}
    body{ height:auto;}
    .nameplate-inner{ padding:12px 14px; flex-wrap:wrap; gap:8px;}
    .brand-text h1{ font-size:15px;}
    .toolbar{ padding:12px 14px; flex-wrap:wrap;}
    .search-input{ min-width:0;}
    .content-wrap{ padding:0 14px 20px;}
    .tabla-scroll{ overflow-x:auto; -webkit-overflow-scrolling:touch; border-radius:10px;}
    table{ min-width:720px;}
  }
</style>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="icons/favicon-16.png" sizes="16x16" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#060A0F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Vigor">
<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}</script>
</head>
<body>

  <div class="wordmark">VIGOR</div>

  <div class="nameplate">
    <div class="nameplate-inner">
      <div style="display:flex; align-items:center;">
        <button class="back-btn" onclick="volverCuartel()">← Volver</button>
        <div class="brand-mark"><svg viewBox="0 0 24 24" fill="none"><path d="M12 2L4 6v6c0 5 3.5 8.5 8 10 4.5-1.5 8-5 8-10V6l-8-4z" stroke="#49E9FF" stroke-width="1.6"/></svg></div>
        <div class="brand-text"><h1>Usuarios del Sistema</h1><span id="nombreCuerpoHead">Todas las Compañías, sin filtro · Vigor</span></div>
      </div>
      <div class="role-tag" id="roleTag">Sesión: —</div>
    </div>
  </div>

  <div id="panelSelectorCuerpo" style="display:none; padding:12px 30px 0;">
    <label style="font-size:10.5px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.06em; display:block; margin-bottom:6px;">Cuerpo (Super Admin)</label>
    <select id="selectCuerpo" class="search-input" style="max-width:340px;"></select>
  </div>

  <div class="toolbar">
    <input type="text" class="search-input" id="buscador" placeholder="Buscar por nombre o N° de Registro…" oninput="renderTabla()">
    <div id="filtroCiaRow" style="display:flex; gap:6px;"></div>
  </div>

  <div class="content-wrap">
    <div class="tabla-scroll">
      <table>
        <thead><tr><th>N° Reg.</th><th>Nombre</th><th>Cargo</th><th>Compañía</th><th>Ingreso</th><th>Especialidades</th><th>Estado</th><th></th></tr></thead>
        <tbody id="tablaBody"></tbody>
      </table>
    </div>
  </div>

  <div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://mcfcfbtiruewlcejionr.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1jZmNmYnRpcnVld2xjZWppb25yIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzODExNzgsImV4cCI6MjEwMzk1NzE3OH0.9b_t63ah25RIGNn3pzZU3L553YUrrn7IXWW3MEjXuXU';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { persistSession: true, autoRefreshToken: true } });

// Pedido explícito: en Celular (ancho angosto) "Volver" va directo a
// Opciones — en PC se mantiene el historial normal del navegador.
function volverCuartel(){
  if(window.history.length > 1){ history.back(); return; }
  window.location.href = 'opciones_celular.html';
}

// Vigor es un producto comercial configurable — la cantidad de Compañías la
// define cada Cuerpo cliente, nunca un número fijo. El orden se genera
// dinámicamente a partir del número real de Compañía de cada persona.
function numeroDeOrdenCia(nombreCia){
  const match = nombreCia.match(/^(\d+)ª/);
  if(match) return parseInt(match[1], 10);
  if(nombreCia === 'Central de Alarmas') return 9000;
  return 9999; // "—" (sin Compañía) siempre al final
}
const NOMBRE_ESP = { R:'Rescate', T:'Trauma', H:'HAZ-MAT', F:'Forestal', M:'Maquinista', C:'Cuerda' };
// Pedido explícito: chips de Especialidad más grandes, con color propio
// (antes eran todas cyan, sin distinción) y buen contraste de texto.
const ESP_COLOR = { R:'var(--esp-r)', T:'var(--esp-t)', H:'var(--esp-h)', F:'var(--esp-f)', M:'var(--esp-m)', C:'var(--esp-c)' };
const ESP_TEXTO = { R:'#fff', T:'#fff', H:'#241505', F:'#0B2B1C', M:'#fff', C:'#241505' };

const ROLES_INSTITUCIONALES = ['Superintendente','Vicesuperintendente','Secretario General','Tesorero General','Comandante','Segundo Comandante','Tercer Comandante','Cuarto Comandante'];
let USUARIOS = [];
let CIAS = ['Todas'];
let ciaFiltro = 'Todas';
let cuerpoActivo = null;
let miCompaniaId = null;

async function cargarSesion(){
  const { data: { session } } = await sb.auth.getSession();
  if(!session){ toast('Necesitás loguearte primero'); return; }
  const { data: perfil } = await sb.from('personal').select('cuerpo_id, compania_id, cargo').eq('auth_user_id', session.user.id).maybeSingle();
  if(perfil && perfil.cuerpo_id){
    cuerpoActivo = perfil.cuerpo_id;
    // Bug reportado: un Director/Secretario de Compañía veía TODO el
    // Cuerpo acá (sentía que entraba a una herramienta de "control
    // maestro") — si la sesión tiene Compañía propia, se acota a esa
    // sola. Los cargos institucionales (Comandancia/Administración
    // General) ahora PUEDEN tener Compañía propia también (siguen siendo
    // bomberos de su Compañía, además de su cargo institucional), así que
    // se los excluye de esa restricción explícitamente en vez de asumir
    // que nunca tienen compania_id.
    const esInstitucional = ROLES_INSTITUCIONALES.includes(perfil.cargo);
    miCompaniaId = esInstitucional ? null : (perfil.compania_id || null);
    document.getElementById('roleTag').textContent = 'Sesión: ' + perfil.cargo;
    document.getElementById('filtroCiaRow').style.display = miCompaniaId ? 'none' : 'flex';
    await cargarUsuarios();
    return;
  }
  const { data: soyAdmin } = await sb.rpc('soy_super_admin');
  if(!soyAdmin){ toast('No se pudo determinar tu Cuerpo'); return; }
  document.getElementById('roleTag').textContent = 'Sesión: Super Admin';
  document.getElementById('panelSelectorCuerpo').style.display = 'block';
  const { data: cuerpos } = await sb.from('cuerpos').select('id, nombre_oficial').order('nombre_oficial');
  const sel = document.getElementById('selectCuerpo');
  sel.innerHTML = (cuerpos || []).map(c => `<option value="${c.id}">${c.nombre_oficial}</option>`).join('');
  sel.addEventListener('change', () => { cuerpoActivo = sel.value; cargarUsuarios(); });
  if(cuerpos && cuerpos.length){ cuerpoActivo = cuerpos[0].id; await cargarUsuarios(); }
}

async function cargarUsuarios(){
  const { data: cuerpoRow } = await sb.from('cuerpos').select('nombre_oficial').eq('id', cuerpoActivo).single();
  const alcanceTxt = miCompaniaId ? 'Mi Compañía' : 'Todas las Compañías, sin filtro';
  document.getElementById('nombreCuerpoHead').textContent = (cuerpoRow ? cuerpoRow.nombre_oficial : '—') + ' · ' + alcanceTxt + ' · Vigor';

  let query = sb.from('personal')
    .select('id, numero_registro, nombre_completo, cargo, estado, fecha_ingreso, companias(nombre), personal_especialidades(especialidades(codigo))')
    .eq('cuerpo_id', cuerpoActivo);
  if(miCompaniaId) query = query.eq('compania_id', miCompaniaId);
  const { data } = await query;

  USUARIOS = (data || []).map(p => ({
    id: p.id, reg: p.numero_registro, nombre: p.nombre_completo, cargo: p.cargo,
    cia: p.companias ? p.companias.nombre : 'Central de Alarmas',
    estado: p.estado === 'dado_de_baja' ? 'baja' : 'activo',
    ingreso: p.fecha_ingreso ? new Date(p.fecha_ingreso+'T00:00:00').getFullYear() : '—',
    esp: (p.personal_especialidades || []).map(pe => pe.especialidades.codigo),
  }));

  const CIAS_UNICAS = [...new Set(USUARIOS.map(u => u.cia))].sort((a,b) => numeroDeOrdenCia(a) - numeroDeOrdenCia(b));
  CIAS = ['Todas', ...CIAS_UNICAS];
  ciaFiltro = 'Todas';
  renderFiltroCia();
  renderTabla();
}

function renderFiltroCia(){
  document.getElementById('filtroCiaRow').innerHTML = CIAS.map(c =>
    `<button class="filtro-btn ${ciaFiltro===c?'on':''}" onclick="setCiaFiltro('${c}')">${c}</button>`
  ).join('');
}
function setCiaFiltro(c){ ciaFiltro = c; renderFiltroCia(); renderTabla(); }

function renderTabla(){
  const q = document.getElementById('buscador').value.trim().toLowerCase();
  let filtrados = USUARIOS.filter(u =>
    (ciaFiltro==='Todas' || u.cia===ciaFiltro) &&
    (u.nombre.toLowerCase().includes(q) || String(u.reg).includes(q))
  );
  // Siempre ordenado por Compañía primero (1ª→5ª→Central→Sin Compañía),
  // y dentro de cada Compañía por N° de Registro.
  filtrados = filtrados.slice().sort((a,b) => {
    const ordA = numeroDeOrdenCia(a.cia), ordB = numeroDeOrdenCia(b.cia);
    if(ordA !== ordB) return ordA - ordB;
    return a.reg - b.reg;
  });
  document.getElementById('tablaBody').innerHTML = filtrados.map(u => `
    <tr>
      <td class="td-reg">N° ${u.reg}</td>
      <td class="td-nombre">${u.nombre}</td>
      <td>${u.cargo}</td>
      <td>${u.cia}</td>
      <td class="mono">${u.ingreso}</td>
      <td>${u.esp.length ? u.esp.map(e=>`<span class="esp-chip" style="background:${ESP_COLOR[e]||'var(--panel-alt)'}; color:${ESP_TEXTO[e]||'#fff'};" title="${NOMBRE_ESP[e]||e}">${e}</span>`).join('') : '<span style="color:var(--text-dim);">—</span>'}</td>
      <td><span class="estado-pill ${u.estado}">${u.estado==='activo'?'Activo':'Dado de Baja'}</span></td>
      <td><button class="btn-ver-ficha" onclick="window.location.href='ficha_bombero.html?bombero=${u.id}'">Ver Ficha</button></td>
    </tr>
  `).join('') || `<tr><td colspan="8" style="text-align:center; padding:30px; color:var(--text-dim); font-style:italic;">Sin resultados.</td></tr>`;
}

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2800);
}

cargarSesion();
</script>
</body>
</html>
