<style>
  :root{
    --bg:#060A0F; --panel:#0A131C; --panel-alt:#0E1D28; --line:#132734; --line-strong:#1C3B49;
    --text:#E7F5FA; --text-muted:#7B99A3; --text-dim:#516E78;
    --brass:#C97A2E; --brass-bright:#FF9A44; --brass-dim:#8A4E1E;
    --cyan:#49E9FF; --cyan-dim:#1E6E7D; --cyan-glow:rgba(73,233,255,0.35); --amber-glow:rgba(255,154,68,0.32);
    --burdeo:#7A1620; --burdeo-bright:#D8394E;
    --servicio:#3CF29A; --emergencia:#FF4B5C; --alerta:#FFC94D; --fuera:#C9A63B; --nodisp:#42555C;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;}
  body{ background:var(--bg); color:var(--text); font-family:'Inter',sans-serif; height:100vh; display:flex; flex-direction:column;}
  .mono{font-family:'JetBrains Mono',monospace;}
  h1,h2,h3{font-family:'Rajdhani',sans-serif; text-transform:uppercase; letter-spacing:.04em; font-weight:700; margin:0;}

  /* ---- Crear Carro: formulario a la izquierda, vista previa del carro a la derecha ---- */
  .pantalla{ flex:1; min-height:0; overflow-y:auto;}
  .crear-wrap{ max-width:1020px; margin:0 auto; padding:20px 22px 40px; display:grid; grid-template-columns:minmax(0,1fr) 340px; gap:18px; align-items:start;}
  .nameplate{ display:none;}
  .form-head:not(:has(*)){ display:none;}
  .col-form{ display:flex; flex-direction:column; gap:14px; min-width:0;}
  .tarjeta{ background:var(--panel); border:1.5px solid var(--line-strong); border-radius:16px; padding:18px;}
  .tarjeta-t{ font-size:11px; color:var(--cyan); text-transform:uppercase; letter-spacing:.1em; font-weight:700; margin:0 0 14px;}
  .campo{ display:flex; flex-direction:column; gap:6px; margin-bottom:14px;}
  .campo:last-child{ margin-bottom:0;}
  .campo label{ font-size:10.5px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.07em; font-weight:700;}
  .campo input, .campo select{ background:var(--panel-alt); border:1.5px solid var(--line-strong); border-radius:12px; padding:12px 14px; font-size:14px; color:var(--text); font-family:inherit; width:100%;}
  .campo input.mono{ font-family:'JetBrains Mono',monospace; letter-spacing:.04em;}
  .campo input:focus, .campo select:focus{ outline:none; border-color:var(--cyan);}
  .dos{ display:grid; grid-template-columns:1fr 1fr; gap:14px;}

  .cia-locked-card{ display:flex; align-items:center; gap:14px; background:var(--panel-alt); border:1.5px solid var(--line-strong); border-radius:12px; padding:12px 14px;}
  .cia-locked-badge{ width:44px; height:44px; border-radius:50%; background:var(--vg-grad, linear-gradient(90deg,#34B8FF,#35F454)); color:#06141F; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:14px; flex-shrink:0;}
  .cia-locked-nombre{ font-size:14px; font-weight:700;}
  .cia-locked-sub{ font-size:11px; color:var(--text-dim); margin-top:3px;}

  .tipos{ display:flex; flex-wrap:wrap; gap:8px;}
  .tipo-chip{ background:var(--panel-alt); border:1.5px solid var(--line-strong); color:var(--text-muted); border-radius:999px; padding:8px 14px; font-size:12.5px; font-weight:600; cursor:pointer; font-family:inherit;}
  .tipo-chip:hover{ border-color:var(--cyan); color:var(--text);}
  .tipo-chip.on{ background:var(--vg-grad, linear-gradient(90deg,#34B8FF,#35F454)); border-color:transparent; color:#06141F; font-weight:800;}

  .foto-upload{ display:flex; align-items:center; gap:14px; background:var(--panel-alt); border:1.5px dashed var(--line-strong); border-radius:12px; padding:14px 16px; cursor:pointer;}
  .foto-upload:hover{ border-color:var(--cyan);}
  .foto-upload svg{ width:26px; height:26px; color:var(--cyan); flex-shrink:0;}
  .foto-upload span{ font-size:13px; color:var(--text-muted); overflow-wrap:anywhere;}

  .btn-guardar{ width:100%; border:none; color:#06141F; font-weight:800; font-size:15px; padding:15px; border-radius:14px; cursor:pointer; font-family:inherit; background:var(--vg-grad, linear-gradient(90deg,#34B8FF,#35F454));}
  .btn-guardar:hover{ filter:brightness(1.08);}
  .btn-guardar:disabled{ opacity:.5; cursor:not-allowed;}

  /* Vista previa: así se verá el carro en la Compañía */
  .col-prev{ position:sticky; top:14px;}
  .prev-etq{ font-size:10.5px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.1em; font-weight:700; margin:0 4px 8px;}
  .carro-card{ background:var(--panel); border:1.5px solid var(--line-strong); border-radius:16px; overflow:hidden;}
  .carro-foto{ aspect-ratio:16/10; background:radial-gradient(120% 90% at 50% 100%, rgba(45,211,219,.10), transparent 70%), var(--panel-alt); background-size:cover; background-position:center; display:flex; align-items:center; justify-content:center; color:var(--line-strong);}
  .camion-def{ width:72%; max-width:300px; height:auto; display:block; filter:drop-shadow(0 6px 18px rgba(45,211,219,.25));}
  .carro-info{ padding:14px 16px 16px;}
  .carro-fila{ display:flex; align-items:flex-start; justify-content:space-between; gap:10px;}
  .carro-nom{ font-weight:800; font-size:28px; line-height:1; background:var(--vg-grad, linear-gradient(90deg,#34B8FF,#35F454)); -webkit-background-clip:text; background-clip:text; color:transparent;}
  .carro-tipo{ font-size:12px; color:var(--text-muted); margin-top:6px;}
  .carro-estado-pill{ font-size:9.5px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; padding:4px 10px; border-radius:10px; background:#3CF29A; color:#06141F; flex-shrink:0;}
  .carro-datos{ display:flex; flex-wrap:wrap; gap:8px; margin-top:12px;}
  .dato{ font-size:11px; color:var(--text-muted); background:var(--panel-alt); border:1px solid var(--line-strong); border-radius:999px; padding:5px 11px;}
  .dato b{ color:var(--text); font-weight:700;}

  .toast{ position:fixed; bottom:26px; left:50%; transform:translateX(-50%) translateY(12px); background:var(--panel-alt); border:1px solid var(--cyan); color:#DFF7F9; padding:13px 22px; border-radius:10px; font-size:13.5px; opacity:0; pointer-events:none; transition:all .25s; z-index:90; text-align:center; max-width:90vw;}
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0);}

  @media (max-width:860px){
    html,body{ overflow:auto; height:auto; min-height:100%;}
    body{ height:auto; display:block;}
    .pantalla{ overflow:visible;}
    .crear-wrap{ grid-template-columns:1fr; padding:14px 14px 30px;}
    .col-prev{ position:static; order:-1;}
    .carro-foto{ aspect-ratio:16/8;}
    .dos{ grid-template-columns:1fr;}
  }
</style>

<script>
// --- Conexión real a Supabase ---
const SUPABASE_URL = 'https://mcfcfbtiruewlcejionr.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1jZmNmYnRpcnVld2xjZWppb25yIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzODExNzgsImV4cCI6MjEwMzk1NzE3OH0.9b_t63ah25RIGNn3pzZU3L553YUrrn7IXWW3MEjXuXU';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { persistSession: true, autoRefreshToken: true } });

// Pedido explícito: en Celular (ancho angosto) "Volver" va directo a
// Opciones — en PC se mantiene exactamente el destino de siempre
// (Administración General).
function volverCrearCarro(){
  if(window.history.length > 1){ history.back(); return; }
  window.location.href = window.innerWidth <= 760 ? 'opciones_celular.html' : 'administracion_general.html';
}

// La Compañía queda fija a la de la sesión real — ya no es un selector de
// rol demo. Si la persona tiene compania_id, crea carros ahí; si es
// Cuerpo General (compania_id null, ej. Superintendencia/Comandancia),
// crea carros de Comandancia — numeración N°0 (K-0, Z-0, J-0… sección 8.1).
let ambito = null; // { esComandancia, companiaId, label, badge, placeholder }
let miCuerpoId = null;

function renderCiaLocked(){
  const a = ambito;
  document.getElementById('ciaLockedBadge').textContent = a.badge;
  document.querySelector('.cia-locked-nombre').textContent = a.label;
  document.getElementById('nomenclaturaField').placeholder = a.placeholder;
  actualizarPreview();
}

async function cargarSesion(){
  const { data: { session } } = await sb.auth.getSession();
  if(!session){
    document.getElementById('roleTag').textContent = 'Sin sesión — inicia sesión primero';
    document.querySelector('.btn-guardar').disabled = true;
    return;
  }
  const { data: perfil } = await sb.from('personal')
    .select('id, cuerpo_id, compania_id, nombre_completo, cargo, companias(nombre, numero)')
    .eq('auth_user_id', session.user.id).single();
  if(!perfil){
    document.getElementById('roleTag').textContent = 'Sin perfil real';
    return;
  }
  miCuerpoId = perfil.cuerpo_id;
  document.getElementById('roleTag').textContent = `${perfil.nombre_completo} · ${perfil.cargo}`;

  // Bug reportado: Administración General/Comandancia ahora PUEDEN tener
  // Compañía propia también (siguen siendo bomberos de su Compañía,
  // además de su cargo institucional) -- antes esto los dejaba con el
  // candado puesto en SU Compañía, sin poder crear carros para otra ni
  // para Comandancia. Se les da un selector real en vez del candado.
  const esInstitucional = ROLES_INSTITUCIONALES.includes(perfil.cargo);
  if(esInstitucional){
    document.getElementById('ciaLockedCard').style.display = 'none';
    document.getElementById('ciaSelectorWrap').style.display = 'flex';
    const { data: cias } = await sb.from('companias').select('id, nombre, numero').eq('cuerpo_id', miCuerpoId).order('numero');
    const sel = document.getElementById('ciaSelectorField');
    sel.innerHTML = (cias || []).map(c => `<option value="${c.id}">${c.nombre}</option>`).join('')
      + `<option value="__comandancia__">Comandancia (Cuerpo General)</option>`;
    CIAS_SELECTOR = cias || [];
    onCiaSelectorChange();
    return;
  }

  if(perfil.compania_id){
    ambito = { esComandancia:false, companiaId: perfil.compania_id, label: perfil.companias.nombre, badge: perfil.companias.numero + 'ª', placeholder:'Ej. B-0' };
  } else {
    ambito = { esComandancia:true, companiaId: null, label:'Comandancia (Cuerpo General)', badge:'N°0', placeholder:'Ej. K-0' };
  }
  renderCiaLocked();
}

const ROLES_INSTITUCIONALES = ['Superintendente','Vicesuperintendente','Secretario General','Tesorero General','Comandante','Segundo Comandante','Tercer Comandante','Cuarto Comandante'];
let CIAS_SELECTOR = [];
function onCiaSelectorChange(){
  const val = document.getElementById('ciaSelectorField').value;
  if(val === '__comandancia__'){
    ambito = { esComandancia:true, companiaId: null, label:'Comandancia (Cuerpo General)', badge:'N°0', placeholder:'Ej. K-0' };
  } else {
    const c = CIAS_SELECTOR.find(x => x.id === val);
    ambito = { esComandancia:false, companiaId: val, label: c ? c.nombre : '—', badge: c ? c.numero + 'ª' : '—', placeholder:'Ej. B-0' };
  }
  actualizarPreview();
}

const TIPOS = ['Bomba','Rescate','Aljibe','Forestal','Hazmat','Porta Escala','Transporte de Personal'];
let tipoSel = 'Bomba';   // 'otro' = «Otro (especificar)…»
function renderTipos(){
  document.getElementById('tiposRow').innerHTML = TIPOS.map(t =>
    `<button type="button" class="tipo-chip ${tipoSel === t ? 'on' : ''}" onclick="setTipo('${t}')">${t}</button>`
  ).join('') + `<button type="button" class="tipo-chip ${tipoSel === 'otro' ? 'on' : ''}" onclick="setTipo('otro')">Otro (especificar)…</button>`;
}
function setTipo(t){
  tipoSel = t;
  renderTipos();
  const esOtro = t === 'otro';
  document.getElementById('tipoOtroRow').style.display = esOtro ? 'flex' : 'none';
  if(esOtro) document.getElementById('tipoOtroField').focus();
  actualizarPreview();
}

function tipoActual(){
  if(tipoSel === 'otro'){
    return document.getElementById('tipoOtroField').value.trim() || 'Tipo a especificar';
  }
  return tipoSel;
}

function actualizarPreview(){
  const nom = document.getElementById('nomenclaturaField').value.trim() || (ambito ? ambito.placeholder.replace('Ej. ','') : '');
  document.getElementById('previewNom').textContent = nom;
  document.getElementById('previewTipo').textContent = tipoActual();
  document.getElementById('previewPatente').textContent = document.getElementById('patenteField').value.trim().toUpperCase() || '—';
  document.getElementById('previewCia').innerHTML = '<b>' + (ambito ? ambito.label : '—') + '</b>';
}

async function crearCarro(){
  const nom = document.getElementById('nomenclaturaField').value.trim();
  if(!nom){ toast('Ingresa la nomenclatura del carro'); return; }
  const patente = document.getElementById('patenteField').value.trim();
  if(!patente){ toast('Ingresa la patente del carro'); return; }
  if(!ambito || !miCuerpoId){ toast('Debes iniciar sesión primero'); return; }

  const { data, error } = await sb.rpc('crear_carro_con_login', {
    p_cuerpo_id: miCuerpoId,
    p_compania_id: ambito.companiaId,
    p_nomenclatura: nom,
    p_tipo_descripcion: tipoActual(),
    p_patente: patente
  });

  if(error){
    toast(error.code === '23505' ? `Ya existe un carro con la nomenclatura "${nom}"` : 'No se pudo crear — ' + error.message);
    return;
  }

  const resultado = Array.isArray(data) ? data[0] : data;
  // El carro ya está creado: la foto (si se eligió) se sube y se guarda; si falla, el carro igual queda creado
  if(fotoArchivo){
    const ok = await guardarFotoCarro(resultado.r_carro_id, fotoArchivo);
    if(!ok) toast('El carro se creó, pero no se pudo guardar la foto.');
  }
  mostrarCredencialCarro(nom, resultado.r_password_temporal);
}

// La Tablet montada en este carro se loguea con esta credencial en el
// mismo login_registro.html de todos — Usuario: la Nomenclatura, más el
// Código de Cuerpo y esta contraseña. Se muestra una sola vez, igual que
// las contraseñas temporales de Directores en el Wizard.
function mostrarCredencialCarro(nomenclatura, passwordTemporal){
  const modal = document.createElement('div');
  modal.style.cssText = 'position:fixed;inset:0;background:rgba(5,10,15,.75);z-index:80;display:flex;align-items:center;justify-content:center;padding:24px;';
  modal.innerHTML = `
    <div style="background:var(--panel);border:1.5px solid var(--line-strong);border-radius:16px;padding:26px 24px;max-width:400px;width:100%;">
      <h3 style="font-size:16px;margin-bottom:12px;">✅ Carro ${nomenclatura} creado</h3>
      <p style="font-size:12.5px;color:var(--text-muted);line-height:1.6;margin-bottom:16px;">
        Para instalar la Tablet de este carro, ve a la pantalla de <b>inicio de sesión</b>, escribe en Usuario la Nomenclatura (${nomenclatura}), completa el Código de Cuerpo y esta contraseña. Guárdala ahora, no se vuelve a mostrar.
      </p>
      <div style="font-family:'JetBrains Mono',monospace;font-size:20px;text-align:center;color:var(--cyan);background:var(--panel-alt);border:1px solid var(--line-strong);border-radius:12px;padding:14px;margin-bottom:16px;">${passwordTemporal}</div>
      <button onclick="this.closest('div[style*=fixed]').remove(); location.reload();" style="width:100%;border:none;color:#06141F;font-weight:800;font-size:14px;padding:13px;border-radius:12px;cursor:pointer;font-family:inherit;background:var(--vg-grad,linear-gradient(90deg,#34B8FF,#35F454));">Entendido</button>
    </div>`;
  document.body.appendChild(modal);
}

// Reduce la foto (máx. 1280 px, JPEG) para que no pese tanto al subirla desde el celular
function reducirFoto(file){
  return new Promise((resolve) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, 1280 / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      c.toBlob((blob) => resolve(blob || file), 'image/jpeg', 0.85);
    };
    img.onerror = () => { URL.revokeObjectURL(url); resolve(file); };
    img.src = url;
  });
}
async function guardarFotoCarro(carroId, file){
  try{
    if(!carroId) return false;
    const blob = await reducirFoto(file);
    const path = `${miCuerpoId}/carros/${crypto.randomUUID()}.jpg`;
    const { error: upErr } = await sb.storage.from('vigor-fotos').upload(path, blob, { contentType: blob.type || 'image/jpeg' });
    if(upErr) return false;
    const url = sb.storage.from('vigor-fotos').getPublicUrl(path).data.publicUrl;
    const { error } = await sb.from('carros').update({ foto_url: url }).eq('id', carroId);
    return !error;
  }catch(e){ return false; }
}

// Selector de archivo real (abre el explorador nativo) con vista previa
// real de la imagen elegida — no es un aviso de mentira.
let fotoArchivo = null;
function previsualizarFoto(input){
  if(!input.files || !input.files[0]) return;
  const file = input.files[0];
  fotoArchivo = file;
  const reader = new FileReader();
  reader.onload = (e) => {
    const foto = document.getElementById('previewFoto');
    foto.style.backgroundImage = `url(${e.target.result})`;
    foto.innerHTML = '';
    document.getElementById('fotoLabel').textContent = file.name;
  };
  reader.readAsDataURL(file);
}

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2800);
}
