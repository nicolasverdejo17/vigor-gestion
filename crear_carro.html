<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Vigor — Ingresar Ítem</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#060A0F; --panel:#0A131C; --panel-alt:#0E1D28; --line:#132734; --line-strong:#1C3B49;
    --text:#E7F5FA; --text-muted:#7B99A3; --text-dim:#516E78;
    --brass:#C97A2E; --brass-bright:#FF9A44; --brass-dim:#8A4E1E;
    --cyan:#49E9FF; --cyan-dim:#1E6E7D; --cyan-glow:rgba(73,233,255,0.35); --amber-glow:rgba(255,154,68,0.32);
    --burdeo:#7A1620; --burdeo-bright:#D8394E;
    --servicio:#3CF29A; --emergencia:#FF4B5C; --alerta:#FFC94D; --fuera:#C9A63B; --nodisp:#42555C;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;}
  body{
    background:
      radial-gradient(1100px 500px at 15% -10%, rgba(73,233,255,0.06), transparent 60%),
      var(--bg);
    color:var(--text); font-family:'Inter',sans-serif;
    height:100vh; display:flex; flex-direction:column;
  }
  .mono{font-family:'JetBrains Mono',monospace;}
  h1,h2,h3{font-family:'Rajdhani',sans-serif; text-transform:uppercase; letter-spacing:.04em; font-weight:700; margin:0;}

  .nameplate{ background:linear-gradient(180deg,var(--panel-alt),var(--panel)); border-bottom:2px solid var(--brass-dim); flex-shrink:0;}
  .nameplate-inner{ display:flex; align-items:center; justify-content:space-between; padding:14px 26px; flex-wrap:wrap; gap:12px;}
  .brand{ display:flex; align-items:center; gap:12px;}
  .brand-mark{ width:36px;height:36px; border:1.5px solid var(--brass); border-radius:3px; display:flex; align-items:center; justify-content:center; position:relative; background:var(--panel);}
  .brand-mark::before{ content:""; position:absolute; inset:4px; border:1px solid var(--brass-dim); border-radius:2px;}
  .brand-mark svg{ width:15px; height:15px;}
  .brand-text h1{ font-size:19px; letter-spacing:.04em;}
  .brand-text span{ font-size:10.5px; color:var(--text-dim); letter-spacing:.1em; text-transform:uppercase; display:block; margin-top:2px;}
  .role-tag{
    font-family:'Rajdhani'; font-weight:700; font-size:11.5px; letter-spacing:.06em; text-transform:uppercase;
    padding:6px 14px; border-radius:4px; background:var(--panel); border:1.5px solid var(--brass); color:var(--brass-bright);
  }
  .role-switch{ display:flex; gap:4px; background:var(--panel); border:1px solid var(--line-strong); border-radius:5px; padding:3px;}
  .role-switch-btn{
    background:transparent; border:none; color:var(--text-muted); font-family:'Inter'; font-weight:600; font-size:10.5px;
    padding:6px 10px; border-radius:3px; cursor:pointer;
  }
  .role-switch-btn.on{ background:var(--cyan-dim); color:#fff;}

  .form-wrap{ flex:1; min-height:0; padding:20px 32px 24px; display:flex; flex-direction:column; overflow:hidden;}
  .form-head{ display:flex; align-items:center; gap:14px; margin-bottom:16px; flex-shrink:0;}
  .back-btn{
    background:var(--panel); border:1.5px solid var(--line-strong); color:var(--text-muted);
    font-family:'Rajdhani'; font-weight:600; letter-spacing:.03em; text-transform:uppercase;
    font-size:12.5px; padding:9px 16px; border-radius:5px; cursor:pointer;
  }
  .back-btn:hover{ border-color:var(--brass-bright); color:var(--text);}
  .form-head h2{ font-size:22px;}

  .form-body{
    flex:1; min-height:0; background:var(--panel); border:1px solid var(--line-strong);
    border-radius:10px; padding:22px 28px; overflow-y:auto; position:relative; max-width:820px;
  }
  .form-body::before{ content:""; position:absolute; inset:6px; border:1px solid var(--brass-dim); border-radius:6px; pointer-events:none; opacity:.4;}

  .section-title{
    font-size:11.5px; color:var(--brass-bright); text-transform:uppercase; letter-spacing:.1em;
    font-weight:700; margin:0 0 14px; padding-bottom:8px; border-bottom:1px solid var(--line);
  }
  .section-title:not(:first-child){ margin-top:22px;}

  .form-row{ display:grid; grid-template-columns:1fr 1fr; gap:18px; margin-bottom:16px;}
  .form-field{ display:flex; flex-direction:column; gap:6px;}
  .form-field.full{ grid-column:1 / -1;}
  .form-field label{ font-size:11px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.07em; font-weight:600;}
  .form-field input, .form-field select{
    background:var(--panel-alt); border:1.5px solid var(--line-strong); border-radius:6px;
    padding:11px 13px; font-size:14px; color:var(--text); font-family:'Inter';
  }
  .form-field input:focus, .form-field select:focus{ outline:none; border-color:var(--cyan);}

  /* Bug reportado: "completamente descompaginado" en Celular — el form de
     2 columnas fijas no entraba en un teléfono. */
  @media (max-width:760px){
    html,body{ overflow:auto; height:auto; min-height:100%;}
    body{ height:auto;}
    .form-wrap{ padding:14px 12px 20px; overflow:visible;}
    .form-body{ padding:16px 16px; max-width:none;}
    .form-row{ grid-template-columns:1fr; gap:12px;}
    .form-head h2{ font-size:17px;}
    .nameplate-inner{ padding:12px 14px;}
  }
  .form-field input.mono{ font-family:'JetBrains Mono',monospace;}

  .cat-select-row{ display:flex; gap:8px; flex-wrap:wrap;}
  .cat-opt{
    flex:1; min-width:120px; background:var(--panel-alt); border:1.5px solid var(--line-strong); border-radius:6px;
    padding:10px; text-align:center; font-size:12.5px; font-weight:600; color:var(--text-muted); cursor:pointer;
  }
  .cat-opt.on{ background:var(--cyan-dim); border-color:var(--cyan); color:#fff;}

  .subcat-select-row{ display:none; gap:8px; flex-wrap:wrap; margin-top:-8px; margin-bottom:16px;}
  .subcat-select-row.show{ display:flex;}
  .subcat-opt{
    background:var(--panel-alt); border:1.5px solid var(--brass-dim); border-radius:16px;
    padding:6px 13px; font-size:11.5px; font-weight:600; color:var(--text-muted); cursor:pointer;
  }
  .subcat-opt.on{ background:var(--brass-dim); border-color:var(--brass-bright); color:#fff;}

  .foto-upload{
    display:flex; align-items:center; gap:14px; background:var(--panel-alt); border:1.5px dashed var(--line-strong);
    border-radius:8px; padding:14px 16px; cursor:pointer;
  }
  .foto-upload .circle{
    width:44px; height:44px; border-radius:8px; background:var(--panel); border:2px solid var(--line-strong);
    display:flex; align-items:center; justify-content:center; flex-shrink:0; font-size:18px; color:var(--text-dim);
  }
  .foto-upload span{ font-size:13px; color:var(--text-muted);}

  .btn-guardar{
    width:100%; margin-top:20px; background:var(--cyan-dim); border:2px solid var(--cyan); color:#fff;
    font-family:'Rajdhani'; font-weight:700; letter-spacing:.05em; text-transform:uppercase;
    font-size:15px; padding:14px; border-radius:8px; cursor:pointer;
  }
  .btn-guardar:hover{ background:var(--cyan); color:#0D2226;}

  .carro-preview-card{
    display:flex; align-items:baseline; gap:14px; background:var(--panel-alt); border:1.5px solid var(--brass-dim);
    border-radius:8px; padding:16px 18px; margin-bottom:4px;
  }
  .carro-preview-nom{ font-family:'JetBrains Mono',monospace; font-weight:700; font-size:24px; color:var(--brass-bright);}
  .carro-preview-tipo{ font-size:13px; color:var(--text-muted);}

  .cia-locked-card{
    display:flex; align-items:center; gap:14px; background:var(--panel-alt); border:1.5px dashed var(--line-strong);
    border-radius:8px; padding:14px 16px;
  }
  .cia-locked-badge{
    width:44px; height:44px; border-radius:8px; border:2px solid var(--line-strong); background:var(--panel);
    display:flex; align-items:center; justify-content:center; font-family:'JetBrains Mono',monospace; font-weight:700; font-size:14px;
    color:var(--text-muted); flex-shrink:0;
  }
  .cia-locked-nombre{ font-size:14px; font-weight:600; color:var(--text-muted);}
  .cia-locked-sub{ font-size:11px; color:var(--text-dim); margin-top:2px;}

  .toast{
    position:fixed; bottom:26px; left:50%; transform:translateX(-50%) translateY(12px);
    background:var(--panel-alt); border:1px solid var(--cyan); color:#DFF7F9;
    padding:13px 22px; border-radius:6px; font-size:13.5px; opacity:0; pointer-events:none;
    transition:all .25s; z-index:50;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0);}
</style>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="icons/favicon-16.png" sizes="16x16" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#060A0F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Vigor">
<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}</script>
</head>
<body>

  <div class="nameplate">
    <div class="nameplate-inner">
      <div class="brand">
        <div class="brand-mark"><svg viewBox="0 0 24 24" fill="none"><path d="M12 2L4 6v6c0 5 3.5 8.5 8 10 4.5-1.5 8-5 8-10V6l-8-4z" stroke="#49E9FF" stroke-width="1.6"/></svg></div>
        <div class="brand-text"><h1>Administración — Crear Carro</h1><span>Vigor</span></div>
      </div>
      <div style="display:flex; align-items:center; gap:10px;">
        <div class="role-tag" id="roleTag">Sin sesión</div>
      </div>
    </div>
  </div>

  <div class="form-wrap">
    <div class="form-head">
      <button class="back-btn" onclick="volverCrearCarro()">← Volver</button>
      <h2>Crear Carro</h2>
    </div>

    <div class="form-body">
      <div class="section-title">Compañía</div>
      <div class="cia-locked-card">
        <div class="cia-locked-badge" id="ciaLockedBadge">3ª</div>
        <div>
          <div class="cia-locked-nombre">3ª Compañía</div>
          <div class="cia-locked-sub">🔒 Un Director solo puede crear carros para su propia Compañía</div>
        </div>
      </div>

      <div class="section-title">Identidad del Carro</div>
      <div class="form-row">
        <div class="form-field">
          <label>Nomenclatura</label>
          <input type="text" class="mono" id="nomenclaturaField" placeholder="Ej. B-0" oninput="actualizarPreview()">
        </div>
        <div class="form-field">
          <label>Tipo</label>
          <select id="tipoField" onchange="onTipoChange()">
            <option>Bomba</option>
            <option>Rescate</option>
            <option>Aljibe</option>
            <option>Forestal</option>
            <option>Hazmat</option>
            <option>Porta Escala</option>
            <option>Transporte de Personal</option>
            <option value="otro">Otro (especificar)…</option>
          </select>
        </div>
      </div>
      <div class="form-row" id="tipoOtroRow" style="display:none;">
        <div class="form-field full">
          <label>Especificar tipo</label>
          <input type="text" id="tipoOtroField" placeholder="Ej. Bomba Tanker, Carro de Comando, Ambulancia…" oninput="actualizarPreview()">
        </div>
      </div>
      <div class="form-row">
        <div class="form-field full">
          <label>Patente</label>
          <input type="text" class="mono" id="patenteField" placeholder="Ej. XZ-KL-45">
        </div>
      </div>

      <div class="section-title">Vista previa</div>
      <div class="carro-preview-card" id="carroPreview">
        <span class="carro-preview-nom" id="previewNom">B-6</span>
        <span class="carro-preview-tipo" id="previewTipo">Bomba</span>
      </div>

      <div class="section-title">Foto (opcional)</div>
      <div class="foto-upload" onclick="document.getElementById('fotoInput').click()">
        <div class="circle" id="fotoCircle">📷</div>
        <span id="fotoLabel">Subir foto del carro</span>
      </div>
      <input type="file" id="fotoInput" accept="image/*" style="display:none;" onchange="previsualizarFoto(this)">

      <button class="btn-guardar" onclick="crearCarro()">Crear Carro</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// --- Conexión real a Supabase ---
const SUPABASE_URL = 'https://mcfcfbtiruewlcejionr.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1jZmNmYnRpcnVld2xjZWppb25yIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzODExNzgsImV4cCI6MjEwMzk1NzE3OH0.9b_t63ah25RIGNn3pzZU3L553YUrrn7IXWW3MEjXuXU';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// Pedido explícito: en Celular (ancho angosto) "Volver" va directo a
// Opciones — en PC se mantiene exactamente el destino de siempre
// (Administración General).
function volverCrearCarro(){
  window.location.href = window.innerWidth <= 760 ? 'opciones_celular.html' : 'administracion_general.html';
}

// La Compañía queda fija a la de la sesión real — ya no es un selector de
// rol demo. Si la persona tiene compania_id, crea carros ahí; si es
// Cuerpo General (compania_id null, ej. Superintendencia/Comandancia),
// crea carros de Comandancia — numeración N°0 (K-0, Z-0, J-0… sección 8.1).
let ambito = null; // { esComandancia, companiaId, label, badge, placeholder }
let miCuerpoId = null;

function renderCiaLocked(){
  const a = ambito;
  document.getElementById('ciaLockedBadge').textContent = a.badge;
  document.querySelector('.cia-locked-nombre').textContent = a.label;
  document.querySelector('.cia-locked-sub').textContent = a.esComandancia
    ? '🔒 Carro de Comandancia (Cuerpo General) — numeración N°0'
    : '🔒 Solo podés crear carros para tu propia Compañía';
  document.getElementById('nomenclaturaField').placeholder = a.placeholder;
  actualizarPreview();
}

async function cargarSesion(){
  const { data: { session } } = await sb.auth.getSession();
  if(!session){
    document.getElementById('roleTag').textContent = 'Sin sesión — andá a login_registro.html';
    document.querySelector('.btn-guardar').disabled = true;
    return;
  }
  const { data: perfil } = await sb.from('personal')
    .select('id, cuerpo_id, compania_id, nombre_completo, cargo, companias(nombre, numero)')
    .eq('auth_user_id', session.user.id).single();
  if(!perfil){
    document.getElementById('roleTag').textContent = 'Sin perfil real';
    return;
  }
  miCuerpoId = perfil.cuerpo_id;
  document.getElementById('roleTag').textContent = `${perfil.nombre_completo} · ${perfil.cargo}`;

  if(perfil.compania_id){
    ambito = { esComandancia:false, companiaId: perfil.compania_id, label: perfil.companias.nombre, badge: perfil.companias.numero + 'ª', placeholder:'Ej. B-0' };
  } else {
    ambito = { esComandancia:true, companiaId: null, label:'Comandancia (Cuerpo General)', badge:'N°0', placeholder:'Ej. K-0' };
  }
  renderCiaLocked();
}

function onTipoChange(){
  const esOtro = document.getElementById('tipoField').value === 'otro';
  document.getElementById('tipoOtroRow').style.display = esOtro ? 'grid' : 'none';
  if(esOtro) document.getElementById('tipoOtroField').focus();
  actualizarPreview();
}

function tipoActual(){
  const sel = document.getElementById('tipoField').value;
  if(sel === 'otro'){
    return document.getElementById('tipoOtroField').value.trim() || 'Tipo a especificar';
  }
  return sel;
}

function actualizarPreview(){
  const nom = document.getElementById('nomenclaturaField').value.trim() || (ambito ? ambito.placeholder.replace('Ej. ','') : '');
  document.getElementById('previewNom').textContent = nom;
  document.getElementById('previewTipo').textContent = tipoActual();
}

async function crearCarro(){
  const nom = document.getElementById('nomenclaturaField').value.trim();
  if(!nom){ toast('Ingresá la nomenclatura del carro'); return; }
  const patente = document.getElementById('patenteField').value.trim();
  if(!patente){ toast('Ingresá la patente del carro'); return; }
  if(!ambito || !miCuerpoId){ toast('Necesitás loguearte primero'); return; }

  const { data, error } = await sb.rpc('crear_carro_con_login', {
    p_cuerpo_id: miCuerpoId,
    p_compania_id: ambito.companiaId,
    p_nomenclatura: nom,
    p_tipo_descripcion: tipoActual(),
    p_patente: patente
  });

  if(error){
    toast(error.code === '23505' ? `Ya existe un carro con la nomenclatura "${nom}"` : 'No se pudo crear — ' + error.message);
    return;
  }

  const resultado = Array.isArray(data) ? data[0] : data;
  mostrarCredencialCarro(nom, resultado.r_password_temporal);
}

// La Tablet montada en este carro se loguea con esta credencial en el
// mismo login_registro.html de todos — Usuario: la Nomenclatura, más el
// Código de Cuerpo y esta contraseña. Se muestra una sola vez, igual que
// las contraseñas temporales de Directores en el Wizard.
function mostrarCredencialCarro(nomenclatura, passwordTemporal){
  const modal = document.createElement('div');
  modal.style.cssText = 'position:fixed;inset:0;background:rgba(5,10,15,.75);z-index:80;display:flex;align-items:center;justify-content:center;padding:24px;';
  modal.innerHTML = `
    <div style="background:var(--panel);border:1.5px solid var(--brass-dim);border-radius:12px;padding:26px 24px;max-width:380px;width:100%;">
      <h3 style="font-size:16px;margin-bottom:12px;">✅ Carro ${nomenclatura} creado</h3>
      <p style="font-size:12.5px;color:var(--text-muted);line-height:1.6;margin-bottom:16px;">
        Para instalar la Tablet de este carro, andá a <b>login_registro.html</b> → en Usuario poné la Nomenclatura (${nomenclatura}), completá el Código de Cuerpo y esta contraseña. Guardala ahora, no se vuelve a mostrar.
      </p>
      <div style="font-family:'JetBrains Mono',monospace;font-size:20px;text-align:center;color:var(--brass-bright);background:var(--panel-alt);border:1px solid var(--line-strong);border-radius:8px;padding:12px;margin-bottom:16px;">${passwordTemporal}</div>
      <button onclick="this.closest('div[style*=fixed]').remove(); location.reload();" style="width:100%;background:var(--cyan-dim);border:2px solid var(--cyan);color:#fff;font-family:'Rajdhani';font-weight:700;letter-spacing:.04em;text-transform:uppercase;font-size:13px;padding:11px;border-radius:7px;cursor:pointer;">Entendido</button>
    </div>`;
  document.body.appendChild(modal);
}

// Selector de archivo real (abre el explorador nativo) con vista previa
// real de la imagen elegida — no es un aviso de mentira.
function previsualizarFoto(input){
  if(!input.files || !input.files[0]) return;
  const file = input.files[0];
  const reader = new FileReader();
  reader.onload = (e) => {
    const circle = document.getElementById('fotoCircle');
    circle.style.backgroundImage = `url(${e.target.result})`;
    circle.style.backgroundSize = 'cover';
    circle.style.backgroundPosition = 'center';
    circle.textContent = '';
    document.getElementById('fotoLabel').textContent = file.name;
  };
  reader.readAsDataURL(file);
}

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2800);
}

cargarSesion();
actualizarPreview();
</script>
</body>
</html>
