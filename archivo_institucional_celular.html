<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Vigor — Archivo Institucional</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  @view-transition { navigation: auto; }
  :root{
    --bg:#060A0F; --panel:#0A131C; --panel-alt:#0E1D28; --line:#132734; --line-strong:#1C3B49;
    --text:#E7F5FA; --text-muted:#7B99A3; --text-dim:#516E78;
    --brass:#C97A2E; --brass-bright:#FF9A44; --brass-dim:#8A4E1E;
    --cyan:#49E9FF; --cyan-dim:#1E6E7D;
    --servicio:#3CF29A; --nodisp:#42555C;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;}
  body{
    background: radial-gradient(900px 500px at 50% -10%, rgba(73,233,255,0.08), transparent 60%), #060A0F;
    font-family:'Inter',sans-serif; color:var(--text);
  }
  .mono{font-family:'JetBrains Mono',monospace;}
  h1,h2,h3{font-family:'Rajdhani',sans-serif; text-transform:uppercase; letter-spacing:.04em; font-weight:700; margin:0;}
  #phoneWrap{ height:100%; display:flex; flex-direction:column; position:relative;}

  .app-head{ padding:10px 18px 8px; flex-shrink:0;}
  .app-head .eyebrow{ font-size:10px; color:var(--text-dim); letter-spacing:.1em; text-transform:uppercase;}
  .app-head h1{ font-size:19px; margin-top:2px;}

  .content{ flex:1; overflow-y:auto; padding:10px 18px 18px;}
  .content::-webkit-scrollbar{ display:none;}

  .cat-row{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:14px;}
  .cat-btn{ background:var(--panel); border:1.5px solid var(--line-strong); color:var(--text-muted); font-family:'Rajdhani'; font-weight:700; font-size:10.5px; letter-spacing:.03em; text-transform:uppercase; padding:6px 12px; border-radius:12px; cursor:pointer;}
  .cat-btn.on{ background:var(--cyan-dim); border-color:var(--cyan); color:#fff;}

  .doc-card{
    background:var(--panel); border:1.5px solid var(--line-strong); border-radius:10px; padding:14px 16px; margin-bottom:10px;
    display:flex; align-items:flex-start; gap:12px; position:relative; overflow:hidden;
  }
  .doc-card::before{ content:""; position:absolute; inset:5px; border:1px solid var(--brass-dim); border-radius:6px; opacity:.3; pointer-events:none;}
  .doc-ico{ width:38px; height:38px; border-radius:8px; background:var(--panel-alt); border:1.5px solid var(--brass); display:flex; align-items:center; justify-content:center; flex-shrink:0; position:relative; z-index:1;}
  .doc-ico svg{ width:18px; height:18px;}
  .doc-info{ flex:1; min-width:0; position:relative; z-index:1;}
  .doc-titulo{ font-size:13.5px; font-weight:700;}
  .doc-cat{ font-size:10px; color:var(--brass-bright); text-transform:uppercase; letter-spacing:.04em; margin-top:2px;}
  .doc-desc{ font-size:11.5px; color:var(--text-muted); margin-top:5px; line-height:1.5;}
  .doc-fecha{ font-size:10.5px; color:var(--text-dim); margin-top:5px; font-family:'JetBrains Mono',monospace;}
  .doc-descarga{
    width:34px; height:34px; border-radius:8px; background:var(--cyan-dim); border:1.5px solid var(--cyan);
    color:#fff; display:flex; align-items:center; justify-content:center; font-size:15px; flex-shrink:0; text-decoration:none;
    position:relative; z-index:1;
  }
  .estado-pill{ font-size:9px; font-weight:700; text-transform:uppercase; padding:2px 8px; border-radius:8px; color:#fff; margin-left:8px;}

  .empty-state{ text-align:center; padding:50px 20px; color:var(--text-dim); font-size:12.5px;}

  .tabbar-real{ display:flex; border-top:1px solid var(--line-strong); background:#0C1116; flex-shrink:0; padding-bottom:6px;}
  .tabbar-real a{ flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; padding:9px 0 5px; color:var(--text-dim); text-decoration:none; font-size:9.5px; font-weight:600; letter-spacing:.01em;}
  .tabbar-real a .ic{ line-height:1; display:flex;}
  .tabbar-real a .ic svg{ width:22px; height:22px;}
  .tabbar-real a.active{ color:var(--cyan);}

  .toast{
    position:absolute; bottom:70px; left:16px; right:16px;
    background:var(--panel-alt); border:1px solid var(--cyan); color:#DFF7F9;
    padding:11px 16px; border-radius:8px; font-size:12.5px; opacity:0; transform:translateY(8px);
    transition:all .25s; pointer-events:none; text-align:center; z-index:30;
  }
  .toast.show{ opacity:1; transform:translateY(0);}
</style>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="icons/favicon-16.png" sizes="16x16" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#060A0F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Vigor">
<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}</script>
</head>
<body>

  <div id="phoneWrap">
    <div class="app-head">
      <a href="opciones_celular.html" style="display:inline-block; color:var(--text-muted); font-size:11px; text-decoration:none; margin-bottom:6px;">← Opciones</a>
      <div class="eyebrow" id="nombreCuerpoCel">—</div>
      <h1>Archivo Institucional</h1>
    </div>

    <div class="content">
      <div class="cat-row" id="ambitoRow" style="display:none;"></div>
      <div class="cat-row" id="catRow"></div>
      <div id="listaDocs"></div>
    </div>

    <div class="tabbar-real" id="tabbarReal"></div>
    <div class="toast" id="toast"></div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://mcfcfbtiruewlcejionr.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1jZmNmYnRpcnVld2xjZWppb25yIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzODExNzgsImV4cCI6MjEwMzk1NzE3OH0.9b_t63ah25RIGNn3pzZU3L553YUrrn7IXWW3MEjXuXU';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { persistSession: true, autoRefreshToken: true } });

// Vive aparte de la pestaña "Archivo Institucional" de Secretaría (que es
// de gestión, solo para Secretario General) -- esta es de solo lectura,
// para CUALQUIER bombero del Cuerpo, mostrando exactamente los mismos
// documentos (misma tabla secretaria_archivo, sin filtro de cargo en la
// RLS de SELECT).
const CATEGORIAS = ['Todas','Estatutos','Reglamentos','Históricos','Convenios','Otros'];
let catFiltro = 'Todas';
let DOCS = [];

function fmtFecha(f){ return f ? new Date(f+'T00:00:00').toLocaleDateString('es-CL') : '—'; }

function iconoPorExt(nombre){
  const ext = (nombre||'').split('.').pop().toLowerCase();
  if(['doc','docx'].includes(ext)) return '<path d="M6 3h9l3 3v15a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/><path d="M15 3v3h3"/><path d="M8 13h8M8 16.5h5"/>';
  if(['xls','xlsx'].includes(ext)) return '<path d="M6 3h9l3 3v15a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/><path d="M15 3v3h3"/><path d="M8 12l3 5M11 12l-3 5M14 12.5h4M14 16h4"/>';
  if(['ppt','pptx'].includes(ext)) return '<path d="M6 3h9l3 3v15a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/><path d="M15 3v3h3"/><circle cx="11" cy="14.5" r="2.3"/>';
  if(['jpg','jpeg','png'].includes(ext)) return '<rect x="5" y="4" width="14" height="16" rx="1.5"/><circle cx="9.5" cy="9.5" r="1.3"/><path d="M6 16.5l3.5-4 2.5 3 2-2.5 4 3.5"/>';
  return '<path d="M6 3h9l3 3v15a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/><path d="M15 3v3h3"/><path d="M8 13h8M8 16.5h8"/>';
}

let DOCS_CUERPO = [];
let DOCS_CIA = [];
let miCompaniaIdArchivo = null;
let ambitoArchivo = 'cia';

async function cargarDatos(){
  const { data: { session } } = await sb.auth.getSession();
  if(!session){ toast('Necesitás loguearte primero'); return; }
  const { data: perfil } = await sb.from('personal').select('cuerpo_id, compania_id, cuerpos(nombre_oficial)').eq('auth_user_id', session.user.id).maybeSingle();
  if(!perfil || !perfil.cuerpo_id) return;
  document.getElementById('nombreCuerpoCel').textContent = (perfil.cuerpos ? perfil.cuerpos.nombre_oficial : 'Cuerpo') + ' · Vigor';
  miCompaniaIdArchivo = perfil.compania_id;

  const { data } = await sb.from('secretaria_archivo').select('*').eq('cuerpo_id', perfil.cuerpo_id).order('creado_en', { ascending:false });
  DOCS_CUERPO = (data || []).filter(d => !d.compania_id);
  DOCS_CIA = miCompaniaIdArchivo ? (data || []).filter(d => d.compania_id === miCompaniaIdArchivo) : [];
  ambitoArchivo = miCompaniaIdArchivo ? 'cia' : 'cuerpo';
  renderAmbitos();
  renderCats();
  renderLista();
}

function renderAmbitos(){
  const wrap = document.getElementById('ambitoRow');
  if(!miCompaniaIdArchivo){ wrap.style.display = 'none'; return; }
  wrap.style.display = 'flex';
  wrap.innerHTML = `
    <button class="cat-btn ${ambitoArchivo==='cia'?'on':''}" onclick="setAmbito('cia')">De mi Compañía</button>
    <button class="cat-btn ${ambitoArchivo==='cuerpo'?'on':''}" onclick="setAmbito('cuerpo')">Del Cuerpo General</button>
  `;
}
function setAmbito(a){ ambitoArchivo = a; renderAmbitos(); renderCats(); renderLista(); }

function renderCats(){
  document.getElementById('catRow').innerHTML = CATEGORIAS.map(c =>
    `<button class="cat-btn ${catFiltro===c?'on':''}" onclick="setCat('${c}')">${c}</button>`
  ).join('');
}
function setCat(c){ catFiltro = c; renderCats(); renderLista(); }

function renderLista(){
  const cont = document.getElementById('listaDocs');
  DOCS = ambitoArchivo === 'cia' ? DOCS_CIA : DOCS_CUERPO;
  const filtrados = DOCS.filter(d => catFiltro==='Todas' || d.categoria===catFiltro);
  if(!filtrados.length){
    cont.innerHTML = `<div class="empty-state">Sin documentos ${catFiltro==='Todas'?'':'en '+catFiltro} todavía.</div>`;
    return;
  }
  const colorEstado = { 'Vigente':'var(--servicio)', 'Archivado':'var(--nodisp)' };
  cont.innerHTML = filtrados.map(d => `
    <div class="doc-card">
      <div class="doc-ico"><svg viewBox="0 0 24 24" fill="none" stroke="#49E9FF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${iconoPorExt(d.archivo_nombre)}</svg></div>
      <div class="doc-info">
        <div class="doc-titulo">${d.nombre_documento}<span class="estado-pill" style="background:${colorEstado[d.estado]||'var(--nodisp)'}">${d.estado}</span></div>
        <div class="doc-cat">${d.categoria}</div>
        ${d.descripcion ? `<div class="doc-desc">${d.descripcion}</div>` : ''}
        <div class="doc-fecha">${d.fecha_documento ? fmtFecha(d.fecha_documento) : ''}</div>
      </div>
      ${d.archivo_url ? `<a class="doc-descarga" href="${d.archivo_url}" target="_blank" rel="noopener" download title="Descargar">⬇</a>` : ''}
    </div>
  `).join('');
}

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2400);
}

const ICONOS_TAB = {
  inicio: '<path d="M4 12 12 5l8 7"/><path d="M6.5 10.5V19a1 1 0 0 0 1 1h9a1 1 0 0 0 1-1v-8.5"/><path d="M10 20v-5h4v5"/>',
  compania: '<path d="M12 2.2v1.5"/><path d="M7.5 8.6C7.5 5.4 9.5 3.6 12 3.6s4.5 1.8 4.5 5"/><path d="M5.8 8.6C5.8 10.4 8.5 11.4 12 11.4s6.2-1 6.2-2.8"/><path d="M5 21c0-4.5 3-7 7-7s7 2.5 7 7"/>',
  pizarra: '<rect x="4" y="5" width="16" height="14" rx="1.6"/><path d="M7.7 10h7M7.7 13.6h4.6"/><circle cx="16.3" cy="8.3" r="1.3"/>',
  actividades: '<rect x="4" y="5.5" width="16" height="14" rx="1.6"/><path d="M4 9.5h16"/><path d="M8 3.5v3M16 3.5v3"/><path d="M8.5 13.5l2 2 4-4.2"/>',
  gps: '<path d="M12 21s7-7.2 7-12a7 7 0 1 0-14 0c0 4.8 7 12 7 12z"/><circle cx="12" cy="9" r="2.4"/>',
  opciones: '<circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2.8"/><g stroke-width="2.3"><path d="M19 12h2.3M16.95 16.95l1.63 1.63M12 19v2.3M7.05 16.95l-1.63 1.63M5 12H2.7M7.05 7.05 5.42 5.42M12 5V2.7M16.95 7.05l1.63-1.63"/></g>',
};
const TABS_NAV = [
  {href:'inicio_celular.html', ic:'inicio', label:'Inicio'},
  {href:'compania_celular.html', ic:'compania', label:'Compañía'},
  {href:'pizarra_celular.html', ic:'pizarra', label:'Pizarra'},
  {href:'actividades_celular.html', ic:'actividades', label:'Activid.'},
  {href:'coordenadas_celular.html', ic:'gps', label:'GPS'},
  {href:'opciones_celular.html', ic:'opciones', label:'Opciones'},
];
(function renderTabbarReal(){
  const cont = document.getElementById('tabbarReal');
  if(!cont) return;
  cont.innerHTML = TABS_NAV.map(t => `<a href="${t.href}"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICONOS_TAB[t.ic]}</svg></span>${t.label}</a>`).join('');
})();

cargarDatos();
</script>
</body>
</html>
