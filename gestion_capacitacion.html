<!DOCTYPE html>
<html lang="es">
<head>
<meta name="robots" content="noindex, nofollow, noarchive">
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>VIGOR - Gestiona tu compañía de forma eficiente</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#060A0F; --panel:#0A131C; --panel-alt:#0E1D28; --line:#132734; --line-strong:#1C3B49;
    --text:#E7F5FA; --text-muted:#7B99A3; --text-dim:#516E78;
    --brass:#C97A2E; --brass-bright:#FF9A44; --brass-dim:#8A4E1E;
    --cyan:#49E9FF; --cyan-dim:#1E6E7D; --cyan-glow:rgba(73,233,255,0.35); --amber-glow:rgba(255,154,68,0.32);
    --burdeo:#F13746; --burdeo-bright:#F13746;
    --servicio:#3CF29A; --emergencia:#F13746; --alerta:#FFC94D; --fuera:#C9A63B; --nodisp:#42555C;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;}
  body{
    background: radial-gradient(1100px 500px at 15% -10%, rgba(73,233,255,0.06), transparent 60%), var(--bg);
    color:var(--text); font-family:'Inter',sans-serif; height:100vh; display:flex; flex-direction:column;
  }
  .mono{font-family:'JetBrains Mono',monospace;}
  h1,h2,h3{font-family:'Rajdhani',sans-serif; text-transform:uppercase; letter-spacing:.04em; font-weight:700; margin:0;}

  .nameplate{ background:linear-gradient(180deg,var(--panel-alt),var(--panel)); border-bottom:2px solid var(--brass-dim); flex-shrink:0;}
  .nameplate-inner{ display:flex; align-items:center; justify-content:space-between; padding:14px 26px; flex-wrap:wrap; gap:12px;}
  .brand{ display:flex; align-items:center; gap:12px;}
  .brand-mark{ width:36px;height:36px; border:1.5px solid var(--brass); border-radius:3px; display:flex; align-items:center; justify-content:center; position:relative; background:var(--panel);}
  .brand-mark::before{ content:""; position:absolute; inset:4px; border:1px solid var(--brass-dim); border-radius:2px;}
  .brand-mark svg{ width:15px; height:15px;}
  .brand-text h1{ font-size:19px; letter-spacing:.04em;}
  .brand-text span{ font-size:10.5px; color:var(--text-dim); letter-spacing:.1em; text-transform:uppercase; display:block; margin-top:2px;}
  .role-tag{
    font-family:'Rajdhani'; font-weight:700; font-size:11.5px; letter-spacing:.06em; text-transform:uppercase;
    padding:6px 14px; border-radius:4px; background:var(--panel); border:1.5px solid var(--brass); color:var(--brass-bright);
  }

  .leyenda{ flex-shrink:0; padding:10px 26px; background:var(--panel); border-bottom:1px solid var(--line); display:flex; align-items:center; gap:18px; flex-wrap:wrap;}
  .leyenda-item{ display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--text-muted);}
  .leyenda-dot{ width:10px; height:10px; border-radius:50%; flex-shrink:0;}
  .leyenda-dot.inicial{ background:var(--fuera);}
  .leyenda-dot.operativo{ background:var(--cyan);}
  .leyenda-dot.profesional{ background:var(--brass-bright);}

  .content-wrap{ flex:1; min-height:0; padding:0 30px 20px; overflow-y:auto;}

  .bomberos-list{ overflow-y:auto; border-right:1px solid var(--line); padding:12px;}
  .bombero-card{
    background:var(--panel); border:1.5px solid var(--line-strong); border-radius:8px;
    padding:12px 14px; margin-bottom:8px; cursor:pointer; position:relative;
  }
  .bombero-card.activo{ border-color:var(--cyan);}
  .bombero-card::before{ content:""; position:absolute; inset:5px; border:1px solid var(--brass-dim); border-radius:4px; pointer-events:none; opacity:.3;}
  .bombero-top{ display:flex; justify-content:space-between; align-items:center; margin-bottom:3px; position:relative; z-index:1;}
  .bombero-nombre{ font-size:13.5px; font-weight:700;}
  .bombero-reg{ font-size:10.5px; color:var(--text-dim); font-family:'JetBrains Mono',monospace; margin-bottom:7px; position:relative; z-index:1;}
  .nivel-pill{ font-size:9.5px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; padding:3px 9px; border-radius:10px; position:relative; z-index:1; display:inline-block;}
  .nivel-pill.inicial{ background:var(--fuera); color:#241505;}
  .nivel-pill.operativo{ background:var(--cyan-dim); color:#fff;}
  .nivel-pill.profesional{ background:var(--brass-bright); color:#241505;}
  .nivel-pill.especialidad{ background:var(--esp-m,#B77CFF); color:#1a0b2e;}
  .nivel-pill.ninguno{ background:var(--nodisp); color:#fff;}

  .detalle-panel{ padding:6px 0 20px;}
  .detalle-head{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:14px; padding-bottom:14px; border-bottom:1px solid var(--line);}
  .detalle-nombre{ font-size:20px; margin-bottom:6px;}
  .detalle-meta{ font-size:12.5px; color:var(--text-muted);}
  .detalle-actions{ display:flex; gap:8px;}
  .btn-exportar{
    background:transparent; border:1.5px solid var(--cyan); color:var(--cyan);
    font-family:'Rajdhani'; font-weight:700; letter-spacing:.03em; text-transform:uppercase;
    font-size:11px; padding:9px 14px; border-radius:5px; cursor:pointer;
  }
  .btn-exportar:hover{ background:rgba(73,233,255,0.1);}
  .btn-agregar{
    background:var(--alerta); border:none; color:#241505;
    font-family:'Rajdhani'; font-weight:700; letter-spacing:.03em; text-transform:uppercase;
    font-size:11px; padding:9px 14px; border-radius:5px; cursor:pointer;
  }
  .btn-agregar:hover{ filter:brightness(1.08);}

  .cursos-title{ font-size:11.5px; color:var(--brass-bright); text-transform:uppercase; letter-spacing:.08em; font-weight:700; margin-bottom:10px;}
  .curso-row{ display:flex; align-items:center; gap:12px; background:var(--panel); border:1px solid var(--line-strong); border-radius:6px; padding:11px 15px; margin-bottom:7px;}
  .curso-fecha{ font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--text-dim); width:82px; flex-shrink:0;}
  .curso-nombre{ flex:1; font-size:13px; font-weight:600;}
  .curso-tag-externo{ font-size:9px; font-weight:700; text-transform:uppercase; color:var(--text-dim); border:1px solid var(--line-strong); padding:2px 7px; border-radius:8px; margin-right:8px;}
  .curso-cert-link{ display:flex; align-items:center; color:var(--cyan); flex-shrink:0;}
  .curso-cert-link svg{ width:16px; height:16px;}
  .curso-cert-link:hover{ color:#fff;}
  .curso-empty{ text-align:center; padding:30px; color:var(--text-dim); font-size:12.5px;}

  .modal-overlay{ position:fixed; inset:0; background:rgba(5,10,15,0.75); z-index:60; display:none; align-items:center; justify-content:center;}
  .modal-overlay.show{ display:flex;}
  .modal-box{ background:var(--panel); border:1.5px solid var(--brass-dim); border-radius:12px; padding:22px 24px; width:400px;}
  .modal-box h3{ font-size:15px; margin-bottom:4px;}
  .modal-sub{ font-size:11.5px; color:var(--text-muted); margin-bottom:16px;}
  .m-field{ margin-bottom:14px;}
  .m-field label{ display:block; font-size:10.5px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.06em; margin-bottom:6px;}
  .m-field input{ width:100%; background:var(--panel-alt); border:1.5px solid var(--line-strong); border-radius:6px; padding:10px 12px; color:var(--text); font-size:13px;}
  .m-field input:focus{ outline:none; border-color:var(--cyan);}
  .nivel-select-row{ display:flex; gap:6px;}
  .nivel-opt{ flex:1; background:var(--panel-alt); border:1.5px solid var(--line-strong); border-radius:6px; padding:9px 4px; text-align:center; font-size:11px; font-weight:600; color:var(--text-muted); cursor:pointer;}
  .nivel-opt.inicial.on{ background:var(--fuera); border-color:var(--fuera); color:#241505;}
  .nivel-opt.operativo.on{ background:var(--cyan-dim); border-color:var(--cyan); color:#fff;}
  .nivel-opt.especialidad.on{ background:#B77CFF; border-color:#B77CFF; color:#1a0b2e;}
  .nivel-opt.profesional.on{ background:var(--brass-bright); border-color:var(--brass-bright); color:#241505;}
  .nivel-opt-externo{
    flex:1; background:var(--panel-alt); border:1.5px dashed var(--line-strong); border-radius:6px;
    padding:9px 4px; text-align:center; font-size:11px; font-weight:600; color:var(--text-dim); font-style:italic;
  }
  .externo-check{ display:flex; align-items:center; gap:9px; cursor:pointer; margin-bottom:16px;}
  .externo-box{ width:18px; height:18px; border-radius:4px; border:1.5px solid var(--line-strong); background:var(--panel-alt); display:flex; align-items:center; justify-content:center; font-size:12px; color:#fff;}
  .externo-box.on{ background:var(--brass-dim); border-color:var(--brass-bright);}
  .externo-label{ font-size:12.5px; color:var(--text-muted);}

  .cert-upload{
    display:flex; align-items:center; gap:9px; cursor:pointer; margin-bottom:16px;
    background:var(--panel-alt); border:1.5px dashed var(--line-strong); border-radius:6px; padding:10px 12px;
  }
  .cert-upload:hover{ border-color:var(--cyan);}
  .cert-upload svg{ width:18px; height:18px; color:var(--cyan); flex-shrink:0;}
  .cert-upload span{ font-size:12px; color:var(--text-muted);}
  .modal-actions{ display:flex; gap:10px; margin-top:6px;}
  .modal-cancel{ flex:1; background:transparent; border:1.5px solid var(--line-strong); color:var(--text-muted); font-size:12.5px; padding:10px; border-radius:6px; cursor:pointer;}
  .modal-guardar{ flex:1.4; background:var(--cyan-dim); border:1.5px solid var(--cyan); color:#fff; font-family:'Rajdhani'; font-weight:700; letter-spacing:.04em; text-transform:uppercase; font-size:12px; padding:10px; border-radius:6px; cursor:pointer;}

  .toast{
    position:fixed; bottom:26px; left:50%; transform:translateX(-50%) translateY(12px);
    background:var(--panel-alt); border:1px solid var(--cyan); color:#DFF7F9;
    padding:13px 22px; border-radius:6px; font-size:13.5px; opacity:0; pointer-events:none;
    transition:all .25s; z-index:50; text-align:center;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0);}

  @media print{
    body{ background:#fff !important; color:#111 !important; height:auto !important; overflow:visible !important;}
    .nameplate, .leyenda, .toolbar, #vistaLista, .detalle-actions, .modal-overlay, .toast, .curso-del{ display:none !important;}
    .detalle-panel{ display:block !important;}
    .content-wrap{ display:block !important;}
    .curso-row{ border-color:#ccc !important;}
  }

  /* Bug reportado: "descompaginado" en Celular — el sidebar fijo de 320px
     no entraba en un teléfono. Se apila en una sola columna. */
  @media (max-width:760px){
    html,body{ overflow:auto !important; height:auto !important; min-height:100%;}
    body{ height:auto !important;}
    .content-wrap{ display:block !important; overflow:visible !important; padding:0 14px 20px;}
    .detalle-panel{ padding:6px 0 16px;}
    .nameplate-inner{ padding:12px 14px;}
    .brand-text h1{ font-size:15px;}
    .leyenda{ padding:8px 14px; gap:12px;}
    .detalle-head{ flex-wrap:wrap; gap:10px;}
    .detalle-actions{ width:100%;}
    .btn-exportar, .btn-agregar{ flex:1; text-align:center;}
    .modal-box{ width:calc(100vw - 32px); max-width:400px;}
  }

  .back-cuartel{
    background:transparent; border:1.5px solid var(--line-strong); color:var(--text-muted);
    font-family:'Rajdhani',sans-serif; font-weight:600; letter-spacing:.03em; text-transform:uppercase;
    font-size:11.5px; padding:7px 13px; border-radius:5px; cursor:pointer; margin-right:12px;
  }
  .back-cuartel:hover{ border-color:var(--brass-bright); color:var(--text);}

  /* ---- Listado con buscador (mismo formato que Registro de Bomberos) ---- */
  .toolbar{ flex-shrink:0; padding:14px 30px; display:flex; gap:10px; align-items:center; flex-wrap:wrap;}
  .search-input{ flex:1; min-width:220px; background:var(--panel-alt); border:1.5px solid var(--line-strong); border-radius:6px; padding:9px 14px; font-size:13px; color:var(--text);}
  .search-input:focus{ outline:none; border-color:var(--cyan);}
  .tabla-wrap table{ width:100%;}
  .btn-ver-ficha{
    background:var(--cyan-dim); border:1.5px solid var(--cyan); color:#fff;
    font-family:'Rajdhani'; font-weight:700; letter-spacing:.03em; text-transform:uppercase;
    font-size:12px; padding:9px 18px; border-radius:6px; cursor:pointer; white-space:nowrap;
  }
  .btn-ver-ficha:hover{ background:var(--cyan); color:#0D2226;}
  @media (max-width:760px){
    .toolbar{ padding:12px 14px; flex-wrap:wrap;}
    .search-input{ min-width:0;}
  }

  table{ width:100%; border-collapse:collapse; background:var(--panel); border:1px solid var(--line-strong); border-radius:10px; overflow:hidden;}
  thead th{ text-align:left; font-size:10px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.06em; padding:11px 16px; border-bottom:2px solid var(--line-strong); background:var(--panel-alt);}
  tbody tr{ border-bottom:1px solid var(--line);}
  tbody tr:last-child{ border-bottom:none;}
  tbody td{ padding:10px 16px; font-size:12.5px; vertical-align:middle;}
  .td-nombre{ font-weight:600;}
  .td-reg{ font-family:'JetBrains Mono',monospace; color:var(--text-dim);}
  .tabla-scroll{ padding:0;}
  @media (max-width:760px){
    .tabla-scroll{ overflow-x:auto; -webkit-overflow-scrolling:touch; border-radius:10px;}
    table{ min-width:620px;}
  }

  .btn-peligro{ background:transparent; border:1.5px solid var(--burdeo-bright); color:var(--burdeo-bright); font-family:'Rajdhani'; font-weight:700; letter-spacing:.04em; text-transform:uppercase; font-size:12px; padding:10px; border-radius:6px; cursor:pointer;}
  .btn-peligro:hover{ background:var(--burdeo); color:#fff;}
  .curso-del{ background:none; border:1px solid transparent; color:var(--text-dim); cursor:pointer; padding:5px; border-radius:6px; display:flex; flex-shrink:0;}
  .curso-del svg{ width:17px; height:17px;}
  .curso-del:hover{ color:var(--emergencia); border-color:rgba(241,55,70,.5);}

  /* ---- Detalle de una persona (Mis Cursos / ficha de cursos) ---- */
  .detalle-panel{ max-width:960px; margin:0 auto; padding-top:16px;}
  .perfil-card{ display:flex; align-items:center; gap:16px; flex-wrap:wrap; background:var(--panel); border:1.5px solid var(--line-strong); border-radius:16px; padding:18px;}
  .pc-av{ width:64px; height:64px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:21px; color:#030B13; background:var(--vg-grad, linear-gradient(90deg,#34B8FF,#35F454)) center/cover; overflow:hidden;}
  .pc-av img{ width:100%; height:100%; object-fit:cover; display:block;}
  .pc-info{ flex:1; min-width:200px;}
  .pc-nom{ font-size:20px; font-weight:800; line-height:1.15;}
  .pc-sub{ font-size:12px; color:var(--text-muted); margin-top:4px;}
  .pc-chips{ display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; align-items:center;}
  .dato{ font-size:11px; color:var(--text-muted); background:var(--panel-alt); border:1px solid var(--line-strong); border-radius:999px; padding:5px 11px;}
  .dato b{ color:var(--text); font-weight:700;}
  .detalle-actions{ display:flex; gap:8px; align-items:center;}
  .btn-exportar, .btn-agregar{ border-radius:12px !important; padding:11px 16px !important; font-size:12px !important;}
  .btn-agregar{ background:var(--alerta) !important;}
  .tarjeta-nivel{ background:var(--panel); border:1.5px solid var(--line-strong); border-radius:16px; padding:16px 18px; margin-top:14px;}
  .seccion-t{ font-size:11px; color:var(--cyan); text-transform:uppercase; letter-spacing:.1em; font-weight:700; margin:0 0 12px;}
  .historial-t{ font-size:11px; color:var(--cyan); text-transform:uppercase; letter-spacing:.1em; font-weight:700; margin:22px 4px 10px;}

  .curso-card{ display:flex; align-items:center; gap:14px; background:var(--panel); border:1.5px solid var(--line-strong); border-radius:14px; padding:12px 14px; margin-bottom:8px;}
  .cc-fecha{ width:50px; flex-shrink:0; text-align:center; border-right:1px solid var(--line-strong); padding-right:14px;}
  .cc-fecha .d{ font-weight:800; font-size:20px; line-height:1;}
  .cc-fecha .m{ font-size:9.5px; color:var(--text-muted); text-transform:uppercase; letter-spacing:.06em; margin-top:3px;}
  .cc-fecha .a{ font-size:9px; color:var(--text-dim); margin-top:1px;}
  .cc-info{ flex:1; min-width:0;}
  .cc-nombre{ font-size:14px; font-weight:700; overflow-wrap:anywhere;}
  .cc-tags{ display:flex; gap:6px; flex-wrap:wrap; margin-top:7px;}
  .cc-tags .nivel-pill{ padding:3px 10px;}
  .tag-ext{ font-size:9px; font-weight:700; text-transform:uppercase; color:var(--text-muted); border:1px solid var(--line-strong); padding:3px 9px; border-radius:10px;}
  .cc-cert{ display:inline-flex; align-items:center; gap:6px; font-size:11px; font-weight:700; color:var(--cyan); border:1.5px solid var(--cyan-dim); border-radius:10px; padding:7px 11px; text-decoration:none; flex-shrink:0;}
  .cc-cert svg{ width:15px; height:15px;}
  .cc-cert:hover{ background:rgba(73,233,255,.1);}
  .vacio-cursos{ text-align:center; padding:34px 16px; background:var(--panel); border:1.5px dashed var(--line-strong); border-radius:16px; color:var(--text-dim); font-size:13px;}
  .vacio-cursos svg{ width:38px; height:38px; display:block; margin:0 auto 10px; color:var(--line-strong);}
  @media (max-width:760px){
    .perfil-card{ padding:14px;}
    .pc-av{ width:54px; height:54px; font-size:18px;}
    .detalle-actions{ width:100%;}
    .detalle-actions > button{ flex:1;}
    .curso-card{ flex-wrap:wrap;}
    .cc-cert{ margin-left:64px;}
  }
  @media print{
    .perfil-card, .curso-card, .tarjeta-nivel, .vacio-cursos{ background:#fff !important; border:1px solid #999 !important; color:#000 !important; break-inside:avoid;}
    .pc-av{ background:#ddd !important; color:#000 !important;}
    .pc-sub, .cc-fecha .m, .cc-fecha .a, .dato, .tag-ext{ color:#333 !important; background:#fff !important; border-color:#999 !important;}
    .cc-cert{ color:#000 !important; border-color:#999 !important;}
    .seccion-t, .historial-t{ color:#000 !important;}
  }
</style>

<body>

  <div class="nameplate">
    <div class="nameplate-inner">
      <div class="brand">
        <button class="back-cuartel" onclick="volverCuartel()">← Volver</button><div class="brand-mark"><svg viewBox="0 0 24 24" fill="none"><path d="M12 2L4 6v6c0 5 3.5 8.5 8 10 4.5-1.5 8-5 8-10V6l-8-4z" stroke="#49E9FF" stroke-width="1.6"/></svg></div>
        <div class="brand-text"><h1>Gestión de Capacitación</h1><span id="subtituloInv">Vigor</span></div>
      </div>
      <div class="role-tag" id="roleTag">Sin sesión</div>
    </div>
  </div>

  <div class="toolbar" id="toolbarLista" style="display:none;">
    <input type="text" class="search-input" id="buscador" placeholder="Buscar por nombre o N° de Registro…" oninput="renderTabla()">
  </div>

  <div class="content-wrap">
    <div class="tabla-scroll" id="vistaLista" style="display:none;">
      <table>
        <thead><tr><th>N° Reg.</th><th>Nombre</th><th>Cargo</th><th>Nivel</th><th>Cursos</th><th></th></tr></thead>
        <tbody id="tablaBody"></tbody>
      </table>
    </div>
    <div class="detalle-panel" id="detallePanel" style="display:none;"></div>
  </div>

  <div class="modal-overlay" id="cursoModal">
    <div class="modal-box">
      <h3>Agregar Curso</h3>
      <div class="modal-sub" id="modalBomberoNombre">R. Salinas</div>
      <div class="m-field"><label>Nombre del curso</label><input type="text" id="mNombre" placeholder="Ej. Manejo de Materiales Peligrosos"></div>
      <div class="m-field"><label>Fecha en que se ingresa</label><input type="text" class="mono" id="mFecha" placeholder="dd/mm/aaaa" inputmode="numeric" oninput="this.value = formatearFecha(this.value)"></div>
      <div class="m-field">
        <label>Nivel</label>
        <div class="nivel-select-row" id="nivelSelectRow"></div>
      </div>
      <div class="externo-check" onclick="toggleExterno()">
        <div class="externo-box" id="externoBox"></div>
        <div class="externo-label">Es un curso externo (no dictado por el Cuerpo)</div>
      </div>
      <div class="cert-upload" onclick="document.getElementById('mCertInput').click()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3.5h7l4 4V20a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4.5a1 1 0 0 1 1-1z"/><path d="M14 3.5V8h4"/><path d="M9 13.5l2 2 4-4.2"/></svg>
        <span id="mCertLabel">Subir certificado (PDF, JPG o PNG) — opcional</span>
      </div>
      <input type="file" id="mCertInput" accept="application/pdf,image/jpeg,image/png" style="display:none;" onchange="seleccionarCertificado(this)">
      <div class="modal-actions">
        <button class="modal-cancel" onclick="cerrarModal()">Cancelar</button>
        <button class="modal-guardar" onclick="guardarCurso()">Guardar Curso</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="elimCursoModal" onclick="if(event.target===this) cerrarElimCurso()">
    <div class="modal-box">
      <h3>Eliminar curso</h3>
      <div class="modal-sub" id="elimCursoTxt"></div>
      <div class="modal-actions">
        <button class="modal-cancel" onclick="cerrarElimCurso()">Cancelar</button>
        <button class="btn-peligro" style="flex:1.4;" id="btnElimCurso" onclick="confirmarEliminarCurso()">Eliminar curso</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="vigor-sesion.js"></script>
<script>
const SUPABASE_URL = 'https://mcfcfbtiruewlcejionr.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1jZmNmYnRpcnVld2xjZWppb25yIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzODExNzgsImV4cCI6MjEwMzk1NzE3OH0.9b_t63ah25RIGNn3pzZU3L553YUrrn7IXWW3MEjXuXU';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { persistSession: true, autoRefreshToken: true } });

// Pedido explícito: en Celular (ancho angosto) "Volver" va directo a
// Opciones — en PC se mantiene el historial normal del navegador.
let detalleAbierto = false;
function volverCuartel(){
  if(detalleAbierto && !soloMios){ mostrarLista(); return; }
  window.location.href = 'opciones_celular.html';
}

const EDIT_ROLES = ['Director','Capitán','Ayudante Cía.'];
const NIVELES = ['inicial','operativo','profesional'];
const NIVEL_LABEL = { inicial:'Inicial', operativo:'Operativo', profesional:'Profesional', especialidad:'Especialidad', ninguno:'Sin nivel' };
// Un curso puede ser de nivel Especialidad; el nivel de una persona sigue siendo solo uno de los tres anteriores.
const NIVELES_CURSO = [...NIVELES, 'especialidad'];

let BOMBEROS = [];
let miCuerpoId = null, miCompaniaId = null, miPersonalId = null, puedoEditar = false;
let bomberoActivo = 0;
let nivelSel = 'inicial';
let esExterno = false;

// Bug reportado: "Mis Cursos" (menú de Opciones, sin permiso de gestión)
// mostraba el historial de TODO el mundo, no el propio — se llega acá con
// ?mios=1 y se acota el roster a la propia fila, sin sidebar de elegir a
// otra persona.
const soloMios = new URLSearchParams(window.location.search).get('mios') === '1';

async function cargarDatos(){
  const { data: { session } } = await sb.auth.getSession();
  if(!session){ toast('Debes iniciar sesión primero'); return; }
  const { data: perfil } = await sb.from('personal')
    .select('id, cargo, cuerpo_id, compania_id, companias(nombre), personal_roles_funcionales(rol_funcional)')
    .eq('auth_user_id', session.user.id).single();
  if(!perfil) return;
  miPersonalId = perfil.id;
  miCuerpoId = perfil.cuerpo_id;
  miCompaniaId = perfil.compania_id;
  const rolesFuncionalesActivos = new Set((perfil.personal_roles_funcionales || []).map(r => r.rol_funcional));
  puedoEditar = !soloMios && (EDIT_ROLES.includes(perfil.cargo) || rolesFuncionalesActivos.has('Depto. Capacitación'));
  document.getElementById('roleTag').textContent = soloMios ? 'Mis Cursos' : perfil.cargo;
  document.getElementById('subtituloInv').textContent = (perfil.companias ? perfil.companias.nombre : 'Cuerpo General') + ' · Vigor';
  
  let q = sb.from('personal').select('id, nombre_completo, numero_registro, cargo, foto_url, nivel_capacitacion')
    .eq('cuerpo_id', miCuerpoId).neq('estado','dado_de_baja').order('numero_registro');
  q = soloMios ? q.eq('id', miPersonalId) : (miCompaniaId ? q.eq('compania_id', miCompaniaId) : q.is('compania_id', null));
  const { data: personal } = await q;

  const { data: cursos } = await sb.from('personal_capacitaciones')
    .select('*').eq('cuerpo_id', miCuerpoId).order('fecha', { ascending:false });

  BOMBEROS = (personal || []).map(p => ({
    id: p.id, nombre: p.nombre_completo, reg: p.numero_registro, cargo: p.cargo, foto: p.foto_url, nivelActual: p.nivel_capacitacion,
    cursos: (cursos || []).filter(c => c.personal_id === p.id)
  }));
  bomberoActivo = 0;
  if(soloMios) abrirBombero(0); else mostrarLista();
}

function mostrarLista(){
  detalleAbierto = false;
  document.getElementById('detallePanel').style.display = 'none';
  document.getElementById('vistaLista').style.display = 'block';
  document.getElementById('toolbarLista').style.display = 'flex';
  renderTabla();
}
function abrirBombero(i){
  detalleAbierto = true; bomberoActivo = i;
  document.getElementById('vistaLista').style.display = 'none';
  document.getElementById('toolbarLista').style.display = 'none';
  document.getElementById('detallePanel').style.display = 'block';
  renderDetalle();
  window.scrollTo(0, 0);
}
function renderTabla(){
  const q = document.getElementById('buscador').value.trim().toLowerCase();
  const filas = BOMBEROS.map((b, i) => ({ b, i })).filter(({ b }) => b.nombre.toLowerCase().includes(q) || String(b.reg).includes(q));
  document.getElementById('tablaBody').innerHTML = filas.map(({ b, i }) => {
    const nv = b.nivelActual || 'ninguno';
    return `<tr>
      <td class="td-reg">N° ${b.reg}</td>
      <td class="td-nombre">${b.nombre}</td>
      <td>${b.cargo || '—'}</td>
      <td><span class="nivel-pill ${nv}">${NIVEL_LABEL[nv]}</span></td>
      <td class="mono">${b.cursos.length}</td>
      <td><button class="btn-ver-ficha" onclick="abrirBombero(${i})">Ver Cursos</button></td>
    </tr>`;
  }).join('') || `<tr><td colspan="6" style="text-align:center; padding:30px; color:var(--text-dim); font-style:italic;">Sin resultados.</td></tr>`;
}

const MESES_CORTO = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const ICO_DOC = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3.5h7l4 4V20a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4.5a1 1 0 0 1 1-1z"/><path d="M14 3.5V8h4"/><path d="M9 13.5l2 2 4-4.2"/></svg>';
const ICO_BASURA = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-12M9 7V4h6v3"/></svg>';
const iniciales = (n) => (n || '?').split(' ').filter(Boolean).slice(0, 2).map(p => p[0]).join('').toUpperCase();
const escH = (t) => String(t == null ? '' : t).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function renderDetalle(){
  if(BOMBEROS.length===0){ document.getElementById('detallePanel').innerHTML = `<div class="curso-empty">Sin personal para mostrar.</div>`; return; }
  const b = BOMBEROS[bomberoActivo];
  const nv = b.nivelActual || 'ninguno';
  const fechaL = (iso) => new Date(iso + 'T00:00:00').toLocaleDateString('es-CL');
  const tarjetas = b.cursos.length
    ? b.cursos.map(c => {
        const [y, m, d] = c.fecha.split('-').map(Number);
        return `<div class="curso-card">
          <div class="cc-fecha"><div class="d">${String(d).padStart(2,'0')}</div><div class="m">${MESES_CORTO[m-1]}</div><div class="a">${y}</div></div>
          <div class="cc-info">
            <div class="cc-nombre">${escH(c.nombre_curso)}</div>
            <div class="cc-tags">${c.nivel ? `<span class="nivel-pill ${c.nivel}">${NIVEL_LABEL[c.nivel]}</span>` : ''}${c.es_externo ? '<span class="tag-ext">Externo</span>' : ''}</div>
          </div>
          ${c.certificado_url ? `<a class="cc-cert" href="${escH(c.certificado_url)}" target="_blank" rel="noopener" title="Ver certificado">${ICO_DOC}Certificado</a>` : ''}
          ${puedoEditar ? `<button class="curso-del" onclick="pedirEliminarCurso('${c.id}')" title="Eliminar curso">${ICO_BASURA}</button>` : ''}
        </div>`;
      }).join('')
    : `<div class="vacio-cursos">${ICO_DOC}Sin cursos ingresados todavía.</div>`;

  // El nivel solo se puede cambiar si tienes permiso; en «Mis Cursos» se ve en la tarjeta de arriba
  const nivelSelector = puedoEditar ? `<div class="tarjeta-nivel">
      <div class="seccion-t">Nivel actual</div>
      <div class="nivel-select-row" style="max-width:460px;">${NIVELES.map(n =>
        `<div class="nivel-opt ${n} ${b.nivelActual===n?'on':''}" onclick="setNivelBombero('${n}')">${NIVEL_LABEL[n]}</div>`).join('')}</div>
    </div>` : '';

  document.getElementById('detallePanel').innerHTML = `
    <div class="perfil-card">
      <div class="pc-av">${b.foto ? `<img src="${escH(b.foto)}" alt="">` : escH(iniciales(b.nombre))}</div>
      <div class="pc-info">
        <div class="pc-nom">${escH(b.nombre)}</div>
        <div class="pc-sub">N° ${b.reg}${b.cargo ? ' · ' + escH(b.cargo) : ''}</div>
        <div class="pc-chips">
          <span class="nivel-pill ${nv}">${nv === 'ninguno' ? NIVEL_LABEL.ninguno : 'Nivel ' + NIVEL_LABEL[nv]}</span>
          <span class="dato"><b>${b.cursos.length}</b> curso${b.cursos.length === 1 ? '' : 's'}</span>
          ${b.cursos.length ? `<span class="dato">Último: <b>${fechaL(b.cursos[0].fecha)}</b></span>` : ''}
        </div>
      </div>
      <div class="detalle-actions">
        <button class="btn-exportar" onclick="window.print()">⬇ Exportar PDF</button>
        ${puedoEditar ? `<button class="btn-agregar" onclick="abrirModal()">+ Agregar Curso</button>` : ''}
      </div>
    </div>
    ${nivelSelector}
    <div class="historial-t">Historial de cursos</div>
    ${tarjetas}
  `;
}

let cursoPorEliminar = null;
function pedirEliminarCurso(id){
  const b = BOMBEROS[bomberoActivo];
  const c = b && b.cursos.find(x => x.id === id);
  if(!c) return;
  cursoPorEliminar = c;
  document.getElementById('elimCursoTxt').textContent = `«${c.nombre_curso}» (${new Date(c.fecha + 'T00:00:00').toLocaleDateString('es-CL')}) de ${b.nombre}. También se quita de su Hoja de Vida.`;
  document.getElementById('elimCursoModal').classList.add('show');
}
function cerrarElimCurso(){ document.getElementById('elimCursoModal').classList.remove('show'); cursoPorEliminar = null; }
async function confirmarEliminarCurso(){
  if(!cursoPorEliminar) return;
  const c = cursoPorEliminar, b = BOMBEROS[bomberoActivo];
  const btn = document.getElementById('btnElimCurso'); btn.disabled = true;
  const { error } = await sb.rpc('eliminar_curso', { p_curso_id: c.id });
  btn.disabled = false;
  if(error){ toast((error.message || '').includes('SIN_PERMISO') ? 'No tienes permiso para eliminar cursos' : 'No se pudo eliminar — ' + error.message); return; }
  b.cursos = b.cursos.filter(x => x.id !== c.id);
  cerrarElimCurso();
  renderDetalle();
  toast('Curso eliminado');
}

async function setNivelBombero(n){
  const b = BOMBEROS[bomberoActivo];
  const { error } = await sb.rpc('actualizar_nivel_capacitacion', { p_personal_id: b.id, p_nivel: n });
  if(error){ toast('No se pudo actualizar el nivel — ' + error.message); return; }
  b.nivelActual = n;
  renderDetalle();
  toast(`Nivel de ${b.nombre} actualizado a ${NIVEL_LABEL[n]}`);
}


let certificadoFile = null;
function abrirModal(){
  document.getElementById('modalBomberoNombre').textContent = BOMBEROS[bomberoActivo].nombre;
  document.getElementById('mNombre').value = '';
  document.getElementById('mFecha').value = '';
  nivelSel = 'inicial';
  esExterno = false;
  certificadoFile = null;
  document.getElementById('mCertInput').value = '';
  document.getElementById('mCertLabel').textContent = 'Subir certificado (PDF, JPG o PNG) — opcional';
  renderNivelSelect();
  renderExterno();
  document.getElementById('cursoModal').classList.add('show');
}

function seleccionarCertificado(input){
  if(!input.files || !input.files[0]) return;
  certificadoFile = input.files[0];
  document.getElementById('mCertLabel').textContent = certificadoFile.name;
}
function cerrarModal(){ document.getElementById('cursoModal').classList.remove('show'); }

function renderNivelSelect(){
  const row = document.getElementById('nivelSelectRow');
  if(esExterno){
    row.innerHTML = `<div class="nivel-opt-externo">Externo — sin nivel interno del Cuerpo</div>`;
    return;
  }
  row.innerHTML = NIVELES_CURSO.map(n =>
    `<div class="nivel-opt ${n} ${nivelSel===n?'on':''}" onclick="setNivelSel('${n}')">${NIVEL_LABEL[n]}</div>`
  ).join('');
}
function setNivelSel(n){ nivelSel = n; renderNivelSelect(); }

function toggleExterno(){
  esExterno = !esExterno;
  // Un curso externo no lo dicta el Cuerpo — no tiene sentido que además
  // tenga un nivel interno seleccionado. Se limpia la selección y el
  // selector pasa a mostrar "Externo" en vez de las 3 píldoras.
  if(esExterno) nivelSel = null;
  else nivelSel = 'inicial';
  renderExterno();
  renderNivelSelect();
}
function renderExterno(){ document.getElementById('externoBox').classList.toggle('on', esExterno); document.getElementById('externoBox').textContent = esExterno ? '✓' : ''; }

async function guardarCurso(){
  const nombre = document.getElementById('mNombre').value.trim();
  const fecha = fechaAIso(document.getElementById('mFecha').value);
  if(!nombre || !fecha){ toast('Completa nombre y fecha del curso (dd/mm/aaaa)'); return; }
  const b = BOMBEROS[bomberoActivo];

  let certificadoUrl = null;
  if(certificadoFile){
    const ext = (certificadoFile.name.split('.').pop() || 'pdf').toLowerCase();
    const path = `${miCuerpoId}/capacitaciones/${crypto.randomUUID()}.${ext}`;
    const { error: upErr } = await sb.storage.from('vigor-fotos').upload(path, certificadoFile);
    if(upErr){ toast('No se pudo subir el certificado — ' + upErr.message); return; }
    certificadoUrl = sb.storage.from('vigor-fotos').getPublicUrl(path).data.publicUrl;
  }

  const { data: curso, error } = await sb.from('personal_capacitaciones').insert({
    personal_id: b.id, cuerpo_id: miCuerpoId, compania_id: miCompaniaId,
    nombre_curso: nombre, fecha, nivel: esExterno ? null : nivelSel, es_externo: esExterno, creado_por: miPersonalId,
    certificado_url: certificadoUrl
  }).select().single();
  if(error){ toast('No se pudo guardar el curso — ' + error.message); return; }
  const idxActivo = bomberoActivo;
  cerrarModal();
  await cargarDatos();
  abrirBombero(idxActivo);
  toast(`Curso "${nombre}" agregado a ${BOMBEROS[bomberoActivo].nombre}`);
}

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2800);
}

function formatearFecha(valor){
  const limpio = valor.replace(/\D/g, '').slice(0, 8);
  let out = limpio.slice(0, 2);
  if(limpio.length > 2) out += '/' + limpio.slice(2, 4);
  if(limpio.length > 4) out += '/' + limpio.slice(4, 8);
  return out;
}
function fechaAIso(txt){
  const partes = (txt || '').trim().split('/');
  return partes.length === 3 ? `${partes[2]}-${partes[1].padStart(2,'0')}-${partes[0].padStart(2,'0')}` : null;
}

cargarDatos();
</script>
</body>
</html>
