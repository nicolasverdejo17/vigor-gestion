<!DOCTYPE html>
<html lang="es">
<head>
<meta name="robots" content="noindex, nofollow, noarchive">

<title>VIGOR - Gestiona tu compañía de forma eficiente</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#060A0F; --panel:#0A131C; --panel-alt:#0E1D28; --line:#132734; --line-strong:#1C3B49;
    --text:#E7F5FA; --text-muted:#7B99A3; --text-dim:#516E78;
    --brass:#C97A2E; --brass-bright:#FF9A44; --brass-dim:#8A4E1E;
    --cyan:#49E9FF; --cyan-dim:#1E6E7D;
    --burdeo:#7A1620; --burdeo-bright:#D8394E;
    --servicio:#3CF29A; --emergencia:#FF4B5C; --alerta:#FFC94D; --nodisp:#42555C;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;}
  body{
    background: radial-gradient(900px 500px at 50% -10%, rgba(73,233,255,0.08), transparent 60%), #060A0F;
    font-family:'Inter',sans-serif; color:var(--text);
  }
  .mono{font-family:'JetBrains Mono',monospace;}
  h1,h2,h3{font-family:'Rajdhani',sans-serif; text-transform:uppercase; letter-spacing:.04em; font-weight:700; margin:0;}
  svg.i{ width:1em; height:1em; fill:none; stroke:currentColor; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round; flex-shrink:0;}

  #wrap{ height:100%; display:none; flex-direction:column;}
  .app-head{ padding:10px 18px 8px; flex-shrink:0; display:flex; align-items:center; gap:12px;}
  .back-btn{
    background:var(--panel); border:1.5px solid var(--line-strong); color:var(--text-muted);
    font-family:'Rajdhani'; font-weight:600; letter-spacing:.03em; text-transform:uppercase;
    font-size:11px; padding:7px 12px; border-radius:6px; cursor:pointer; flex-shrink:0;
  }
  .app-head .titulo{ min-width:0; flex:1;}
  .app-head .eyebrow{ font-size:10px; color:var(--text-dim); letter-spacing:.1em; text-transform:uppercase;}
  .app-head h1{ font-size:17px; margin-top:2px;}
  .content{ flex:1; overflow-y:auto; padding:6px 18px 18px;}
  .content::-webkit-scrollbar{ width:7px;} .content::-webkit-scrollbar-thumb{ background:var(--brass-dim); border-radius:4px;}
  .contenedor{ max-width:980px; margin:0 auto; display:flex; flex-direction:column; gap:14px;}

  .panel{ background:var(--panel); border:1.5px solid var(--line-strong); border-radius:12px; padding:14px; position:relative;}
  .panel::before{ content:""; position:absolute; inset:5px; border:1px solid var(--brass-dim); border-radius:8px; pointer-events:none; opacity:.25;}
  .panel > *{ position:relative; z-index:1;}
  .panel h3{ font-size:12.5px; color:var(--brass-bright); letter-spacing:.08em; margin-bottom:10px; display:flex; align-items:center; justify-content:space-between; gap:8px;}
  .nota{ font-size:11.5px; color:var(--text-muted); line-height:1.5;}

  .btn-pri{ background:var(--cyan-dim); border:2px solid var(--cyan); color:#fff; font-family:'Rajdhani'; font-weight:700; letter-spacing:.05em; text-transform:uppercase; font-size:13px; padding:10px 14px; border-radius:8px; cursor:pointer;}
  .btn-pri:hover{ background:var(--cyan); color:#0D2226;}
  .btn-sec{ background:transparent; border:1.5px solid var(--line-strong); color:var(--text-muted); font-family:'Rajdhani'; font-weight:700; letter-spacing:.04em; text-transform:uppercase; font-size:11.5px; padding:7px 12px; border-radius:7px; cursor:pointer; display:inline-flex; align-items:center; gap:6px;}
  .btn-sec:hover{ border-color:var(--brass-bright); color:var(--text);}
  .btn-peligro{ background:transparent; border:1.5px solid var(--burdeo-bright); color:var(--burdeo-bright); font-family:'Rajdhani'; font-weight:700; letter-spacing:.05em; text-transform:uppercase; font-size:13px; padding:10px 14px; border-radius:8px; cursor:pointer;}
  .btn-peligro:hover{ background:var(--burdeo); color:#fff;}
  button:disabled{ opacity:.5; cursor:not-allowed;}

  select.sel, input.inp, textarea.inp{
    background:var(--panel-alt); border:1.5px solid var(--line-strong); border-radius:7px; padding:9px 10px;
    font-size:13px; color:var(--text); font-family:'Inter'; min-width:0; width:100%;
  }
  textarea.inp{ resize:vertical; min-height:74px; line-height:1.45;}
  select.sel:focus, input.inp:focus, textarea.inp:focus{ outline:none; border-color:var(--cyan);}
  label.t{ display:block; font-size:10px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.06em; margin-bottom:5px; font-weight:600;}
  .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .campo{ margin-bottom:10px;}

  .chip{ font-size:9.5px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; padding:4px 10px; border-radius:10px; display:inline-flex; align-items:center; gap:5px; color:#fff;}
  .chip.abierto{ background:var(--cyan-dim); border:1px solid var(--cyan);}
  .chip.cerrado{ background:var(--burdeo); border:1px solid var(--burdeo-bright);}
  .asist{ font-size:9px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; padding:2px 7px; border-radius:8px; border:1px solid var(--line-strong); color:var(--text-muted); display:inline-block; white-space:nowrap;}
  .asist.completa{ color:var(--servicio); border-color:rgba(60,242,154,.5);}
  .asist.parcial{ color:var(--alerta); border-color:rgba(255,201,77,.55);}
  .asist.ausente{ color:var(--emergencia); border-color:rgba(255,75,92,.55);}
  .asist.en_curso{ color:var(--cyan); border-color:rgba(73,233,255,.5);}
  .tag-reemplazo{ display:inline-block; margin-top:3px; font-family:'Inter',sans-serif; font-size:9px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; padding:2px 7px; border-radius:8px; background:var(--cyan-dim); color:#fff; border:1px solid var(--cyan);}

  /* ---- Lista ---- */
  .filtros{ display:grid; grid-template-columns:repeat(auto-fit, minmax(120px,1fr)); gap:10px; align-items:end;}
  .libro-card{ display:flex; align-items:center; gap:12px; padding:12px 14px; border:1.5px solid var(--line-strong); border-radius:10px; background:var(--panel-alt); cursor:pointer; margin-bottom:8px;}
  .libro-card:hover{ border-color:var(--brass-bright);}
  .libro-card .fecha{ font-family:'Rajdhani'; font-weight:800; font-size:16px; text-transform:uppercase; letter-spacing:.03em;}
  .libro-card .meta{ font-size:11px; color:var(--text-muted); margin-top:2px;}
  .libro-card .info{ flex:1; min-width:0;}
  .emerg-badge{ font-size:10px; color:var(--emergencia); border:1px solid rgba(255,75,92,.5); border-radius:8px; padding:2px 8px; font-weight:700;}
  .vacio{ text-align:center; padding:26px 12px; color:var(--text-dim); font-size:12.5px; line-height:1.6;}

  /* ---- Detalle ---- */
  .cabecera{ display:flex; flex-wrap:wrap; align-items:center; gap:10px;}
  .cabecera .grow{ flex:1; min-width:200px;}
  .cabecera h2{ font-size:19px;}
  .aviso{ font-size:12px; padding:9px 12px; border-radius:8px; margin-bottom:10px; line-height:1.5;}
  .aviso.mal{ background:rgba(255,75,92,.1); border:1px solid rgba(255,75,92,.5); color:#FFC9CE;}
  .aviso.bien{ background:rgba(60,242,154,.08); border:1px solid rgba(60,242,154,.4); color:#BDF7DC;}
  .aviso.info{ background:var(--panel-alt); border:1px dashed var(--line-strong); color:var(--text-muted);}
  .tabla{ width:100%; border-collapse:collapse; font-size:12.5px;}
  .tabla th{ text-align:left; font-size:9.5px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.06em; padding:5px 6px; border-bottom:1px solid var(--line-strong);}
  .tabla td{ padding:8px 6px; border-bottom:1px solid var(--line); vertical-align:middle;}
  .tabla .sub{ font-size:10px; color:var(--text-dim); font-family:'JetBrains Mono',monospace;}
  .scroll-x{ overflow-x:auto;}
  .moon{ color:var(--alerta); font-size:14px; display:inline-flex;}
  .mat-row{ display:grid; grid-template-columns:70px 1.3fr 1fr 2fr; gap:8px; align-items:center; padding:8px 0; border-bottom:1px solid var(--line);}
  .mat-row b{ font-family:'Rajdhani'; font-size:16px; letter-spacing:.03em;}
  @media (max-width:640px){ .mat-row{ grid-template-columns:1fr 1fr; } .mat-row b{ grid-column:1 / -1; } .mat-row input{ grid-column:1 / -1; } .grid2{ grid-template-columns:1fr;} }
  .mat-ro{ font-size:12px; color:var(--text-muted);}
  .nov{ display:flex; gap:10px; padding:10px 0; border-bottom:1px solid var(--line);}
  .nov:last-child{ border-bottom:none;}
  .nov .hora{ font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--cyan); width:46px; flex-shrink:0; padding-top:1px;}
  .nov .cuerpo{ flex:1; min-width:0;}
  .nov .tipo{ font-size:9px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--text-dim);}
  .nov.emergencia .tipo{ color:var(--emergencia);}
  .nov.emergencia{ background:rgba(255,75,92,.06); border-left:3px solid var(--emergencia); padding-left:10px; margin:2px 0;}
  .nov .desc{ font-size:13px; line-height:1.45; margin-top:2px; white-space:pre-wrap;}
  .nov .datos{ font-size:11px; color:var(--text-muted); margin-top:4px; font-family:'JetBrains Mono',monospace; line-height:1.5;}
  .mini-x{ background:none; border:none; color:var(--text-dim); cursor:pointer; font-size:14px; padding:3px; align-self:flex-start;}
  .mini-x:hover{ color:var(--burdeo-bright);}
  .texto-ro{ white-space:pre-wrap; font-size:13px; line-height:1.5; background:var(--panel-alt); border:1px solid var(--line); border-radius:8px; padding:10px 12px;}
  .anot{ padding:9px 0; border-bottom:1px solid var(--line); font-size:13px; line-height:1.45;}
  .anot .quien{ font-size:10.5px; color:var(--text-dim); margin-bottom:2px;}

  /* ---- Modal ---- */
  .modal-overlay{ position:fixed; inset:0; background:rgba(5,10,15,0.78); z-index:60; display:none; align-items:center; justify-content:center; padding:18px;}
  .modal-overlay.show{ display:flex;}
  .modal-box{ background:var(--panel); border:1.5px solid var(--brass-dim); border-radius:12px; padding:18px; width:100%; max-width:460px; max-height:90vh; overflow-y:auto; position:relative;}
  .modal-box::before{ content:""; position:absolute; inset:5px; border:1px solid var(--brass-dim); border-radius:8px; opacity:.35; pointer-events:none;}
  .modal-box > *{ position:relative; z-index:1;}
  @media (max-width:560px){ .modal-overlay{ align-items:flex-end; padding:0;} .modal-box{ border-radius:14px 14px 0 0; max-height:92vh;} }
  .modal-head{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:12px;}
  .modal-head h3{ font-size:16px; margin:0;}
  .modal-x{ background:none; border:none; color:var(--text-dim); font-size:17px; cursor:pointer; padding:2px; line-height:1;}
  .modal-actions{ display:flex; gap:10px; margin-top:14px;} .modal-actions > *{ flex:1;}

  .toast{ position:fixed; bottom:84px; left:50%; transform:translateX(-50%) translateY(8px); max-width:90vw; text-align:center; background:var(--panel-alt); border:1px solid var(--cyan); color:#DFF7F9; padding:11px 18px; border-radius:8px; font-size:12.5px; opacity:0; pointer-events:none; transition:all .25s; z-index:80;}
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0);}
  .toast.error{ border-color:var(--burdeo-bright);}

  .tabbar-real{ display:flex; border-top:1px solid var(--line-strong); background:#0C1116; flex-shrink:0; padding-bottom:6px;}
  .tabbar-real a{ flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; padding:9px 0 5px; color:var(--text-dim); text-decoration:none; font-size:9.5px; font-weight:600;}
  .tabbar-real a .ic{ line-height:1; display:flex;}
  .tabbar-real a .ic svg{ width:22px; height:22px;}
  .tabbar-real a.active{ color:var(--cyan);}

  /* ---- Impresión (carta/oficio) ---- */
  @media print{
    @page{ size:letter; margin:14mm; }
    html,body{ height:auto; overflow:visible; background:#fff !important; color:#000 !important;}
    #wrap{ display:block !important; height:auto;}
    .content{ overflow:visible; padding:0;}
    .no-print, .app-head, .tabbar-real, .toast, .mini-x{ display:none !important;}
    .panel{ background:#fff !important; border:1px solid #999 !important; color:#000 !important; break-inside:avoid; margin-bottom:10px;}
    .panel::before{ display:none;}
    .panel h3{ color:#000 !important;}
    .nota, .nov .datos, .tabla .sub, .mat-ro, .anot .quien, .nov .tipo, .texto-ro{ color:#333 !important;}
    .texto-ro{ background:#fff !important; border-color:#999 !important;}
    .tabla th, .tabla td, .nov, .anot, .mat-row{ border-color:#ccc !important;}
    .asist, .chip, .tag-reemplazo, .emerg-badge{ color:#000 !important; border:1px solid #666 !important; background:#fff !important;}
    .nov.emergencia{ background:#fff !important; border-left:3px solid #000 !important;}
    select.sel, input.inp, textarea.inp{ background:#fff !important; color:#000 !important; border:1px solid #999 !important;}
  }
</style>

<body>

  <div id="sinSesion" style="display:none; padding:40vh 16px 40px; color:var(--text-muted); text-align:center;">
    Debes iniciar sesión primero. <a href="login_registro.html" style="color:var(--cyan);">Ir a iniciar sesión</a>
  </div>

  <div id="wrap">
    <div class="app-head">
      <button class="back-btn" onclick="volver()">← Volver</button>
      <div class="titulo">
        <div class="eyebrow" id="ciaLabel">—</div>
        <h1>Libro de Guardia</h1>
      </div>
    </div>
    <div class="content"><div class="contenedor" id="vista"></div></div>
    <div class="tabbar-real" id="tabbarReal"></div>
  </div>

  <!-- Modal: abrir libro -->
  <div class="modal-overlay" id="abrirModal" onclick="if(event.target===this) cerrarAbrir()">
    <div class="modal-box">
      <div class="modal-head"><h3>Abrir libro de guardia</h3><button class="modal-x" onclick="cerrarAbrir()">✕</button></div>
      <div class="campo"><label class="t">Fecha en que empezó la guardia</label>
        <input class="inp mono" id="abrirFecha" type="text" inputmode="numeric" placeholder="dd/mm/aaaa" oninput="this.value = formatearFecha(this.value)"></div>
      <div class="modal-actions"><button class="btn-sec" onclick="cerrarAbrir()">Cancelar</button><button class="btn-pri" id="btnAbrir" onclick="confirmarAbrir()">Abrir libro</button></div>
    </div>
  </div>

  <!-- Modal: novedad -->
  <div class="modal-overlay" id="novModal" onclick="if(event.target===this) cerrarNovedad()">
    <div class="modal-box">
      <div class="modal-head"><h3>Nueva novedad</h3><button class="modal-x" onclick="cerrarNovedad()">✕</button></div>
      <div class="grid2">
        <div class="campo"><label class="t">Hora</label><input class="inp mono" id="novHora" type="time"></div>
        <div class="campo"><label class="t">Tipo</label>
          <select class="sel" id="novTipo" onchange="cambiarTipoNovedad()">
            <option value="general">Novedad general</option>
            <option value="emergencia">Salida a emergencia</option>
            <option value="material">Material / equipo</option>
            <option value="cuartel">Cuartel / instalaciones</option>
            <option value="comunicaciones">Comunicaciones / radio</option>
            <option value="visitas">Visitas</option>
            <option value="otro">Otro</option>
          </select></div>
      </div>
      <div class="campo"><label class="t" id="novDescLabel">Descripción</label><textarea class="inp" id="novDesc" placeholder="Qué pasó…"></textarea></div>
      <div id="novEmergencia" style="display:none;">
        <div class="grid2">
          <div class="campo"><label class="t">Clave</label><input class="inp mono" id="emClave" type="text" placeholder="Ej. 10-0"></div>
          <div class="campo"><label class="t">Unidad</label><select class="sel" id="emUnidad"></select></div>
        </div>
        <div class="campo"><label class="t">Dirección</label><input class="inp" id="emDireccion" type="text" placeholder="Calle y número / referencia"></div>
        <div class="campo"><label class="t">Personal que salió</label><input class="inp" id="emPersonal" type="text" placeholder="Nombres separados por coma"></div>
        <div class="grid2">
          <div class="campo"><label class="t">Hora de salida</label><input class="inp mono" id="emSalida" type="time"></div>
          <div class="campo"><label class="t">Hora de regreso</label><input class="inp mono" id="emRegreso" type="time"></div>
        </div>
      </div>
      <div class="modal-actions"><button class="btn-sec" onclick="cerrarNovedad()">Cancelar</button><button class="btn-pri" id="btnNovedad" onclick="guardarNovedad()">Guardar</button></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

<script>
const SUPABASE_URL = 'https://mcfcfbtiruewlcejionr.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1jZmNmYnRpcnVld2xjZWppb25yIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzODExNzgsImV4cCI6MjEwMzk1NzE3OH0.9b_t63ah25RIGNn3pzZU3L553YUrrn7IXWW3MEjXuXU';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { persistSession: true, autoRefreshToken: true } });

// El Libro de Guardia es de toda la Compañía: cualquier integrante puede verlo y llenarlo (la base valida la pertenencia).
const CONFIG_DEF = { hora_inicio:'22:00', hora_fin:'05:00', minimo_total:7, minimo_maquinista:1 };
const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const ASIST_LABEL = { completa:'Completa', parcial:'Parcial', ausente:'Ausente', en_curso:'En servicio', pendiente:'Pendiente' };
const TIPO_LABEL = { general:'Novedad general', emergencia:'Salida a emergencia', material:'Material / equipo', cuartel:'Cuartel / instalaciones', comunicaciones:'Comunicaciones / radio', visitas:'Visitas', otro:'Otro' };
const ESTADO_MAT = { servicio:'En servicio', mant:'En mantención', fuera:'Fuera de servicio', emergencia:'En emergencia' };
const COMBUSTIBLE = ['Lleno','3/4','1/2','1/4','Reserva'];
const MOON = '<svg class="i" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>';

const ERRORES = {
  LIBRO_CERRADO: 'El libro está cerrado: ya no se puede modificar (solo se agregan anotaciones posteriores).',
  LIBRO_ABIERTO: 'Las anotaciones posteriores se agregan solo a libros ya cerrados.',
  GUARDIA_EN_CURSO: 'La guardia todavía no termina — el libro se puede cerrar cuando termina el horario.',
  FECHA_FUTURA: 'No se puede abrir el libro de una guardia que todavía no empieza.',
  SIN_PERMISO: 'No tienes permiso para hacer esto.',
  SIN_SESION: 'Tu sesión expiró — vuelve a iniciar sesión.',
  LIBRO_NO_ENCONTRADO: 'No se encontró ese libro.',
};
function msgError(e){ const m = (e && e.message) || ''; const k = Object.keys(ERRORES).find(x => m.includes(x)); return k ? ERRORES[k] : 'No se pudo completar — ' + m; }

let PERFIL = null, compId = null, CONFIG = { ...CONFIG_DEF }, ciaNombre = '—';
let LISTA = [], LIBRO = null, MATERIAL = [], NOVEDADES = [], ANOTACIONES = [], DOTACION = [];
let enviando = false;

// ---- Utilidades ----
const pad = (n) => String(n).padStart(2, '0');
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const claveFecha = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
function formatearFecha(valor){
  const limpio = valor.replace(/\D/g, '').slice(0, 8);
  let out = limpio.slice(0, 2);
  if(limpio.length > 2) out += '/' + limpio.slice(2, 4);
  if(limpio.length > 4) out += '/' + limpio.slice(4, 8);
  return out;
}
function fechaAIso(txt){
  const p = (txt || '').trim().split('/');
  if(p.length !== 3 || p[2].length !== 4) return null;
  const iso = `${p[2]}-${p[1].padStart(2, '0')}-${p[0].padStart(2, '0')}`;
  const d = new Date(iso + 'T00:00:00');
  return isNaN(d) || claveFecha(d) !== iso ? null : iso;
}
function isoAFecha(iso){ const p = (iso || '').split('-'); return p.length === 3 ? `${p[2]}/${p[1]}/${p[0]}` : ''; }
function fechaLarga(iso){
  const [y, m, d] = iso.split('-').map(Number);
  const t = new Date(y, m - 1, d).toLocaleDateString('es-CL', { weekday:'long', day:'numeric', month:'long', year:'numeric' });
  return t.charAt(0).toUpperCase() + t.slice(1);
}
function hhmm(iso){ return iso ? new Date(iso).toLocaleTimeString('es-CL', { hour:'2-digit', minute:'2-digit', hour12:false }) : '—'; }
function fechaHora(iso){ return iso ? new Date(iso).toLocaleString('es-CL', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit', hour12:false }) : '—'; }
function durTxt(min){ const h = Math.floor(min / 60), m = min % 60; return h ? `${h} h${m ? ' ' + m + ' min' : ''}` : `${m} min`; }
function nombreCorto(n){ return (n || '').split(' ').filter(Boolean).slice(0, 2).join(' '); }
function toast(msg, error){ const t = document.getElementById('toast'); t.textContent = msg; t.classList.toggle('error', !!error); t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2800); }
// «Volver» sale directo del libro, a la pantalla desde la que se entró (Opciones o Guardia Nocturna),
// sin recorrer uno por uno los libros que se hayan abierto en medio.
(function(){ try{
  const r = document.referrer ? new URL(document.referrer) : null;
  const f = r && r.origin === location.origin ? r.pathname.split('/').pop() : '';
  if(f && f !== 'libro_guardia.html' && /^[a-z_]+\.html$/.test(f)) sessionStorage.setItem('libro_origen', f);
  else if(!f) sessionStorage.removeItem('libro_origen');
}catch(e){} })();
function volver(){
  let destino = 'opciones_celular.html';
  try{ destino = sessionStorage.getItem('libro_origen') || destino; }catch(e){}
  window.location.href = destino;
}

// Ventana horaria de la guardia (hora_inicio -> hora_fin, puede cruzar medianoche)
function ventana(iso){
  const [y, m, d] = iso.split('-').map(Number);
  const [hi, mi] = CONFIG.hora_inicio.slice(0, 5).split(':').map(Number);
  const [hf, mf] = CONFIG.hora_fin.slice(0, 5).split(':').map(Number);
  const cruza = (hf * 60 + mf) <= (hi * 60 + mi);
  return { ini: new Date(y, m - 1, d, hi, mi), fin: new Date(y, m - 1, d + (cruza ? 1 : 0), hf, mf), inicioMin: hi * 60 + mi };
}

// ---- Abrir libro ----
function guardiaActualFecha(){
  // Si todavía es de madrugada (antes del término de la guardia de anoche), el libro es el de ayer.
  const ahora = new Date(), v = ventana(claveFecha(new Date(ahora.getFullYear(), ahora.getMonth(), ahora.getDate() - 1)));
  const d = ahora < v.fin ? new Date(ahora.getFullYear(), ahora.getMonth(), ahora.getDate() - 1) : ahora;
  return claveFecha(d);
}
function abrirAbrir(){ document.getElementById('abrirFecha').value = isoAFecha(guardiaActualFecha()); document.getElementById('abrirModal').classList.add('show'); }
function cerrarAbrir(){ document.getElementById('abrirModal').classList.remove('show'); }

// ---- Acciones ----
async function ejecutar(boton, fn, okMsg){
  if(enviando) return false; enviando = true;
  const txt = boton ? boton.textContent : '';
  if(boton){ boton.disabled = true; boton.textContent = 'Guardando…'; }
  const res = await fn();
  enviando = false;
  if(boton){ boton.disabled = false; boton.textContent = txt; }
  if(res && res.error){ toast(msgError(res.error), true); return false; }
  if(okMsg) toast(okMsg);
  return true;
}
async function guardarMaterial(){
  const filas = [...document.querySelectorAll('.mat-estado')].map(e => ({ carro: e.dataset.carro, estado: e.value }));
  const ok = await ejecutar(document.getElementById('btnMaterial'), async () => {
    for(const f of filas){
      const comb = document.querySelector(`.mat-comb[data-carro="${f.carro}"]`).value, obs = document.querySelector(`.mat-obs[data-carro="${f.carro}"]`).value;
      const { error } = await sb.rpc('libro_guardar_material', { p_libro_id: LIBRO.id, p_carro_id: f.carro, p_estado: f.estado, p_combustible: comb, p_observacion: obs });
      if(error) return { error };
    }
    return {};
  }, 'Estado del material guardado');
  if(ok) await recargarDetalle();
}
async function guardarEntrega(){
  const ok = await ejecutar(document.getElementById('btnEntrega'), () => sb.rpc('libro_guardar_entrega', { p_libro_id: LIBRO.id, p_resumen: document.getElementById('entResumen').value, p_pendientes: document.getElementById('entPendientes').value }), 'Entrega guardada');
  if(ok) await recargarDetalle();
}
async function quitarNovedad(id){
  if(!confirm('¿Quitar esta novedad del libro? Solo se puede mientras el libro está abierto.')) return;
  const ok = await ejecutar(null, () => sb.rpc('libro_quitar_novedad', { p_novedad_id: id }), 'Novedad quitada');
  if(ok) await recargarDetalle();
}
async function cerrarLibro(){
  if(!confirm('¿Cerrar el libro de esta guardia? Después no se podrá editar: solo se podrán agregar anotaciones posteriores.')) return;
  const ok = await ejecutar(document.getElementById('btnCerrar'), () => sb.rpc('libro_cerrar', { p_libro_id: LIBRO.id }), 'Libro cerrado');

async function agregarAnotacion(){

// La hora de una novedad de la noche pertenece al día siguiente si es anterior a la hora de inicio de la guardia.
function horaAISO(hhmmTxt){
  const [h, m] = hhmmTxt.split(':').map(Number), v = ventana(LIBRO.fecha);
  const [y, mo, d] = LIBRO.fecha.split('-').map(Number);
  const cruza = v.fin.getDate() !== v.ini.getDate() || v.fin.getMonth() !== v.ini.getMonth();
  const dia = (cruza && (h * 60 + m) < v.inicioMin) ? d + 1 : d;
  return new Date(y, mo - 1, dia, h, m).toISOString();
}
async function guardarNovedad(){
  const hora = document.getElementById('novHora').value, tipo = document.getElementById('novTipo').value, desc = document.getElementById('novDesc').value.trim();
  if(!hora){ toast('Pon la hora.', true); return; }
  if(!desc){ toast('Escribe la descripción.', true); return; }
  let datos = null;
  if(tipo === 'emergencia'){
    const g = (id) => document.getElementById(id).value.trim();
    datos = { clave: g('emClave'), direccion: g('emDireccion'), unidad: document.getElementById('emUnidad').value, personal: g('emPersonal'), salida: g('emSalida'), regreso: g('emRegreso') };
  }
  const ok = await ejecutar(document.getElementById('btnNovedad'), () => sb.rpc('libro_agregar_novedad', { p_libro_id: LIBRO.id, p_hora: horaAISO(hora), p_tipo: tipo, p_descripcion: desc, p_datos: datos }), 'Novedad registrada');
  if(ok){ cerrarNovedad(); await recargarDetalle(); }
}
