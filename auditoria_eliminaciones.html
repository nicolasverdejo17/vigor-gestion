<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Vigor — Registro de Auditoría</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#060A0F; --panel:#0A131C; --panel-alt:#0E1D28; --line:#132734; --line-strong:#1C3B49;
    --text:#E7F5FA; --text-muted:#7B99A3; --text-dim:#516E78;
    --brass:#C97A2E; --brass-bright:#FF9A44; --brass-dim:#8A4E1E;
    --cyan:#49E9FF; --cyan-dim:#1E6E7D;
    --burdeo-bright:#D8394E; --servicio:#3CF29A; --alerta:#FFC94D;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;}
  body{
    background: radial-gradient(1100px 500px at 15% -10%, rgba(73,233,255,0.06), transparent 60%), var(--bg);
    color:var(--text); font-family:'Inter',sans-serif; height:100vh; display:flex; flex-direction:column;
  }
  .mono{font-family:'JetBrains Mono',monospace;}
  h1,h2,h3{font-family:'Rajdhani',sans-serif; text-transform:uppercase; letter-spacing:.04em; font-weight:700; margin:0;}
  .nameplate{ background:linear-gradient(180deg,var(--panel-alt),var(--panel)); border-bottom:2px solid var(--brass-dim); flex-shrink:0;}
  .nameplate-inner{ display:flex; align-items:center; justify-content:space-between; padding:14px 26px; flex-wrap:wrap; gap:12px;}
  .brand{ display:flex; align-items:center; gap:12px;}
  .brand-mark{ width:36px;height:36px; border:1.5px solid var(--brass); border-radius:3px; display:flex; align-items:center; justify-content:center; position:relative; background:var(--panel);}
  .brand-mark::before{ content:""; position:absolute; inset:4px; border:1px solid var(--brass-dim); border-radius:2px;}
  .brand-mark svg{ width:15px; height:15px;}
  .brand-text h1{ font-size:19px;}
  .brand-text span{ font-size:10.5px; color:var(--text-dim); letter-spacing:.1em; text-transform:uppercase; display:block; margin-top:2px;}
  .back-btn{ background:transparent; border:1.5px solid var(--line-strong); color:var(--text-muted); font-family:'Rajdhani'; font-weight:600; font-size:12px; padding:8px 14px; border-radius:5px; cursor:pointer; margin-right:12px;}
  .back-btn:hover{ border-color:var(--brass-bright); color:var(--text);}
  .role-tag{ font-family:'Rajdhani'; font-weight:700; font-size:11.5px; letter-spacing:.06em; text-transform:uppercase; padding:6px 14px; border-radius:4px; background:var(--panel); border:1.5px solid var(--brass); color:var(--brass-bright);}

  .intro-nota{
    flex-shrink:0; margin:14px 26px 0; padding:12px 16px; background:var(--panel-alt);
    border:1px solid var(--brass-dim); border-left:3px solid var(--brass-bright); border-radius:6px;
    font-size:11.5px; color:var(--text-muted); line-height:1.6;
  }
  .intro-nota b{ color:var(--text);}

  .content-wrap{ flex:1; min-height:0; padding:14px 26px 20px; overflow-y:auto;}
  table{ width:100%; border-collapse:collapse; background:var(--panel); border:1px solid var(--line-strong); border-radius:10px; overflow:hidden;}
  thead th{ text-align:left; font-size:10px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.06em; padding:11px 16px; border-bottom:2px solid var(--line-strong); background:var(--panel-alt);}
  tbody tr{ border-bottom:1px solid var(--line);}
  tbody tr:last-child{ border-bottom:none;}
  tbody td{ padding:11px 16px; font-size:12.5px; vertical-align:middle;}
  .td-hora{ font-family:'JetBrains Mono',monospace; color:var(--text-dim); font-size:11px; white-space:nowrap;}
  .td-usuario{ font-weight:600;}
  .evento-tag{ font-size:9.5px; font-weight:700; text-transform:uppercase; letter-spacing:.02em; padding:3px 9px; border-radius:10px; display:inline-block; background:var(--burdeo-bright); color:#fff;}
  .empty-state{ text-align:center; padding:50px 20px; color:var(--text-dim); font-size:12.5px;}

  @media (max-width:760px){
    html,body{ overflow:auto; height:auto; min-height:100%;}
    body{ height:auto;}
    .nameplate-inner{ padding:12px 14px;}
    .intro-nota{ margin:12px 14px 0;}
    .content-wrap{ padding:12px 14px 20px; overflow-x:auto;}
    table{ min-width:600px;}
  }

  .toast{ position:fixed; bottom:26px; left:50%; transform:translateX(-50%) translateY(12px); background:var(--panel-alt); border:1px solid var(--cyan); color:#DFF7F9; padding:13px 22px; border-radius:6px; font-size:13.5px; opacity:0; pointer-events:none; transition:all .25s; z-index:50;}
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0);}
</style>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="icons/favicon-16.png" sizes="16x16" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#060A0F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Vigor">
<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}</script>
</head>
<body>

  <div class="nameplate">
    <div class="nameplate-inner">
      <div class="brand">
        <button class="back-btn" onclick="volver()">← Volver</button>
        <div class="brand-mark"><svg viewBox="0 0 24 24" fill="none"><path d="M12 2L4 6v6c0 5 3.5 8.5 8 10 4.5-1.5 8-5 8-10V6l-8-4z" stroke="#49E9FF" stroke-width="1.6"/></svg></div>
        <div class="brand-text"><h1>Registro de Auditoría</h1><span id="alcanceLabel">—</span></div>
      </div>
      <div class="role-tag" id="roleTag">Sin sesión</div>
    </div>
  </div>

  <div class="intro-nota" id="introNota">
    <b>Qué es esto:</b> registro de acciones críticas (por ahora, eliminaciones) sobre Secretaría e Inventario.
  </div>

  <div class="content-wrap">
    <table>
      <thead><tr><th>Fecha / Hora</th><th>Usuario</th><th>Evento</th><th>Detalle</th></tr></thead>
      <tbody id="tablaBody"></tbody>
    </table>
  </div>

  <div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://mcfcfbtiruewlcejionr.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1jZmNmYnRpcnVld2xjZWppb25yIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzODExNzgsImV4cCI6MjEwMzk1NzE3OH0.9b_t63ah25RIGNn3pzZU3L553YUrrn7IXWW3MEjXuXU';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { persistSession: true, autoRefreshToken: true } });

// Solo Superintendente (alcance: Cuerpo General) y Director (alcance: su
// propia Compañía) llegan acá con datos -- la RLS de registro_auditoria ya
// resuelve el alcance correcto para cada uno, no hace falta filtrar del
// lado del cliente.
const ROLES_CON_ACCESO = ['Superintendente','Director'];

function volver(){
  if(window.history.length > 1){ history.back(); return; }
  window.location.href = 'opciones_celular.html';
}

async function cargarDatos(){
  const { data: { session } } = await sb.auth.getSession();
  if(!session){ toast('Necesitás loguearte primero'); return; }
  const { data: perfil } = await sb.from('personal').select('cargo').eq('auth_user_id', session.user.id).maybeSingle();
  if(!perfil || !ROLES_CON_ACCESO.includes(perfil.cargo)){
    document.getElementById('tablaBody').innerHTML = `<tr><td colspan="4" class="empty-state">🔒 Esta pantalla es exclusiva del Superintendente (Cuerpo General) y el Director de cada Compañía.</td></tr>`;
    return;
  }
  document.getElementById('roleTag').textContent = perfil.cargo;
  document.getElementById('alcanceLabel').textContent = perfil.cargo === 'Superintendente' ? 'Cuerpo General · Vigor' : 'Mi Compañía · Vigor';

  const { data, error } = await sb.from('registro_auditoria')
    .select('ocurrido_en, usuario_label, tipo, detalle')
    .order('ocurrido_en', { ascending:false })
    .limit(200);
  if(error){ toast('No se pudo cargar — ' + error.message); return; }
  renderTabla(data || []);
}

function renderTabla(eventos){
  const body = document.getElementById('tablaBody');
  if(!eventos.length){
    body.innerHTML = `<tr><td colspan="4" class="empty-state">Sin eventos registrados todavía.</td></tr>`;
    return;
  }
  body.innerHTML = eventos.map(e => `
    <tr>
      <td class="td-hora">${new Date(e.ocurrido_en).toLocaleString('es-CL', {day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit', hour12:false})}</td>
      <td class="td-usuario">${e.usuario_label}</td>
      <td><span class="evento-tag">${e.tipo}</span></td>
      <td>${e.detalle}</td>
    </tr>
  `).join('');
}

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2600);
}

cargarDatos();
</script>
</body>
</html>
