<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Vigor — Historial de Movimientos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#060A0F; --panel:#0A131C; --panel-alt:#0E1D28; --line:#132734; --line-strong:#1C3B49;
    --text:#E7F5FA; --text-muted:#7B99A3; --text-dim:#516E78;
    --brass:#C97A2E; --brass-bright:#FF9A44; --brass-dim:#8A4E1E;
    --cyan:#49E9FF; --cyan-dim:#1E6E7D; --cyan-glow:rgba(73,233,255,0.35); --amber-glow:rgba(255,154,68,0.32);
    --burdeo:#7A1620; --burdeo-bright:#D8394E;
    --servicio:#3CF29A; --emergencia:#FF4B5C; --alerta:#FFC94D; --fuera:#C9A63B; --nodisp:#42555C;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;}
  body{
    background: radial-gradient(1100px 500px at 15% -10%, rgba(73,233,255,0.06), transparent 60%), var(--bg);
    color:var(--text); font-family:'Inter',sans-serif; height:100vh; display:flex; flex-direction:column;
  }
  .mono{font-family:'JetBrains Mono',monospace;}
  h1,h2,h3{font-family:'Rajdhani',sans-serif; text-transform:uppercase; letter-spacing:.04em; font-weight:700; margin:0;}

  .nameplate{ background:linear-gradient(180deg,var(--panel-alt),var(--panel)); border-bottom:2px solid var(--brass-dim); flex-shrink:0;}
  .nameplate-inner{ display:flex; align-items:center; justify-content:space-between; padding:14px 26px; flex-wrap:wrap; gap:12px;}
  .brand{ display:flex; align-items:center; gap:12px;}
  .brand-mark{ width:36px;height:36px; border:1.5px solid var(--brass); border-radius:3px; display:flex; align-items:center; justify-content:center; position:relative; background:var(--panel);}
  .brand-mark::before{ content:""; position:absolute; inset:4px; border:1px solid var(--brass-dim); border-radius:2px;}
  .brand-mark svg{ width:15px; height:15px;}
  .brand-text h1{ font-size:19px; letter-spacing:.04em;}
  .brand-text span{ font-size:10.5px; color:var(--text-dim); letter-spacing:.1em; text-transform:uppercase; display:block; margin-top:2px;}
  .role-tag{
    font-family:'Rajdhani'; font-weight:700; font-size:11.5px; letter-spacing:.06em; text-transform:uppercase;
    padding:6px 14px; border-radius:4px; background:var(--panel); border:1.5px solid var(--brass); color:var(--brass-bright);
  }

  .content-wrap{ flex:1; min-height:0; padding:18px 26px 22px; display:flex; flex-direction:column; overflow:hidden;}
  .head-row{ display:flex; align-items:center; gap:14px; margin-bottom:14px; flex-shrink:0;}
  .back-btn{
    background:var(--panel); border:1.5px solid var(--line-strong); color:var(--text-muted);
    font-family:'Rajdhani'; font-weight:600; letter-spacing:.03em; text-transform:uppercase;
    font-size:12.5px; padding:9px 16px; border-radius:5px; cursor:pointer;
  }
  .back-btn:hover{ border-color:var(--brass-bright); color:var(--text);}
  .btn-exportar-hist{
    margin-left:auto; background:var(--cyan-dim); border:1.5px solid var(--cyan); color:#fff;
    font-family:'Rajdhani'; font-weight:700; letter-spacing:.03em; text-transform:uppercase;
    font-size:11.5px; padding:9px 15px; border-radius:6px; cursor:pointer;
  }
  .btn-exportar-hist:hover{ background:var(--cyan); color:#0D2226;}

  @media print{
    body{ background:#fff !important; color:#111 !important; height:auto !important; overflow:visible !important;}
    .nameplate, .back-btn, .btn-exportar-hist, .btn-registrar-mov, .modal-overlay, .toast{ display:none !important;}
    .content-wrap{ overflow:visible !important; padding:10px !important;}
    .layout{ display:block !important;}
    .ficha, .tl-item{ border:1px solid #ccc !important; break-inside:avoid;}
  }
  .head-row h2{ font-size:20px;}

  .layout{ flex:1; min-height:0; display:grid; grid-template-columns:340px 1fr; gap:16px;}

  /* ---- Ficha del ítem ---- */
  .ficha{
    background:var(--panel); border:1px solid var(--line-strong); border-radius:10px;
    padding:20px; position:relative; overflow-y:auto;
  }
  .ficha::before{ content:""; position:absolute; inset:6px; border:1px solid var(--brass-dim); border-radius:6px; pointer-events:none; opacity:.4;}
  .ficha-cod{ font-family:'JetBrains Mono',monospace; color:var(--brass-bright); font-size:13px; font-weight:700;}
  .ficha-nombre{ font-size:20px; margin:6px 0 14px; line-height:1.2;}
  .ficha-row{ display:flex; justify-content:space-between; padding:9px 0; border-bottom:1px solid var(--line); font-size:13px;}
  .ficha-row:last-of-type{ border-bottom:none;}
  .ficha-label{ color:var(--text-dim); text-transform:uppercase; font-size:10.5px; letter-spacing:.06em;}
  .ficha-val{ font-weight:600; text-align:right;}
  .estado-pill{ font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; padding:4px 10px; border-radius:4px;}
  .estado-pill.bueno{ background:var(--servicio); color:#fff;}
  .estado-pill.regular{ background:var(--fuera); color:#241505;}
  .estado-pill.malo{ background:var(--burdeo); color:#fff;}
  .estado-pill.baja{ background:var(--nodisp); color:#fff;}

  .btn-baja{
    width:100%; margin-top:8px; background:var(--burdeo); border:2px solid var(--burdeo-bright); color:#fff;
    font-family:'Rajdhani'; font-weight:700; letter-spacing:.05em; text-transform:uppercase;
    font-size:13px; padding:12px; border-radius:7px; cursor:pointer;
  }
  .btn-baja:hover{ filter:brightness(1.1);}

  .btn-registrar-mov{
    width:100%; margin-top:18px; background:var(--cyan-dim); border:2px solid var(--cyan); color:#fff;
    font-family:'Rajdhani'; font-weight:700; letter-spacing:.04em; text-transform:uppercase;
    font-size:12.5px; padding:11px; border-radius:7px; cursor:pointer;
  }
  .btn-registrar-mov:hover{ background:var(--cyan); color:#0D2226;}

  .modal-overlay{ position:fixed; inset:0; background:rgba(5,10,15,0.75); z-index:60; display:none; align-items:center; justify-content:center;}
  .modal-overlay.show{ display:flex;}
  .modal-box{ background:var(--panel); border:1.5px solid var(--brass-dim); border-radius:12px; padding:22px 24px; width:380px; position:relative;}
  .modal-box::before{ content:""; position:absolute; inset:6px; border:1px solid var(--brass-dim); border-radius:8px; opacity:.4; pointer-events:none;}
  .modal-box h3{ font-size:15px; margin-bottom:2px;}
  .modal-sub{ font-size:11.5px; color:var(--text-muted); margin-bottom:16px;}
  .modal-actions{ display:flex; gap:10px; margin-top:16px;}
  .modal-cancel{
    flex:1; background:transparent; border:1.5px solid var(--line-strong); color:var(--text-muted);
    font-family:'Rajdhani'; font-weight:700; letter-spacing:.03em; text-transform:uppercase;
    font-size:12px; padding:10px; border-radius:6px; cursor:pointer;
  }
  .modal-guardar{
    flex:1.4; background:var(--cyan-dim); border:1.5px solid var(--cyan); color:#fff;
    font-family:'Rajdhani'; font-weight:700; letter-spacing:.03em; text-transform:uppercase;
    font-size:12px; padding:10px; border-radius:6px; cursor:pointer;
  }
  .modal-guardar:hover{ background:var(--cyan); color:#0D2226;}

  .m-field{ margin-bottom:14px;}
  .m-field label{ display:block; font-size:10.5px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.06em; margin-bottom:7px; font-weight:600;}
  .m-field input, .m-field select, .m-field textarea{
    width:100%; background:var(--panel-alt); border:1.5px solid var(--line-strong); border-radius:6px;
    padding:10px 12px; font-size:13px; color:var(--text); font-family:'Inter';
  }
  .m-field input:focus, .m-field select:focus, .m-field textarea:focus{ outline:none; border-color:var(--cyan);}
  .tipo-mov-row{ display:flex; gap:8px;}
  .tipo-mov-opt{
    flex:1; background:var(--panel-alt); border:1.5px solid var(--line-strong); border-radius:6px;
    padding:9px 6px; text-align:center; font-size:12px; font-weight:600; color:var(--text-muted); cursor:pointer;
  }
  .tipo-mov-opt.on{ background:var(--cyan-dim); border-color:var(--cyan); color:#fff;}

  /* ---- Timeline ---- */
  .timeline-panel{
    background:var(--panel); border:1px solid var(--line-strong); border-radius:10px;
    padding:20px 22px; overflow-y:auto; position:relative;
  }
  .timeline-panel::before{ content:""; position:absolute; inset:6px; border:1px solid var(--brass-dim); border-radius:6px; pointer-events:none; opacity:.4;}
  .timeline-title{ font-size:11.5px; color:var(--brass-bright); text-transform:uppercase; letter-spacing:.1em; font-weight:700; margin-bottom:16px; padding-bottom:8px; border-bottom:1px solid var(--line);}

  .tl-item{ display:flex; gap:14px; padding-bottom:18px; position:relative;}
  .tl-item::before{ content:""; position:absolute; left:8px; top:20px; bottom:0; width:1.5px; background:var(--line);}
  .tl-item:last-child::before{ display:none;}
  .tl-dot{ width:17px; height:17px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center; margin-top:1px; z-index:1;}
  .tl-dot.ingreso{ background:var(--cyan-dim); border:2px solid var(--cyan);}
  .tl-dot.traslado{ background:var(--panel-alt); border:2px solid var(--brass-bright);}
  .tl-dot.estado{ background:var(--panel-alt); border:2px solid var(--fuera);}
  .tl-dot.baja{ background:var(--burdeo); border:2px solid var(--burdeo-bright);}
  .tl-content{ flex:1;}
  .tl-top{ display:flex; justify-content:space-between; align-items:baseline; gap:10px;}
  .tl-tipo{ font-size:13.5px; font-weight:700;}
  .tl-fecha{ font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--text-dim); white-space:nowrap;}
  .tl-detalle{ font-size:12.5px; color:var(--text-muted); margin-top:3px; line-height:1.4;}
  .tl-responsable{ font-size:11px; color:var(--text-dim); margin-top:4px;}
  .tl-responsable b{ color:var(--brass-bright);}

  .toast{
    position:fixed; bottom:26px; left:50%; transform:translateX(-50%) translateY(12px);
    background:var(--panel-alt); border:1px solid var(--cyan); color:#DFF7F9;
    padding:13px 22px; border-radius:6px; font-size:13.5px; opacity:0; pointer-events:none;
    transition:all .25s; z-index:50;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0);}
</style>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">

<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<body>

  <div class="nameplate">
    <div class="nameplate-inner">
      <div class="brand">
        <div class="brand-mark"><svg viewBox="0 0 24 24" fill="none"><path d="M12 2L4 6v6c0 5 3.5 8.5 8 10 4.5-1.5 8-5 8-10V6l-8-4z" stroke="#49E9FF" stroke-width="1.6"/></svg></div>
        <div class="brand-text"><h1 id="tituloInv">Historial de Movimientos</h1><span>Vigor</span></div>
      </div>
      <div class="role-tag" id="roleTag">Sin sesión</div>
    </div>
  </div>

  <div class="content-wrap">
    <div class="head-row">
      <button class="back-btn" onclick="window.location.href='inventario.html'">← Volver</button>
      <h2>Historial de Movimientos</h2>
      <button class="btn-exportar-hist" onclick="window.print()">⬇ Exportar PDF</button>
    </div>

    <div class="layout" id="printArea">
      <div class="ficha">
        <div class="ficha-cod" id="fichaCod">—</div>
        <div class="ficha-nombre" id="fichaNombre">—</div>
        <div class="ficha-row"><span class="ficha-label">Categoría</span><span class="ficha-val" id="fichaCategoria">—</span></div>
        <div class="ficha-row"><span class="ficha-label">Estado actual</span><span class="ficha-val"><span class="estado-pill bueno" id="fichaEstadoPill">—</span></span></div>
        <div class="ficha-row"><span class="ficha-label">Lugar actual</span><span class="ficha-val" id="fichaLugar">—</span></div>
        <div class="ficha-row"><span class="ficha-label">Valor</span><span class="ficha-val mono" id="fichaValor">—</span></div>
        <div class="ficha-row"><span class="ficha-label">Ingresado</span><span class="ficha-val" id="fichaFecha">—</span></div>

        <button class="btn-registrar-mov" id="btnRegistrarMov" style="display:none;" onclick="abrirModalMovimiento()">+ Registrar Movimiento</button>
        <button class="btn-baja" id="btnDarBaja" style="display:none;" onclick="window.location.href='dar_de_baja.html?item=' + itemId">Dar de Baja</button>
      </div>

      <div class="timeline-panel">
        <div class="timeline-title">Línea de tiempo</div>

        <div class="tl-list" id="tlList"></div>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="movModal">
    <div class="modal-box">
      <h3>Registrar Movimiento</h3>
      <div class="modal-sub">Se agrega de verdad a la línea de tiempo de este ítem.</div>

      <div class="m-field">
        <label>Tipo de movimiento</label>
        <div class="tipo-mov-row" id="tipoMovRow"></div>
      </div>

      <div class="m-field" id="campoEstadoNuevo">
        <label>Nuevo estado</label>
        <select id="estadoNuevo">
          <option value="bueno">Bueno</option>
          <option value="regular">Regular</option>
          <option value="malo">Malo</option>
        </select>
      </div>

      <div class="m-field" id="campoLugarNuevo" style="display:none;">
        <label>Nuevo lugar</label>
        <input type="text" id="lugarNuevo" placeholder="Ej. R-3, Bodega, B-3…">
      </div>

      <div class="m-field">
        <label>Detalle</label>
        <textarea id="detalleMov" placeholder="Motivo o contexto del movimiento…" rows="3"></textarea>
      </div>

      <div class="modal-actions">
        <button class="modal-cancel" onclick="cerrarModalMovimiento()">Cancelar</button>
        <button class="modal-guardar" onclick="guardarMovimiento()">Registrar</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://mcfcfbtiruewlcejionr.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1jZmNmYnRpcnVld2xjZWppb25yIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzODExNzgsImV4cCI6MjEwMzk1NzE3OH0.9b_t63ah25RIGNn3pzZU3L553YUrrn7IXWW3MEjXuXU';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { persistSession: true, autoRefreshToken: true, storageKey: 'vigor-auth-v1' } });

const MODIFY_CARGOS = ['Director','Tesorero/a'];
const MODIFY_ROLES_FUNCIONALES = ['Depto. Material Menor','Depto. Material Mayor'];
const itemId = new URLSearchParams(window.location.search).get('item');
let miPersonalId = null, miNombreCompleto = null, rolActivo = null;
let itemActual = null;

const ESTADO_LABEL = { bueno:'Bueno', regular:'Regular', malo:'Malo', baja:'De Baja' };
const TIPO_LABEL = { ingreso:'Ingreso al inventario', traslado:'Traslado', cambio_estado:'Cambio de estado', baja:'Dado de Baja' };
const TIPO_DOT = { ingreso:'ingreso', traslado:'traslado', cambio_estado:'estado', baja:'baja' };

async function cargarDatos(){
  if(!itemId){ toast('Falta el ítem a mostrar'); return; }
  const { data: { session } } = await sb.auth.getSession();
  if(!session){ toast('Necesitás loguearte primero'); return; }
  const { data: perfil } = await sb.from('personal')
    .select('id, nombre_completo, cargo, personal_roles_funcionales(rol_funcional)').eq('auth_user_id', session.user.id).single();
  if(!perfil) return;
  miPersonalId = perfil.id;
  miNombreCompleto = perfil.nombre_completo;
  rolActivo = perfil.cargo;
  const rolesFuncionalesActivos = new Set((perfil.personal_roles_funcionales || []).map(r => r.rol_funcional));
  document.getElementById('roleTag').textContent = perfil.cargo;

  const { data: item, error } = await sb.from('inventario_items').select('*').eq('id', itemId).single();
  if(error || !item){ toast('No se encontró el ítem'); return; }
  itemActual = item;

  const catIds = [item.categoria_id, item.subcategoria_id].filter(Boolean);
  const { data: cats } = await sb.from('inventario_categorias').select('id, nombre').in('id', catIds);
  const catMap = {};
  (cats || []).forEach(c => catMap[c.id] = c.nombre);
  const catTexto = [catMap[item.categoria_id], item.subcategoria_id ? catMap[item.subcategoria_id] : null].filter(Boolean).join(' · ');

  document.getElementById('tituloInv').textContent = 'Historial — ' + item.codigo;
  document.getElementById('fichaCod').textContent = item.codigo;
  document.getElementById('fichaNombre').textContent = item.nombre;
  document.getElementById('fichaCategoria').textContent = catTexto || '—';
  const pill = document.getElementById('fichaEstadoPill');
  pill.className = `estado-pill ${item.estado}`;
  pill.textContent = ESTADO_LABEL[item.estado] || item.estado;
  document.getElementById('fichaLugar').textContent = item.lugar_actual || '—';
  document.getElementById('fichaValor').textContent = (item.valor !== null && item.valor !== undefined) ? '$' + Number(item.valor).toLocaleString('es-CL') : '—';
  document.getElementById('fichaFecha').textContent = item.fecha_ingreso ? new Date(item.fecha_ingreso + 'T00:00:00').toLocaleDateString('es-CL') : '—';

  const puedeModificar = MODIFY_CARGOS.includes(rolActivo) || MODIFY_ROLES_FUNCIONALES.some(r => rolesFuncionalesActivos.has(r));
  document.getElementById('btnRegistrarMov').style.display = (puedeModificar && item.estado !== 'baja') ? '' : 'none';
  document.getElementById('btnDarBaja').style.display = (puedeModificar && item.estado !== 'baja') ? '' : 'none';

  await cargarTimeline();
}

async function cargarTimeline(){
  const { data: movs } = await sb.from('inventario_movimientos')
    .select('*, personal(nombre_completo, cargo)')
    .eq('item_id', itemId).order('fecha', { ascending:false });
  const list = document.getElementById('tlList');
  if(!movs || movs.length===0){ list.innerHTML = '<div style="color:var(--text-dim); font-size:12.5px;">Sin movimientos registrados.</div>'; return; }
  list.innerHTML = movs.map(m => {
    const fecha = new Date(m.fecha).toLocaleString('es-CL', {day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit', hour12:false});
    let tipoTexto = TIPO_LABEL[m.tipo] || m.tipo;
    if(m.tipo === 'cambio_estado' && m.estado_nuevo) tipoTexto = `Cambio de estado — a ${ESTADO_LABEL[m.estado_nuevo] || m.estado_nuevo}`;
    if(m.tipo === 'traslado' && m.lugar_nuevo) tipoTexto = `Traslado${m.lugar_anterior ? ' — ' + m.lugar_anterior + ' → ' + m.lugar_nuevo : ' — a ' + m.lugar_nuevo}`;
    const responsable = m.personal ? m.personal.nombre_completo + (m.personal.cargo ? ' — ' + m.personal.cargo : '') : 'Sistema';
    return `
    <div class="tl-item">
      <div class="tl-dot ${TIPO_DOT[m.tipo] || 'estado'}"></div>
      <div class="tl-content">
        <div class="tl-top"><span class="tl-tipo">${tipoTexto}</span><span class="tl-fecha">${fecha}</span></div>
        <div class="tl-detalle">${m.detalle || ''}</div>
        <div class="tl-responsable">Registrado por <b>${responsable}</b></div>
      </div>
    </div>`;
  }).join('');
}

const TIPOS_MOV = { cambio_estado:'Cambio de Estado', traslado:'Traslado' };
let tipoMovSel = 'cambio_estado';

function renderTipoMov(){
  document.getElementById('tipoMovRow').innerHTML = Object.entries(TIPOS_MOV).map(([k,label]) =>
    `<div class="tipo-mov-opt ${tipoMovSel===k?'on':''}" onclick="setTipoMov('${k}')">${label}</div>`
  ).join('');
  document.getElementById('campoEstadoNuevo').style.display = tipoMovSel==='cambio_estado' ? 'block' : 'none';
  document.getElementById('campoLugarNuevo').style.display = tipoMovSel==='traslado' ? 'block' : 'none';
}
function setTipoMov(k){
  tipoMovSel = k;
  renderTipoMov();
}

function abrirModalMovimiento(){
  tipoMovSel = 'cambio_estado';
  document.getElementById('lugarNuevo').value = '';
  document.getElementById('detalleMov').value = '';
  renderTipoMov();
  document.getElementById('movModal').classList.add('show');
}
function cerrarModalMovimiento(){
  document.getElementById('movModal').classList.remove('show');
}

async function guardarMovimiento(){
  const detalle = document.getElementById('detalleMov').value.trim();
  if(!detalle){
    toast('Describí el motivo del movimiento');
    return;
  }

  const payload = { item_id: itemId, tipo: tipoMovSel, detalle, realizado_por: miPersonalId };

  if(tipoMovSel === 'cambio_estado'){
    const nuevoEstado = document.getElementById('estadoNuevo').value;
    payload.estado_nuevo = nuevoEstado;
    const { error: upErr } = await sb.from('inventario_items').update({ estado: nuevoEstado }).eq('id', itemId);
    if(upErr){ toast('No se pudo actualizar el estado — ' + upErr.message); return; }
  } else {
    const lugarAnterior = itemActual.lugar_actual;
    const lugarNuevo = document.getElementById('lugarNuevo').value.trim();
    if(!lugarNuevo){
      toast('Escribí el nuevo lugar');
      return;
    }
    payload.lugar_anterior = lugarAnterior;
    payload.lugar_nuevo = lugarNuevo;
    const { error: upErr } = await sb.from('inventario_items').update({ lugar_actual: lugarNuevo }).eq('id', itemId);
    if(upErr){ toast('No se pudo actualizar el lugar — ' + upErr.message); return; }
  }

  const { error } = await sb.from('inventario_movimientos').insert(payload);
  if(error){ toast('No se pudo registrar el movimiento — ' + error.message); return; }

  cerrarModalMovimiento();
  toast('Movimiento registrado en la línea de tiempo');
  await cargarDatos();
}

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2400);
}

cargarDatos();
</script>
</body>
</html>
