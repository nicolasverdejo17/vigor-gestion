<style>
  :root{ --bg:#030B13; --panel:#061520; --line:#153A52; --tx:#EAF6FB; --mu:#8FB0C2; --dim:#5F7F93; --cy:#2DD3DB; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; height:100%; }
  body{ background:var(--bg); color:var(--tx); font-family:'Montserrat','Segoe UI',sans-serif; overflow-y:auto; }
  .app-head{ display:none; }
  .back-btn{ background:transparent; border:1px solid var(--line); color:var(--tx); font:600 13px 'Montserrat',sans-serif; padding:9px 14px; cursor:pointer; }
  main.soporte{ max-width:520px; margin:0 auto; padding:24px 18px 56px; }
  .s-etq{ margin:0 2px 10px; font-size:11px; letter-spacing:.2em; text-transform:uppercase; color:var(--dim); font-weight:700; }
  .s-etq + .s-etq, .s-row + .s-etq{ margin-top:24px; }
  .s-row{ display:flex; align-items:center; gap:14px; background:var(--panel); border:1px solid var(--line); padding:14px; margin-bottom:9px; color:var(--tx); text-decoration:none; }
  .s-row:hover{ border-color:var(--cy); }
  .s-ico{ width:40px; height:40px; flex-shrink:0; display:flex; align-items:center; justify-content:center; background:rgba(45,211,219,.08); color:var(--cy); }
  .s-ico svg{ width:21px; height:21px; }
  .s-txt{ flex:1; min-width:0; }
  .s-txt b{ display:block; font-size:14px; font-weight:700; }
  .s-txt span{ display:block; margin-top:3px; font-size:12px; color:var(--mu); overflow-wrap:anywhere; user-select:text; }
  .s-flecha{ color:var(--dim); font-size:18px; }
  .s-copy{ margin:30px 0 0; text-align:center; font-size:11.5px; color:var(--dim); line-height:1.6; }
</style>
